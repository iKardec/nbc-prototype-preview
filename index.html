/* ── base/reset.css ── */
/* ===== Base ===== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; font-family: var(--font-family); color: var(--color-text); background-size: var(--space-5) var(--space-5);
}
button, input { font: inherit; color: inherit; }
a { color: inherit; }
/* ===== Componentes ===== */
.icone { width: var(--space-4); height: var(--space-4); flex: none; }
.icone-nav { width: var(--font-size-lg); height: var(--font-size-lg); flex: none; }
#anuncio { position: fixed; }
/* fora do fluxo: não cria 1px de rolagem no fim da página */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
input[type="checkbox"] { width: var(--space-4); height: var(--space-4); margin: 0; flex: none; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
i.ph.icone, i.ph-fill.icone { width: auto; height: auto; font-size: var(--font-size-md); line-height: 1; }
i.ph.icone-nav { width: auto; height: auto; font-size: var(--font-size-lg); line-height: 1; }
.sonda-icone { position: absolute; visibility: hidden; }
/* rolagem da página travada com um modal aberto, sem deslocar o layout */
html { scrollbar-gutter: stable; }
/* página, barra superior e sub-barra em cápsulas brancas, folha clara de cantos 40px, alça, HUB e gaveta sem borda nem sombra */
body { font-size: var(--papel-corpo-tamanho); line-height: var(--papel-corpo-entrelinha); font-weight: var(--papel-corpo-peso); font-synthesis: none; background-color: var(--aero-pagina); background-image: none; }
input[type="checkbox"] { accent-color: var(--color-graphite); }

/* ── base/tipografia.css ── */
h1, h2, h3, h4, h5, p, dl, dd { margin: 0; }
.subtitulo { margin-top: var(--space-1); color: var(--color-text-muted); }
.link-botao {
  padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
  color: var(--color-text); font-weight: var(--font-weight-medium);
}
.legenda { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted); }
.num { font-variant-numeric: tabular-nums; }
.rotulo { font-size: var(--font-size-xs); line-height: var(--line-height-xs); font-weight: var(--font-weight-semibold); color: var(--color-text-muted); }
.truncar { display: block; max-width: calc(var(--space-7) * 8); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.nowrap { white-space: nowrap; }
.mais-quadro { align-self: flex-start; font-size: var(--font-size-xs); line-height: var(--line-height-xs); font-weight: var(--font-weight-medium); }
.titulo { font-stretch: var(--font-stretch-display); }
/* papéis tipográficos: família, tamanho, entrelinha, peso, tracking e largura por função; fallback com métricas compensadas */
@font-face { font-family: "Figtree Fallback"; src: local("Arial"); size-adjust: 99.44%; ascent-override: 95.53%; descent-override: 25.14%; line-gap-override: 0%; }
@font-face { font-family: "Archivo Fallback"; src: local("Arial"); size-adjust: 97.78%; ascent-override: 90%; descent-override: 21.48%; line-gap-override: 0%; }
.titulo {
  font-family: var(--font-family-display); font-size: var(--papel-titulo-pagina-tamanho);
  line-height: var(--papel-titulo-pagina-entrelinha); font-weight: var(--papel-titulo-pagina-peso);
  letter-spacing: var(--papel-titulo-pagina-tracking); font-stretch: var(--papel-titulo-pagina-largura);
}
.subtitulo { font-size: var(--papel-subtitulo-tamanho); line-height: var(--papel-subtitulo-entrelinha); font-weight: var(--papel-subtitulo-peso); }
.rotulo { font-size: var(--papel-rotulo-tamanho); line-height: var(--papel-rotulo-entrelinha); font-weight: var(--papel-rotulo-peso); letter-spacing: var(--papel-rotulo-tracking); }
.legenda { font-size: var(--papel-legenda-tamanho); line-height: var(--papel-legenda-entrelinha); }
/* quebra de linha: títulos equilibrados, textos longos sem viúva */
h1, h2, h3, .titulo { text-wrap: balance; }
.subtitulo { text-wrap: pretty; }
/* estilo Aero (ref/canva/design_areo.html): céu periwinkle, folha clara, separação por fundo tonal, sem sombra e sem desfoque.
   Divergências da referência e correções de contraste em docs/EXPLORACAO.md (exp-06) */

/* Plus Jakarta Sans 300 a 600: títulos e números grandes em 300, texto em 400, rótulos em 500. Apagar o bloco volta ao
   Archivo + Figtree do exp-05 (o link carrega as três famílias) */
/* fallback com métricas medidas no Chrome (largura do texto e caixa da fonte em relação à Arial) */
@font-face { font-family: "Plus Jakarta Sans Fallback"; src: local("Arial"); size-adjust: 106.34%; ascent-override: 97.8%; descent-override: 20.69%; line-gap-override: 0%; }
.titulo { font-weight: var(--font-weight-light); }
.rotulo { padding-left: var(--space-1); }

/* ── base/layout.css ── */
.conteudo {
  display: flex; flex-direction: column;
}
.cabecalho { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--space-3) var(--space-4); }
.cabecalho-acoes { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-3); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
.grid-topo { align-items: start; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.grid-principal { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-4); align-items: start; }
.coluna { display: flex; flex-direction: column; gap: var(--space-4); }
.trilha { display: flex; flex-wrap: wrap; gap: var(--space-2); color: var(--color-text-muted); }
.pauta { white-space: pre-wrap; overflow-wrap: anywhere; }
.conteudo.entrando { animation: entrar-rota var(--duration-base) var(--easing-standard); }
.cabecalho .titulo { position: relative; padding-bottom: var(--space-2); }
.cabecalho .titulo::after {
  content: ""; position: absolute; left: 0; bottom: 0; width: var(--space-7); height: var(--tape-width); border-radius: var(--radius-full);

@media (max-width: 89em) {

.legenda-item { font-weight: var(--font-weight-medium); }

/* pílulas: status com o par da referência, prioridade em azul-campo, Pauta em marinho */
.badge { padding: var(--aero-pad-pilula); border-radius: var(--radius-full); line-height: var(--line-height-xs); font-weight: var(--font-weight-medium); }
.badge-status { gap: var(--aero-espaco-pilula); padding-left: var(--space-2); }
.badge .glifo-status { margin-right: 0; }
[data-status="NAO_INICIADO"], [data-status="DESLIGADO"], [data-presente="false"] { background: var(--aero-ni-fundo); color: var(--aero-ni-texto); }
[data-prioridade]:not([data-prioridade="PAUTA_SEMANA"]) { background: var(--aero-campo); color: var(--color-text); }
.badge-contagem { padding: 0 var(--space-2); background: var(--aero-campo); color: var(--color-text-muted); }
/* sólidos de status: pontos, legendas e barras finas */
.barra-preenchimento[data-status="NAO_INICIADO"] { background: var(--aero-solido-ni); }
.barra-preenchimento[data-status="EM_ANDAMENTO"] { background: var(--aero-solido-ea); }
.barra-preenchimento[data-status="EM_RISCO"] { background: var(--aero-solido-er); }
.barra-preenchimento[data-status="CONCLUIDO"] { background: var(--aero-solido-c); }
.barra-preenchimento[data-vencida] { background: var(--aero-solido-vencida); }
/* selo de tipo: círculo pastel com o ícone na cor do tipo; o rótulo continua no texto, no title e no aria-label */
.selo-tipo[data-tipo="ESTRATEGICA"] { --tipo-pastel: var(--aero-tipo-e-pastel); }
.selo-tipo[data-tipo="OPERACIONAL"] { --tipo-pastel: var(--aero-tipo-o-pastel); }
.selo-tipo[data-tipo="SUB_ACAO"] { --tipo-pastel: var(--aero-tipo-s-pastel); }
.selo-tipo-icone { border-radius: var(--radius-full); background: var(--tipo-pastel); color: var(--tipo-cor); font-size: var(--font-size-sm); }
.selo-tipo { gap: var(--aero-espaco-selo); font-weight: var(--font-weight-semibold); }
.chip { border: 0; border-radius: var(--radius-full); background: var(--aero-campo); padding: var(--aero-pad-chip); }
.avatar { background: var(--aero-avatar); color: var(--color-text); }
.avatar-sm { width: var(--space-5); height: var(--space-5); border-color: var(--color-surface); font-size: var(--aero-avatar-sm-fonte); }

/* ── componentes/tabelas.css ── */
.tabela { width: 100%; border-collapse: collapse; }
.tabela th {
  border-bottom: 1px solid var(--color-border); font-size: var(--font-size-xs); line-height: var(--line-height-xs);
  color: var(--color-text-muted); white-space: nowrap;
}
.tabela td { padding: var(--space-3); border-bottom: 1px solid var(--color-border); }
.tabela tbody tr:last-child td { border-bottom: 0; }
.tabela tbody tr { transition: background-color var(--duration-fast) var(--easing-standard); }
.tabela .num { text-align: right; white-space: nowrap; }
.tabela-compacta td { padding: var(--space-2) var(--space-3); }
.col-barra { width: 30%; }
.detalhe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5) var(--space-4); }
.detalhe-item { display: flex; flex-direction: column; gap: var(--space-1); }
.celula { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.tabela .col-acao { width: calc(var(--control-height) + var(--space-3)); padding-right: 0; }
.detalhe-grid-1 { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
.tabela tr.surgindo { animation: surgir var(--duration-base) var(--easing-standard); }
.legenda-tabela th { padding-top: var(--space-1); padding-bottom: var(--space-1); }
.tabela th { font-size: var(--papel-rotulo-tamanho); line-height: var(--papel-rotulo-entrelinha); font-weight: var(--papel-rotulo-peso); letter-spacing: var(--papel-rotulo-tracking); }
/* números: algarismos tabulares (as duas famílias têm) em tabelas, indicadores, datas, horas e contagens */
.tabela td, .tabela th { font-variant-numeric: tabular-nums; }
/* tabelas: cabeçalho 12,5/500, divisória clara; linha sem pílula */
.tabela th { text-align: left; padding: var(--aero-pad-th); border-bottom-color: var(--color-border); font-weight: var(--font-weight-medium); }
.tabela td { vertical-align: middle; border-bottom-color: var(--color-border); }
.tabela tbody tr:hover { background: var(--color-surface); }

/* ── componentes/estados.css ── */
.aviso { background: var(--color-info-bg); color: var(--color-info); }
.motivo { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted); }
.estado-icone {
  width: var(--space-7); height: var(--space-7); display: grid; place-items: center; border-radius: var(--radius-full);
  color: var(--color-text-muted);
}
.estado-titulo { font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); color: var(--color-text); }
.estado-vazio { padding: var(--space-6) var(--space-4); }
.skeleton { height: var(--space-4); border-radius: var(--radius-md); }
.skeleton-curto { width: 40%; }
.skeleton-alto { height: var(--space-6); width: 60%; }
.aviso[data-tom="warning"] { background: var(--color-warning-bg); color: var(--color-warning); }
.aviso-link { display: flex; align-items: center; gap: var(--space-2); font-weight: var(--font-weight-medium); text-decoration: none; }
.aviso-link:hover { text-decoration: underline; }
.alerta-erro { padding: var(--space-3) var(--space-4); background: var(--color-danger-bg); color: var(--color-danger); }
.alerta-erro ul { margin: var(--space-2) 0 0; padding-left: var(--space-5); }
.skeleton { animation: pulso calc(var(--duration-slow) * 4) var(--easing-standard) infinite; }
.ilustracao-vazio { width: calc(var(--space-7) * 2.5); height: auto; }
.iv-quadro { fill: var(--color-lane); }
.iv-ima { fill: var(--color-surface); stroke: var(--color-border-strong); stroke-width: 1; }
.iv-e { stroke: var(--tipo-estrategica, var(--color-border-strong)); }
.iv-o { stroke: var(--tipo-operacional, var(--color-border-strong)); }
.iv-livre { fill: none; stroke-dasharray: 4 3; }
.estado-titulo { text-wrap: balance; }
.estado p, .aviso { text-wrap: pretty; }
.aviso { border-radius: var(--space-5); padding: var(--aero-pad-aviso); }
.alerta-erro { border-radius: var(--space-5); }
.estado-icone { background: var(--aero-tonal); }
.skeleton { background: var(--aero-trilho); }

/* ── componentes/dialogos.css ── */
.toast {
  position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: 20; display: flex; align-items: center;
  gap: var(--space-3); border: 1px solid var(--color-border); background: var(--color-surface);
  box-shadow: var(--shadow-overlay); font-weight: var(--font-weight-medium); opacity: 0; visibility: hidden;
  transform: translateY(var(--space-2));
  transition: opacity var(--duration-base) var(--easing-standard), transform var(--duration-base) var(--easing-standard), visibility 0s linear var(--duration-base);
}
.toast.visivel {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity var(--duration-base) var(--easing-standard), transform var(--duration-base) var(--easing-standard), visibility 0s;
}
.toast[data-tipo="sucesso"] { color: var(--color-success); }
.toast[data-tipo="erro"] { color: var(--color-danger); }
.dialogo {
  width: 100%; max-width: calc(var(--content-max-width) / 3); color: var(--color-text);
  box-shadow: var(--shadow-overlay);
}
.dialogo-corpo { display: flex; flex-direction: column; gap: var(--space-4); }
.dialogo-acoes { display: flex; justify-content: flex-end; gap: var(--space-3); }
.gaveta {
  inset: 0 0 0 auto; margin: 0 0 0 auto; padding: 0;
  width: var(--drawer-width); max-width: 100%; height: 100%; max-height: 100%; overflow-y: auto;
  border: 0; border-left: 1px solid var(--color-border); background: var(--color-surface);
  color: var(--color-text); box-shadow: var(--shadow-overlay);
}
.gaveta-corpo { display: flex; flex-direction: column; gap: var(--space-5); }
.gaveta-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.gaveta-titulo:focus { outline: 0; }
/* não interativo: recebe foco por script só para o leitor de tela anunciar a ação */
.gaveta-cabecalho { display: flex; flex-direction: column; gap: var(--space-3); }
.gaveta-secao { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-5); border-top: 1px solid var(--color-border); }
.gaveta .detalhe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lista-curta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista-curta li { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border); }
.lista-curta li:last-child { border-bottom: 0; }
.gaveta-rodape {
  position: sticky; bottom: 0; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: var(--space-3);
  margin-bottom: calc(var(--space-5) * -1); padding: var(--space-4) 0 var(--space-5);
  border-top: 1px solid var(--color-border);
}
.dialogo[open] { animation: dialogo-entrar var(--duration-base) var(--easing-standard); }
.dialogo[open]::backdrop { animation: fundo-entrar var(--duration-base) var(--easing-standard); }
.dialogo.fechando { animation: dialogo-sair var(--duration-fast) var(--easing-standard) forwards; }
.dialogo.fechando::backdrop { animation: fundo-sair var(--duration-fast) var(--easing-standard) forwards; }
.gaveta[open] { animation: gaveta-entrar var(--duration-base) var(--easing-standard); }
.gaveta[open]::backdrop { animation: fundo-entrar var(--duration-base) var(--easing-standard); }
.gaveta.fechando { animation: gaveta-sair var(--duration-fast) var(--easing-standard) forwards; }
.gaveta.fechando::backdrop { animation: fundo-sair var(--duration-fast) var(--easing-standard) forwards; }
@media (prefers-reduced-motion: reduce) {
  ::backdrop { animation: none !important; transition: none !important; }
}
.gaveta-titulo { font-family: var(--font-family-display); letter-spacing: var(--papel-titulo-card-tracking); font-stretch: var(--papel-titulo-card-largura); }
.gaveta-titulo { text-wrap: balance; }
html:has(.gaveta[open]), html:has(.dialogo[open]) { overflow: hidden; }
.gaveta-titulo { font-size: var(--aero-gaveta-titulo); line-height: var(--aero-gaveta-titulo-entrelinha); font-weight: var(--font-weight-light); letter-spacing: -0.025em; }
.gaveta { border: 0; border-radius: var(--aero-raio-painel) 0 0 var(--aero-raio-painel); background: var(--aero-folha); }
.gaveta::backdrop, .dialogo::backdrop { background: var(--fundo-modal); -webkit-backdrop-filter: none; backdrop-filter: none; }
.dialogo { border: 0; border-radius: var(--aero-raio-painel); background: var(--aero-folha); padding: var(--space-6); }
.gaveta-corpo { padding: var(--space-5) var(--aero-pad-gaveta) var(--aero-pad-gaveta); }
.gaveta-rodape { background: var(--aero-folha); }
/* toast e flutuantes: brancos com divisória, sem sombra */
.toast { border-radius: var(--radius-full); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5); border-color: var(--color-border-strong); }
/* gaveta: dados num bloco tonal */
.gaveta .detalhe-grid { padding: var(--space-4) var(--space-5); border-radius: var(--aero-raio-dados); background: var(--aero-tonal); }
.gaveta-secao { border-top-color: var(--color-border); }

/* ── componentes/flutuantes.css ── */
.select-status {
  width: auto; padding: 0 var(--space-2); border-color: transparent; border-radius: var(--radius-sm);
  font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); cursor: pointer;
}
.select-status:hover { border-color: currentColor; }
.dica { display: inline-flex; align-items: center; gap: var(--space-2); }
.dica-alvo:hover::after, .dica-alvo:focus-visible::after { animation: dica-entrar var(--duration-fast) var(--easing-standard); }
/* dica ao passar o mouse ou focar: valor e rótulo também em texto */
.dica-alvo { position: relative; }
.dica-alvo[data-dica]:hover::after, .dica-alvo[data-dica]:focus-visible::after {
  content: attr(data-dica); position: absolute; left: 50%; bottom: calc(100% + var(--space-1)); z-index: 3; transform: translateX(-50%);
  padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); background: var(--color-graphite); color: var(--color-topbar-text);
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); font-weight: var(--font-weight-medium); white-space: nowrap; pointer-events: none;
}
.menu-status, .confirmacao-status {
  position: fixed; z-index: var(--z-flutuante);
  border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-overlay);
  animation: flutuante-entrar var(--duration-fast) var(--easing-standard);
}
.badge-menu:hover, .badge-menu[aria-expanded="true"] { border-color: currentColor; }
.badge-menu .icone-seta { margin-left: var(--space-1); font-size: var(--font-size-xs); }
.menu-status { display: flex; flex-direction: column; min-width: var(--menu-status-largura); padding: var(--space-1); }
.menu-status-item {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-height: var(--alvo-minimo);
  padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
.menu-status-item:not([aria-disabled="true"]):hover, .menu-status-item:focus-visible { background: var(--color-surface-muted); }
.menu-status-item:focus-visible { outline-offset: calc(var(--space-1) * -1); }
.menu-status-item[aria-disabled="true"] { cursor: default; }
.confirmacao-status {
  width: var(--flutuante-largura); max-width: calc(100vw - var(--space-4) * 2);
  display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg);
}
.confirmacao-cabecalho { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.confirmacao-titulo { font-family: var(--font-family-display); font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); }
.confirmacao-acao { display: flex; align-items: flex-start; gap: var(--space-2); font-weight: var(--font-weight-medium); }
.confirmacao-de-para .badges { gap: var(--space-2); }
.confirmacao-acoes { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--space-2); }
.confirmacao-acoes .legenda { margin-right: auto; }
.menu-status { border-radius: var(--space-5); }
.confirmacao-status { border-radius: var(--aero-raio-cartao); padding: var(--space-5); border-color: var(--color-border-strong); }
.select-status { height: auto; }
.badge-menu { min-height: var(--alvo-minimo); }

/* ── shell/shell.css ── */
/* ===== Layout ===== */
/* Quadro à vista: a barra superior grafite é a moldura do quadro; o conteúdo usa a largura toda */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.topo {
  display: flex;
}
.marca {
  display: flex; align-items: center; gap: var(--space-3); flex: none; align-self: center; color: inherit;
  text-decoration: none; transition: background-color var(--duration-fast) var(--easing-standard);
}
.marca-logo {
  flex: none; display: grid; place-items: center;
}
.marca-nome { font-family: var(--font-family-display); font-size: var(--font-size-md); line-height: var(--line-height-md); white-space: nowrap; }
.nav { display: flex; min-width: 0; }
.nav-item {
  position: relative; display: flex; align-items: center; text-decoration: none; white-space: nowrap;
  transition: color var(--duration-fast) var(--easing-standard), background-color var(--duration-fast) var(--easing-standard);
}
/* fita do item ativo, como a etiqueta magnética de uma raia */
.nav-item::after {
  position: absolute; left: var(--space-3); right: var(--space-3); bottom: 0; height: var(--tape-width);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: transparent;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
.nav-item[aria-current="page"]::after { background: var(--color-topbar-text); }
.topo-usuario { margin-left: auto; display: flex; align-items: center; gap: var(--space-3); flex: none; }
.usuario-texto { display: flex; flex-direction: column; min-width: 0; }
.btn-sair {
  display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer;
  transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
}
@media (max-width: 80em) {
  /* até 1280 de largura: o nome da marca some e o do usuário fica só para leitor de tela; a navegação fica inteira */
.topo .marca-nome { display: none; }
  .usuario-texto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
.demo {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4);
  padding: var(--space-1) var(--space-5);
  background: var(--color-demo-bg); border-bottom: 1px dashed var(--color-border-strong);
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted);
}
.demo-titulo { font-weight: var(--font-weight-semibold); }
.demo label { display: flex; align-items: center; gap: var(--space-2); }
.demo select { width: auto; font-size: var(--font-size-xs); }
.marcador[data-status="NAO_INICIADO"] { background: var(--color-text-muted); }
.marcador[data-status="EM_ANDAMENTO"], .marcador[data-status="AGENDADA"] { background: var(--color-info); }
.marcador[data-status="EM_RISCO"], .marcador[data-status="AGUARDANDO_FINALIZACAO"] { background: var(--color-warning); }
.marcador[data-status="CONCLUIDO"], .marcador[data-status="FINALIZADA"] { background: var(--color-success); }
.marcador[data-status="HOJE"] { background: var(--color-primary); }
.marcador { width: var(--space-2); height: var(--space-2); flex: none; border-radius: var(--radius-full); }
.marca-logo { font-stretch: var(--font-stretch-display); }
/* sem a fonte de ícones: os botões que só têm ícone mostram um texto curto */
.sem-icones .btn-sair::after { content: "Sair"; font-size: var(--font-size-xs); }
.marcador-status { display: inline-block; margin-right: var(--space-2); vertical-align: middle; }
.marcador-status[data-cor="NAO_INICIADO"] { background: var(--color-text-muted); }
.marcador-status[data-cor="EM_ANDAMENTO"] { background: var(--color-info); }
.marcador-status[data-cor="EM_RISCO"] { background: var(--color-warning); }
.marcador-status[data-cor="CONCLUIDO"] { background: var(--color-success); }
.marcador-status[data-cor="VENCIDA"] { background: var(--color-danger); }
.nav-item { gap: var(--space-2); }
.nav-item i.ph.icone-nav { font-size: var(--font-size-lg); }
@media (max-width: 88em) {
  /* até 1408px os seis itens não cabem com rótulo: fica o ícone; o rótulo vai para leitor de tela e para o title */
.nav-rotulo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
.subnav { top: var(--topbar-height); z-index: 9; border-bottom: 1px solid var(--color-border); }
.subnav-faixa { align-items: stretch; }
.subnav-item {
  position: relative; display: flex; align-items: center; gap: var(--space-2); white-space: nowrap;
  transition: color var(--duration-fast) var(--easing-standard), background-color var(--duration-fast) var(--easing-standard);
}
.subnav-item::after {
  position: absolute; left: var(--space-3); right: var(--space-3); bottom: 0; height: var(--tape-width);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0; background: transparent;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
.subnav-item[aria-current="page"]::after { background: var(--color-graphite); }
/* com a faixa, as abas não se repetem no cabeçalho da página */
body.com-subnav .cabecalho-acoes > .abas { display: none; }
@media (max-height: 50em) {
  /* telas baixas: a faixa ocupa altura, então o respiro da página e do quadro Hoje encolhe para o Hoje caber em 1024×768 */
body.com-subnav .conteudo { padding-bottom: var(--space-4); gap: var(--space-3); }
}
.marca-nome { font-weight: var(--font-weight-medium); }
.marca-nome { font-weight: var(--font-weight-semibold); letter-spacing: -0.01em; }
.topo {
  position: sticky; top: var(--space-3); z-index: 10;
  width: calc(100% - var(--alca-notif-largura, var(--space-7)) * 2 - var(--space-3));
  max-width: var(--content-max-width); height: var(--aero-topo-altura); margin: var(--space-4) auto 0;
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3); align-items: center; gap: var(--space-4);
  border-radius: var(--radius-full); background: var(--color-topbar-bg); color: var(--color-topbar-text);
}
