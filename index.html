/* --- T02 Painel (Leis P1–P6) --- */
function indicadores(lista) {
  const porStatus = Object.fromEntries(Object.values(STATUS_ACAO).map((s) => [s, 0]));
  const porPrioridade = Object.fromEntries(Object.values(PRIORIDADE_ACAO).map((p) => [p, 0]));
  const porUnidade = new Map();
  const porMes = new Map();
  for (const a of lista) {
    porStatus[a.status] += 1;
    porPrioridade[a.prioridade] += 1;
    porUnidade.set(a.unidadeId, (porUnidade.get(a.unidadeId) || 0) + 1);
    const mes = a.mesConclusaoEstimado.slice(0, 7);
    porMes.set(mes, (porMes.get(mes) || 0) + 1);
  }
  return {
    total: lista.length, porStatus, porPrioridade, porUnidade, porMes,
    vencidas: lista.filter(estaVencida).length,
    vencemEsteMes: lista.filter((a) => a.mesConclusaoEstimado === FIM_DO_MES_CORRENTE && a.status !== ST.CONCLUIDO).length,
  };
}

// opções dos filtros saem só das ações que o usuário vê (nada invisível aparece)
function opcoesFiltrosPainel(visiveis) {
  const meses = [...new Set(visiveis.map((a) => a.mesConclusaoEstimado))].sort().map((m) => [m, formatarMes(m)]);
  const ids = new Set(visiveis.flatMap((a) => a.pontosFocais.map((r) => r.id)));
  const pontosFocais = [...ids].map(usuarioPorId)
    .sort((a, b) => a.username.localeCompare(b.username, 'pt-BR'))
    .map((u) => [u.id, statusVisivel(u.id) === STATUS_USUARIO.ATIVO ? u.username : `${u.username} — ${ROTULOS_STATUS_USUARIO[u.status]}`]);
  return {
    meses,
    pontosFocais: [[FILTRO_PONTO_FOCAL.SEM, ROTULOS_FILTRO.SEM_PONTO_FOCAL], ...pontosFocais],
    status: [...Object.values(STATUS_ACAO).map((s) => [s, ROTULOS_STATUS_ACAO[s]]), [FILTRO_STATUS_PAINEL.VENCIDAS, ROTULO_VENCIDAS]],
  };
}

function tabelaAcoes(lista, mensagemVazio) {
  if (lista.length === 0) return estadoVazio(mensagemVazio);
  const linhas = lista.map((a) => `<tr>
      <td><div class="badges"><a class="link" href="#/acoes/${a.id}">${esc(a.descricao)}</a>${badgeTipo(a.tipo)}</div></td>
      <td>${listaUsuarios(a.responsaveis)}</td>
      <td>${esc(unidadePorId(a.unidadeId).nome)}</td>
      <td class="num">${formatarMes(a.mesConclusaoEstimado)}</td>
      <td><div class="badges">${badgeStatus(a.status)}${badgeVencida(a)}</div></td></tr>`).join('');
  return `<table class="tabela"><thead><tr><th>Descrição</th><th>Responsáveis</th><th>Unidade</th><th class="num">Mês concl.</th><th>Status</th></tr></thead><tbody>${linhas}</tbody></table>`;
}

function tabelaBarras(titulo, cabecalhoCol, linhas) {
  // linhas: [{ rotulo (html), e, o, atributos }]; barra proporcional ao maior total
  const maximo = Math.max(0, ...linhas.map((l) => l.e + l.o));
  const corpo = linhas.length
    ? linhas.map((l) => `<tr><td>${l.rotulo}</td><td class="col-barra">${barra(larguraBarra(l.e + l.o, maximo), l.atributos || '')}</td><td class="num">${l.e}</td><td class="num">${l.o}</td></tr>`).join('')
    : `<tr><td colspan="4" class="legenda">${esc(MENSAGENS.NENHUM_DADO)}</td></tr>`;
  return `<section class="card"><h2 class="card-titulo">${esc(titulo)}</h2>
    <table class="tabela tabela-compacta"><thead><tr><th>${esc(cabecalhoCol)}</th><th>Proporção</th><th class="num">${ROTULOS_TIPO_PLURAL[E]}</th><th class="num">${ROTULOS_TIPO_PLURAL[O]}</th></tr></thead><tbody>${corpo}</tbody></table></section>`;
}

function renderPainel() {
  const u = usuarioAtual();
  const f = estado.filtrosPainel;
  const visiveis = acoes.filter((a) => podeVer(a, u));
  const opcoes = opcoesFiltrosPainel(visiveis);
  // filtro que deixou de existir para o usuário atual (troca de usuário) é descartado
  if (f.mes && !opcoes.meses.some(([v]) => v === f.mes)) f.mes = '';
  if (f.pontoFocal && !opcoes.pontosFocais.some(([v]) => String(v) === f.pontoFocal)) f.pontoFocal = '';

  // Unidade, mês e ponto focal só restringem o escopo (como P5) e valem para todos os blocos
  const restringe = (a) => (!f.unidadeId || a.unidadeId === Number(f.unidadeId))
    && (!f.mes || a.mesConclusaoEstimado === f.mes)
    && (!f.pontoFocal || (f.pontoFocal === FILTRO_PONTO_FOCAL.SEM ? a.pontosFocais.length === 0 : a.pontosFocais.some((r) => String(r.id) === f.pontoFocal)));
  const confereStatus = (a) => (f.status === FILTRO_STATUS_PAINEL.TODOS ? true
    : f.status === FILTRO_STATUS_PAINEL.VENCIDAS ? estaVencida(a) : a.status === f.status);

  const escopo = visiveis.filter((a) => a.tipo !== S && restringe(a)); // P1
  const escopoStatus = escopo.filter(confereStatus);
  const iE = indicadores(escopo.filter((a) => a.tipo === E)); // faixa de KPIs e "Por status": sem filtro de status
  const iO = indicadores(escopo.filter((a) => a.tipo === O));
  const fE = indicadores(escopoStatus.filter((a) => a.tipo === E)); // blocos que respeitam o filtro de status
  const fO = indicadores(escopoStatus.filter((a) => a.tipo === O));
  const iS = indicadores(visiveis.filter((a) => a.tipo === S && temVinculo(a, u) && restringe(a))); // P2
  const pauta = escopo.filter((a) => a.prioridade === P.PAUTA_SEMANA && a.status !== ST.CONCLUIDO).sort(porMesEId); // P4

  const ativos = [f.unidadeId, f.mes, f.pontoFocal, f.status].filter(Boolean).length;
  const porTipo = (e, o) => `${ROTULOS_TIPO_PLURAL[E]} ${e} · ${ROTULOS_TIPO_PLURAL[O]} ${o}`;
  const valorKpi = {
    ESCOPO: [iE.total + iO.total, porTipo(iE.total, iO.total)],
    CONCLUIDO: [iE.porStatus.CONCLUIDO + iO.porStatus.CONCLUIDO, porTipo(iE.porStatus.CONCLUIDO, iO.porStatus.CONCLUIDO)],
    EM_ANDAMENTO: [iE.porStatus.EM_ANDAMENTO + iO.porStatus.EM_ANDAMENTO, porTipo(iE.porStatus.EM_ANDAMENTO, iO.porStatus.EM_ANDAMENTO)],
    VENCIDAS: [iE.vencidas + iO.vencidas, `${ROTULO_VENCEM_ESTE_MES}: ${iE.vencemEsteMes + iO.vencemEsteMes}`],
  };
  const kpis = KPIS.map((k) => `<button type="button" class="card kpi" data-acao="kpi" data-kpi="${k.chave}" aria-pressed="${k.status === f.status}">
      <span class="kpi-topo"><span class="rotulo">${esc(k.rotulo)}</span><span class="kpi-icone">${icone(k.icone)}</span></span>
      <span class="kpi-numero" data-tom="${k.tom}">${valorKpi[k.chave][0]}</span>
      <span class="legenda">${esc(valorKpi[k.chave][1])}</span></button>`).join('');

  const rotuloStatusFiltro = f.status === FILTRO_STATUS_PAINEL.VENCIDAS ? ROTULO_VENCIDAS : ROTULOS_STATUS_ACAO[f.status];
  const filtradas = escopoStatus.slice().sort(porMesEId);
  const cardFiltradas = f.status === FILTRO_STATUS_PAINEL.TODOS ? '' : `<section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">Ações filtradas ${badgeContagem(filtradas.length)}</h2><span class="legenda">${esc(ROTULOS_FILTRO.STATUS)}: ${esc(rotuloStatusFiltro)}</span></div>
      ${tabelaAcoes(filtradas, MENSAGENS.NENHUMA_ACAO_FILTRADA)}</section>`;

  const totalF = fE.total + fO.total;
  const linhasStatus = Object.values(STATUS_ACAO).map((s) => ({ rotulo: badgeStatus(s), e: iE.porStatus[s], o: iO.porStatus[s], atributos: `data-status="${s}"` }))
    .concat([
      { rotulo: `<span class="badge" data-vencida>${ROTULO_VENCIDAS}</span>`, e: iE.vencidas, o: iO.vencidas, atributos: 'data-vencida' },
      { rotulo: `<span class="legenda">${ROTULO_VENCEM_ESTE_MES}</span>`, e: iE.vencemEsteMes, o: iO.vencemEsteMes },
    ]);
  const linhasUnidade = [...new Set([...fE.porUnidade.keys(), ...fO.porUnidade.keys()])]
    .map(unidadePorId).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
    .map((un) => ({ rotulo: esc(un.nome), e: fE.porUnidade.get(un.id) || 0, o: fO.porUnidade.get(un.id) || 0 }));
  const linhasMes = [...new Set([...fE.porMes.keys(), ...fO.porMes.keys()])].sort()
    .map((m) => ({ rotulo: `<span class="num">${formatarMes(m)}</span>`, e: fE.porMes.get(m) || 0, o: fO.porMes.get(m) || 0 }));
  const maxSub = Math.max(0, iS.vencidas, ...Object.values(iS.porStatus));

  const acoesCabecalho = (pode(OPERACAO.CRIAR_ESTRATEGICA) ? botaoEmBreve('Nova ação', 'btn-primario', 'mais') : '')
    + botaoEmBreve('Agendar reunião', 'btn-secundario', 'calendario');
  const abas = `<div class="abas" role="tablist"><button type="button" class="aba" aria-current="page">Geral</button><button type="button" class="aba" data-acao="em-breve">Semanal</button></div>`;

  return cabecalho('Cockpit', '', abas + acoesCabecalho) + `
    <section class="card filtros-painel" aria-label="Filtros do painel">
      <div class="filtros-campos">
        ${seletor('filtrosPainel.unidadeId', ROTULOS_FILTRO.UNIDADE, f.unidadeId, opcoesUnidades(), ROTULOS_FILTRO.TODAS_UNIDADES)}
        ${seletor('filtrosPainel.mes', ROTULOS_FILTRO.MES, f.mes, opcoes.meses, ROTULOS_FILTRO.TODOS_MESES)}
        ${seletor('filtrosPainel.pontoFocal', ROTULOS_FILTRO.PONTO_FOCAL, f.pontoFocal, opcoes.pontosFocais, ROTULOS_FILTRO.TODOS_PONTOS_FOCAIS)}
        ${seletor('filtrosPainel.status', ROTULOS_FILTRO.STATUS, f.status, opcoes.status, ROTULOS_FILTRO.TODOS_STATUS)}
      </div>
      <div class="filtros-rodape"><span class="legenda" aria-live="polite">${esc(ativos ? MENSAGENS.FILTROS_ATIVOS(ativos) : MENSAGENS.SEM_FILTROS)}</span>
        <button type="button" class="btn btn-terciario" data-acao="limpar-filtros" data-grupo="filtrosPainel" ${ativos ? '' : 'disabled'}>Limpar filtros</button></div>
    </section>
    <div class="grid-4">${kpis}</div>
    ${cardFiltradas}
    <div class="grid-2">
      <section class="card"><h2 class="card-titulo">Estratégicas e operacionais</h2>
        <div class="proporcao"><div class="proporcao-linha"><span>${ROTULOS_TIPO_PLURAL[E]}</span><span class="legenda num">${fE.total} (${larguraBarra(fE.total, totalF)})</span></div>
          ${barra(larguraBarra(fE.total, totalF), '', 'barra-preenchimento-primaria')}</div>
        <div class="proporcao"><div class="proporcao-linha"><span>${ROTULOS_TIPO_PLURAL[O]}</span><span class="legenda num">${fO.total} (${larguraBarra(fO.total, totalF)})</span></div>
          ${barra(larguraBarra(fO.total, totalF))}</div>
      </section>
      <section class="card"><h2 class="card-titulo">Por prioridade</h2>
        <div class="prioridades">${Object.values(PRIORIDADE_ACAO).map((p) => `<div class="prioridade-item">${badgePrioridade(p)}<span class="indicador-numero">${fE.porPrioridade[p] + fO.porPrioridade[p]}</span><span class="legenda num">${esc(porTipo(fE.porPrioridade[p], fO.porPrioridade[p]))}</span></div>`).join('')}</div>
      </section>
    </div>
    <div class="grid-2 grid-topo">
      ${tabelaBarras('Por status', 'Status', linhasStatus)}
      ${tabelaBarras('Por unidade', 'Unidade', linhasUnidade)}
    </div>
    ${tabelaBarras('Por mês de conclusão', 'Mês', linhasMes)}
    <div class="grid-principal">
      <section class="card">
        <div class="card-cabecalho"><h2 class="card-titulo">Pauta da semana ${badgeContagem(pauta.length)}</h2><a class="link-discreto" href="${ROTAS.ACOES}">Ver todas no gestor de ações</a></div>
        ${tabelaAcoes(pauta, MENSAGENS.NENHUMA_PAUTA)}
      </section>
      <div class="coluna">
        <section class="card"><h2 class="card-titulo">Minhas sub-ações ${badgeContagem(iS.total)}</h2>
          <table class="tabela tabela-compacta"><tbody>
            ${Object.values(STATUS_ACAO).map((s) => `<tr><td>${badgeStatus(s)}</td><td class="col-barra">${barra(larguraBarra(iS.porStatus[s], maxSub), `data-status="${s}"`)}</td><td class="num">${iS.porStatus[s]}</td></tr>`).join('')}
            <tr><td><span class="badge" data-vencida>${ROTULO_VENCIDAS}</span></td><td class="col-barra">${barra(larguraBarra(iS.vencidas, maxSub), 'data-vencida')}</td><td class="num">${iS.vencidas}</td></tr>
          </tbody></table>
        </section>
        <section class="card"><h2 class="card-titulo">Agenda de reuniões</h2><p class="legenda">${esc(MENSAGENS.AGENDA_EM_BREVE)}</p></section>
      </div>
    </div>`;
}

/* --- T04 Lista, árvore e Kanban de ações --- */
function visaoAtual() {
  const valor = lerQuery().get(QUERY_VISAO.PARAMETRO);
  if (valor === QUERY_VISAO.KANBAN) return VISAO_ACOES.KANBAN;
  if (valor === QUERY_VISAO.CALENDARIO) return VISAO_ACOES.CALENDARIO;
  return VISAO_ACOES.LISTA;
}

// no Kanban as colunas já são os status: o filtro Status não se aplica
function confereFiltrosAcoes(a, visao) {
  const f = estado.filtrosAcoes;
  const termo = normalizar(f.busca.trim());
  return (!f.unidadeId || a.unidadeId === Number(f.unidadeId))
    && (!f.tipo || a.tipo === f.tipo)
    && (visao === VISAO_ACOES.KANBAN || !f.status || a.status === f.status)
    && (!termo || normalizar(a.descricao).includes(termo));
}
function filtrosAtivosAcoes(visao) {
  const f = estado.filtrosAcoes;
  return [f.unidadeId, f.tipo, visao !== VISAO_ACOES.KANBAN ? f.status : '', f.busca.trim()].filter(Boolean).length;
}

function renderFiltrosAcoes(visao) {
  const f = estado.filtrosAcoes;
  const ativos = filtrosAtivosAcoes(visao);
  const alternador = Object.values(VISAO_ACOES).map((v) => `<button type="button" class="aba" data-acao="visao" data-visao="${v}" aria-pressed="${v === visao}">${icone(ICONES_VISAO[v])}${esc(ROTULOS_VISAO[v])}</button>`).join('');
  return `<section class="card filtros-acoes" aria-label="Filtros de ações">
      <div class="filtros-topo">
        <div class="abas" role="group" aria-label="${esc(ROTULOS_FILTRO.VISAO)}">${alternador}</div>
        <label class="busca" ${f.busca.trim() ? 'data-ativo' : ''}><span class="sr-only">${esc(ROTULOS_FILTRO.BUSCA)}</span>${icone('busca')}<input class="input" type="search" data-filtro="filtrosAcoes.busca" value="${esc(f.busca)}" placeholder="${esc(ROTULOS_FILTRO.BUSCA)}" autocomplete="off"></label>
      </div>
      <div class="filtros-campos">
        ${seletor('filtrosAcoes.unidadeId', ROTULOS_FILTRO.UNIDADE, f.unidadeId, opcoesUnidades(), ROTULOS_FILTRO.TODAS_UNIDADES)}
        ${seletor('filtrosAcoes.tipo', ROTULOS_FILTRO.TIPO, f.tipo, Object.values(TIPO_ACAO).map((t) => [t, ROTULOS_TIPO[t]]), ROTULOS_FILTRO.TODOS_TIPOS)}
        ${visao !== VISAO_ACOES.KANBAN ? seletor('filtrosAcoes.status', ROTULOS_FILTRO.STATUS, f.status, Object.values(STATUS_ACAO).map((s) => [s, ROTULOS_STATUS_ACAO[s]]), ROTULOS_FILTRO.TODOS_STATUS) : ''}
      </div>
      <div class="filtros-rodape"><span class="legenda" aria-live="polite">${esc(ativos ? MENSAGENS.FILTROS_ATIVOS(ativos) : MENSAGENS.SEM_FILTROS)}</span>
        <button type="button" class="btn btn-terciario" data-acao="limpar-filtros" data-grupo="filtrosAcoes" ${ativos ? '' : 'disabled'}>Limpar filtros</button></div>
    </section>`;
}

function iniciaisResponsaveis(lista) {
  const nomes = lista.map((r) => r.username).join(', ');
  const mostrados = lista.slice(0, CONFIG.MAX_INICIAIS_CARTAO);
  const extra = lista.length - mostrados.length;
  return `<span class="iniciais" role="img" title="${esc(nomes)}" aria-label="${esc(MENSAGENS.RESPONSAVEIS(nomes))}">${mostrados.map((r) => `<span class="avatar avatar-sm" aria-hidden="true">${esc(iniciais(r.username))}</span>`).join('')}${extra > 0 ? `<span class="avatar avatar-sm" aria-hidden="true">+${extra}</span>` : ''}</span>`;
}

function cartaoKanban(a, raiaId, nivelTitulo) {
  const u = usuarioAtual();
  const podeMover = pode(OPERACAO.MUDAR_STATUS, a);
  const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
  const cadeado = podeMover ? '' : `<span class="cadeado" title="${esc(MENSAGENS.STATUS_BLOQUEADO)}">${icone('cadeado')}<span class="sr-only">${esc(MENSAGENS.STATUS_BLOQUEADO)}</span></span>`;
  const complemento = a.tipo === E ? barraProgresso(progresso(a)) // Lei 7
    : a.tipo === O ? `<span class="legenda">${esc(MENSAGENS.SUB_ACOES(filhasDe(a.id).filter((s) => podeVer(s, u)).length))}</span>` : '';
  return `<article class="cartao ${estado.recemMovido === a.id ? 'movido' : ''}" tabindex="0" draggable="${podeMover}" data-acao="gaveta-abrir" data-id="${a.id}" data-cartao="${a.id}" data-raia="${raiaId}" aria-labelledby="cartao-${a.id}" ${podeMover ? 'aria-describedby="dica-kanban"' : ''}>
      <div class="cartao-topo"><h${nivelTitulo} class="cartao-titulo" id="cartao-${a.id}" title="${esc(a.descricao)}">${esc(a.descricao)}</h${nivelTitulo}>${cadeado}</div>
      ${pai && podeVer(pai, u) ? `<p class="legenda cartao-pai" title="${esc(pai.descricao)}">${PREFIXO_PAI} ${esc(pai.descricao)}</p>` : ''}
      <div class="badges">${badgeTipo(a.tipo)}${badgePrioridade(a.prioridade)}</div>
      <div class="badges"><span class="legenda num">${formatarMes(a.mesConclusaoEstimado)}</span>${badgeVencida(a)}</div>
      ${a.tipo === E ? complemento : ''}
      <div class="cartao-rodape">${iniciaisResponsaveis(a.responsaveis)}${a.tipo === E ? '' : complemento}</div>
    </article>`;
}

// com raias, a coluna fica um nível abaixo do título da raia
function colunasKanban(cartoes, raiaId) {
  const nivel = raiaId ? 4 : 3;
  return `<div class="colunas">${Object.values(STATUS_ACAO).map((s) => {
    const daColuna = cartoes.filter((a) => a.status === s);
    const titulo = `coluna-${raiaId || 'todas'}-${s}`;
    return `<section class="coluna-kanban" data-coluna="${s}" data-raia="${raiaId}" aria-labelledby="${titulo}">
        <h${nivel} class="coluna-cabecalho" id="${titulo}"><span class="marcador" data-status="${s}" aria-hidden="true"></span>${esc(ROTULOS_STATUS_ACAO[s])} ${badgeContagem(daColuna.length)}</h${nivel}>
        <div class="coluna-cartoes">${daColuna.length ? daColuna.map((a) => cartaoKanban(a, raiaId, nivel + 1)).join('') : `<p class="coluna-vazia">${esc(MENSAGENS.NENHUMA_ACAO_COLUNA)}</p>`}</div>
      </section>`;
  }).join('')}</div>`;
}

function raiaKanban({ estrategica: e, cartoes }) {
  const recolhida = estado.raiasRecolhidas.has(e.id);
  return `<section class="raia" aria-labelledby="raia-${e.id}">
      <div class="raia-cabecalho">
        <button type="button" class="btn-expandir" data-acao="recolher-raia" data-id="${e.id}" aria-expanded="${!recolhida}" aria-label="${recolhida ? 'Expandir' : 'Recolher'} ${esc(e.descricao)}">${icone(recolhida ? 'direita' : 'abaixo')}</button>
        <h3 class="raia-titulo" id="raia-${e.id}"><button type="button" class="link-botao" data-acao="gaveta-abrir" data-id="${e.id}">${esc(e.descricao)}</button></h3>
        ${badgeContagem(cartoes.length)}
        <div class="badges">${seletorStatus(e)}${badgeVencida(e)}</div>
        ${barraProgresso(progresso(e))}
      </div>
      ${recolhida ? '' : colunasKanban(cartoes, e.id)}
    </section>`;
}

function renderKanban(acaoVazio) {
  const u = usuarioAtual();
  const f = estado.filtrosAcoes;
  const tipoEstrategica = f.tipo === E;
  if (tipoEstrategica) estado.agrupamentoKanban = AGRUPAMENTO_KANBAN.NENHUM;
  const agrupando = estado.agrupamentoKanban === AGRUPAMENTO_KANBAN.ESTRATEGICA;
  // com raias, as estratégicas viram cabeçalho e não aparecem como cartões
  const cartoes = acoes.filter((a) => podeVer(a, u) && confereFiltrosAcoes(a, VISAO_ACOES.KANBAN) && !(agrupando && a.tipo === E)).sort(porMesEId);
  const corpo = agrupando
    ? acoes.filter((a) => a.tipo === E && podeVer(a, u)).sort(porMesEId)
      .map((e) => ({ estrategica: e, cartoes: cartoes.filter((c) => estrategicaDe(c).id === e.id) }))
      .filter((r) => r.cartoes.length).map(raiaKanban).join('')
    : colunasKanban(cartoes, '');

  const opcoesAgrupar = Object.values(AGRUPAMENTO_KANBAN).map((g) => `<button type="button" class="aba" data-acao="agrupar" data-agrupamento="${g}" aria-pressed="${g === estado.agrupamentoKanban}" ${tipoEstrategica ? 'disabled aria-describedby="dica-agrupar"' : ''}>${esc(ROTULOS_AGRUPAMENTO[g])}</button>`).join('');
  return `<section class="card">
      <div class="card-cabecalho quadro-barra">
        <h2 class="card-titulo">Ações ${badgeContagem(cartoes.length)}</h2>
        <div class="agrupar"><span class="rotulo" id="rotulo-agrupar">${esc(ROTULOS_FILTRO.AGRUPAR)}</span>
          <div class="abas" role="group" aria-labelledby="rotulo-agrupar">${opcoesAgrupar}</div>
          ${tipoEstrategica ? `<span class="legenda" id="dica-agrupar">${esc(MENSAGENS.AGRUPAMENTO_INDISPONIVEL)}</span>` : ''}</div>
      </div>
      <p class="legenda" id="dica-kanban">${esc(MENSAGENS.DICA_KANBAN)}</p>
      ${cartoes.length
        ? `<div class="quadro" style="--colunas:${Object.values(STATUS_ACAO).length}"><div class="quadro-conteudo">${corpo}</div></div>`
        : estadoVazio(MENSAGENS.NENHUMA_ACAO, acaoVazio)}
    </section>`;
}

/* --- T04 Calendário (mês e semana; sem arraste: mudar o mês seria editar a ação) --- */
// E, depois cada O seguida das suas S; grupos por estratégica (porMesEId); só as ações da lista
function ordenarHierarquia(lista) {
  const ids = new Set(lista.map((a) => a.id));
  const resultado = [];
  const percorrer = (a) => { if (ids.has(a.id)) resultado.push(a); filhasDe(a.id).forEach(percorrer); };
  [...new Set(lista.map(estrategicaDe))].sort(porMesEId).forEach(percorrer);
  return resultado;
}

const formatarMesExtenso = (iso) => { const [ano, mes] = iso.split('-'); return `${MESES_NOME[Number(mes) - 1]} de ${ano}`; };
const diaDoMes = (iso) => Number(iso.split('-')[2]);
function formatarSemana(segunda) {
  const domingo = somarDias(segunda, CONFIG.DIAS_POR_SEMANA - 1);
  const [a1, m1] = segunda.split('-').map(Number);
  const [a2, m2] = domingo.split('-').map(Number);
  const fim = `${diaDoMes(domingo)} ${MESES_ABREV[m2 - 1]} ${a2}`;
  if (a1 !== a2) return `${diaDoMes(segunda)} ${MESES_ABREV[m1 - 1]} ${a1} – ${fim}`;
  if (m1 !== m2) return `${diaDoMes(segunda)} ${MESES_ABREV[m1 - 1]} – ${fim}`;
  return `${diaDoMes(segunda)} – ${fim}`;
}
const formatarDiaCurto = (iso) => { const [, mes, dia] = iso.split('-'); return `${DIAS_SEMANA_ABREV[indiceDiaSemana(iso)]} ${dia}/${mes}`; };

function rotuloFaixa(a) {
  return MENSAGENS.FAIXA(a.descricao, ROTULOS_TIPO[a.tipo], ROTULOS_STATUS_ACAO[a.status], formatarMes(a.mesConclusaoEstimado), estaVencida(a));
}
// atributos comuns: abre a gaveta; cor pelo status (Vencida usa danger, Lei 9)
// uma ação por linha (grid-row fixo), para a ordem hierárquica não se misturar
const atributosFaixa = (a, chave, linha, colunaInicio, colunaFim, extraRotulo = '') => `type="button" data-acao="gaveta-abrir" data-id="${a.id}" data-faixa="${a.id}-${chave}" data-status="${a.status}" ${estaVencida(a) ? 'data-vencida' : ''}
  style="grid-row:${linha}; grid-column:${colunaInicio} / ${colunaFim + 1}" title="${esc(a.descricao)}" aria-label="${esc(rotuloFaixa(a) + extraRotulo)}"`;
// "Vencida" é selo à parte (Lei 9), nunca parte do rótulo de status
const statusFaixa = (a) => `${badgeVencida(a)}<span class="faixa-status">${esc(ROTULOS_STATUS_ACAO[a.status])}</span>`;

// colunas da grade são 1-based; dias é a lista ISO da semana
const colunaDe = (dias, iso) => dias.indexOf(iso) + 1;

function diaFundo(iso, foraDoMes, comNumero) {
  const hoje = iso === HOJE;
  return `<div class="dia" ${ehFimDeSemana(iso) ? 'data-fim-de-semana' : ''} ${foraDoMes ? 'data-fora' : ''} ${hoje && !foraDoMes ? 'data-hoje' : ''}>${comNumero && !foraDoMes
    ? `<span class="dia-numero num">${diaDoMes(iso)}</span>${hoje ? `<span class="hoje-legenda">${esc(ROTULOS_CALENDARIO.HOJE)}</span>` : ''}` : ''}</div>`;
}

function renderMes(lista, inicio, fim) {
  const cabecalho = DIAS_SEMANA_ABREV.map((d, i) => `<div class="dia-titulo" ${i >= CONFIG.DIAS_POR_SEMANA - 2 ? 'data-fim-de-semana' : ''}>${esc(d)}</div>`).join('');
  const semanas = [];
  for (let segunda = segundaDe(inicio); segunda <= fim; segunda = somarDias(segunda, CONFIG.DIAS_POR_SEMANA)) {
    const dias = diasDaSemana(segunda);
    const doMes = dias.filter((d) => d >= inicio && d <= fim);
    const [ini, ult] = [colunaDe(dias, doMes[0]), colunaDe(dias, doMes[doMes.length - 1])];
    const visiveis = lista.slice(0, CONFIG.MAX_FAIXAS_SEMANA_MES);
    const resto = lista.length - visiveis.length;
    const faixas = visiveis.map((a, i) => `<button class="faixa" ${atributosFaixa(a, segunda, i + 1, ini, ult)}>${badgeTipo(a.tipo)}<span class="faixa-desc">${esc(a.descricao)}</span>${statusFaixa(a)}</button>`).join('')
      + (resto > 0 ? `<button type="button" class="link-botao legenda faixa-mais" data-acao="calendario-ver-semana" data-semana="${doMes[0]}" style="grid-row:${visiveis.length + 1}; grid-column:${ini} / ${ult + 1}" aria-label="${esc(MENSAGENS.VER_SEMANA(resto, formatarSemana(segunda)))}">${esc(MENSAGENS.MAIS_FAIXAS(resto))}</button>` : '');
    semanas.push(`<div class="semana-mes">
        <div class="dias-fundo" aria-hidden="true">${dias.map((d) => diaFundo(d, d < inicio || d > fim, true)).join('')}</div>
        <div class="faixas">${faixas}</div>
      </div>`);
  }
  return `<div class="dias-cabecalho" aria-hidden="true">${cabecalho}</div>${semanas.join('')}`;
}

function renderSemana(lista, segunda) {
  const u = usuarioAtual();
  const dias = diasDaSemana(segunda);
  const domingo = dias[dias.length - 1];
  const cabecalho = dias.map((d) => `<div class="dia-titulo" ${ehFimDeSemana(d) ? 'data-fim-de-semana' : ''} ${d === HOJE ? 'data-hoje' : ''}>${esc(formatarDiaCurto(d))}${d === HOJE ? `<span class="hoje-legenda">${esc(ROTULOS_CALENDARIO.HOJE)}</span>` : ''}</div>`).join('');
  const faixas = lista.map((a, i) => {
    const { inicio, fim } = intervaloDaAcao(a);
    const antes = inicio < segunda;
    const depois = fim > domingo;
    const ini = colunaDe(dias, antes ? segunda : inicio);
    const ult = colunaDe(dias, depois ? domingo : fim);
    const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
    const extra = (antes ? `. ${MENSAGENS.CONTINUA_ANTES}` : '') + (depois ? `. ${MENSAGENS.CONTINUA_DEPOIS}` : '');
    return `<button class="faixa faixa-semana" ${atributosFaixa(a, segunda, i + 1, ini, ult, extra)}>
        <span class="faixa-linha">
          ${antes ? `<span class="faixa-continua" aria-hidden="true">${ROTULOS_CALENDARIO.CONTINUA_ANTES}</span>` : ''}
          <span class="badges">${badgeTipo(a.tipo)}${badgePrioridade(a.prioridade)}</span>
          ${depois ? `<span class="faixa-continua" aria-hidden="true">${ROTULOS_CALENDARIO.CONTINUA_DEPOIS}</span>` : ''}
        </span>
        <span class="faixa-titulo">${esc(a.descricao)}</span>
        ${pai && podeVer(pai, u) ? `<span class="legenda cartao-pai">${PREFIXO_PAI} ${esc(pai.descricao)}</span>` : ''}
        <span class="faixa-linha">${iniciaisResponsaveis(a.responsaveis)}${a.tipo === E ? barraProgresso(progresso(a)) : ''}${statusFaixa(a)}</span>
      </button>`;
  }).join('');
  return `<div class="semana-quadro">
      <div class="dias-cabecalho">${cabecalho}</div>
      <div class="semana-corpo">
        <div class="dias-fundo" aria-hidden="true">${dias.map((d) => diaFundo(d, false, false)).join('')}</div>
        <div class="faixas">${faixas}</div>
      </div>
    </div>`;
}

function renderCalendario(acaoVazio) {
  const u = usuarioAtual();
  const c = estado.calendario;
  const mes = c.modo === MODO_CALENDARIO.MES;
  const inicio = mes ? inicioDoMes(c.referencia) : segundaDe(c.referencia);
  const fim = mes ? ultimoDiaDoMes(c.referencia) : somarDias(inicio, CONFIG.DIAS_POR_SEMANA - 1);
  const noPeriodo = ordenarHierarquia(acoes.filter((a) => {
    if (!podeVer(a, u) || !confereFiltrosAcoes(a, VISAO_ACOES.CALENDARIO)) return false;
    const intervalo = intervaloDaAcao(a);
    return intervalo.inicio <= fim && intervalo.fim >= inicio;
  }));
  const navegar = ROTULOS_CALENDARIO.NAVEGAR[c.modo];
  const modos = Object.values(MODO_CALENDARIO).map((m) => `<button type="button" class="aba" data-acao="calendario-modo" data-modo="${m}" aria-pressed="${m === c.modo}">${esc(ROTULOS_MODO_CALENDARIO[m])}</button>`).join('');
  const grade = mes ? renderMes(noPeriodo, inicio, fim) : renderSemana(noPeriodo, inicio);
  return `<section class="card">
      <div class="card-cabecalho calendario-barra">
        <div class="calendario-nav">
          <button type="button" class="btn btn-secundario btn-icone" data-acao="calendario-navegar" data-passo="-1" aria-label="${esc(navegar.ANTERIOR)}" title="${esc(navegar.ANTERIOR)}">${ROTULOS_CALENDARIO.ANTERIOR}</button>
          <button type="button" class="btn btn-secundario btn-icone" data-acao="calendario-navegar" data-passo="1" aria-label="${esc(navegar.PROXIMO)}" title="${esc(navegar.PROXIMO)}">${ROTULOS_CALENDARIO.PROXIMO}</button>
          <button type="button" class="btn btn-secundario" data-acao="calendario-hoje">${esc(ROTULOS_CALENDARIO.HOJE)}</button>
          <h2 class="card-titulo calendario-periodo" id="calendario-periodo" tabindex="-1" aria-live="polite">${esc(mes ? formatarMesExtenso(inicio) : formatarSemana(inicio))}</h2>
        </div>
        <div class="agrupar">
          <span class="legenda" aria-live="polite">${esc(MENSAGENS.ACOES_NO_PERIODO[c.modo](noPeriodo.length))}</span>
          <div class="abas" role="group" aria-label="${esc(ROTULOS_CALENDARIO.MODO)}">${modos}</div>
        </div>
      </div>
      ${noPeriodo.length
        ? `<div class="calendario-grade ${estado.calendarioTrocado ? 'trocando' : ''}">${grade}</div>`
        : estadoVazio(MENSAGENS.NENHUMA_ACAO_PERIODO, acaoVazio)}
    </section>`;
}

function renderAcoes() {
  const u = usuarioAtual();
  const visao = visaoAtual();
  const confere = (a) => confereFiltrosAcoes(a, visao);
  const visiveis = (lista) => lista.filter((a) => podeVer(a, u));
  // nó aparece se confere com o filtro ou tem descendente visível que confere
  const aparece = (a) => confere(a) || visiveis(filhasDe(a.id)).some(aparece);

  const linhas = [];
  const adicionar = (a, nivel, surgindo) => {
    if (!aparece(a)) return;
    const filhas = visiveis(filhasDe(a.id));
    const aberto = estado.expandidos.has(a.id);
    const expandir = filhas.length
      ? `<button type="button" class="btn-expandir" data-acao="expandir" data-id="${a.id}" aria-expanded="${aberto}" aria-label="${aberto ? 'Recolher' : 'Expandir'} ${esc(a.descricao)}">${icone(aberto ? 'abaixo' : 'direita')}</button>`
      : '<span class="espaco-expandir"></span>';
    linhas.push(`<tr ${surgindo ? 'class="surgindo"' : ''}>
      <td><div class="arvore-desc ${nivel ? `recuo-${nivel}` : ''}">${expandir}<a class="link" href="#/acoes/${a.id}">${esc(a.descricao)}</a>${badgeTipo(a.tipo)}</div></td>
      <td>${listaUsuarios(a.responsaveis)}</td>
      <td>${listaUsuarios(a.pontosFocais)}</td>
      <td>${esc(unidadePorId(a.unidadeId).nome)}</td>
      <td class="num">${formatarMes(a.mesConclusaoEstimado)}</td>
      <td>${badgePrioridade(a.prioridade)}</td>
      <td>${a.tipo === E ? barraProgresso(progresso(a)) : '<span class="legenda">—</span>'}</td>
      <td><div class="badges">${seletorStatus(a)}${badgeVencida(a)}</div></td>
    </tr>`);
    if (aberto) filhas.forEach((filha) => adicionar(filha, nivel + 1, surgindo || estado.recemExpandido === a.id));
  };
  const abas = `<div class="abas" role="tablist"><button type="button" class="aba" aria-current="page">Visão geral</button><button type="button" class="aba" data-acao="em-breve">Pauta da semana</button><button type="button" class="aba" data-acao="em-breve">Gerador de ações</button></div>`;
  const novaAcao = pode(OPERACAO.CRIAR_ESTRATEGICA) ? botaoEmBreve('Nova ação', 'btn-primario', 'mais') : '';
  const topo = cabecalho('Gestor de ações', 'Acompanhe e controle o fluxo de atividades estratégicas e operacionais', abas + novaAcao) + renderFiltrosAcoes(visao);
  // "Nova ação" já está no cabeçalho: no vazio, a ação útil é limpar os filtros
  const acaoVazio = filtrosAtivosAcoes(visao) ? '<button type="button" class="btn btn-secundario" data-acao="limpar-filtros" data-grupo="filtrosAcoes">Limpar filtros</button>' : '';
  if (visao === VISAO_ACOES.KANBAN) return topo + renderKanban(acaoVazio);
  if (visao === VISAO_ACOES.CALENDARIO) return topo + renderCalendario(acaoVazio);

  visiveis(acoes.filter((a) => a.tipo === E)).sort(porMesEId).forEach((a) => adicionar(a, 0, false));
  const total = acoes.filter((a) => podeVer(a, u) && confere(a)).length;

  return topo + `
    <section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">Ações ${badgeContagem(total)}</h2></div>
      ${linhas.length
        ? `<table class="tabela"><thead><tr><th>Descrição</th><th>Responsáveis</th><th>Ponto focal</th><th>Unidade</th><th class="num">Mês concl.</th><th>Prioridade</th><th>Progresso</th><th>Status</th></tr></thead><tbody>${linhas.join('')}</tbody></table>`
        : estadoVazio(MENSAGENS.NENHUMA_ACAO, acaoVazio)}
    </section>`;
}

/* --- T05 Detalhe da ação --- */
// grade "Dados da ação": usada no T05 e na gaveta do T04
function gradeDadosAcao(a) {
  const item = (rotulo, valor) => `<div class="detalhe-item"><dt class="rotulo">${esc(rotulo)}</dt><dd>${valor}</dd></div>`;
  return `<dl class="detalhe-grid">
      ${item('Tipo', esc(ROTULOS_TIPO[a.tipo]))}
      ${item('Status', `<div class="badges">${seletorStatus(a)}${badgeVencida(a)}</div>`)}
      ${item('Prioridade', badgePrioridade(a.prioridade))}
      ${item('Unidade', esc(unidadePorId(a.unidadeId).nome))}
      ${item('Mês de conclusão', formatarMes(a.mesConclusaoEstimado))}
      ${a.tipo === E ? item('Progresso', barraProgresso(progresso(a))) : ''}
      ${item('Responsáveis', listaUsuarios(a.responsaveis))}
      ${item('Pontos focais', listaUsuarios(a.pontosFocais, MENSAGENS.NENHUM_PONTO_FOCAL))}
    </dl>`;
}

function renderDetalhe(id) {
  const u = usuarioAtual();
  const a = acaoPorId(id);
  if (!a || !pode(OPERACAO.VER, a)) return renderEstado(ESTADO_TELA.NAO_ENCONTRADO); // 404 idêntico

  const trilha = [];
  for (let pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null; pai; pai = pai.acaoPaiId ? acaoPorId(pai.acaoPaiId) : null) {
    trilha.unshift(`<a class="link-discreto" href="#/acoes/${pai.id}">${esc(ROTULOS_TIPO[pai.tipo])}: ${esc(pai.descricao)}</a>`);
  }
  trilha.unshift(`<a class="link-discreto" href="${ROTAS.ACOES}">Gestor de ações</a>`);

  const bloqueio = motivoBloqueioExclusao(a);
  let botoes = '';
  if (pode(OPERACAO.EDITAR, a)) botoes += botaoEmBreve('Editar');
  if (pode(OPERACAO.EXCLUIR, a)) {
    botoes += `<button type="button" class="btn btn-perigo" data-acao="excluir" data-id="${a.id}" ${bloqueio ? `disabled title="${esc(bloqueio)}"` : ''}>Excluir</button>`;
  }
  const somenteLeitura = !pode(OPERACAO.EDITAR, a) && !pode(OPERACAO.MUDAR_STATUS, a);

  const filhas = filhasDe(a.id).filter((x) => podeVer(x, u));
  const tipoFilha = a.tipo === E ? O : S;
  const podeCriarFilha = a.tipo === E ? pode(OPERACAO.CRIAR_OPERACIONAL, a) : pode(OPERACAO.CRIAR_SUB_ACAO, a);
  const botaoNovaFilha = podeCriarFilha ? botaoEmBreve(`Nova ${a.tipo === E ? 'operacional' : 'sub-ação'}`, 'btn-secundario', 'mais') : '';

  const cardFilhas = a.tipo === S ? '' : `<section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">${ROTULOS_TIPO_PLURAL[tipoFilha]} ${badgeContagem(filhas.length)}</h2>${botaoNovaFilha}</div>
      ${filhas.length ? `<table class="tabela"><thead><tr><th>Descrição</th><th>Responsáveis</th><th class="num">Mês concl.</th><th>Prioridade</th><th>Status</th></tr></thead><tbody>
        ${filhas.map((x) => `<tr><td><a class="link" href="#/acoes/${x.id}">${esc(x.descricao)}</a></td><td>${listaUsuarios(x.responsaveis)}</td><td class="num">${formatarMes(x.mesConclusaoEstimado)}</td><td>${badgePrioridade(x.prioridade)}</td><td><div class="badges">${seletorStatus(x)}${badgeVencida(x)}</div></td></tr>`).join('')}
      </tbody></table>` : estadoVazio(MENSAGENS.NENHUMA_FILHA)}
    </section>`;

  return `<nav class="trilha" aria-label="Trilha">${trilha.join('<span aria-hidden="true">/</span>')}</nav>`
    + cabecalho(a.descricao, '', botoes)
    + `<div class="badges">${badgeTipo(a.tipo)}${badgeStatus(a.status)}${badgeVencida(a)}</div>`
    + (bloqueio && pode(OPERACAO.EXCLUIR, a) ? `<p class="motivo">${esc(bloqueio)}</p>` : '')
    + (somenteLeitura ? `<p class="aviso">${esc(MENSAGENS.HERANCA)}</p>` : '')
    + `<section class="card"><h2 class="card-titulo">Dados da ação</h2>${gradeDadosAcao(a)}</section>`
    + cardFilhas
    + `<section class="card"><h2 class="card-titulo">Histórico de status</h2><p class="legenda">${esc(MENSAGENS.HISTORICO_EM_BREVE)}</p></section>`;
}

/* --- T04 Gaveta de detalhe rápido (editar e excluir ficam só no T05) --- */
function renderGaveta(a) {
  const u = usuarioAtual();
  const trilha = [];
  for (let pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null; pai; pai = pai.acaoPaiId ? acaoPorId(pai.acaoPaiId) : null) {
    if (podeVer(pai, u)) trilha.unshift(`<button type="button" class="link-botao legenda" data-acao="gaveta-abrir" data-id="${pai.id}">${esc(ROTULOS_TIPO[pai.tipo])}: ${esc(pai.descricao)}</button>`);
  }
  const somenteLeitura = !pode(OPERACAO.EDITAR, a) && !pode(OPERACAO.MUDAR_STATUS, a);
  const filhas = filhasDe(a.id).filter((x) => podeVer(x, u));
  const tipoFilha = a.tipo === E ? O : S;
  const secaoFilhas = a.tipo === S ? '' : `<section class="gaveta-secao"><h3 class="card-titulo">${ROTULOS_TIPO_PLURAL[tipoFilha]} ${badgeContagem(filhas.length)}</h3>
      ${filhas.length
        ? `<ul class="lista-curta">${filhas.map((x) => `<li><button type="button" class="link-botao" data-acao="gaveta-abrir" data-id="${x.id}">${esc(x.descricao)}</button><span class="badges">${badgeStatus(x.status)}${badgeVencida(x)}</span></li>`).join('')}</ul>`
        : `<p class="legenda">${esc(MENSAGENS.NENHUMA_FILHA)}</p>`}

  return `<div class="gaveta-topo">
      <nav class="trilha" aria-label="Trilha">${trilha.join('<span class="legenda" aria-hidden="true">/</span>') || `<span class="legenda">${esc(ROTULOS_TIPO[a.tipo])}</span>`}</nav>
      <button type="button" class="btn btn-terciario" data-acao="gaveta-fechar">${icone('fechar')}${esc(MENSAGENS.FECHAR)}</button>
    </div>
    <div class="gaveta-cabecalho">
      <h2 class="gaveta-titulo" id="gaveta-titulo" tabindex="-1">${esc(a.descricao)}</h2>
      <div class="badges">${badgeTipo(a.tipo)}</div>
      ${somenteLeitura ? `<p class="aviso">${esc(MENSAGENS.HERANCA)}</p>` : ''}
    </div>
    <section class="gaveta-secao"><h3 class="card-titulo">Dados da ação</h3>${gradeDadosAcao(a)}</section>
    ${secaoFilhas}

/* --- Shell persistente (criado uma vez; só o conteúdo é re-renderizado) --- */
function renderShell() {
  const itens = MENU.map((m) => `<a class="nav-item" href="${m.rota}" data-menu="${m.base}" aria-label="${esc(m.rotulo)}">${icone(m.icone, 'icone-nav')}<span class="recolhivel">${esc(m.rotulo)}</span></a>`).join('');
  const usuarios = USUARIOS.filter((x) => x.status === STATUS_USUARIO.ATIVO) // inativo não entra (401/403)
    .map((x) => `<option value="${x.id}">${esc(x.username)} — ${esc(ROTULOS_PAPEL[x.role])}</option>`).join('');
  const estados = Object.values(ESTADO_TELA).map((s) => `<option value="${s}">${esc(ROTULOS_ESTADO_TELA[s])}</option>`).join('');
  return `<div class="shell">
    <aside class="sidebar" aria-label="Navegação">
      <div class="marca"><span class="marca-logo" aria-hidden="true">nb</span><div class="recolhivel"><div class="marca-nome">Newbay Control</div><div class="marca-sub">Gestor de ações</div></div></div>
      <nav class="nav" aria-label="Principal">${itens}</nav>
      <div class="cartao-usuario">
        <div class="usuario-linha"><span class="avatar" id="usuario-iniciais" aria-hidden="true"></span>
          <div class="usuario-texto recolhivel"><span class="cartao-usuario-nome" id="usuario-nome"></span><span class="cartao-usuario-papel" id="usuario-papel"></span></div></div>
        <button type="button" class="btn-sair" data-acao="sair" aria-label="Sair">${icone('sair')}<span class="recolhivel">Sair</span></button>
      </div>
    </aside>
    <div class="main">
      <div class="demo" aria-label="Controle de demonstração"><span class="demo-titulo">Demonstração</span>
        <label>Usuário <select class="select" data-campo="usuario">${usuarios}</select></label>
        <label>Estado da tela <select class="select" data-campo="estado-tela">${estados}</select></label>
        <span>Hoje: ${HOJE.split('-').reverse().join('/')}</span></div>
      <main class="conteudo" id="conteudo"></main>

function atualizarShell(base) {
  const u = usuarioAtual();
  document.querySelectorAll('[data-menu]').forEach((link) => {
    const item = MENU.find((m) => m.base === link.dataset.menu);
    link.hidden = Boolean(item.operacao) && !pode(item.operacao);
    if (item.base === base) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
  });
  document.getElementById('usuario-iniciais').textContent = iniciais(u.username);
  document.getElementById('usuario-nome').textContent = u.username;
  document.getElementById('usuario-papel').textContent = ROTULOS_PAPEL[u.role];
  document.querySelector('[data-campo="usuario"]').value = String(estado.usuarioId);
  document.querySelector('[data-campo="estado-tela"]').value = estado.estadoTela;
}

/* ===== 6. Roteador por hash ===== */
function renderTela(base, id) {
  if (estado.estadoTela !== ESTADO_TELA.NORMAL) return renderEstado(estado.estadoTela);
  const itemMenu = MENU.find((m) => m.base === base);
  switch (base) {
    case 'painel': return renderPainel();
    case 'acoes': return id === undefined ? renderAcoes() : renderDetalhe(Number(id));
    case 'reunioes':
    case 'historico-reunioes': return renderEmBreve(itemMenu.rotulo);
    case 'usuarios': return pode(OPERACAO.VER_USUARIOS) ? renderEmBreve(itemMenu.rotulo) : renderEstado(ESTADO_TELA.SEM_PERMISSAO);
    default: return renderEstado(ESTADO_TELA.NAO_ENCONTRADO);
  }
}

function seletorDeFoco(el) {
  if (!el || el === document.body) return null;
  const partes = ATRIBUTOS_FOCO.filter((a) => el.hasAttribute(a)).map((a) => `[${a}="${el.getAttribute(a)}"]`);
  return partes.length ? partes.join('') : null;
}

// query do hash (#/acoes?visao=kanban)
function lerQuery() {
  const i = location.hash.indexOf('?');
  return new URLSearchParams(i === -1 ? '' : location.hash.slice(i + 1));
}

// re-renderiza um contêiner devolvendo o foco (e a posição do cursor, em campos de texto)
function trocarConteudo(conteiner, html) {
  const ativo = conteiner.contains(document.activeElement) ? document.activeElement : null;
  const foco = seletorDeFoco(ativo);
  const cursor = ativo && typeof ativo.selectionStart === 'number' ? [ativo.selectionStart, ativo.selectionEnd] : null;
  conteiner.innerHTML = html;
  if (!foco) return;
  const alvo = conteiner.querySelector(foco);
  if (!alvo || alvo.disabled) return;
  alvo.focus({ preventScroll: true });
  if (cursor && alvo.setSelectionRange) alvo.setSelectionRange(cursor[0], cursor[1]);
}

function render() {
  const app = document.getElementById('app');
  const hash = location.hash;
  const [caminho] = hash.replace(/^#\//, '').split('?');
  const [base, id] = caminho.split('/');
  const rotaMudou = hash !== estado.rotaRenderizada;
  estado.rotaRenderizada = hash;
  if (base !== 'acoes' || id !== undefined) fecharGaveta(); // a gaveta só existe no T04
  if (base === 'login') { app.innerHTML = renderLogin(); return; }
  if (!document.getElementById('conteudo')) app.innerHTML = renderShell();
  atualizarShell(base);

  const conteudo = document.getElementById('conteudo');
  conteudo.classList.remove('entrando'); // animação de entrada só na troca de rota
  trocarConteudo(conteudo, renderTela(base, id));
  if (rotaMudou) {
    void conteudo.offsetWidth; // reinicia a animação
    conteudo.classList.add('entrando');
    window.scrollTo(0, 0);
  }
  atualizarGaveta();
  estado.recemExpandido = null;
  estado.recemMovido = null;
  estado.calendarioTrocado = false;
}

function irPara(destino) {
  if (location.hash === destino) render(); else location.hash = destino;
}

// o toast não recebe foco ao aparecer; o tempo pausa enquanto ele está sob o mouse ou com foco
let timerToast;
let duracaoToast = CONFIG.DURACAO_TOAST_MS;
const elToast = () => document.getElementById('toast');
function esconderToast() {
  clearTimeout(timerToast);
  elToast().classList.remove('visivel');
  estado.ultimaMudanca = null; // fim da janela do "Desfazer"
}
function agendarFimToast() {
  clearTimeout(timerToast);
  timerToast = setTimeout(esconderToast, duracaoToast);
}
function toast(mensagem, tipo = 'sucesso', { desfazer = false } = {}) {
  const el = elToast();
  const botao = el.querySelector('[data-acao="desfazer"]');
  document.getElementById('toast-texto').textContent = mensagem;
  botao.textContent = MENSAGENS.DESFAZER;
  botao.hidden = !desfazer;
  if (!desfazer) estado.ultimaMudanca = null;
  el.dataset.tipo = tipo;
  el.classList.add('visivel');
  duracaoToast = desfazer ? CONFIG.DURACAO_DESFAZER_MS : CONFIG.DURACAO_TOAST_MS;
  agendarFimToast();
}

function anunciar(mensagem) {
  const el = document.getElementById('anuncio');
  el.textContent = '';
  requestAnimationFrame(() => { el.textContent = mensagem; });
}

// toda mudança de status passa por aqui (lista, Kanban, gaveta, T05 e "Desfazer")
function mudarStatus(id, novo, { desfazendo = false, anunciarMovimento = false } = {}) {
  const a = acaoPorId(id);
  if (!a || !pode(OPERACAO.VER, a)) { toast(MENSAGENS.ACAO_NAO_ENCONTRADA, 'erro'); render(); return; } // 404 idêntico
  if (!pode(OPERACAO.MUDAR_STATUS, a)) { toast(MENSAGENS.SEM_PERMISSAO_OPERACAO, 'erro'); render(); return; } // 403
  if (!Object.values(STATUS_ACAO).includes(novo)) return; // só valores do enum
  if (a.status === novo) return; // Lei 12: mesmo status não tem efeito
  const de = a.status;
  a.status = novo;
  estado.recemMovido = id;
  if (desfazendo) toast(MENSAGENS.MUDANCA_DESFEITA);
  else {
    toast(MENSAGENS.STATUS_ATUALIZADO, 'sucesso', { desfazer: true });
    estado.ultimaMudanca = { id, de, para: novo, usuarioId: estado.usuarioId };
  }
  if (anunciarMovimento) anunciar(MENSAGENS.ACAO_MOVIDA(a.descricao, ROTULOS_STATUS_ACAO[novo]));
  render();
}

function desfazerMudanca() {
  const m = estado.ultimaMudanca;
  esconderToast();
  if (!m || m.usuarioId !== estado.usuarioId) return; // só quem mudou desfaz
  const a = acaoPorId(m.id);
  if (!a || a.status !== m.para) return; // a ação mudou de novo ou foi excluída
  mudarStatus(m.id, m.de, { desfazendo: true });
  // o botão some com o toast: o foco vai para o controle da ação, se estiver na tela
  const alvo = document.querySelector(`#gaveta[open] [data-status-acao="${m.id}"], #conteudo [data-cartao="${m.id}"], #conteudo [data-status-acao="${m.id}"]`);
  if (alvo) alvo.focus({ preventScroll: true });
}

// Kanban: mover cartão para outra coluna (mouse ou teclado)
function moverCartao(id, novo) {
  const a = acaoPorId(id);
  if (!a || a.status === novo) return; // Lei 12: mesma coluna não faz nada
  mudarStatus(id, novo, { anunciarMovimento: true });
}

function moverCartaoPorTeclado(cartao, passo) {
  const id = Number(cartao.dataset.cartao);
  const a = acaoPorId(id);
  if (!a) return;
  if (!pode(OPERACAO.MUDAR_STATUS, a)) { anunciar(MENSAGENS.STATUS_BLOQUEADO); return; }
  const ordem = Object.values(STATUS_ACAO);
  const destino = ordem[ordem.indexOf(a.status) + passo];
  if (destino) moverCartao(id, destino);
}

/* Gaveta de detalhe rápido */
let origemGaveta = null; // seletor do controle que abriu a gaveta, para devolver o foco
function abrirGaveta(id, origem) {
  const a = acaoPorId(id);
  if (!a || !pode(OPERACAO.VER, a)) return;
  const gaveta = document.getElementById('gaveta');
  if (!gaveta.open) {
    origemGaveta = seletorDeFoco(origem);
    gaveta.append(elToast()); // fora do modal o toast ficaria inerte
    gaveta.showModal();
  }
  estado.gavetaAcaoId = id;
  atualizarGaveta();
  document.getElementById('gaveta-titulo').focus();
}

function atualizarGaveta() {
  const gaveta = document.getElementById('gaveta');
  if (!gaveta.open || gaveta.classList.contains('fechando')) return;
  const a = acaoPorId(estado.gavetaAcaoId);
  // fecha se a ação deixou de ser visível (troca de usuário, exclusão) ou a tela saiu do estado normal
  if (!a || !pode(OPERACAO.VER, a) || estado.estadoTela !== ESTADO_TELA.NORMAL) { fecharGaveta(); return; }
  trocarConteudo(document.getElementById('gaveta-corpo'), renderGaveta(a));
}

function fecharGaveta() {
  const gaveta = document.getElementById('gaveta');
  if (!gaveta.open || gaveta.classList.contains('fechando')) return;
  fecharDialogo(gaveta, aoFecharGaveta);
}

// também é chamada pelo evento close (Esc forçado pelo navegador); roda uma vez por abertura
function aoFecharGaveta() {
  if (estado.gavetaAcaoId === null) return;
  estado.gavetaAcaoId = null;
  document.body.append(elToast());
  const alvo = origemGaveta && document.querySelector(`#conteudo ${origemGaveta}`);
  if (alvo) alvo.focus({ preventScroll: true });
  origemGaveta = null;
}

function abrirConfirmacao(id) {
  const a = acaoPorId(id);
  if (!a || !pode(OPERACAO.EXCLUIR, a) || motivoBloqueioExclusao(a)) return;
  const dialogo = document.getElementById('dialogo');
  document.getElementById('dialogo-titulo').textContent = `Excluir ${ROTULOS_TIPO[a.tipo].toLowerCase()}?`;
  document.getElementById('dialogo-texto').textContent = { [E]: MENSAGENS.CONFIRMAR_EXCLUSAO_E, [O]: MENSAGENS.CONFIRMAR_EXCLUSAO_O, [S]: MENSAGENS.CONFIRMAR_EXCLUSAO_S }[a.tipo];
  dialogo.dataset.id = String(id);
  dialogo.showModal();
}

function fecharDialogo(dialogo, depois) {
  let terminou = false;
  const fim = () => {
    if (terminou) return;
    terminou = true;
    dialogo.removeEventListener('animationend', aoTerminar);
    dialogo.classList.remove('fechando'); dialogo.close(); if (depois) depois();
  };
  function aoTerminar(evento) { if (evento.target === dialogo && !evento.pseudoElement) fim(); } // ignora animações internas e do fundo
  dialogo.classList.add('fechando');
  const estilo = getComputedStyle(dialogo);
  if (estilo.animationName === 'none') { fim(); return; }
  dialogo.addEventListener('animationend', aoTerminar);
  setTimeout(fim, parseFloat(estilo.animationDuration) * CONFIG.MS_POR_SEGUNDO * CONFIG.FATOR_SALVAGUARDA_ANIMACAO); // salvaguarda se o animationend não vier
}

// Leis 10 e 11: exclusão física com cascata, independente de visibilidade
function excluirEmCascata(id) {
  const a = acaoPorId(id);
  const ids = new Set([id]);
  let cresceu = true;
  while (cresceu) {
    cresceu = false;
    for (const x of acoes) {
      if (x.acaoPaiId !== null && ids.has(x.acaoPaiId) && !ids.has(x.id)) { ids.add(x.id); cresceu = true; }
    }
  }
  acoes = acoes.filter((x) => !ids.has(x.id));
  toast(MENSAGENS.ACAO_EXCLUIDA);
  const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
  irPara(pai && pode(OPERACAO.VER, pai) ? `#/acoes/${pai.id}` : ROTAS.ACOES);
}

document.addEventListener('click', (evento) => {
  const alvo = evento.target.closest('[data-acao]');
  if (!alvo) return;
  const dialogo = document.getElementById('dialogo');
  switch (alvo.dataset.acao) {
    case 'expandir': {
      const id = Number(alvo.dataset.id);
      if (estado.expandidos.has(id)) estado.expandidos.delete(id);
      else { estado.expandidos.add(id); estado.recemExpandido = id; }
      render();
      break;
    }
    case 'kpi': {
      const kpi = KPIS.find((k) => k.chave === alvo.dataset.kpi);
      // clicar no cartão ativo volta para "No escopo"
      estado.filtrosPainel.status = kpi.status === estado.filtrosPainel.status ? FILTRO_STATUS_PAINEL.TODOS : kpi.status;
      render();
      break;
    }
    case 'limpar-filtros': {
      const grupo = alvo.dataset.grupo;
      clearTimeout(timerBusca);
      Object.assign(estado[grupo], FILTROS_INICIAIS[grupo]);
      render();
      document.querySelector(`[data-filtro="${grupo}.unidadeId"]`).focus(); // o botão fica desabilitado
      break;
    }
    case 'visao': irPara(ROTA_VISAO[alvo.dataset.visao]); break;
    case 'agrupar': estado.agrupamentoKanban = alvo.dataset.agrupamento; render(); break;
    case 'calendario-navegar': {
      const c = estado.calendario;
      const passo = Number(alvo.dataset.passo);
      c.referencia = c.modo === MODO_CALENDARIO.MES ? somarMeses(c.referencia, passo) : somarDias(c.referencia, passo * CONFIG.DIAS_POR_SEMANA);
      estado.calendarioTrocado = true;
      render();
      break;
    }
    case 'calendario-hoje': estado.calendario.referencia = HOJE; estado.calendarioTrocado = true; render(); break;
    case 'calendario-modo': estado.calendario.modo = alvo.dataset.modo; estado.calendarioTrocado = true; render(); break;
    case 'calendario-ver-semana':
      Object.assign(estado.calendario, { modo: MODO_CALENDARIO.SEMANA, referencia: alvo.dataset.semana });
      estado.calendarioTrocado = true;
      render();
      document.getElementById('calendario-periodo').focus(); // o "+N mais" some: o foco vai para o título do período
      break;
    case 'recolher-raia': {
      const id = Number(alvo.dataset.id);
      if (estado.raiasRecolhidas.has(id)) estado.raiasRecolhidas.delete(id); else estado.raiasRecolhidas.add(id);
      render();
      break;
    }
    case 'gaveta-abrir': abrirGaveta(Number(alvo.dataset.id), alvo); break;
    case 'gaveta-fechar': fecharGaveta(); break;
    case 'desfazer': desfazerMudanca(); break;
    case 'em-breve': toast(MENSAGENS.EM_BREVE); break;
    case 'excluir': abrirConfirmacao(Number(alvo.dataset.id)); break;
    case 'cancelar-exclusao': fecharDialogo(dialogo); break;
    case 'confirmar-exclusao': fecharDialogo(dialogo, () => excluirEmCascata(Number(dialogo.dataset.id))); break;
    case 'tentar-de-novo': estado.estadoTela = ESTADO_TELA.NORMAL; render(); break;
    case 'sair': irPara(ROTAS.LOGIN); break;
    default: break;
  }
});

document.addEventListener('change', (evento) => {
  const alvo = evento.target;
  if (alvo.matches('[data-campo="usuario"]')) { esconderToast(); estado.usuarioId = Number(alvo.value); render(); return; } // encerra o "Desfazer" do usuário anterior
  if (alvo.matches('[data-campo="estado-tela"]')) { estado.estadoTela = alvo.value; render(); return; }
  if (alvo.matches('[data-filtro]') && alvo.type !== 'search') { // a busca é tratada no evento input
    const [grupo, chave] = alvo.dataset.filtro.split('.');
    estado[grupo][chave] = alvo.value;
    render();
    return;
  }
  if (alvo.matches('[data-status-acao]')) mudarStatus(Number(alvo.dataset.statusAcao), alvo.value);
});

let timerBusca;
document.addEventListener('input', (evento) => {
  const alvo = evento.target;
  if (!alvo.matches('[data-filtro="filtrosAcoes.busca"]')) return;
  const valor = alvo.value;
  clearTimeout(timerBusca);
  timerBusca = setTimeout(() => { estado.filtrosAcoes.busca = valor; render(); }, CONFIG.DEBOUNCE_BUSCA_MS);
});

// teclado no cartão: Enter ou Espaço abre a gaveta; Alt+← e Alt+→ movem para a coluna vizinha
document.addEventListener('keydown', (evento) => {
  const cartao = evento.target instanceof Element && evento.target.matches('[data-cartao]') ? evento.target : null;
  if (!cartao) return;
  if ((evento.key === 'Enter' || evento.key === ' ') && !evento.altKey) {
    evento.preventDefault();
    abrirGaveta(Number(cartao.dataset.cartao), cartao);
  } else if (evento.altKey && (evento.key === 'ArrowRight' || evento.key === 'ArrowLeft')) {
    evento.preventDefault(); // evita o voltar/avançar do navegador
    moverCartaoPorTeclado(cartao, evento.key === 'ArrowRight' ? 1 : -1);
  }
});

// arrastar e soltar (API nativa do HTML5); só entre colunas da mesma raia
let arrastandoId = null;
function limparArraste() {
  arrastandoId = null;
  document.querySelectorAll('[data-arrastando], [data-destino], [data-origem], [data-sobre]').forEach((el) => {
    el.removeAttribute('data-arrastando'); el.removeAttribute('data-destino'); el.removeAttribute('data-origem'); el.removeAttribute('data-sobre');
  });
}
document.addEventListener('dragstart', (evento) => {
  const cartao = evento.target instanceof Element ? evento.target.closest('[data-cartao]') : null;
  if (!cartao || cartao.getAttribute('draggable') !== 'true') return;
  const a = acaoPorId(Number(cartao.dataset.cartao));
  if (!a || !pode(OPERACAO.MUDAR_STATUS, a)) { evento.preventDefault(); return; }
  arrastandoId = a.id;
  evento.dataTransfer.effectAllowed = 'move';
  evento.dataTransfer.setData('text/plain', String(a.id));
  const quadro = cartao.closest('.quadro-conteudo');
  quadro.setAttribute('data-arrastando', '');
  quadro.querySelectorAll('.coluna-kanban').forEach((coluna) => {
    if (coluna.dataset.raia === cartao.dataset.raia && coluna.dataset.coluna !== a.status) coluna.setAttribute('data-destino', '');
  });
  requestAnimationFrame(() => cartao.setAttribute('data-origem', '')); // depois da captura da imagem de arraste
});
document.addEventListener('dragover', (evento) => {
  if (arrastandoId === null) return;
  const coluna = evento.target instanceof Element ? evento.target.closest('.coluna-kanban[data-destino]') : null;
  // destaque próprio só na coluna sob o cursor
  document.querySelectorAll('[data-sobre]').forEach((el) => { if (el !== coluna) el.removeAttribute('data-sobre'); });
  if (!coluna) return;
  coluna.setAttribute('data-sobre', '');
  evento.preventDefault();
  evento.dataTransfer.dropEffect = 'move';
});
document.addEventListener('drop', (evento) => {
  const coluna = evento.target instanceof Element ? evento.target.closest('.coluna-kanban[data-destino]') : null;
  if (arrastandoId === null || !coluna) return;
  evento.preventDefault();
  const id = arrastandoId;
  limparArraste();
  moverCartao(id, coluna.dataset.coluna);
});
document.addEventListener('dragend', limparArraste);

document.addEventListener('submit', (evento) => {
  if (!evento.target.matches('[data-form="login"]')) return;
  evento.preventDefault();
  irPara(ROTAS.PAINEL);
});

document.getElementById('dialogo').addEventListener('cancel', (evento) => { evento.preventDefault(); fecharDialogo(evento.target); });
document.getElementById('gaveta').addEventListener('cancel', (evento) => { evento.preventDefault(); fecharGaveta(); });
document.getElementById('gaveta').addEventListener('close', aoFecharGaveta);
const toastEl = elToast();
toastEl.addEventListener('mouseenter', () => clearTimeout(timerToast));
toastEl.addEventListener('focusin', () => clearTimeout(timerToast));
toastEl.addEventListener('mouseleave', () => { if (toastEl.classList.contains('visivel') && !toastEl.contains(document.activeElement)) agendarFimToast(); });
toastEl.addEventListener('focusout', (evento) => { if (toastEl.classList.contains('visivel') && !toastEl.contains(evento.relatedTarget) && !toastEl.matches(':hover')) agendarFimToast(); });
window.addEventListener('hashchange', render);

/* ===== 7. Inicialização ===== */
if (!location.hash) location.hash = ROTAS.LOGIN;
render();
</script>
</body>
</html>
