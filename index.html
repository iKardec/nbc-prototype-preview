  .nivel-item-rotulo { font-size: var(--font-size-xs); letter-spacing: -0.01em; }
  .card-nivel .glifo-status { font-size: var(--font-size-xs); }
}
.sem-progresso { display: inline-flex; }

/* ── telas/acoes/gerador.css ── */
.tipos-acao { display: grid; grid-template-columns: repeat(var(--tipos), minmax(0, 1fr)); gap: var(--space-3); }
.tipo-opcao {
  display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-3) var(--space-4);
  border: 1px solid var(--color-border); border-left: var(--tape-width) solid var(--color-border-strong);
  cursor: pointer;
  transition: border-color var(--duration-fast) var(--easing-standard), background-color var(--duration-fast) var(--easing-standard);
}
.tipo-opcao:hover { border-color: var(--color-border-strong); }
.tipo-opcao:has(input:focus-visible) { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.tipo-opcao-nome { font-family: var(--font-family-display); font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); }
.bloco-filha { min-width: 0; margin: 0; border: 0; border-left: var(--tape-width) solid var(--color-accent); }
.bloco-filha > legend { float: left; width: 100%; margin-bottom: var(--space-1); padding: 0; }
.bloco-filha > .legenda { clear: both; margin-bottom: var(--space-4); }
.tipo-opcao[data-tipo="ESTRATEGICA"] { --tipo-cor: var(--tipo-estrategica); --tipo-bg: var(--tipo-estrategica-bg); --tipo-texto: var(--tipo-estrategica-texto); }
.tipo-opcao[data-tipo="OPERACIONAL"] { --tipo-cor: var(--tipo-operacional); --tipo-bg: var(--tipo-operacional-bg); --tipo-texto: var(--tipo-operacional-texto); }
.tipo-opcao[data-tipo="SUB_ACAO"] { --tipo-cor: var(--tipo-sub-acao); --tipo-bg: var(--tipo-sub-acao-bg); --tipo-texto: var(--tipo-sub-acao-texto); }
.tipo-opcao:has(input:checked) { border-left-color: var(--tipo-cor); background: var(--tipo-bg); }
.tipo-opcao-nome .selo-tipo { font-size: var(--font-size-md); line-height: var(--line-height-md); }
/* tipos no Gerador e bloco da primeira operacional: painéis da referência */
.tipo-opcao { border-radius: var(--aero-raio-opcao); border-color: var(--color-border); background: var(--color-surface); }
.tipo-opcao:has(input:checked) { border-color: transparent; box-shadow: inset 0 0 0 var(--aero-contorno-selecionado) var(--tipo-cor); }
.bloco-filha { padding: var(--space-5); border-radius: var(--aero-raio-painel); background: var(--aero-painel-o); }

/* ── telas/calendario/calendario.css ── */
/* Calendário: grade comum e faixas de ações (v5) */
.calendario-barra { flex-wrap: wrap; }
.calendario-nav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.calendario-periodo { margin-left: var(--space-2); }
.calendario-periodo:focus { outline: 0; }
/* não interativo: recebe foco por script depois do "+N mais" */
.calendario-grade { border: 1px solid var(--color-border); overflow: hidden; }
.calendario-grade.trocando { animation: surgir var(--duration-fast) var(--easing-standard); }
.dias-cabecalho, .dias-fundo, .faixas { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dias-cabecalho { border-bottom: 1px solid var(--color-border); }
.dia-titulo {
  display: flex; align-items: center; gap: var(--space-1); border-right: 1px solid var(--color-border);
  line-height: var(--line-height-sm); font-weight: var(--font-weight-medium); color: var(--color-text-muted);
}
.dias-fundo { position: absolute; inset: 0; }
.dia { padding: var(--space-1) var(--space-2); border-right: 1px solid var(--color-border); font-size: var(--font-size-xs); line-height: var(--line-height-sm); }
.dia:last-child, .dia-titulo:last-child { border-right: 0; }
.dia[data-fim-de-semana], .dia-titulo[data-fim-de-semana] { background: var(--color-bg); }
.dia[data-fora] { background: var(--color-surface-muted); color: var(--color-text-muted); }
.dia-numero { display: inline-grid; place-items: center; padding: 0 var(--space-1); border-radius: var(--radius-full); }
.hoje-legenda { margin-left: var(--space-1); font-weight: var(--font-weight-semibold); color: var(--color-text); }
.semana-mes { position: relative; min-height: var(--calendar-day-min-height); border-bottom: 1px solid var(--color-border); }
.semana-mes:last-child { border-bottom: 0; }
.faixas { position: relative; row-gap: var(--space-1); padding: calc(var(--line-height-sm) + var(--space-2)) 0 var(--space-2); }
.faixa {
  display: flex; align-items: center; gap: var(--space-2); min-width: 0; height: var(--calendar-bar-height);
  margin: 0 var(--space-1); border: 0; font-size: var(--font-size-xs); line-height: var(--line-height-xs);
  text-align: left; cursor: pointer; overflow: hidden;
  transition: box-shadow var(--duration-fast) var(--easing-standard);
}
.faixa:hover { box-shadow: var(--shadow-card-hover); }
.faixa .badge { flex: none; }
.faixa .badge:not([data-prioridade="PAUTA_SEMANA"]) { background: var(--color-surface); }
/* contorno sobre a faixa neutra */
.faixa-desc { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: var(--font-weight-medium); }
.faixa-status { flex: none; font-weight: var(--font-weight-medium); white-space: nowrap; }
.faixa-mais { margin: 0 var(--space-2); justify-self: start; }
.semana-quadro { max-height: calc(100vh - var(--space-7) * 5); overflow-y: auto; }
.semana-quadro .dias-cabecalho { position: sticky; top: 0; z-index: 1; }
.semana-corpo { position: relative; min-height: calc(var(--calendar-day-min-height) * 2); }
.semana-corpo .faixas { row-gap: var(--space-2); padding-top: var(--space-2); }
.faixa-semana { flex-direction: column; align-items: stretch; gap: var(--space-1); height: auto; min-height: var(--calendar-bar-height-week); padding: var(--space-2) var(--space-3); }
.faixa-linha { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); min-width: 0; }
.faixa-titulo {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  font-size: var(--font-size-sm); line-height: var(--line-height-sm); font-weight: var(--font-weight-medium);
}
.faixa .cartao-pai { display: block; }
.faixa .progresso { flex: 1; min-width: 0; }
.faixa-continua { flex: none; font-size: var(--font-size-sm); }
.faixa-linha .badges { flex: 1; }
.dia-fora-mes { margin-left: var(--space-1); }
/* Calendário (tela própria desde a v6: ações e reuniões) */
.calendario-contexto {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: var(--space-4);
  min-height: calc(var(--control-height) + var(--line-height-xs) + var(--space-1));
}
.calendario-contexto-texto { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); }
.calendario-contexto-titulo { font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); }
.calendario-contexto .campo { flex: 0 0 calc(var(--space-7) * 5); }
.calendario-rodape { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3); }
/* Reuniões no mês: uma célula por dia, eventos com hora */
.mes-reunioes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dia-reunioes {
  display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; min-height: var(--calendar-day-min-height);
  padding: var(--space-1) var(--space-1) var(--space-2);
  border-right: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border);
  font-size: var(--font-size-xs); line-height: var(--line-height-sm);
}
.dia-reunioes:nth-child(7n) { border-right: 0; }
.dia-reunioes:nth-last-child(-n + 7) { border-bottom: 0; }
.dia-reunioes[data-fim-de-semana] { background: var(--color-bg); }
.dia-reunioes[data-fora] { background: var(--color-surface-muted); color: var(--color-text-muted); }
.dia-topo { display: flex; justify-content: space-between; align-items: center; gap: var(--space-1); padding-left: var(--space-1); }
.dia-agendar {
  width: var(--space-5); height: var(--space-5); flex: none; display: grid; place-items: center; padding: 0;
  border: 0; border-radius: var(--radius-sm); background: none; color: var(--color-text-muted); cursor: pointer; opacity: 0;
  transition: opacity var(--duration-fast) var(--easing-standard), background-color var(--duration-fast) var(--easing-standard);
}
.dia-reunioes:hover .dia-agendar, .dia-agendar:focus-visible { opacity: 1; }
.dia-agendar:hover { background: var(--color-surface-muted); color: var(--color-text); }
@media (hover: none) {
  .dia-agendar { opacity: 1; }
}
.evento {
  display: flex; align-items: center; gap: var(--space-1); width: 100%; min-width: 0; border: 0;
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); text-align: left; cursor: pointer;
  transition: box-shadow var(--duration-fast) var(--easing-standard);
}
.evento:hover, .evento-bloco:hover { box-shadow: var(--shadow-card-hover); }
.evento-hora { flex: none; font-weight: var(--font-weight-semibold); white-space: nowrap; }
/* status nunca só pela cor: rótulo visível em cada reunião */
.evento-status { flex: none; font-weight: var(--font-weight-medium); white-space: nowrap; }
.evento { flex-wrap: wrap; row-gap: 0; height: auto; min-height: var(--calendar-bar-height); padding-top: var(--space-1); padding-bottom: var(--space-1); }
.evento .evento-status { flex-basis: 100%; font-weight: var(--font-weight-regular); }
/* semana: status na linha do horário; nos blocos curtos, no fim da linha */
.evento-linha { display: flex; gap: var(--space-1); min-width: 0; white-space: nowrap; }
.evento-linha .evento-status { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: var(--font-weight-regular); }
.evento-linha .evento-status::before { content: "· "; }
.evento-bloco[data-curto] .evento-linha { display: contents; }
.evento-bloco[data-curto] .evento-status { order: 3; flex: none; }
.evento-bloco[data-curto] .evento-status::before { content: none; }
/* em HOJE o fundo já é a primária: a borda não vira um vão claro */
.evento[data-status="HOJE"], .evento-bloco[data-status="HOJE"] { border-left-color: var(--color-primary); }
.evento-titulo { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: var(--font-weight-medium); }
.dia-reunioes .faixa-mais { align-self: flex-start; margin: 0 var(--space-1); }
/* Reuniões na semana: grade de horas (uma hora = --space-7) */
.agenda-semana { max-height: calc(100vh - var(--space-7) * 5); overflow-y: auto; }
.agenda-cabecalho, .agenda-corpo { display: grid; grid-template-columns: var(--space-7) repeat(7, minmax(0, 1fr)); }
.agenda-cabecalho { position: sticky; top: 0; z-index: 2; border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
.agenda-horas { display: flex; flex-direction: column; padding-top: var(--space-2); }
.hora-rotulo {
  height: var(--space-7); padding-right: var(--space-2); text-align: right;
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted);
  transform: translateY(calc(var(--line-height-xs) / -2));
}
.agenda-dia {
  position: relative; height: calc(var(--horas) * var(--space-7)); margin-top: var(--space-2);
  border-left: 1px solid var(--color-border);
  background-image: repeating-linear-gradient(to bottom, var(--color-border) 0, var(--color-border) 1px, transparent 1px, transparent var(--space-7));
}
.agenda-dia[data-fim-de-semana] { background-color: var(--color-bg); }
.evento-bloco {
  position: absolute; top: calc(var(--inicio) * var(--space-7)); height: calc(var(--duracao) * var(--space-7));
  left: calc(100% * var(--faixa) / var(--faixas)); width: calc(100% / var(--faixas)); display: flex;
  flex-direction: column; align-items: stretch; padding: var(--space-1) var(--space-2);
  border: 1px solid var(--color-surface); overflow: hidden; font-size: var(--font-size-xs);
  line-height: var(--line-height-xs); text-align: left; cursor: pointer;
  transition: box-shadow var(--duration-fast) var(--easing-standard);
}
.evento-bloco:hover, .evento-bloco:focus-visible { z-index: 1; }
.evento-bloco-titulo { font-weight: var(--font-weight-semibold); hyphens: auto; }
/* até 30 min: hora e título na mesma linha */
.evento-bloco[data-curto] { flex-direction: row; align-items: center; gap: var(--space-1); padding-top: 0; padding-bottom: 0; }
.evento-bloco[data-curto] .evento-bloco-titulo { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.evento-bloco[data-curto] .evento-local { display: none; }
.evento-local { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.agora-linha { position: absolute; left: 0; right: 0; top: calc(var(--inicio) * var(--space-7)); z-index: 1; border-top: 1px solid var(--color-primary); pointer-events: none; }
.agora-linha::before {
  content: ""; position: absolute; left: 0; top: 0; width: var(--space-2); height: var(--space-2);
  border-radius: var(--radius-full); background: var(--color-primary); transform: translate(-50%, -50%);
}
.agenda-dia-rotulo {
  flex: none; min-width: calc(var(--space-7) + var(--space-2)); padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm); background: var(--color-surface-muted); color: var(--color-text-muted);
  text-align: center;
  font-size: var(--font-size-xs); line-height: var(--line-height-sm); font-weight: var(--font-weight-semibold);
}
.agenda-dia-rotulo[data-hoje] { background: var(--color-primary); color: var(--color-on-primary); }
.sem-icones .dia-agendar::after { content: "+"; }
.popover-calendario {
  position: fixed; z-index: var(--z-flutuante);
  border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-overlay);
  animation: flutuante-entrar var(--duration-fast) var(--easing-standard);
}
.popover-calendario {
  width: var(--flutuante-largura); max-width: calc(100vw - var(--space-4) * 2);
  display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); border-radius: var(--radius-lg);
}
.dia-agendar { width: var(--alvo-minimo); height: var(--alvo-minimo); }
.faixa-mais { display: inline-flex; align-items: center; min-height: var(--alvo-minimo); }
.dia-titulo[data-hoje] { color: var(--color-text); font-weight: var(--font-weight-semibold); }
.dia-titulo[data-hoje] .hoje-legenda { padding: 0 var(--space-2); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-on-primary); }
.calendario-filtros { display: flex; flex-wrap: wrap; gap: var(--space-3); }
.calendario-filtros .campo { flex: 0 0 calc(var(--space-7) * 4); }
.dia-numero, .hora-rotulo, .evento-hora { font-variant-numeric: tabular-nums; }
/* legenda dos glifos no rodapé do Vencimento: mesma linha dos tipos (sem altura extra), mais justa no aperto */
.legenda-glifos { gap: var(--space-1) var(--space-3); }
.legenda-glifos .legenda-item { gap: var(--space-1); }
@media (max-width: 80em) {
  .calendario-rodape { column-gap: var(--space-4); }
  .calendario-rodape .legenda-tipos { column-gap: var(--space-2); }
  .calendario-rodape:has(.legenda-glifos) .rotulo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
/* Calendário: grade branca de 26px; fim de semana e fora do mês em tons claros; hoje em círculo marinho; faixas em pílula */
.calendario-grade { border-color: var(--color-border); border-radius: var(--aero-raio-cartao); background: var(--color-surface); }
.dias-cabecalho { background: var(--color-surface); }
.dia-titulo { padding: var(--aero-pad-dia-titulo); border-right-color: transparent; font-size: var(--font-size-xs); }
.dia, .dia-reunioes { border-color: var(--color-border); }
.dia[data-fim-de-semana], .dia-titulo[data-fim-de-semana], .dia-reunioes[data-fim-de-semana], .agenda-dia[data-fim-de-semana] { background: var(--aero-fim-de-semana); }
.dia[data-fora], .dia-reunioes[data-fora] { background: var(--aero-fora-do-mes); }
.dia-numero { min-width: var(--aero-dia-numero); height: var(--aero-dia-numero); font-size: var(--aero-dia-numero-fonte); font-weight: var(--font-weight-regular); }
[data-hoje] .dia-numero { background: var(--color-graphite); color: var(--color-on-primary); font-weight: var(--font-weight-semibold); }
.dia-titulo[data-hoje] { background: var(--aero-campo); }
.faixa { border-left: 0; border-radius: var(--radius-full); padding: 0 var(--space-3) 0 var(--space-1); }
.faixa:hover, .evento:hover, .evento-bloco:hover { box-shadow: inset 0 0 0 1px currentColor; }
.evento { border-left: 0; border-radius: var(--space-4); padding: var(--aero-pad-evento); }
.evento[data-status="HOJE"], .evento-bloco[data-status="HOJE"] { border-left: 0; }
.evento-bloco { border-left: 0; border-radius: var(--radius-md); }
.semana-corpo .dia[data-hoje], .agenda-dia:has(.agora-linha) { background-color: var(--aero-campo); }
.calendario-com-guia { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: var(--space-4); }

/* ── telas/calendario/vencimento.css ── */
.vencimento { transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard); }
.mes-vencimentos .dia-vencimentos { min-height: var(--vencimento-celula); gap: var(--space-1); }
.dia-contagem { flex: none; min-width: var(--line-height-sm); padding: 0 var(--space-1); border-radius: var(--radius-full); background: var(--color-surface-muted); color: var(--color-text-muted); text-align: center; font-size: var(--font-size-xs); line-height: var(--line-height-sm); font-weight: var(--font-weight-medium); }
.vencimentos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.vencimento {
  width: 100%; min-width: 0; min-height: var(--vencimento-item-altura); display: flex; flex-direction: column; justify-content: center; gap: var(--vencimento-fresta);
  padding: 0 var(--space-2) 0 var(--vencimento-fresta); border: 0; border-radius: var(--radius-full); font: inherit; font-size: var(--font-size-xs); line-height: var(--line-height-xs); text-align: left; cursor: pointer;
}
.vencimento:hover { box-shadow: inset 0 0 0 1px currentColor; }
.vencimento-duas-linhas { min-height: var(--vencimento-item-duas-linhas); padding: var(--space-1) var(--space-2); border-radius: var(--radius-md); }
.vencimento-titulo { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
.vencimento-titulo .selo-tipo-icone { --selo-tipo-tamanho: var(--vencimento-selo); }
.vencimento-desc { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: var(--font-weight-medium); }
.vencimento-titulo .badge { flex: none; padding: 0 var(--space-1); }
/* semana: a coluna tem altura; o título ocupa até duas linhas */
.colunas-vencimento .vencimento-titulo { align-items: flex-start; }
.colunas-vencimento .vencimento-desc { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
.vencimento-glifo { flex: none; display: inline-flex; }
.vencimento-glifo .glifo-status { margin-right: 0; }
/* concluída: esmaecida (texto secundário, 5,2:1 sobre o verde) e com o glifo de check */
.vencimento[data-status="CONCLUIDO"] .vencimento-desc { font-weight: var(--font-weight-regular); color: var(--color-text-muted); }
.vencimento-linha { display: flex; align-items: center; gap: var(--space-1); min-width: 0; overflow: hidden; }
.vencimento-linha .badge { flex: none; padding: 0 var(--space-2); background: var(--color-surface); }
.vencimento-iniciais { margin-left: auto; flex: none; }
.vencimento-mais { align-self: flex-start; margin: 0; min-height: var(--vencimento-item-altura); padding: 0 var(--space-2); border-radius: var(--radius-full); font-weight: var(--font-weight-semibold); color: var(--color-text); }
.vencimento-mais:hover, .vencimento-mais[aria-expanded="true"] { background: var(--aero-campo, var(--color-surface-muted)); text-decoration: none; }
/* semana: 7 colunas com a lista inteira; rolagem dentro da coluna */
.semana-vencimento .dias-cabecalho { position: static; }
.dia-titulo-vencimento { flex-direction: column; align-items: stretch; gap: var(--space-1); }
.dia-titulo-linha { display: flex; align-items: center; gap: var(--space-1); }
.dia-titulo-linha .dia-contagem { margin-left: auto; }
.barra-dia { display: flex; gap: var(--vencimento-fresta); height: var(--space-1); border-radius: var(--radius-full); overflow: hidden; }
.barra-dia-seg { flex-basis: 0; min-width: var(--space-1); }
.barra-dia-seg[data-cor="NAO_INICIADO"] { background: var(--aero-solido-ni, var(--color-text-muted)); }
.barra-dia-seg[data-cor="EM_ANDAMENTO"] { background: var(--aero-solido-ea, var(--color-info)); }
.barra-dia-seg[data-cor="EM_RISCO"] { background: var(--aero-solido-er, var(--color-warning)); }
.barra-dia-seg[data-cor="CONCLUIDO"] { background: var(--aero-solido-c, var(--color-success)); }
/* dias sem vencimento ficam mais estreitos (o modelo vem do script, igual no cabeçalho e no corpo) */
.semana-vencimento .dias-cabecalho, .colunas-vencimento { display: grid; grid-template-columns: var(--colunas-semana, repeat(7, minmax(0, 1fr))); }
.coluna-vencimento { min-width: 0; max-height: var(--vencimento-coluna-altura); min-height: calc(var(--calendar-day-min-height) * 2); overflow-y: auto; padding: var(--space-2) var(--space-1); border-right: 1px solid var(--color-border); }
.coluna-vencimento:last-child { border-right: 0; }
.coluna-vencimento[data-fim-de-semana] { background: var(--aero-fim-de-semana, var(--color-bg)); }
.coluna-vencimento[data-hoje] { background: var(--color-accent-bg); }
.coluna-vencimento:focus-visible { outline-offset: -2px; }
.coluna-vencimento-vazia { padding: var(--space-1) var(--space-2); }
/* painel do dia ("+N") */
.popover-vencimento {
  position: fixed; z-index: var(--z-flutuante); width: var(--flutuante-largura); max-width: calc(100vw - var(--space-4) * 2);
  display: flex; flex-direction: column; gap: var(--space-3); max-height: var(--painel-vencimento-altura); padding: var(--space-4);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-overlay);
  animation: flutuante-entrar var(--duration-fast) var(--easing-standard);
}
.painel-vencimento-titulo { font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); }
.painel-vencimento-titulo:focus { outline: 0; }
.painel-vencimento-titulo:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.painel-vencimento-corpo { display: flex; flex-direction: column; gap: var(--space-3); min-height: 0; overflow-y: auto; padding: var(--space-1); }
.painel-vencimento-grupo { display: flex; flex-direction: column; gap: var(--space-1); }
.painel-vencimento-grupo-titulo { display: flex; align-items: center; gap: var(--space-1); font-size: var(--font-size-xs); line-height: var(--line-height-xs); font-weight: var(--font-weight-semibold); }
.painel-vencimento-grupo .vencimento { min-height: var(--alvo-minimo); }

/* ── telas/calendario/guia.css ── */
.guia-dia { transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard); }
.guia-semanal { width: var(--guia-largura); display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: var(--radius-lg); background: var(--color-surface); }
.guia-recolhido { width: var(--guia-recolhido); padding: var(--space-1); }
.guia-alternar { width: 100%; display: flex; flex-direction: column; align-items: center; gap: var(--space-1); padding: var(--space-2) 0; border: 0; border-radius: var(--radius-md); background: none; color: var(--color-text); font: inherit; font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); text-transform: uppercase; cursor: pointer; }
.guia-alternar:hover { background: var(--color-accent-bg); }
.guia-alternar i { font-size: var(--font-size-lg); }
.guia-topo { display: flex; align-items: center; gap: var(--space-1); }
.guia-mes { flex: 1; text-align: center; font-weight: var(--font-weight-semibold); }
.guia-mes::first-letter { text-transform: uppercase; }
.guia-recolher { margin-left: var(--space-1); }
.guia-iniciais, .guia-semana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.guia-iniciais { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted); text-align: center; }
.guia-grade { display: flex; flex-direction: column; gap: var(--guia-fresta); }
.guia-semana { border-radius: var(--radius-full); }
.guia-semana[data-exibida] { background: var(--color-accent-bg); box-shadow: inset 0 0 0 var(--guia-contorno) var(--color-graphite); }
.guia-dia {
  position: relative; height: var(--guia-dia); display: grid; place-items: center; padding: 0; border: 0; border-radius: var(--radius-full);
  background: none; color: var(--color-text); font: inherit; font-size: var(--font-size-xs); cursor: pointer; align-content: start; padding-top: 1px;
}
.guia-dia:hover { background: var(--color-surface-muted); }
.guia-dia[data-fora] { color: var(--color-text-muted); }
.guia-dia-numero { display: grid; place-items: center; width: var(--guia-numero); height: var(--guia-numero); border-radius: var(--radius-full); }
.guia-dia[aria-current="date"] .guia-dia-numero { background: var(--color-graphite); color: var(--color-on-primary); font-weight: var(--font-weight-semibold); }
.guia-dia:focus-visible { outline-offset: 0; }
/* intensidade dos vencimentos: tamanho e forma, não só tom (1–2 ponto, 3–9 ponto maior, 10+ anel cheio) */
.guia-ponto { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%); width: var(--space-1); height: var(--space-1); border-radius: var(--radius-full); background: var(--color-text-muted); }
.guia-ponto[data-nivel="2"] { width: var(--guia-ponto-medio); height: var(--guia-ponto-medio); background: var(--color-graphite); }
.guia-ponto[data-nivel="3"] { width: var(--space-2); height: var(--space-2); background: var(--color-graphite); box-shadow: 0 0 0 1px var(--color-surface), 0 0 0 var(--guia-fresta) var(--color-graphite); }

/* ── telas/reunioes/reunioes.css ── */
.pessoas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pessoas li { display: flex; align-items: center; gap: var(--space-3); min-height: var(--control-height); padding: var(--space-1) 0; border-bottom: 1px solid var(--color-border); }
.pessoas li:last-child { border-bottom: 0; }
.pessoas .check { flex: 1; min-width: 0; gap: var(--space-3); }
.pessoa-nome { flex: 1; min-width: 0; }
.anexo-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.anexo-nome { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: var(--font-weight-medium); }
.anexo-icone { display: inline-flex; color: var(--color-text-muted); }
.anexos-envio { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.upload:has(input:focus-visible) { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.upload:has(input:disabled) { opacity: var(--opacity-disabled); cursor: not-allowed; }
.local { display: inline-flex; align-items: center; gap: var(--space-1); min-width: 0; max-width: calc(var(--space-7) * 4); color: var(--color-text-muted); }
.local .icone { color: var(--color-text-muted); }
.local-texto { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--color-text); }
.pessoa { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; }
#duracao-reuniao:empty { display: none; }
.reuniao-cabecalho-badges { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }

/* ── base/movimento.css ── */
/* ===== Movimento (só funcional) ===== */
@keyframes entrar-rota { from { opacity: 0; transform: translateY(var(--space-2)); } }
@keyframes crescer { from { transform: scaleX(0); } }
@keyframes surgir { from { opacity: 0; } }
@keyframes dialogo-entrar { from { opacity: 0; transform: translateY(var(--space-2)); } }
@keyframes dialogo-sair { to { opacity: 0; transform: translateY(var(--space-2)); } }
@keyframes fundo-entrar { from { opacity: 0; } }
@keyframes fundo-sair { to { opacity: 0; } }
@keyframes pulso { 50% { opacity: var(--opacity-disabled); } }
@keyframes gaveta-entrar { from { transform: translateX(100%); } }
@keyframes gaveta-sair { to { transform: translateX(100%); } }
@keyframes destacar { from { background: var(--color-accent-bg); box-shadow: 0 0 0 2px var(--color-accent); } }
@keyframes dica-entrar { from { opacity: 0; transform: translate(-50%, var(--space-1)); } }
@keyframes flutuante-entrar { from { opacity: 0; transform: translateY(calc(var(--space-1) * -1)); } }
@keyframes painel-entrar { from { transform: translateX(100%); } }

/* ── mudancas/controles-separados/controles-separados.css ── */
/* controles-separados (exp-08, canvas "NBC — Fase 2"): todo controle tem contorno visível na borda de controle,
 * os cartões ganham borda na linha e a sombra do cartão, e os painéis, borda na linha. O foco não muda. */
:root {
  --controle-campo-altura: 44px;
}

/* campos de texto e selects: 44px, fundo de campo, contorno de controle */
.select, .input, .textarea { border: 1px solid var(--color-border-control); background-color: var(--aero-campo); }
.select, .input { height: var(--controle-campo-altura); }
.select:not([disabled]):not([aria-invalid="true"]):hover, .input:not([disabled]):not([aria-invalid="true"]):hover,
.textarea:not([disabled]):not([aria-invalid="true"]):hover { border-color: var(--color-text-muted); }
/* filtro ativo: o anel de 2px na ação substitui o contorno */
.campo[data-ativo] .select, .campo[data-ativo] .input, .busca[data-ativo] .input { border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary); }

/* botões com contorno: secundários e terciários (Limpar filtros, Hoje, ‹ ›, Sair) */
.btn-secundario, .btn-terciario { border: 1px solid var(--color-border-control); background: var(--color-surface); color: var(--color-text); }
.btn-secundario:active, .btn-terciario:active { border-color: var(--color-border-control); }
.botoes-unidos .btn.btn-icone:first-child, .botoes-unidos .btn.btn-icone:last-child { border-left: 1px solid var(--color-border-control); }
/* hover no painel: nas paletas em que o campo é branco como o cartão, o fundo de campo não dava retorno */
.btn-secundario:not([disabled]):hover, .btn-terciario:not([disabled]):hover, .btn-pagina:not([disabled]):hover,
.btn-expandir:hover, .btn-quadrado:hover { background: var(--aero-tonal); }
/* o dia de hoje no calendário também usava o fundo de campo */
.dia-titulo[data-hoje], .semana-corpo .dia[data-hoje], .agenda-dia:has(.agora-linha) { background-color: var(--aero-tonal); }
/* desabilitado continua desabilitado: a cor acima tem a mesma especificidade da regra global [disabled] */
.btn-secundario[disabled], .btn-terciario[disabled], .aba[disabled] { color: var(--aero-desabilitado); }

/* segmentados: recipiente de cartão com contorno; a opção marcada na ação, as demais em texto secundário */
.abas { border: 1px solid var(--color-border-control); background: var(--color-surface); }
.aba { color: var(--color-text-muted); }
.aba:not([disabled]):hover { background: var(--aero-tonal); color: var(--color-text); }
.aba[aria-current="page"], .aba[aria-pressed="true"],
.aba[aria-current="page"]:not([disabled]):hover, .aba[aria-pressed="true"]:not([disabled]):hover {
  background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-semibold); box-shadow: none;
}

/* alça do HUB: contorno de controle, sem o lado da borda da tela */
.alca-notif { border: 1px solid var(--color-border-control); border-right: 0; }

/* pílulas sobre o cartão (canvas): prioridade, contagem e chip com fundo de cartão e borda na linha; Pauta da semana no texto */
[data-prioridade]:not([data-prioridade="PAUTA_SEMANA"]), .badge-contagem, .chip { border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-muted); }
.badge[data-prioridade="PAUTA_SEMANA"] { border: 1px solid var(--color-text); background: var(--color-text); color: var(--aero-folha); }

/* cartões: borda na linha e a sombra do cartão (uma elevação só: na Aero a sombra é zero) */
.cartao, .card-nivel { border: 1px solid var(--color-border); box-shadow: var(--shadow-card); }
.cartao:hover { box-shadow: var(--shadow-card-hover), inset 0 0 0 1px var(--color-border-strong); }

/* painéis (filtros, faixas, calendário): fundo de painel e borda na linha */
.card, .barra-ferramentas { border: 1px solid var(--color-border); background: var(--aero-tonal); }

/* ── mudancas/cabecalho-a/cabecalho-a.css ── */
/* cabecalho-a (exp-08, canvas "NBC — Fase 2", bloco isA): barra clara de ponta a ponta, presa ao topo, com a
 * sub-barra da seção como segunda linha. Conteúdo com até 1440px e 40px nas laterais. */
:root {
  --cabecalho-linha1: 76px;
  --cabecalho-linha2: 52px;
  --cabecalho-respiro: 40px;
  --cabecalho-conteudo: 1360px;
  --cabecalho-marca: 40px;
  --cabecalho-marca-raio: 12px;
  --cabecalho-marca-logo-tamanho: 15px;
  --cabecalho-marca-nome-tamanho: 17px;
  --cabecalho-nav-distancia: 48px;
  --cabecalho-nav-folga: 16px;
  --cabecalho-nav-tamanho: 15px;
  --cabecalho-sublinhado: 3px;
  --cabecalho-sublinhado-aba: 2px;
  --cabecalho-marca-tracking: -0.01em;
  --cabecalho-aba-folga: 14px;
  --cabecalho-aba-tamanho: 14px;
  --cabecalho-separador: 28px;
  --cabecalho-sair-folga: 18px;
  --cabecalho-usuario-espaco: 14px;
  --cabecalho-papel-tamanho: 12px;
  /* laterais: 40px, ou o que sobra dos 1360px de conteúdo */
  --cabecalho-lateral: max(var(--cabecalho-respiro), calc((100% - var(--cabecalho-conteudo)) / 2));
}

/* a barra: abaixo da alça do HUB e dos flutuantes, acima do conteúdo */
.topo {
  position: sticky; top: 0; z-index: calc(var(--z-alca) - 1);
  display: grid; grid-template-columns: var(--cabecalho-lateral) auto minmax(0, 1fr) auto var(--cabecalho-lateral);
  grid-template-rows: var(--cabecalho-linha1) auto; align-items: stretch;
  width: auto; max-width: none; height: auto; margin: 0; padding: 0; gap: 0;
  border-radius: 0; border-bottom: 1px solid var(--color-border);
  background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-cabecalho);
}
html { scroll-padding-top: var(--cabecalho-linha1); }
html:has(body.com-subnav) { scroll-padding-top: calc(var(--cabecalho-linha1) + var(--cabecalho-linha2)); }

/* marca: quadrado de 40px na ação com "nb" */
.topo > .marca { grid-column: 2; grid-row: 1; align-self: center; gap: var(--space-3); padding: 0; border-radius: var(--cabecalho-marca-raio); }
.topo > .marca:hover { background: none; }
.topo .marca-logo {
  width: var(--cabecalho-marca); height: var(--cabecalho-marca); border-radius: var(--cabecalho-marca-raio);
  background: var(--color-primary); color: var(--color-on-primary);
  font-size: var(--cabecalho-marca-logo-tamanho); font-weight: var(--font-weight-heavy);
}
.topo .marca-nome { font-family: var(--font-family); font-size: var(--cabecalho-marca-nome-tamanho); font-weight: var(--font-weight-heavy); letter-spacing: var(--cabecalho-marca-tracking); color: var(--color-text); }

/* navegação: itens da altura da barra; o atual em texto principal com sublinhado de 3px na ação colado à base */
.topo > .nav { grid-column: 3; grid-row: 1; align-items: stretch; gap: var(--space-2); margin-left: var(--cabecalho-nav-distancia); overflow-x: auto; scrollbar-width: none; }
.topo .nav-item {
  height: auto; padding: 0 var(--cabecalho-nav-folga); border-radius: 0; background: none;
  border-top: var(--cabecalho-sublinhado) solid transparent; border-bottom: var(--cabecalho-sublinhado) solid transparent;
  color: var(--color-text-muted); font-size: var(--cabecalho-nav-tamanho); font-weight: var(--font-weight-medium);
}
.topo .nav-item:hover { background: none; color: var(--color-text); }
.topo .nav-item[aria-current="page"] { background: none; color: var(--color-text); font-weight: var(--font-weight-heavy); border-bottom-color: var(--color-primary); }
/* o anel de foco fica dentro do item: a navegação rola na horizontal e cortaria o anel de fora */
.topo .nav-item:focus-visible, .topo .subnav-item:focus-visible { outline-offset: -2px; }
/* com o rótulo visível não há ícone (como no canvas); quando o rótulo vai para leitor de tela, fica o ícone */
@media (min-width: 88.0625em) {
  .topo .nav-item .icone-nav { display: none; }
}

/* usuário: avatar de 40px, nome e papel, separador e "Sair" com contorno */
.topo > .topo-usuario { grid-column: 4; grid-row: 1; align-self: center; gap: var(--cabecalho-usuario-espaco); margin-left: var(--space-5); }
.topo .avatar { width: var(--cabecalho-marca); height: var(--cabecalho-marca); border: 1px solid var(--color-border); background: var(--aero-tonal); color: var(--color-text); font-weight: var(--font-weight-heavy); }
.topo .usuario-texto { line-height: var(--line-height-sm); }
.topo .cartao-usuario-nome { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); }
.topo .cartao-usuario-papel { font-size: var(--cabecalho-papel-tamanho); color: var(--color-text-muted); }
.topo-separador { width: 1px; height: var(--cabecalho-separador); background: var(--color-border); }
.topo .topo-sair {
  height: var(--cabecalho-marca); padding: 0 var(--cabecalho-sair-folga); border: 1px solid var(--color-border-control);
  background: var(--color-surface); color: var(--color-text); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold);
}
.topo .topo-sair:hover { background: var(--aero-tonal); }

/* linha 2: a sub-barra da seção como abas, separada da linha 1 por uma linha */
.topo > .subnav {
  grid-column: 1 / -1; grid-row: 2; position: static; z-index: auto; width: auto; max-width: none; height: var(--cabecalho-linha2);
  margin: 0; padding: 0 var(--cabecalho-lateral); border: 0; border-top: 1px solid var(--color-border); background: none; box-shadow: none;
}
.topo > .subnav[hidden] { display: none; }
.topo .subnav-faixa { display: flex; height: 100%; margin: 0; padding: 0; gap: var(--space-2); border-radius: 0; background: none; }
.topo .subnav-item {
  height: auto; padding: 0 var(--cabecalho-aba-folga); border-radius: 0; background: none; box-shadow: none;
  border-top: var(--cabecalho-sublinhado-aba) solid transparent; border-bottom: var(--cabecalho-sublinhado-aba) solid transparent;
  color: var(--color-text-muted); font-size: var(--cabecalho-aba-tamanho); font-weight: var(--font-weight-medium);
}
.topo .subnav-item:hover { background: none; color: var(--color-text); }
.topo .subnav-item[aria-current="page"] { background: none; box-shadow: none; color: var(--color-text); font-weight: var(--font-weight-heavy); border-bottom-color: var(--color-primary); }
.topo .subnav-item .icone { display: none; }

/* ── mudancas/kanban-semana-vencimento/kanban-semana-vencimento.css ── */
/* kanban-semana-vencimento (exp-08): campo "Semana de vencimento", linha de atalhos e "N de M" no título */
:root {
  --semana-passo: 34px;
  --semana-etiqueta-tamanho: 12px;
  --semana-etiqueta-folga: 3px 10px;
  --atalho-semana-altura: 36px;
  --contagem-de-folga: 4px 12px;
}

/* o campo ocupa um pouco mais que os seletores: o intervalo e a etiqueta cabem numa linha */
.barra-ferramentas .campo-semana { flex: 1.6 1 calc(var(--space-7) * 6); }
.semana-controle {
  display: flex; align-items: center; gap: var(--space-1);
  height: var(--controle-campo-altura, var(--aero-campo-altura)); padding: 0 var(--space-1);
  border: 1px solid var(--color-border-control); border-radius: var(--radius-full); background: var(--aero-campo);
}
/* com o filtro ativo, borda de 2px na ação (o 1px a mais sai do respiro interno) */
.campo-semana[data-ativo] .semana-controle { border: 2px solid var(--color-primary); padding: 0 calc(var(--space-1) - 1px); }
.semana-passo {
  flex: none; display: grid; place-items: center; width: var(--semana-passo); height: var(--semana-passo); padding: 0;
  border: 1px solid var(--color-border-control); border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-text);
  cursor: pointer; transition: background-color var(--duration-fast) var(--easing-standard);
}
.semana-passo:hover { background: var(--aero-tonal); }
/* anel de foco colado ao botão: com o filtro ativo, o vão até a borda de 2px do campo é de 3px */
.semana-passo:focus-visible { outline-offset: 0; }
.semana-intervalo {
  flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.semana-etiqueta {
  padding: var(--semana-etiqueta-folga); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-on-primary);
  font-size: var(--semana-etiqueta-tamanho); font-weight: var(--font-weight-heavy); line-height: var(--line-height-xs);
}

/* linha de atalhos: abaixo dos campos, separada por uma linha */
.atalhos-semana {
  flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3);
  padding-top: var(--space-4); border-top: 1px solid var(--color-border);
}
.atalhos-semana-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.atalhos-semana-grupo .rotulo { margin-right: var(--space-1); }
.atalho-semana {
  height: var(--atalho-semana-altura); padding: 0 var(--space-4); border: 1px solid var(--color-border-control); border-radius: var(--radius-full);
  background: var(--color-surface); color: var(--color-text); font: inherit; font-size: var(--aero-tamanho-botao-pequeno);
  font-weight: var(--font-weight-semibold); cursor: pointer; transition: background-color var(--duration-fast) var(--easing-standard);
}
.atalho-semana:hover { background: var(--aero-tonal); }
.atalho-semana[aria-pressed="true"], .atalho-semana[aria-pressed="true"]:hover { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-on-primary); }
.atalhos-semana-fim { display: flex; align-items: center; gap: var(--space-3); }
.atalhos-semana-fim .legenda { color: var(--color-text); font-weight: var(--font-weight-semibold); }

/* "N de M" ao lado do título "Ações" */
.contagem-de {
  padding: var(--contagem-de-folga); border: 1px solid var(--color-border); border-radius: var(--radius-full); background: var(--aero-tonal);
  color: var(--color-text-muted); font-family: var(--font-family); font-size: var(--aero-tamanho-botao-pequeno); font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-xs); font-variant-numeric: tabular-nums; letter-spacing: 0;
}

/* ── mudancas/kanban-faixas/kanban-faixas.css ── */
/* kanban-faixas (exp-08, canvas "NBC — Fase 2"): faixas neutras com filete de 4px na cor cheia do status e o rótulo
 * do status em pílula cheia; nos cartões, "Vencida" cheia, divisória no rodapé e progresso na cor de ação */
:root {
  --faixa-raio: 24px;
  --faixa-filete: 4px;
  --faixa-folga: 18px 24px 24px;
  --faixa-pilula-folga: 5px 14px;
  --faixa-pilula-tamanho: 13px;
  --faixa-cartao-raio: 18px;
}

/* o quadro não tem painel em volta: as faixas são os painéis */
.card:has(> .quadro-barra) { padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; }

.coluna-kanban.linha-kanban {
  gap: var(--space-4); padding: var(--faixa-folga); border: 1px solid var(--color-border); border-top: var(--faixa-filete) solid var(--faixa-cheia);
  border-radius: var(--faixa-raio);
}
.coluna-kanban.linha-kanban[data-coluna="NAO_INICIADO"] { --faixa-cheia: var(--aero-seg-ni); --faixa-sobre-cheia: var(--aero-seg-ni-texto); background: var(--aero-tonal); }
.coluna-kanban.linha-kanban[data-coluna="EM_ANDAMENTO"] { --faixa-cheia: var(--aero-seg-ea); --faixa-sobre-cheia: var(--aero-seg-ea-texto); background: var(--aero-tonal); }
.coluna-kanban.linha-kanban[data-coluna="EM_RISCO"] { --faixa-cheia: var(--aero-seg-er); --faixa-sobre-cheia: var(--aero-seg-er-texto); background: var(--aero-tonal); }
.coluna-kanban.linha-kanban[data-coluna="CONCLUIDO"] { --faixa-cheia: var(--aero-seg-c); --faixa-sobre-cheia: var(--aero-seg-c-texto); background: var(--aero-tonal); }

/* cabeçalho: pílula cheia, "N ações" e, à direita, a página */
.faixa-cabecalho { padding-right: 0; }
.linha-kanban .faixa-kanban-titulo { display: flex; align-items: center; gap: var(--space-3); padding: 0; }
.faixa-pilula {
  padding: var(--faixa-pilula-folga); border-radius: var(--radius-full); background: var(--faixa-cheia); color: var(--faixa-sobre-cheia);
  font-size: var(--faixa-pilula-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy);
}
.faixa-contagem { color: var(--color-text-muted); font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; }
.faixa-cabecalho .legenda-pagina { margin-left: auto; color: var(--color-text-muted); font-size: var(--aero-tamanho-botao-pequeno); }

/* cartão: "Vencida" na cheia, a data vencida no texto da suave, divisória no rodapé */
.cartao .badge[data-vencida] { background: var(--aero-cheia-vencida); color: var(--aero-cheia-vencida-texto); font-weight: var(--font-weight-heavy); }
.cartao:has(.badge[data-vencida]) .cartao-meta .num { color: var(--color-danger); font-weight: var(--font-weight-heavy); }
.cartao-padrao { height: calc(var(--cartao-altura) + var(--space-3)); border-radius: var(--faixa-cartao-raio); }
.cartao-padrao .cartao-rodape { padding-top: var(--space-3); border-top: 1px solid var(--color-border); }
/* progresso na cor de ação; em Concluído, na cheia de Concluído */
.cartao .barra-preenchimento { background: var(--color-primary); }
.cartao[data-fita="CONCLUIDO"] .barra-preenchimento { background: var(--aero-seg-c); }

/* ── mudancas/calendario-sem-compacto/calendario-sem-compacto.css ── */
/* calendario-sem-compacto (exp-09; o visual vem do calendario-periodo-detalhado do exp-08, canvas "NBC — Fase 2"): o Compacto
 * saiu da base, e as barras do Período ficam na suave do tipo, com círculo na cor do tipo, nome do tipo em 700 e o status em
 * pílula cheia; legenda com caixas na ação e pontos na cheia */
:root {
  --barra-tipo-circulo: 20px;
  --barra-status-tamanho: 11px;
  --barra-status-folga: 3px 10px;
  --legenda-ponto: 12px;
  --barra-periodo-altura: 32px;
}

/* barras (mês e semana): a cor vem do tipo, não do status (.calendario-grade mantém a especificidade do exp-08) */
.calendario-grade .faixa {
  border: 1px solid var(--barra-tipo-borda); background: var(--barra-tipo-suave); color: var(--color-text);
}
/* no mês, 32px como no canvas: o círculo de 20px e a pílula de status cabem com a borda */
.calendario-grade .faixa:not(.faixa-semana) { height: var(--barra-periodo-altura); }
.calendario-grade .faixa:has(.selo-tipo[data-tipo="ESTRATEGICA"]) { --barra-tipo-suave: var(--aero-tipo-e-pastel); --barra-tipo-borda: var(--aero-tipo-e-borda); --barra-tipo-texto: var(--aero-tipo-e-texto); }
.calendario-grade .faixa:has(.selo-tipo[data-tipo="OPERACIONAL"]) { --barra-tipo-suave: var(--aero-tipo-o-pastel); --barra-tipo-borda: var(--aero-tipo-o-borda); --barra-tipo-texto: var(--aero-tipo-o-texto); }
.calendario-grade .faixa:has(.selo-tipo[data-tipo="SUB_ACAO"]) { --barra-tipo-suave: var(--aero-tipo-s-pastel); --barra-tipo-borda: var(--aero-tipo-s-borda); --barra-tipo-texto: var(--aero-tipo-s-texto); }
.calendario-grade .faixa .selo-tipo { gap: var(--space-2); }
/* o círculo é a cor do tipo, sem o ícone (o nome ao lado já diz o tipo) */
.calendario-grade .faixa .selo-tipo-icone { width: var(--barra-tipo-circulo); height: var(--barra-tipo-circulo); border-radius: var(--radius-full); background: var(--tipo-cor); color: transparent; }
.calendario-grade .faixa .selo-tipo-rotulo { color: var(--barra-tipo-texto); font-weight: var(--font-weight-heavy); }

/* status em pílula na cor cheia, no fim da barra */
.faixa[data-status="NAO_INICIADO"] { --barra-cheia: var(--aero-seg-ni); --barra-sobre-cheia: var(--aero-seg-ni-texto); }
.faixa[data-status="EM_ANDAMENTO"] { --barra-cheia: var(--aero-seg-ea); --barra-sobre-cheia: var(--aero-seg-ea-texto); }
.faixa[data-status="EM_RISCO"] { --barra-cheia: var(--aero-seg-er); --barra-sobre-cheia: var(--aero-seg-er-texto); }
.faixa[data-status="CONCLUIDO"] { --barra-cheia: var(--aero-seg-c); --barra-sobre-cheia: var(--aero-seg-c-texto); }
.calendario-grade .faixa .faixa-status {
  padding: var(--barra-status-folga); border-radius: var(--radius-full); background: var(--barra-cheia); color: var(--barra-sobre-cheia);
  font-size: var(--barra-status-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy);
}

/* legenda: caixas de tipo na cor de ação; pontos de status na cor cheia, com anel (na Aero, o anel dá o contraste) */
.legenda-tipos input[type="checkbox"] { accent-color: var(--color-primary); }
.legenda-pontos-status { gap: var(--space-1) var(--space-4); }
.legenda-pontos-status .legenda-item { gap: var(--space-2); color: var(--color-text); font-weight: var(--font-weight-semibold); }
.ponto-status { width: var(--legenda-ponto); height: var(--legenda-ponto); flex: none; border-radius: var(--radius-full); background: var(--ponto-cheia); box-shadow: 0 0 0 1px var(--ponto-anel); }
[data-ponto-status="NAO_INICIADO"] { --ponto-cheia: var(--aero-seg-ni); --ponto-anel: var(--aero-anel-ni); }
[data-ponto-status="EM_ANDAMENTO"] { --ponto-cheia: var(--aero-seg-ea); --ponto-anel: var(--aero-anel-ea); }
[data-ponto-status="EM_RISCO"] { --ponto-cheia: var(--aero-seg-er); --ponto-anel: var(--aero-anel-er); }
[data-ponto-status="CONCLUIDO"] { --ponto-cheia: var(--aero-seg-c); --ponto-anel: var(--aero-anel-c); }

/* ── mudancas/calendario-cards-semana/calendario-cards-semana.css ── */
/* calendario-cards-semana (exp-09): cards da Semana do Período. Nada em position absolute dentro do card; o tamanho vem do
 * conteúdo (mínimo de 64px) e o card estreito esconde primeiro o rótulo do tipo e as marcas "desde/até" (container query) */
:root {
  --cs-raio: 12px;
  --cs-folga: 10px 12px;
  --cs-altura-minima: 64px;
  --cs-entre: 8px;
  --cs-ponto: 10px;
  --cs-tipo-tamanho: 12px;
  --cs-status-tamanho: 11px;
  --cs-status-folga: 2px 8px;
  --cs-titulo-tamanho: 14px;
  --cs-titulo-altura: 20px;
  --cs-meta-tamanho: 12px;
  --cs-avatar: 24px;
  --cs-avatar-sobreposto: -6px;
  --cs-avatar-anel: 2px;
  --cs-avatar-texto: 10px;
  --cs-ponto-status: 10px;
}

.semana-cards .faixas { row-gap: var(--cs-entre); padding: var(--cs-entre) var(--space-1); }
.semana-cards { min-height: calc(var(--calendar-day-min-height) * 2); }

.cartao-semana[data-tipo="ESTRATEGICA"] { --cs-suave: var(--aero-tipo-e-pastel); --cs-borda: var(--aero-tipo-e-borda); --cs-cor: var(--tipo-estrategica); --cs-texto-tipo: var(--aero-tipo-e-texto); }
.cartao-semana[data-tipo="OPERACIONAL"] { --cs-suave: var(--aero-tipo-o-pastel); --cs-borda: var(--aero-tipo-o-borda); --cs-cor: var(--tipo-operacional); --cs-texto-tipo: var(--aero-tipo-o-texto); }
.cartao-semana[data-tipo="SUB_ACAO"] { --cs-suave: var(--aero-tipo-s-pastel); --cs-borda: var(--aero-tipo-s-borda); --cs-cor: var(--tipo-sub-acao); --cs-texto-tipo: var(--aero-tipo-s-texto); }
.cartao-semana[data-status="NAO_INICIADO"] { --cs-cheia: var(--aero-seg-ni); --cs-sobre-cheia: var(--aero-seg-ni-texto); }
.cartao-semana[data-status="EM_ANDAMENTO"] { --cs-cheia: var(--aero-seg-ea); --cs-sobre-cheia: var(--aero-seg-ea-texto); }
.cartao-semana[data-status="EM_RISCO"] { --cs-cheia: var(--aero-seg-er); --cs-sobre-cheia: var(--aero-seg-er-texto); }
.cartao-semana[data-status="CONCLUIDO"] { --cs-cheia: var(--aero-seg-c); --cs-sobre-cheia: var(--aero-seg-c-texto); }

.cartao-semana {
  container: cartao-semana / inline-size;
  box-sizing: border-box; min-width: 0; min-height: var(--cs-altura-minima); margin: 0;
  display: flex; flex-direction: column; justify-content: center; gap: var(--space-1); padding: var(--cs-folga);
  border: 1px solid var(--cs-borda); border-radius: var(--cs-raio); background: var(--cs-suave); color: var(--color-text);
  font: inherit; text-align: left; cursor: pointer;
  transition: box-shadow var(--duration-fast) var(--easing-standard);
}
.cartao-semana:hover { box-shadow: var(--shadow-card-hover), inset 0 0 0 1px var(--cs-cor); }
.cartao-semana[data-antes] { border-top-left-radius: 0; border-bottom-left-radius: 0; }
.cartao-semana[data-depois] { border-top-right-radius: 0; border-bottom-right-radius: 0; }

.cs-linha { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.cs-tipo { display: inline-flex; align-items: center; gap: var(--space-1); min-width: 0; }
.cs-ponto { flex: none; width: var(--cs-ponto); height: var(--cs-ponto); border-radius: var(--radius-full); background: var(--cs-cor); }
.cs-tipo-rotulo { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--cs-texto-tipo); font-size: var(--cs-tipo-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy); }
.cs-prazo, .cs-continua { flex: none; white-space: nowrap; color: var(--color-text-muted); font-size: var(--cs-meta-tamanho); line-height: var(--line-height-xs); }
.cs-vencida { flex: none; padding: var(--cs-status-folga); border-radius: var(--radius-full); background: var(--aero-cheia-vencida); color: var(--aero-cheia-vencida-texto); font-size: var(--cs-status-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy); }
.cs-status {
  flex: none; margin-left: auto; padding: var(--cs-status-folga); border-radius: var(--radius-full); white-space: nowrap;
  background: var(--cs-cheia); color: var(--cs-sobre-cheia); font-size: var(--cs-status-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy);
}
.cs-titulo { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: var(--cs-titulo-tamanho); line-height: var(--cs-titulo-altura); font-weight: var(--font-weight-semibold); }
.cs-base { min-height: calc(var(--cs-avatar) + var(--cs-avatar-anel) * 2); }
.cs-pai { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--color-text-muted); font-size: var(--cs-meta-tamanho); line-height: var(--line-height-xs); }
.cs-avatares { flex: none; display: inline-flex; padding-left: calc(var(--cs-avatar-sobreposto) * -1); }
.cs-avatar {
  display: inline-grid; place-items: center; width: var(--cs-avatar); height: var(--cs-avatar); margin-left: var(--cs-avatar-sobreposto);
  border: var(--cs-avatar-anel) solid var(--color-surface); border-radius: var(--radius-full); box-sizing: content-box;
  background: var(--aero-tonal); color: var(--color-text); font-size: var(--cs-avatar-texto); font-weight: var(--font-weight-heavy); line-height: 1;
}

/* um dia só: ponto do tipo e ponto de status (com rótulo para leitor de tela) em cima; o título usa a largura toda, em até 2 linhas */
.cartao-semana-dia { justify-content: flex-start; padding-left: var(--space-2); padding-right: var(--space-2); }
.cs-dia-linha { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); min-width: 0; }
.cs-titulo-duas { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow-wrap: anywhere; font-size: var(--cs-meta-tamanho); line-height: var(--line-height-xs); }
.cs-ponto-status { flex: none; width: var(--cs-ponto-status); height: var(--cs-ponto-status); border-radius: var(--radius-full); background: var(--cs-cheia); box-shadow: 0 0 0 1px var(--cs-sobre-cheia); }

/* card estreito: primeiro sai o nome do tipo (o ponto fica), depois a ação-mãe e o prazo; "desde/até" e Vencida ficam */
@container cartao-semana (max-width: 300px) {
  .cs-tipo-rotulo { display: none; }
}
@container cartao-semana (max-width: 220px) {
  .cs-pai, .cs-prazo { display: none; }
  .cs-base { justify-content: space-between; }
}

/* cabeçalho dos dias: com o seletor aberto em 1024px a coluna estreita, e a etiqueta "Hoje" desce de linha em vez de cortar */
.semana-quadro .dia-titulo { flex-wrap: wrap; row-gap: var(--space-1); white-space: nowrap; }

/* ── mudancas/seletor-semana/seletor-semana.css ── */
/* seletor-semana (exp-09): mini calendário compartilhado. A faixa da semana escolhida é o fundo da linha de 7 células,
 * então cobre exatamente a grade; hoje é um círculo cheio de 28px na cor de ação; o marcador fica dentro da célula */
:root {
  --ss-folga: 16px;
  --ss-passo: 32px;
  --ss-mes-tamanho: 15px;
  --ss-celula: 36px;
  --ss-celula-estreita: 32px;
  --ss-entre-colunas: 2px;
  --ss-entre-linhas: 4px;
  --ss-iniciais-tamanho: 11px;
  --ss-iniciais-altura: 24px;
  --ss-numero-tamanho: 13px;
  --ss-hoje: 28px;
  --ss-ponto: 4px;
  --ss-ponto-base: 1px;
}
@media (max-width: 79.99em) {
  :root { --ss-celula: var(--ss-celula-estreita); }
}

.seletor-semana {
  box-sizing: border-box; flex: none; display: flex; flex-direction: column; gap: var(--space-3);
  width: calc(var(--ss-celula) * 7 + var(--ss-entre-colunas) * 6 + var(--ss-folga) * 2); padding: var(--ss-folga);
  border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-text);
}
.ss-topo { display: flex; align-items: center; gap: var(--space-2); }
.ss-mes { flex: 1; min-width: 0; text-align: center; white-space: nowrap; font-size: var(--ss-mes-tamanho); line-height: var(--line-height-sm); font-weight: var(--font-weight-semibold); }
.ss-mes::first-letter { text-transform: uppercase; }
.ss-passo {
  flex: none; display: inline-grid; place-items: center; width: var(--ss-passo); height: var(--ss-passo); padding: 0;
  border: 1px solid var(--color-border-control); border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-text);
  font: inherit; cursor: pointer; transition: background-color var(--duration-fast) var(--easing-standard);
}
.ss-passo:hover { background: var(--aero-tonal); }
/* alvo de 32px: o anel de foco fica colado ao círculo */
.ss-passo:focus-visible { outline-offset: 1px; }

.ss-grade { display: flex; flex-direction: column; gap: var(--ss-entre-linhas); }
.ss-iniciais, .ss-semana { display: grid; grid-template-columns: repeat(7, var(--ss-celula)); column-gap: var(--ss-entre-colunas); }
.ss-iniciais span {
  display: grid; place-items: center; height: var(--ss-iniciais-altura);
  color: var(--color-text-muted); font-size: var(--ss-iniciais-tamanho); font-weight: var(--font-weight-heavy);
}
/* a borda da faixa é um anel interno (box-shadow inset): não soma largura, e a faixa fica do tamanho exato da grade */
.ss-semana { border-radius: var(--radius-full); transition: box-shadow var(--duration-fast) var(--easing-standard); }
.ss-semana:hover { box-shadow: inset 0 0 0 1px var(--color-border); }
.ss-semana[data-escolhida] { background: var(--color-accent-bg); box-shadow: inset 0 0 0 1px var(--color-primary); }

.ss-dia {
  position: relative; display: grid; place-items: center; width: var(--ss-celula); height: var(--ss-celula); padding: 0;
  border: 0; border-radius: var(--radius-full); background: none; color: var(--color-text); font: inherit; cursor: pointer;
}
.ss-dia[data-fora] { color: var(--color-text-muted); }
.ss-numero {
  display: grid; place-items: center; width: var(--ss-hoje); height: var(--ss-hoje); border-radius: var(--radius-full);
  font-size: var(--ss-numero-tamanho); line-height: 1; font-weight: var(--font-weight-medium); font-variant-numeric: tabular-nums;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
.ss-dia:hover .ss-numero { background: var(--aero-tonal); }
.ss-dia[aria-current="date"] .ss-numero { background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-heavy); }
.ss-dia:focus-visible { outline-offset: -2px; }
/* marcador: ponto de 4px dentro da célula, sob o número (não muda a altura da linha) */
.ss-ponto {
  position: absolute; bottom: var(--ss-ponto-base); left: 50%; width: var(--ss-ponto); height: var(--ss-ponto); transform: translateX(-50%);
  border-radius: var(--radius-full); background: var(--color-primary);
}
/* hoje: o ponto entra no círculo, na cor sobre a ação */
.ss-dia[aria-current="date"] .ss-ponto { bottom: calc((var(--ss-celula) - var(--ss-hoje)) / 2 + var(--ss-ponto)); background: var(--color-on-primary); }

/* ── mudancas/kanban-semana-calendario/kanban-semana-calendario.css ── */
/* kanban-semana-calendario (exp-09): o intervalo do campo vira botão; o popover traz o seletor de semanas */
:root {
  --popover-semana-raio: 18px;
}
.semana-abrir {
  align-self: stretch; margin: var(--space-1) 0; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-full);
  background: none; color: var(--color-text); font-family: inherit; cursor: pointer;
  transition: background-color var(--duration-fast) var(--easing-standard);
}
.semana-abrir:hover, .semana-abrir[aria-expanded="true"] { background: var(--aero-tonal); }
.semana-abrir:focus-visible { outline-offset: 0; }

.popover-semana {
  position: fixed; z-index: var(--z-flutuante); border: 1px solid var(--color-border-control); border-radius: var(--popover-semana-raio);
  background: var(--color-surface); box-shadow: var(--shadow-overlay);
  animation: flutuante-entrar var(--duration-fast) var(--easing-standard);
}
.popover-semana .seletor-semana { border-radius: var(--popover-semana-raio); }

/* ── mudancas/reunioes-semana-alta/reunioes-semana-alta.css ── */
/* reunioes-semana-alta (exp-09): uma hora = 72px (30 min = 36px, uma linha); a grade rola por dentro, com o cabeçalho dos
 * dias preso; sem hifenização; o rótulo de status só aparece com 120px ou mais de largura (abaixo disso, a cor já diz).
 * As larguras das @container ficam escritas: consulta de contêiner não aceita custom property */
:root {
  --agenda-hora: 72px;
  --agenda-altura-minima: 640px;
  --agenda-folga: 48px;
  --agenda-bloco-folga: 6px 8px;
  --agenda-hora-tamanho: 12px;
  --agenda-titulo-tamanho: 13px;
  --agenda-titulo-altura: 17px;
  --agenda-meta-tamanho: 12px;
  --agenda-bloco-entre: 2px;
}
.agenda-semana { height: var(--agenda-visivel, calc(var(--agenda-hora) * 9)); max-height: none; overflow-y: auto; }
.agenda-semana:focus-visible { outline-offset: -2px; }
.agenda-cabecalho .dia-titulo { flex-wrap: wrap; row-gap: var(--space-1); white-space: nowrap; }
.hora-rotulo { height: var(--agenda-hora); }
.agenda-dia {
  height: calc(var(--horas) * var(--agenda-hora));
  background-image: repeating-linear-gradient(to bottom, var(--color-border) 0, var(--color-border) 1px, transparent 1px, transparent var(--agenda-hora));
}
.agora-linha { top: calc(var(--inicio) * var(--agenda-hora)); }

.evento-bloco {
  container: evento-bloco / inline-size;
  top: calc(var(--inicio) * var(--agenda-hora)); height: calc(var(--duracao) * var(--agenda-hora));
  box-sizing: border-box; gap: var(--agenda-bloco-entre); padding: var(--agenda-bloco-folga);
}
.evento-bloco .evento-linha { display: flex; align-items: center; gap: var(--space-1); min-width: 0; }
.evento-bloco .evento-hora { font-size: var(--agenda-hora-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy); }
.evento-bloco .evento-status { display: none; margin-left: auto; }
.evento-bloco .evento-linha .evento-status::before { content: none; }
.evento-bloco-titulo {
  overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2;
  font-size: var(--agenda-titulo-tamanho); line-height: var(--agenda-titulo-altura); font-weight: var(--font-weight-semibold);
  hyphens: none; overflow-wrap: normal; word-break: normal;
}
.evento-local { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--color-text-muted); font-size: var(--agenda-meta-tamanho); line-height: var(--line-height-xs); }
/* 30 min: uma linha, "13:00 · título" */
.evento-bloco[data-curto] { flex-direction: row; align-items: center; padding-top: 0; padding-bottom: 0; }
.evento-bloco[data-curto] .evento-linha { display: flex; flex: 1; }
.evento-bloco[data-curto] .evento-bloco-titulo { flex: 1; display: block; white-space: nowrap; text-overflow: ellipsis; }
.evento-sep { flex: none; }
@container evento-bloco (min-width: 120px) {
  .evento-bloco .evento-status { display: inline; }
}
/* reuniões sobrepostas dividem a coluna: estreito demais para o horário, fica o título (o horário está no rótulo e na dica) */
@container evento-bloco (max-width: 40px) {
  .evento-bloco .evento-hora, .evento-sep { display: none; }
}
/* coluna dividida por reuniões sobrepostas: o título fica em uma linha com reticências (a dica e o rótulo têm o resto) */
@container evento-bloco (max-width: 72px) {
  .evento-bloco-titulo { display: block; white-space: nowrap; text-overflow: ellipsis; }
  .evento-sep { display: none; }
}
.evento-bloco-titulo-uma { display: block; white-space: nowrap; text-overflow: ellipsis; }

/* ── mudancas/reunioes-dica/reunioes-dica.css ── */
/* reunioes-dica (exp-09): 320px, fundo de cartão, borda de controle, cantos de 16px e a sombra dos popovers; acima da grade
 * (camada dos flutuantes) e abaixo das gavetas e diálogos (<dialog> modal fica na camada do topo) */
:root {
  --dica-largura: 320px;
  --dica-raio: 16px;
  --dica-titulo-tamanho: 15px;
  --dica-avatar: 24px;
  --dica-avatar-texto: 10px;
}
.dica-reuniao {
  position: fixed; z-index: var(--z-flutuante); box-sizing: border-box; width: var(--dica-largura); max-width: calc(100vw - var(--space-4));
  display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4);
  border: 1px solid var(--color-border-control); border-radius: var(--dica-raio); background: var(--color-surface); color: var(--color-text);
  box-shadow: var(--shadow-overlay); font-size: var(--font-size-sm); line-height: var(--line-height-sm); pointer-events: auto;
  animation: flutuante-entrar var(--duration-fast) var(--easing-standard);
}
.dica-reuniao p { margin: 0; }
.dica-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); padding-bottom: var(--space-1); }
.dica-titulo { min-width: 0; font-size: var(--dica-titulo-tamanho); line-height: var(--line-height-sm); font-weight: var(--font-weight-heavy); overflow-wrap: anywhere; }
.dica-topo .badge { flex: none; }
.dica-linha { display: flex; align-items: flex-start; gap: var(--space-2); min-width: 0; }
.dica-linha > span { min-width: 0; overflow-wrap: anywhere; }
.dica-linha .ph { flex: none; margin-top: var(--space-1); color: var(--color-text-muted); }
.dica-prioridade { align-items: center; }
.dica-pessoas { list-style: none; margin: 0; padding: var(--space-1) 0 0; display: flex; flex-direction: column; gap: var(--space-1); border-top: 1px solid var(--color-border); }
.dica-pessoa { display: flex; align-items: center; gap: var(--space-2); min-width: 0; padding-top: var(--space-1); }
.dica-pessoa-mais { padding-left: calc(var(--dica-avatar) + var(--space-2)); color: var(--color-text-muted); font-weight: var(--font-weight-semibold); }
.dica-avatar {
  flex: none; display: inline-grid; place-items: center; width: var(--dica-avatar); height: var(--dica-avatar); border-radius: var(--radius-full);
  background: var(--aero-tonal); color: var(--color-text); font-size: var(--dica-avatar-texto); font-weight: var(--font-weight-heavy);
}
.dica-rodape { padding-top: var(--space-2); border-top: 1px solid var(--color-border); }
@media (prefers-reduced-motion: reduce) {
  .dica-reuniao { animation: none; }
}

/* ── mudancas/reunioes-unificadas/reunioes-unificadas.css ── */
/* reunioes-unificadas (exp-09; canvas GestorReunioes): lista numa caixa de cartão que rola para os lados no estreito,
 * pessoas com avatares sobrepostos, presença com barra. Cores de reunião pela tabela "Cores por papel" do LEIAME de reuniões
 * (status, prioridade e presença), valendo em toda pílula de reunião (lista, detalhe, gaveta, calendário e dica) */
:root {
  --ru-caixa-raio: 22px;
  --ru-tabela-minima: 1080px;
  --ru-titulo-tamanho: 15px;
  --ru-meta-tamanho: 13px;
  --ru-avatar: 24px;
  --ru-avatar-sobreposto: -6px;
  --ru-avatar-anel: 2px;
  --ru-avatar-texto: 10px;
  --ru-barra: 6px;
  --ru-col-quando: 150px;
  --ru-col-anexos: 90px;
  --ru-col-abrir: 56px;
  --ru-pagina: 36px;
  --ru-pilula-tamanho: 12px;
  --ru-pilula-folga: 3px 10px;
}

/* cores por papel: status de reunião na cor cheia; prioridade e presença na suave com o texto do papel */
.badge[data-status="AGENDADA"] { background: var(--aero-seg-ea); color: var(--aero-seg-ea-texto); }
.badge[data-status="HOJE"] { background: var(--color-primary); color: var(--color-on-primary); }
.badge[data-status="AGUARDANDO_FINALIZACAO"] { background: var(--aero-seg-er); color: var(--aero-seg-er-texto); }
.badge[data-status="FINALIZADA"] { background: var(--aero-seg-c); color: var(--aero-seg-c-texto); }
.badge[data-prioridade="ALTA"] { border-color: transparent; background: var(--color-danger-bg); color: var(--color-danger); }
.badge[data-prioridade="MEDIA"] { border-color: transparent; background: var(--color-warning-bg); color: var(--color-warning); }
.badge[data-prioridade="BAIXA"] { border-color: transparent; background: var(--aero-ni-fundo); color: var(--aero-ni-texto); }
.badge[data-presente="true"] { background: var(--color-success-bg); color: var(--color-success); }
.badge[data-presente="false"] { background: var(--aero-ni-fundo); color: var(--aero-ni-texto); }
.badge:is([data-status="AGENDADA"], [data-status="HOJE"], [data-status="AGUARDANDO_FINALIZACAO"], [data-status="FINALIZADA"], [data-prioridade="ALTA"], [data-prioridade="MEDIA"], [data-prioridade="BAIXA"], [data-presente]) {
  padding: var(--ru-pilula-folga); border-radius: var(--radius-full); font-size: var(--ru-pilula-tamanho); line-height: var(--line-height-xs); font-weight: var(--font-weight-heavy); white-space: nowrap;
}

/* painel de filtros como no canvas: campos numa linha que quebra (a base não tinha regra para .filtros-campos e empilhava) e o
 * rodapé à direita, separado por uma linha */
.filtros-reunioes { display: flex; flex-direction: column; gap: var(--space-4); }
.filtros-reunioes .filtros-campos { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-4); }
.filtros-reunioes .filtros-campos > .campo { flex: 1 1 calc(var(--space-7) * 3.5); min-width: 0; }
.filtros-reunioes .filtros-campos > .campo-busca-reunioes { flex: 2 1 calc(var(--space-7) * 5.5); }
.filtros-reunioes .filtros-rodape { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--color-border); }
.voltar-reunioes { display: inline-flex; align-items: center; gap: var(--space-1); font-weight: var(--font-weight-semibold); }

.ru-lista { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.ru-lista-cabecalho { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-4); }
.ru-ordenar { display: flex; align-items: center; gap: var(--space-2); }
.ru-ordenar .rotulo { margin: 0; }
.ru-ordenar .select { width: auto; }
.ru-caixa { min-width: 0; border: 1px solid var(--color-border); border-radius: var(--ru-caixa-raio); background: var(--color-surface); overflow: hidden; }
.ru-rolagem { overflow-x: auto; }
.ru-rolagem:focus-visible { outline-offset: -2px; }
.ru-tabela { min-width: var(--ru-tabela-minima); }
.ru-tabela thead th { background: var(--aero-tonal); border-bottom: 1px solid var(--color-border); color: var(--color-text-muted); }
.ru-tabela td { vertical-align: middle; }
.ru-tabela tbody tr:last-child td { border-bottom: 1px solid var(--color-border); }
.ru-tabela[data-aba="ABERTAS"] td:nth-child(3) { width: var(--ru-col-quando); }
.ru-col-anexos { width: var(--ru-col-anexos); }
.ru-col-abrir { width: var(--ru-col-abrir); text-align: right; }
.ru-col-local .local { max-width: none; }

.ru-reuniao { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; max-width: calc(var(--ru-tabela-minima) / 3); }
.ru-titulo-linha { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.ru-titulo { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--color-text); font-size: var(--ru-titulo-tamanho); font-weight: var(--font-weight-semibold); text-decoration: none; }
.ru-titulo:hover { text-decoration: underline; text-underline-offset: var(--space-1); }
.ru-titulo-linha .badge { flex: none; }
.ru-pessoas { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.ru-avatares { flex: none; display: inline-flex; padding-left: calc(var(--ru-avatar-sobreposto) * -1); }
.ru-avatar {
  display: inline-grid; place-items: center; width: var(--ru-avatar); height: var(--ru-avatar); margin-left: var(--ru-avatar-sobreposto);
  border: var(--ru-avatar-anel) solid var(--color-surface); border-radius: var(--radius-full); box-sizing: content-box;
  background: var(--aero-tonal); color: var(--color-text); font-size: var(--ru-avatar-texto); font-weight: var(--font-weight-heavy);
}
.ru-nomes { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--color-text-muted); font-size: var(--ru-meta-tamanho); }
.ru-forte { font-weight: var(--font-weight-heavy); }
.anexos-quantidade { display: inline-flex; align-items: center; gap: var(--space-1); font-weight: var(--font-weight-heavy); }

.ru-presenca { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.ru-presenca-texto { font-size: var(--ru-meta-tamanho); font-weight: var(--font-weight-semibold); white-space: nowrap; }
.barra-presenca { display: block; height: var(--ru-barra); border-radius: var(--radius-full); background: var(--color-border); overflow: hidden; }
.barra-presenca-cheia { display: block; height: 100%; border-radius: var(--radius-full); background: var(--aero-seg-c); }

.ru-rodape { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-5); }
.ru-paginas { display: flex; gap: var(--space-2); }
.ru-pagina {
  display: inline-grid; place-items: center; width: var(--ru-pagina); height: var(--ru-pagina); padding: 0;
  border: 1px solid var(--color-border-control); border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-text); cursor: pointer;
}
.ru-pagina:not([disabled]):hover { background: var(--aero-tonal); }
.ru-pagina[disabled] { color: var(--aero-desabilitado); border-color: var(--color-border); cursor: not-allowed; }
.ru-caixa .estado-vazio { padding: var(--space-6) var(--space-4); }

/* ── mudancas/reunioes-anexos-popover/reunioes-anexos-popover.css ── */
/* reunioes-anexos-popover (exp-09; canvas GestorReunioes): botão com clipe e quantidade; aberto, fundo de painel e borda de
 * ação. Popover de 380px abaixo dele, com a extensão em caixa, o nome, "tamanho · enviado em" e "Baixar" por arquivo */
:root {
  --pa-largura: 380px;
  --pa-raio: 18px;
  --pa-botao-altura: 36px;
  --pa-extensao: 40px;
  --pa-extensao-raio: 10px;
  --pa-extensao-texto: 10px;
  --pa-arquivo-raio: 12px;

.ru-anexos {

  border: 1px solid var(--color-border-control); border-radius: var(--radius-full); background: var(--color-surface); color: var(--color-text);
  font: inherit; font-size: var(--pa-nome-tamanho); font-weight: var(--font-weight-heavy); cursor: pointer;

.ru-anexos:hover { background: var(--aero-tonal); }
.ru-anexos[aria-expanded="true"] { border-color: var(--color-primary); background: var(--aero-tonal); }

.popover-anexos {
  position: fixed; z-index: var(--z-flutuante); box-sizing: border-box; width: var(--pa-largura); max-width: calc(100vw - var(--space-4));
  display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4);
  border: 1px solid var(--color-border-control); border-radius: var(--pa-raio); background: var(--color-surface); color: var(--color-text);
  box-shadow: var(--shadow-overlay); animation: flutuante-entrar var(--duration-fast) var(--easing-standard);
}
.pa-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.pa-titulo { margin: 0; font-size: var(--font-size-sm); line-height: var(--line-height-sm); font-weight: var(--font-weight-heavy); }
.pa-fechar, .pa-baixar {
  flex: none; display: inline-grid; place-items: center; padding: 0; border: 1px solid var(--color-border-control); border-radius: var(--radius-full);
  background: var(--color-surface); color: var(--color-text); cursor: pointer; transition: background-color var(--duration-fast) var(--easing-standard);
}
.pa-fechar { width: var(--pa-fechar); height: var(--pa-fechar); }
.pa-baixar { width: var(--pa-baixar); height: var(--pa-baixar); }
.pa-fechar:hover, .pa-baixar:hover { background: var(--aero-tonal); }
.pa-lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.pa-arquivo { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2); border: 1px solid var(--color-border); border-radius: var(--pa-arquivo-raio); }
.pa-extensao {
  flex: none; display: grid; place-items: center; width: var(--pa-extensao); height: var(--pa-extensao); border: 1px solid var(--color-border); border-radius: var(--pa-extensao-raio);
  background: var(--aero-tonal); color: var(--color-text-muted); font-size: var(--pa-extensao-texto); font-weight: var(--font-weight-heavy);

.pa-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pa-nome { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: var(--pa-nome-tamanho); font-weight: var(--font-weight-semibold); }
.pa-todos { justify-content: center; width: 100%; height: var(--pa-todos-altura); min-height: 0; }
.pa-esqueleto .pa-extensao { border: 0; }
.pa-linha { height: var(--space-3); }
.pa-linha-curta { width: 50%; }
.popover-anexos .alerta-erro { border-radius: var(--pa-arquivo-raio); }

/* ── mudancas/reunioes-detalhe-finalizada/reunioes-detalhe-finalizada.css ── */
/* reunioes-detalhe-finalizada (exp-09; canvas Detalhe): duas colunas (2:1), cartões com título de 18px, arquivos em linhas com
 * a extensão em caixa, ata em estado vazio tracejado, presença com barra e pílulas Presente/Ausente */
:root {
  --df-raio: 22px;
  --df-titulo-tamanho: 18px;
  --df-extensao: 44px;
  --df-extensao-raio: 12px;
  --df-extensao-texto: 11px;
  --df-arquivo-raio: 14px;
  --df-avatar: 36px;
  --df-avatar-texto: 12px;
  --df-barra: 6px;
  --df-ata-icone: 28px;
}
.df-grade { gap: var(--space-5); }
.df-grade .coluna { gap: var(--space-5); min-width: 0; }
.df-card { display: flex; flex-direction: column; gap: var(--space-3); border-radius: var(--df-raio); }
.df-card .card-titulo { margin: 0; font-size: var(--df-titulo-tamanho); }
.df-card-cabecalho { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
.df-contagem { font-family: var(--font-family); font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); }
.df-card p { margin: 0; }

.df-arquivos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
