// T08 Detalhe da reunião (presença, anexos, finalização)

// no T08 status e prioridade já estão nos selos do topo: a grade em uma coluna não os repete
function gradeDadosReuniao(r, umaColuna = false) {
  const l = horarioLocal(r.inicio);
  return `<dl class="detalhe-grid ${umaColuna ? 'detalhe-grid-1' : ''}">
      ${itemDetalhe('Data', `<span class="num">${esc(formatarDiaCurto(l.data))}/${l.data.slice(0, 4)}</span>`)}
      ${itemDetalhe('Horário', `<span class="num">${esc(formatarHorario(r))}</span> <span class="legenda">(${esc(formatarDuracao(duracaoMinutos(r)))})</span>`)}
      ${umaColuna ? '' : itemDetalhe('Status', badgeStatusReuniao(r))}
      ${umaColuna ? '' : itemDetalhe('Prioridade', badgePrioridadeReuniao(r.prioridade))}
      ${itemDetalhe('Local ou link', localOuLink(r.localOuLink))}
      ${itemDetalhe('Unidades', chipsUnidades(r.unidades))}
      ${itemDetalhe('Criada por', listaUsuarios([r.criadoPor]))}
    </dl>`;
}

function cardPresenca(r) {
  const total = r.participantes.length;
  const presentes = r.participantes.filter((p) => p.presente).length;
  const podeMarcar = pode(OPERACAO.MARCAR_PRESENCA, r) && !motivoBloqueioReuniao(r);
  const mostraPresenca = iniciou(r) || Boolean(r.finalizadaEm);
  const itens = r.participantes.map((p) => (podeMarcar
    ? `<li><label class="check"><input type="checkbox" name="presentes" value="${p.id}" ${p.presente ? 'checked' : ''}>${avatarPequeno(p.username)}<span class="pessoa-nome">${listaUsuarios([p])}</span></label></li>`
    : `<li>${avatarPequeno(p.username)}<span class="pessoa-nome">${listaUsuarios([p])}</span>${mostraPresenca ? badgePresenca(p.presente) : ''}</li>`)).join('');
  // PUT /presencas substitui o conjunto: não marcado = ausente
  const corpo = podeMarcar
    ? `<form class="form" data-form="presenca" data-id="${r.id}"><ul class="pessoas">${itens}</ul><div><button type="submit" class="btn btn-secundario">Salvar presença</button></div></form>`
    : `<ul class="pessoas">${itens}</ul>${mostraPresenca ? '' : `<p class="legenda">${esc(MENSAGENS.PRESENCA_AGUARDANDO)}</p>`}`;
  return `<section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">Participantes ${badgeContagem(total)}</h2>${mostraPresenca ? `<span class="legenda num">${esc(MENSAGENS.PRESENTES(presentes, total))}</span>` : ''}</div>
      ${corpo}
    </section>`;
}

function cardAnexos(r) {
  const gerencia = pode(OPERACAO.GERENCIAR_ANEXOS, r);
  const cheio = r.anexos.length >= LIMITES.ANEXOS_POR_REUNIAO;
  const erros = estado.errosAnexos && estado.errosAnexos.reuniaoId === r.id ? estado.errosAnexos : null;
  const itens = r.anexos.map((x) => `<li><span class="anexo-icone">${icone('acoes')}</span>
      <span class="anexo-texto"><span class="anexo-nome" title="${esc(x.nomeOriginal)}">${esc(x.nomeOriginal)}</span>
        <span class="legenda num">${esc(extensaoDe(x.nomeOriginal).toUpperCase())} · ${esc(formatarBytes(x.tamanhoBytes))} · ${esc(formatarData(horarioLocal(x.criadoEm).data))}</span></span>
      <button type="button" class="btn btn-terciario" data-acao="anexo-baixar" data-id="${x.id}" aria-label="${esc(MENSAGENS.BAIXAR(x.nomeOriginal))}">${icone('download')}Baixar</button>
      ${gerencia ? `<button type="button" class="btn btn-terciario" data-acao="anexo-excluir" data-reuniao="${r.id}" data-id="${x.id}" aria-label="${esc(MENSAGENS.EXCLUIR_ANEXO(x.nomeOriginal))}">Excluir</button>` : ''}</li>`).join('');

      <label class="btn btn-secundario upload">${icone('anexo')}Adicionar arquivos<input class="sr-only" type="file" multiple accept="${aceitos}" data-anexos="${r.id}" aria-describedby="anexos-regra" ${cheio ? 'disabled' : ''}></label>

}

// T09 Formulário de reunião (criar e editar), na gaveta
function valoresIniciaisReuniao(r, data) {
  if (r) {
    const ini = horarioLocal(r.inicio);
    return {
      titulo: r.titulo, prioridade: r.prioridade, data: ini.data, inicio: ini.hora, termino: horarioLocal(r.termino).hora,
      localOuLink: r.localOuLink, unidadeIds: r.unidades.map((un) => String(un.id)), participanteIds: r.participantes.map((p) => String(p.id)), assunto: r.assunto,
    };
  }
  const dia = data || HOJE;
  // hoje: próxima hora cheia; outro dia: horário padrão
  const hora = dia === HOJE
    ? Math.min(Math.floor(horarioLocal(AGORA).minutos / CONFIG.MINUTOS_POR_HORA) + 1, CONFIG.HORAS_POR_DIA - 2)
    : CONFIG.HORA_PADRAO_REUNIAO;
  return { titulo: '', prioridade: PRIORIDADE_REUNIAO.MEDIA, data: dia, inicio: horaCheia(hora), termino: horaCheia(hora + 1), localOuLink: '', unidadeIds: [], participanteIds: [], assunto: '' };
}

const textoDuracao = (inicio, termino) => (inicio && termino && termino > inicio
  ? MENSAGENS.DURACAO(formatarDuracao((Date.parse(`${HOJE}T${termino}:00Z`) - Date.parse(`${HOJE}T${inicio}:00Z`)) / CONFIG.MS_POR_MINUTO)) : '');

function validarReuniao(v) {
  const erros = {};
  const obrigatorio = (campo) => { if (!String(v[campo]).trim()) erros[campo] = MENSAGENS.PREENCHA; }; // só espaços conta como vazio
  ['titulo', 'prioridade', 'data', 'inicio', 'termino', 'localOuLink', 'assunto'].forEach(obrigatorio);
  if (!erros.titulo && v.titulo.trim().length > LIMITES.TITULO) erros.titulo = MENSAGENS.LIMITE_TITULO;
  if (!erros.localOuLink && v.localOuLink.trim().length > LIMITES.LOCAL_OU_LINK) erros.localOuLink = MENSAGENS.LIMITE_LOCAL;
  if (!erros.assunto && v.assunto.length > LIMITES.ASSUNTO) erros.assunto = MENSAGENS.LIMITE_TEXTO_LONGO; // sem trim
  if (!erros.inicio && !erros.termino && v.termino <= v.inicio) erros.termino = MENSAGENS.TERMINO_ANTES;
  if (!v.unidadeIds.length) erros.unidadeIds = MENSAGENS.PARTICIPANTES_UNIDADES;
  if (!v.participanteIds.length) erros.participanteIds = MENSAGENS.PARTICIPANTES_UNIDADES;
  return erros;
}

function abrirFormReuniao(id, data, origem) {
  const r = id === null ? null : reuniaoPermitida(id, OPERACAO.EDITAR_REUNIAO);
  if (id !== null && !r) return;
  estado.formReuniao = { id, valores: valoresIniciaisReuniao(r, data), erros: {} };
  abrirGaveta(TIPO_GAVETA.FORM_REUNIAO, id, origem);
}

function lerFormReuniao(form) {
  const fd = new FormData(form);
  const valor = (campo) => String(fd.get(campo) || '');
  return {
    titulo: valor('titulo'), prioridade: valor('prioridade'), data: valor('data'), inicio: valor('inicio'), termino: valor('termino'),
    localOuLink: valor('localOuLink'), unidadeIds: fd.getAll('unidadeIds').map(String), participanteIds: fd.getAll('participanteIds').map(String), assunto: valor('assunto'),
  };
}

function enviarFormReuniao(form) {
  const f = estado.formReuniao;
  const u = usuarioAtual();
  f.valores = lerFormReuniao(form);
  f.erros = validarReuniao(f.valores);
  if (Object.keys(f.erros).length) { // 400: marca os campos e mantém o que foi digitado
    trocarConteudo(document.getElementById('gaveta-corpo'), renderFormReuniao());
    const primeiro = document.querySelector('#gaveta-corpo [aria-invalid="true"]');
    (primeiro.matches('fieldset') ? primeiro.querySelector('input') : primeiro).focus();
    return;
  }
  const v = f.valores;
  const dados = {
    titulo: v.titulo.trim(), assunto: v.assunto, prioridade: v.prioridade, localOuLink: v.localOuLink.trim(),
    inicio: paraUtc(v.data, v.inicio), termino: paraUtc(v.data, v.termino),
    unidades: v.unidadeIds.map((id) => unidadeRef(Number(id))),
  };
  let salva;
  if (f.id === null) {
    salva = {
      id: Math.max(0, ...reunioes.map((r) => r.id)) + 1, ...dados, criadoPor: ref(u.id), finalizadaEm: null,
      participantes: v.participanteIds.map((id) => participante(Number(id))), anexos: [], historico: null,
    };
    reunioes.push(salva);
  } else {
    const r = reuniaoPermitida(f.id, OPERACAO.EDITAR_REUNIAO);
    if (!r) { fecharGaveta(); return; }
    // R10 (409): com presença marcada, o início não vai para o futuro e quem está presente não sai
    const presentes = r.participantes.filter((p) => p.presente);
    if (presentes.length && Date.parse(dados.inicio) > Date.parse(AGORA)) { toast(MENSAGENS.PRESENCA_INICIO_FUTURO, 'erro'); return; }
    const removido = presentes.find((p) => !v.participanteIds.includes(String(p.id)));
    if (removido) { toast(MENSAGENS.PRESENTE_REMOVIDO(removido.username), 'erro'); return; }
    Object.assign(r, dados, { participantes: v.participanteIds.map((id) => r.participantes.find((p) => p.id === Number(id)) || participante(Number(id))) });
    salva = r;
  }
  const criando = f.id === null;
  fecharGaveta();
  // no calendário, a reunião nova aparece na aba Reuniões, no período dela
  if (criando && estado.rotaRenderizada.startsWith(ROTAS.CALENDARIO)) {
    estado.calendario.referencia = v.data;
    estado.calendarioTrocado = true;
    irPara(ROTAS.CALENDARIO_REUNIOES);
  } else render();
  toast(criando ? MENSAGENS.REUNIAO_AGENDADA : MENSAGENS.REUNIAO_SALVA, 'sucesso', criando ? { abrirReuniaoId: salva.id } : {});
}

// formulário de reunião: duração e contador ao vivo
function aoDigitarFormReuniao(form, alvo) {
  limparErroCampo(alvo, estado.formReuniao);
  if (alvo.name === 'inicio' || alvo.name === 'termino') {
    document.getElementById('duracao-reuniao').textContent = textoDuracao(form.elements.inicio.value, form.elements.termino.value);
  }
  if (alvo.name === 'assunto') document.getElementById('contador-assunto').textContent = contadorTexto(alvo.value.length, LIMITES.ASSUNTO);
}

// ── telas/reunioes/operacoes.js
// reuniões: cada operação repete a checagem que a API faria (404, 403, 409)
// devolve a reunião se o usuário pode fazer a operação; senão avisa como a API e devolve null
function reuniaoPermitida(id, operacao) {
  const r = reuniaoPorId(id);
  if (!r || !pode(OPERACAO.VER_REUNIAO, r)) { toast(MENSAGENS.REUNIAO_NAO_ENCONTRADA, 'erro'); render(); return null; } // 404 idêntico
  if (!pode(operacao, r)) { // 409 se finalizada; 403 para quem não é o criador (a regra é ser o criador, não o papel)
    toast(r.finalizadaEm ? MENSAGENS.REUNIAO_JA_FINALIZADA : MENSAGENS.SO_CRIADOR_OPERACAO, 'erro');
    render();
    return null;
  }
  return r;
}

function salvarPresenca(id, presentesIds) {
  const r = reuniaoPermitida(id, OPERACAO.MARCAR_PRESENCA);
  if (!r) return;
  const motivo = motivoBloqueioReuniao(r);
  if (motivo) { toast(motivo, 'erro'); return; } // 409 antes do início
  r.participantes = r.participantes.map((p) => ({ ...p, presente: presentesIds.includes(p.id) })); // PUT substitui o conjunto
  toast(MENSAGENS.PRESENCA_SALVA);
  render();
}

function pedirFinalizacao(id) {
  const r = reuniaoPermitida(id, OPERACAO.FINALIZAR_REUNIAO);
  if (!r || motivoBloqueioReuniao(r)) return;
  confirmar({
    titulo: 'Finalizar reunião?', texto: MENSAGENS.CONFIRMAR_FINALIZACAO, rotulo: 'Finalizar reunião', perigo: false, comObservacao: true,
    aoConfirmar: (observacao) => finalizarReuniao(id, observacao),
  });
}
// R11: irreversível; o histórico guarda a presença no momento da finalização
function finalizarReuniao(id, observacao) {
  const r = reuniaoPermitida(id, OPERACAO.FINALIZAR_REUNIAO);
  if (!r) return;
  const motivo = motivoBloqueioReuniao(r);
  if (motivo) { toast(motivo, 'erro'); return; }
  r.finalizadaEm = AGORA;
  r.historico = { participantes: r.participantes.map((p) => ({ ...p })), observacao: observacao.trim() ? observacao : null, possuiAta: false };
  toast(MENSAGENS.REUNIAO_FINALIZADA);
  render();
}

function pedirExclusaoReuniao(id) {
  const r = reuniaoPermitida(id, OPERACAO.EXCLUIR_REUNIAO);
  if (!r) return;
  confirmar({
    titulo: 'Excluir reunião?', texto: MENSAGENS.CONFIRMAR_EXCLUSAO_REUNIAO, rotulo: 'Excluir',
    aoConfirmar: () => {
      if (!reuniaoPermitida(id, OPERACAO.EXCLUIR_REUNIAO)) return;
      reunioes = reunioes.filter((x) => x.id !== id); // participantes, unidades, anexos e histórico vão junto
      toast(MENSAGENS.REUNIAO_EXCLUIDA);
      irPara(ROTAS.REUNIOES);
    },
  });
}

const encurtarNome = (nome) => {
  if (nome.length <= LIMITES.NOME_ANEXO) return nome;
  const ext = extensaoDe(nome);
  const sufixo = ext ? `.${ext}` : '';
  return nome.slice(0, LIMITES.NOME_ANEXO - sufixo.length) + sufixo; // mantém a extensão
};
// lote com um arquivo inválido é rejeitado inteiro (413/415 com arquivosInvalidos); acima do limite: 409 sem lista
function adicionarAnexos(id, arquivos) {
  if (!arquivos.length) return;
  const r = reuniaoPermitida(id, OPERACAO.GERENCIAR_ANEXOS);
  if (!r) return;
  if (r.anexos.length + arquivos.length > LIMITES.ANEXOS_POR_REUNIAO) { // 409: toast com o detail, tela mantida
    estado.errosAnexos = null;
    toast(MENSAGENS.ANEXOS_LIMITE, 'erro');
    render();
    return;
  }
  const invalidos = arquivos.map((arq) => ({
    nome: arq.name,

  estado.errosAnexos = null;

}

function usuarioPermitido(id) {
  if (!pode(OPERACAO.VER_USUARIOS)) { toast(MENSAGENS.SEM_PERMISSAO_OPERACAO, 'erro'); render(); return null; } // 403
  const x = usuarioPorId(id);
  if (!x) { toast(MENSAGENS.USUARIO_NAO_ENCONTRADO, 'erro'); fecharGaveta(); render(); return null; } // 404
  return x;
}
// guarda o que foi digitado em "Dados" antes de redesenhar a gaveta
function capturarDadosUsuario() {
  const form = document.querySelector('#gaveta-corpo [data-form="usuario"]');
  if (!form || !estado.formUsuario) return;
  estado.formUsuario.valores.username = form.elements.username.value;
  estado.formUsuario.valores.email = form.elements.email.value;
}
function validarUsuario(v, novo) {
  const erros = {};
  const username = v.username.trim();
  if (!username) erros.username = MENSAGENS.PREENCHA;
  else if ([...username].length < LIMITES.USERNAME_MIN || [...username].length > LIMITES.USERNAME_MAX) erros.username = MENSAGENS.LIMITE_USERNAME;
  const email = v.email.trim();
  if (!email) erros.email = MENSAGENS.PREENCHA;
  else if ([...email].length > LIMITES.EMAIL) erros.email = MENSAGENS.LIMITE_EMAIL;
  if (novo) {
    if (!v.senha.trim()) erros.senha = MENSAGENS.PREENCHA;
    else if ([...v.senha].length < LIMITES.SENHA_MIN || new TextEncoder().encode(v.senha).length > LIMITES.SENHA_MAX_BYTES) erros.senha = MENSAGENS.LIMITE_SENHA;
    if (!Object.values(PAPEL).includes(v.role)) erros.role = MENSAGENS.PREENCHA;
  }
  return erros;
}
// a ação e a reunião guardam { id, username }: a resposta da API já viria com o nome novo
function renomearRefs(id, username) {
  const troca = (lista) => lista.forEach((r) => { if (r.id === id) r.username = username; });
  acoes.forEach((a) => { troca(a.responsaveis); troca(a.pontosFocais); });
  reunioes.forEach((r) => { troca([r.criadoPor]); troca(r.participantes); if (r.historico) troca(r.historico.participantes); });
}

function enviarFormUsuario(form) {
  if (!pode(OPERACAO.VER_USUARIOS)) { toast(MENSAGENS.SEM_PERMISSAO_OPERACAO, 'erro'); fecharGaveta(); render(); return; }
  const f = estado.formUsuario;
  const novo = f.id === null;
  const fd = new FormData(form);
  f.valores = { ...f.valores, username: String(fd.get('username') || ''), email: String(fd.get('email') || ''),
    ...(novo ? { senha: String(fd.get('senha') || ''), role: String(fd.get('role') || '') } : {}) };
  f.erros = validarUsuario(f.valores, novo);
  if (Object.keys(f.erros).length) { redesenharGaveta(); focarPrimeiroInvalido('#gaveta-corpo'); return; } // 400
  const username = f.valores.username.trim();
  const email = f.valores.email.trim().toLowerCase();
  // 409: nome único sem diferenciar maiúsculas; email único
  if (USUARIOS.some((x) => x.id !== f.id && x.username.toLowerCase() === username.toLowerCase())) { toast(MENSAGENS.USERNAME_EM_USO, 'erro'); return; }
  if (USUARIOS.some((x) => x.id !== f.id && x.email === email)) { toast(MENSAGENS.EMAIL_EM_USO, 'erro'); return; }
  let x;
  if (novo) {
    // status inicial ATIVO: o contrato de POST /usuarios não está em docs/DOMAIN.md (pendência B27)
    x = { id: Math.max(0, ...USUARIOS.map((y) => y.id)) + 1, username, email, role: f.valores.role, status: STATUS_USUARIO.ATIVO, criadoEm: AGORA };
    USUARIOS.push(x);
    estado.gaveta = { tipo: TIPO_GAVETA.USUARIO, id: x.id };
  } else {
    x = usuarioPermitido(f.id);
    if (!x) return;
    renomearRefs(x.id, username);
    x.username = username;
    x.email = email;
  }
  estado.formUsuario = formUsuarioDe(x);
  render();
  redesenharGaveta();
  toast(novo ? MENSAGENS.USUARIO_CRIADO : MENSAGENS.DADOS_SALVOS);
}

// ── hub/eventos.js
// eventos vivos do feed (B30): a cada desenho, o que mudou nos dados desde o anterior vira aviso para os outros vinculados
// (o ator é o usuário atual; sem autoaviso). O "Desfazer" apaga os avisos da mudança desfeita (estado.desfazendoStatus)
let fotoDados = null;
let ultimosEventosStatus = null; // { acaoId, ids } da última mudança
const vinculadosDe = (a) => [...new Set([...a.responsaveis, ...a.pontosFocais].map((r) => r.id))];
const pessoasDaReuniao = (r) => [...new Set([r.criadoPor.id, ...r.participantes.map((p) => p.id)])];
const adminsAtivosIds = () => USUARIOS.filter((x) => x.role === PAPEL.ADMINISTRADOR && x.status === STATUS_USUARIO.ATIVO).map((x) => x.id);
const fotografar = () => ({
  acoes: new Map(acoes.map((a) => [a.id, { status: a.status, vinculados: vinculadosDe(a) }])),
  reunioes: new Map(reunioes.map((r) => [r.id, {
    dados: JSON.stringify([r.titulo, r.assunto, r.prioridade, r.localOuLink, r.inicio, r.termino, r.unidades.map((x) => x.id)]),
    pessoas: pessoasDaReuniao(r), titulo: r.titulo, finalizada: Boolean(r.finalizadaEm), observacao: r.historico ? r.historico.observacao : null,
  }])),
  usuarios: new Map(USUARIOS.map((x) => [x.id, { role: x.role, status: x.status }])),
});
// um evento por destinatário, nunca para quem fez a mudança
function emitirNotificacao(destinatarios, dados) {
  const ator = estado.usuarioId;
  return destinatarios.filter((id) => id !== ator).map((usuarioId) => {
    const n = { id: proximoIdNotificacao++, usuarioId, atorId: ator, acaoId: null, reuniaoId: null, usuarioAlvoId: null, de: null, para: null, observacao: null, criadoEm: AGORA, lida: false, ...dados };
    notificacoes.push(n);
    return n.id;
  });
}
function registrarEventosNotificacao() {
  const TN = TIPO_NOTIFICACAO;
  const antes = fotoDados;
  fotoDados = fotografar();
  if (!antes) return;
  fotoDados.acoes.forEach((agora, id) => {
    const prev = antes.acoes.get(id);
    if (!prev) { emitirNotificacao(agora.vinculados, { tipo: TN.VINCULO_INCLUIDO, acaoId: id }); return; } // ação criada no Gerador
    if (prev.status !== agora.status) {
      if (estado.desfazendoStatus && ultimosEventosStatus && ultimosEventosStatus.acaoId === id) {
        const apagar = new Set(ultimosEventosStatus.ids);
        for (let i = notificacoes.length - 1; i >= 0; i -= 1) if (apagar.has(notificacoes[i].id)) notificacoes.splice(i, 1);
        ultimosEventosStatus = null;
      } else {
        const obs = estado.observacaoStatus && estado.observacaoStatus.id === id ? estado.observacaoStatus.texto : null;
        ultimosEventosStatus = { acaoId: id, ids: emitirNotificacao(agora.vinculados, { tipo: TN.STATUS_ACAO, acaoId: id, de: prev.status, para: agora.status, observacao: obs }) };
      }
    }
    const entraram = agora.vinculados.filter((x) => !prev.vinculados.includes(x));
    const sairam = prev.vinculados.filter((x) => !agora.vinculados.includes(x));
    if (entraram.length) emitirNotificacao(entraram, { tipo: TN.VINCULO_INCLUIDO, acaoId: id });
    if (sairam.length) emitirNotificacao(sairam, { tipo: TN.VINCULO_REMOVIDO, acaoId: id });
  });
  antes.reunioes.forEach((prev, id) => {
    if (fotoDados.reunioes.has(id)) return;
    titulosReunioesExcluidas.set(id, prev.titulo);
    emitirNotificacao(prev.pessoas, { tipo: TN.REUNIAO_EXCLUIDA, reuniaoId: id });
  });
  fotoDados.reunioes.forEach((agora, id) => {
    const prev = antes.reunioes.get(id);
    if (!prev) { emitirNotificacao(agora.pessoas, { tipo: TN.REUNIAO_CONVITE, reuniaoId: id }); return; }
    if (!prev.finalizada && agora.finalizada) emitirNotificacao(agora.pessoas, { tipo: TN.REUNIAO_FINALIZADA, reuniaoId: id, observacao: agora.observacao });
    const novas = agora.pessoas.filter((x) => !prev.pessoas.includes(x));
    if (novas.length) emitirNotificacao(novas, { tipo: TN.REUNIAO_CONVITE, reuniaoId: id });
    if (prev.dados !== agora.dados) emitirNotificacao(agora.pessoas.filter((x) => prev.pessoas.includes(x)), { tipo: TN.REUNIAO_ALTERADA, reuniaoId: id });
  });
  fotoDados.usuarios.forEach((agora, id) => {
    const prev = antes.usuarios.get(id);
    if (!prev) { emitirNotificacao(adminsAtivosIds(), { tipo: TN.USUARIO_CRIADO, usuarioAlvoId: id }); return; }
    if (prev.role !== agora.role) emitirNotificacao(adminsAtivosIds(), { tipo: TN.USUARIO_PAPEL, usuarioAlvoId: id, de: prev.role, para: agora.role });
    if (prev.status !== agora.status) emitirNotificacao(adminsAtivosIds(), { tipo: TN.USUARIO_STATUS, usuarioAlvoId: id, de: prev.status, para: agora.status });
  });
}

estado.gerais = { soNaoLidas: false, familia: '', limite: CONFIG_GERAIS.POR_PAGINA };

function notificacaoVisivel(n, u) {
  const ev = EVENTOS_NOTIFICACAO[n.tipo];
  if (!ev || n.usuarioId !== u.id || n.atorId === u.id) return false; // só as do usuário; sem autoaviso
  // administração: decide pelo papel de u (a função de permissão lê o usuário atual, que precisa ser u)
  if (ev.familia === FAMILIA_NOTIFICACAO.ADMINISTRACAO) return u.id === estado.usuarioId && pode(OPERACAO.VER_USUARIOS);
  if (ev.destino === DESTINO_NOTIFICACAO.ACAO) { const a = acaoPorId(n.acaoId); return Boolean(a) && podeVer(a, u); }
  if (n.tipo === TIPO_NOTIFICACAO.REUNIAO_EXCLUIDA) return true;
  const r = reuniaoPorId(n.reuniaoId);
  return Boolean(r) && pode(OPERACAO.VER_REUNIAO, r);
}
const notificacoesDe = (u) => notificacoes.filter((n) => notificacaoVisivel(n, u)).sort((a, b) => b.criadoEm.localeCompare(a.criadoEm) || b.id - a.id);
const naoLidas = (u) => notificacoesDe(u).filter((n) => !n.lida).length;
function textoNotificacao(n) {
  const ev = EVENTOS_NOTIFICACAO[n.tipo];
  const ator = (usuarioPorId(n.atorId) || {}).username || '—';
  let alvo;
  if (ev.destino === DESTINO_NOTIFICACAO.ACAO) alvo = acaoPorId(n.acaoId).descricao;
  else if (ev.destino === DESTINO_NOTIFICACAO.REUNIAO) alvo = (reuniaoPorId(n.reuniaoId) || {}).titulo || titulosReunioesExcluidas.get(n.reuniaoId) || TEXTOS_GERAIS.REUNIAO_EXCLUIDA;
  else alvo = (usuarioPorId(n.usuarioAlvoId) || {}).username || '—';
  return ev.texto(ator, alvo, n);
}
const rotuloDiaNotificacao = (data) => (data === HOJE ? TEXTOS_GERAIS.HOJE : data === somarDias(HOJE, -1) ? TEXTOS_GERAIS.ONTEM : formatarDiaCurto(data));
function itemNotificacao(n) {
  const ev = EVENTOS_NOTIFICACAO[n.tipo];
  const l = horarioLocal(n.criadoEm);
  return `<li><button type="button" class="notif-item" data-id="${n.id}" data-secao="notificacao" ${n.lida ? '' : 'data-nao-lida'}>
      <span class="notif-glifo"><i class="ph ${ev.icone}" aria-hidden="true"></i></span>
      <span class="notif-corpo"><span class="notif-texto">${esc(textoNotificacao(n))}</span>
        ${n.observacao ? `<span class="notif-observacao" title="${esc(n.observacao)}">${esc(TEXTOS_GERAIS.OBSERVACAO(n.observacao))}</span>` : ''}
        <span class="legenda num">${esc(ROTULOS_FAMILIA_NOTIFICACAO[ev.familia])} · ${l.hora}</span></span>
      ${n.lida ? '' : `<span class="notif-ponto" aria-hidden="true"></span><span class="sr-only">, ${esc(TEXTOS_GERAIS.NAO_LIDA)}</span>`}
    </button></li>`;
}
// abrir um item: marca como lido, fecha o painel e abre o alvo (gaveta da ação, página da reunião ou gaveta do usuário)
function abrirNotificacao(id) {
  const n = notificacoes.find((x) => x.id === id);
  if (!n) return;
  n.lida = true;
  const ev = EVENTOS_NOTIFICACAO[n.tipo];
  fecharPainelNotificacoes({ devolverFoco: false });
  const marcar = () => marcarGavetaDoPainel();
  if (ev.destino === DESTINO_NOTIFICACAO.ACAO) {
    const a = acaoPorId(n.acaoId);
    render();
    if (!a || !pode(OPERACAO.VER, a)) { toast(MENSAGENS.ACAO_NAO_ENCONTRADA, 'erro'); return; } // deixou de ser visível: 404
    marcar();
    abrirGaveta(TIPO_GAVETA.ACAO, a.id, null);
  } else if (ev.destino === DESTINO_NOTIFICACAO.REUNIAO) {
    irPara(`#/reunioes/${n.reuniaoId}`); // excluída ou sem vínculo: "Não encontrado"
  } else {
    const x = usuarioPorId(n.usuarioAlvoId);
    if (location.hash !== ROTAS.USUARIOS) location.hash = ROTAS.USUARIOS;
    render();
    if (!x || !pode(OPERACAO.VER_USUARIOS)) return;
    estado.formUsuario = formUsuarioDe(x);
    marcar();
    abrirGaveta(TIPO_GAVETA.USUARIO, x.id, null);
  }
}
document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const item = evento.target.closest('#painel-notif .notif-item');
  if (item) { abrirNotificacao(Number(item.dataset.id)); return; }
  const controle = evento.target.closest('#painel-notif button[data-gerais]');
  if (!controle) return;
  const g = estado.gerais;
  const u = usuarioAtual();
  if (controle.dataset.gerais === 'so-nao-lidas') { g.soNaoLidas = !g.soNaoLidas; g.limite = CONFIG_GERAIS.POR_PAGINA; }
  else if (controle.dataset.gerais === 'ver-mais') g.limite += CONFIG_GERAIS.POR_PAGINA;
  else if (controle.dataset.gerais === 'marcar-todas') { notificacoesDe(u).forEach((n) => { n.lida = true; }); anunciar(TEXTOS_GERAIS.TODAS_LIDAS); }
  render();
  const mesmo = document.querySelector(`#painel-notif button[data-gerais="${controle.dataset.gerais}"]`);
  (mesmo && !mesmo.disabled ? mesmo : document.querySelector('#painel-notif [role="tab"][aria-selected="true"]'))?.focus({ preventScroll: true });
});

// Gerais com volume: eventos do mesmo tipo e do mesmo ator (e, em mudança de status, do mesmo destino) dentro de 60 min viram um
// item ("Bruno Lima concluiu 12 ações"), com contagem e expansão. Ler o grupo (expandir) marca todos como lidos; "Marcar grupo
// como lido" marca sem expandir. A alça e a aba contam eventos não lidos, nunca grupos; "Ver mais" pagina grupos
const HUB_CONFIG_GRUPO = Object.freeze({ JANELA_MIN: 60, MINIMO: 2 });
const HUB_TEXTOS_GRUPO = Object.freeze({
  STATUS_ACAO: (ator, n, x) => (x.para === ST.CONCLUIDO ? `${ator} concluiu ${n} ações` : `${ator} mudou ${n} ações para ${ROTULOS_STATUS_ACAO[x.para]}`),
  DADOS_ACAO: (ator, n) => `${ator} alterou os dados de ${n} ações`,
  VINCULO_INCLUIDO: (ator, n) => `${ator} incluiu você em ${n} ações`,
  VINCULO_REMOVIDO: (ator, n) => `${ator} removeu você de ${n} ações`,
  REUNIAO_CONVITE: (ator, n) => `${ator} convidou você para ${n} reuniões`,
  REUNIAO_ALTERADA: (ator, n) => `${ator} alterou ${n} reuniões`,
  REUNIAO_EXCLUIDA: (ator, n) => `${ator} excluiu ${n} reuniões`,
  REUNIAO_FINALIZADA: (ator, n) => `${ator} finalizou ${n} reuniões`,
  USUARIO_CRIADO: (ator, n) => `${ator} criou ${n} usuários`,
  USUARIO_STATUS: (ator, n) => `${ator} mudou o status de ${n} usuários`,
  USUARIO_PAPEL: (ator, n) => `${ator} mudou o papel de ${n} usuários`,
  NAO_LIDAS: (n) => (n === 1 ? '1 não lida' : `${n} não lidas`),
  MARCAR: 'Marcar grupo como lido', MARCAR_ROTULO: (texto) => `Marcar como lido: ${texto}`, LIDO: (texto) => `Grupo marcado como lido: ${texto}`,
  INTERVALO: (de, ate) => (de === ate ? de : `${de}–${ate}`),
});
const ICONES_HUB_GRUPO = Object.freeze({ MARCAR: 'ph-checks', ABRIR: 'ph-caret-down' });
estado.hubGruposAbertos = new Set();
// lista em ordem decrescente → entradas { chave, dia, itens }, na posição do evento mais recente de cada uma
function agruparNotificacoes(lista) {
  const entradas = [];
  const abertas = new Map();
  lista.forEach((n) => {
    const dia = horarioLocal(n.criadoEm).data;
    const base = `${dia}|${n.tipo}|${n.atorId}|${n.tipo === TIPO_NOTIFICACAO.STATUS_ACAO ? n.para : ''}`;
    const g = abertas.get(base);
    if (g && Date.parse(g.itens[0].criadoEm) - Date.parse(n.criadoEm) <= HUB_CONFIG_GRUPO.JANELA_MIN * CONFIG.MS_POR_MINUTO) { g.itens.push(n); return; }
    const nova = { chave: `${base}|${n.id}`, dia, itens: [n] };
    abertas.set(base, nova);
    entradas.push(nova);
  });
  return entradas;
}
const textoGrupo = (gr) => HUB_TEXTOS_GRUPO[gr.itens[0].tipo]((usuarioPorId(gr.itens[0].atorId) || {}).username || '—', gr.itens.length, gr.itens[0]);
function itemGrupoNotificacao(gr) {
  const T = HUB_TEXTOS_GRUPO;
  const n0 = gr.itens[0];
  const ev = EVENTOS_NOTIFICACAO[n0.tipo];
  const texto = textoGrupo(gr);
  const naoLidas = gr.itens.filter((n) => !n.lida).length;
  const aberto = estado.hubGruposAbertos.has(gr.chave);
  const id = `hub-grupo-${n0.id}`;
  const intervalo = T.INTERVALO(horarioLocal(gr.itens[gr.itens.length - 1].criadoEm).hora, horarioLocal(n0.criadoEm).hora);
  return `<li class="hub-grupo" ${naoLidas ? 'data-nao-lida' : ''}>
      <div class="hub-grupo-linha">
        <button type="button" class="hub-grupo-cabeca" data-hub-grupo="${esc(gr.chave)}" aria-expanded="${aberto}" aria-controls="${id}">
          <span class="notif-glifo"><i class="ph ${ev.icone}" aria-hidden="true"></i></span>
          <span class="notif-corpo"><span class="notif-texto">${esc(texto)}</span><span class="legenda num">${esc(ROTULOS_FAMILIA_NOTIFICACAO[ev.familia])} · ${intervalo}</span></span>
          <span class="hub-grupo-contagem num" aria-hidden="true">${gr.itens.length}</span>
          ${naoLidas ? `<span class="notif-ponto" aria-hidden="true"></span><span class="sr-only">, ${esc(T.NAO_LIDAS(naoLidas))}</span>` : ''}
          <i class="ph ${ICONES_HUB_GRUPO.ABRIR} hub-grupo-seta" aria-hidden="true"></i>
        </button>
        ${naoLidas ? `<button type="button" class="btn-quadrado hub-grupo-marcar" data-hub-grupo-lido="${esc(gr.chave)}" aria-label="${esc(T.MARCAR_ROTULO(texto))}" title="${esc(T.MARCAR)}"><i class="ph ${ICONES_HUB_GRUPO.MARCAR}" aria-hidden="true"></i></button>` : ''}
      </div>
      <ul class="notif-lista hub-grupo-itens" id="${id}" ${aberto ? '' : 'hidden'}>${aberto ? gr.itens.map(itemNotificacao).join('') : ''}</ul>
    </li>`;
}
// aba Gerais: filtros no topo (chips de família, Só não lidas, Marcar todas) e as entradas agrupadas
const renderGeraisPainel = NBC.pontos.definir('hub.gerais', (u) => {
  const g = estado.gerais;
  const T = TEXTOS_GERAIS;
  const todas = notificacoesDe(u);
  const familias = Object.values(FAMILIA_NOTIFICACAO).filter((f) => f !== FAMILIA_NOTIFICACAO.ADMINISTRACAO || pode(OPERACAO.VER_USUARIOS));
  if (g.familia && !familias.includes(g.familia)) g.familia = '';
  const entradas = agruparNotificacoes(notificacoesFiltradas(u));
  const mostradas = entradas.slice(0, g.limite);
  const resto = entradas.length - mostradas.length;
  const nNaoLidas = todas.filter((n) => !n.lida).length;
  const dias = [];
  mostradas.forEach((x) => {
    const ultimo = dias[dias.length - 1];
    if (ultimo && ultimo.dia === x.dia) ultimo.itens.push(x); else dias.push({ dia: x.dia, itens: [x] });
  });
  const lista = dias.length
    ? dias.map((x) => `<section class="notif-grupo" aria-labelledby="notif-dia-${x.dia}"><h3 class="notif-dia" id="notif-dia-${x.dia}">${esc(rotuloDiaNotificacao(x.dia))}</h3>
        <ul class="notif-lista">${x.itens.map((e) => (e.itens.length >= HUB_CONFIG_GRUPO.MINIMO ? itemGrupoNotificacao(e) : itemNotificacao(e.itens[0]))).join('')}</ul></section>`).join('')
    : estadoVazio(todas.length ? T.VAZIO_FILTRO : T.VAZIO);
  return `<div class="notif-ferramentas">
      ${chipsFamilia()}
      <div class="notif-botoes">
        <button type="button" class="btn btn-secundario" data-gerais="so-nao-lidas" aria-pressed="${g.soNaoLidas}">${esc(T.SO_NAO_LIDAS)}</button>
        <button type="button" class="btn btn-terciario" data-gerais="marcar-todas" ${nNaoLidas ? '' : 'disabled'}><i class="ph ${ICONES_GERAIS.MARCAR_TODAS}" aria-hidden="true"></i>${esc(T.MARCAR_TODAS)}</button>
      </div>
    </div>
    ${lista}
    ${resto > 0 ? `<button type="button" class="btn btn-secundario" data-gerais="ver-mais">${esc(T.VER_MAIS(Math.min(resto, CONFIG_GERAIS.POR_PAGINA)))}</button>` : ''}`;
});
// mesma lista e mesmos filtros do desenho (Só não lidas e família), para a chave do grupo ser a mesma
estado.hubLidosAoAbrir = new Set(); // avisos lidos ao expandir um grupo: ficam à vista com "Só não lidas"
const notificacoesFiltradas = (u) => notificacoesDe(u).filter((n) => (!estado.gerais.soNaoLidas || !n.lida || estado.hubLidosAoAbrir.has(n.id)) && (!estado.gerais.familia || EVENTOS_NOTIFICACAO[n.tipo].familia === estado.gerais.familia));
const grupoPorChave = (chave) => agruparNotificacoes(notificacoesFiltradas(usuarioAtual())).find((x) => x.chave === chave) || null;
// as ações do HUB redesenham só o painel e a alça (o resto da tela não depende dos avisos)
document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const cabeca = evento.target.closest('#painel-notif [data-hub-grupo]');
  const marcar = evento.target.closest('#painel-notif [data-hub-grupo-lido]');
  if (!cabeca && !marcar) return;
  const chave = (cabeca || marcar).dataset[cabeca ? 'hubGrupo' : 'hubGrupoLido'];
  const gr = grupoPorChave(chave);
  if (cabeca) {
    if (estado.hubGruposAbertos.has(chave)) estado.hubGruposAbertos.delete(chave);
    else { estado.hubGruposAbertos.add(chave); if (gr) gr.itens.forEach((n) => { n.lida = true; estado.hubLidosAoAbrir.add(n.id); }); } // ler o grupo
  } else if (gr) {
    gr.itens.forEach((n) => { n.lida = true; });
    anunciar(HUB_TEXTOS_GRUPO.LIDO(textoGrupo(gr)));
  }
  atualizarPainelNotificacoes();
  const alvo = [...document.querySelectorAll('#painel-notif [data-hub-grupo]')].find((b) => b.dataset.hubGrupo === chave);
  (alvo || document.querySelector('#painel-notif [role="tab"][aria-selected="true"]'))?.focus({ preventScroll: true });
});
// trocar o "Só não lidas" recomeça a lista (captura: roda antes do clique das ferramentas)
document.addEventListener('click', (evento) => {
  if (evento.target instanceof Element && evento.target.closest('#painel-notif [data-gerais="so-nao-lidas"]')) estado.hubLidosAoAbrir.clear();
}, true);

// filtro rápido por família nas Gerais: chips (aria-pressed) no lugar do select; o estado é o mesmo (estado.gerais.familia)
const HUB_TEXTOS_FAMILIA = Object.freeze({ GRUPO: 'Tipo de aviso', TODOS: 'Todos' });
function chipsFamilia() {
  const g = estado.gerais;
  const familias = Object.values(FAMILIA_NOTIFICACAO).filter((f) => f !== FAMILIA_NOTIFICACAO.ADMINISTRACAO || pode(OPERACAO.VER_USUARIOS));
  const T = HUB_TEXTOS_FAMILIA;
  return `<div class="hub-chips" role="group" aria-label="${esc(T.GRUPO)}">${[['', T.TODOS], ...familias.map((f) => [f, ROTULOS_FAMILIA_NOTIFICACAO[f]])]
    .map(([v, rotulo]) => `<button type="button" class="chip-filtro" data-hub-familia="${v}" aria-pressed="${v === g.familia}">${esc(rotulo)}</button>`).join('')}</div>`;
}
document.addEventListener('click', (evento) => {
  const chip = evento.target instanceof Element ? evento.target.closest('#painel-notif [data-hub-familia]') : null;
  if (!chip) return;
  estado.gerais.familia = chip.dataset.hubFamilia;
  estado.gerais.limite = CONFIG_GERAIS.POR_PAGINA;
  atualizarPainelNotificacoes();

});

// ── hub/hoje.js

// Hoje: o que pede ação agora vem primeiro (agenda do dia e reuniões a finalizar, pauta, vencidas, minhas sub-ações); cabe em 1024×768

  AGORA: (hora) => `Agora, ${hora}`, PROXIMA: 'Próxima', MAIS_REUNIOES: (n) => `+${n} no gestor de reuniões`,

// reunião a finalizar: o atalho "Finalizar" (R11) entra ao lado

// atalho para finalizar (R11): só quem criou, só a partir do início; abre o mesmo diálogo do detalhe da reunião

// aba Hoje do painel: o Hoje do cockpit (mesmos cálculos P1–P6, confereRecorte, statusReuniao) em coluna, global (P1 completo,
// sem o filtro de unidade). É estado, não evento: some quando resolvido e não tem lida/não lida.
// o painel tem rolagem própria: os limites não precisam caber em 1024×768
const LIMITES_HOJE_PAINEL = Object.freeze({ A_FINALIZAR: 5, AGENDA: 8, PAUTA: 8, VENCIDAS: 6, SUB_ACOES: 5 });
// agenda do dia em linha do tempo: marca o "agora" e destaca a próxima reunião
function secaoAgendaPainel(doDia) {
  const T = TEXTOS_HOJE;
  const limite = LIMITES_HOJE_PAINEL.AGENDA;
  const pendentes = doDia.filter((r) => Date.parse(r.termino) > Date.parse(AGORA));
  const lista = (doDia.length > limite ? pendentes : doDia).slice(0, limite);
  const resto = doDia.length - lista.length;
  const proxima = doDia.find((r) => Date.parse(r.inicio) > Date.parse(AGORA));
  const agora = `<li class="agenda-agora">${esc(T.AGORA(horarioLocal(AGORA).hora))}</li>`;
  let marcado = false;
  const itens = lista.map((r) => {
    const s = statusReuniao(r);
    const antes = !marcado && Date.parse(r.inicio) > Date.parse(AGORA) ? (marcado = true, agora) : '';
    const ehProxima = r === proxima;
    return `${antes}<li class="${ehProxima ? 'agenda-proxima' : ''}" data-fita="${s}"><button type="button" class="agenda-botao" data-acao="reuniao-abrir" data-id="${r.id}" data-secao="agenda" aria-label="${esc(rotuloEvento(r))}${ehProxima ? `. ${T.PROXIMA}` : ''}">
        <span class="agenda-hora num">${horarioLocal(r.inicio).hora}</span><span class="agenda-titulo">${esc(r.titulo)}</span>
        ${ehProxima ? `<span class="agenda-proxima-rotulo">${esc(T.PROXIMA)}</span>` : ''}<span class="agenda-status">${esc(ROTULOS_STATUS_REUNIAO[s])}</span></button></li>`;
  }).join('') + (lista.length && !marcado ? agora : '');

// ── hub/painel.js
// HUB: alça fixa na borda direita (seta dupla, crachá amarelo de Hoje e marinho de Gerais) e o painel de notificações num

const ABAS_NOTIF = Object.freeze({ HOJE: 'HOJE', GERAIS: 'GERAIS' });

  BOLINHA: Object.freeze({

  }),
  VAZIO: Object.freeze({ HOJE: 'Nada pede ação agora.', GERAIS: 'Nenhuma notificação por aqui.' }),

estado.painelNotif = { aberto: false, aba: ABAS_NOTIF.HOJE }; // a seta abre na última aba usada
let origemPainel = null; // botão da alça que abriu o painel

const ICONES_ALCA = Object.freeze({ ABRIR: 'ph-caret-double-left' });
// Alt+N abre e fecha o HUB de qualquer tela (menos o login), fora de campos de texto e sem outro diálogo aberto
const HUB_ATALHO = Object.freeze({ CODIGO: 'KeyN', TECLAS: 'Alt+N', DICA: (texto) => `${texto} (Alt+N)` });
const textoContagem = (n) => (n > CONFIG_NOTIF.MAX_CONTAGEM ? `${CONFIG_NOTIF.MAX_CONTAGEM}+` : String(n));
function marcarGavetaDoPainel() { gavetaDoPainel = true; }

// a estrutura é montada uma vez; depois só números, atributos e o corpo mudam (o foco não se perde)

function contagensNotificacoes(u) {

function atualizarPainelNotificacoes() {

// saída animada como a da gaveta (fecharDialogo); o painel fecha depois do close, quando a alça já não está inerte
function fecharPainelNotificacoes(opcoes = {}) {

  if (aba) { trocarAbaNotificacoes(aba.dataset.abaNotif); return; }
  // títulos de seção do Hoje levam ao gestor com o recorte: o painel é global, então sem filtro de unidade
  if (evento.target.closest('#painel-notif [data-acao="ir-recorte"]')) estado.filtrosAcoes.unidadeId = '';
});
// itens que abrem a gaveta ou outra tela fecham o painel antes (captura: roda antes do clique global)
elPainel().addEventListener('click', (evento) => {
  const alvo = evento.target instanceof Element ? evento.target.closest('[data-acao="gaveta-abrir"], [data-acao="reuniao-abrir"], a[href]') : null;
  if (!alvo) return;
  if (alvo.matches('[data-acao]')) gavetaDoPainel = true;
  fecharPainelNotificacoes({ devolverFoco: false });
}, true);
elPainel().addEventListener('keydown', (evento) => {
  const aba = evento.target instanceof Element ? evento.target.closest('[role="tab"]') : null;
  if (!aba) return;
  const ordem = Object.values(ABAS_NOTIF);
  const i = ordem.indexOf(aba.dataset.abaNotif);
  const destino = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: ordem.length - 1 }[evento.key];
  if (destino === undefined) return;
  evento.preventDefault();
  trocarAbaNotificacoes(ordem[(destino + ordem.length) % ordem.length]);
});
document.addEventListener('keydown', (evento) => {
  if (evento.key !== 'Escape' || evento.defaultPrevented || !estado.painelNotif.aberto || document.querySelector('dialog[open]')) return;
  // só quando o foco está no painel, na alça ou em lugar nenhum (um popover aberto fora do painel trata o próprio Esc)
  const ativo = document.activeElement;
  if (ativo && ativo !== document.body && !ativo.closest('#painel-notif, #alca-notif')) return;
  evento.preventDefault();
  fecharPainelNotificacoes();
});
document.addEventListener('pointerdown', (evento) => {
  if (!estado.painelNotif.aberto || !(evento.target instanceof Element)) return;
  if (evento.target.closest('#painel-notif, #alca-notif, #menu-status, #confirmacao-status, #popover-calendario, #toast, dialog[open]')) return;
  fecharPainelNotificacoes({ devolverFoco: false });
});
// o <dialog> devolve o foco ao item do painel (já oculto); a gaveta aberta por um item do painel devolve à alça
NBC.ganchos.em('gaveta:fechou', () => { if (gavetaDoPainel) { gavetaDoPainel = false; focarAlca(); } });
// na tela de login não há alça nem painel
window.addEventListener('hashchange', () => {
  if (!location.hash.startsWith(ROTAS.LOGIN)) return;
  fecharPainelNotificacoes({ devolverFoco: false });
  elAlca().hidden = true;
});

const elHub = () => document.getElementById('hub-notif');
elHub().append(elPainel());
elHub().addEventListener('cancel', (evento) => { evento.preventDefault(); fecharPainelNotificacoes(); });
// o fundo (::backdrop) entrega o clique ao próprio <dialog>; o painel ocupa todo o diálogo
elHub().addEventListener('click', (evento) => { if (evento.target === elHub()) fecharPainelNotificacoes(); });

document.addEventListener('keydown', (evento) => {
  if (!evento.altKey || evento.ctrlKey || evento.metaKey || evento.shiftKey || evento.code !== HUB_ATALHO.CODIGO) return;
  if (location.hash.startsWith(ROTAS.LOGIN) || elAlca().hidden) return;
  if (evento.target instanceof Element && evento.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if ([...document.querySelectorAll('dialog[open]')].some((d) => d.id !== 'hub-notif')) return;
  evento.preventDefault();
  if (estado.painelNotif.aberto) fecharPainelNotificacoes();
  else abrirPainelNotificacoes(null, elAlca().querySelector('.alca-seta'));
});
NBC.ganchos.em('shell:atualizado', () => atualizarPainelNotificacoes());

// ── telas/calendario/tela.js
// Calendário: tela própria (Figma "Calendário"), abas Ações e Reuniões
function abaCalendario() {
  return lerQuery().get(QUERY_CALENDARIO.PARAMETRO) === QUERY_CALENDARIO.REUNIOES ? ABA_CALENDARIO.REUNIOES : ABA_CALENDARIO.ACOES;
}
function periodoCalendario() {
  const c = estado.calendario;
  const mes = c.modo === MODO_CALENDARIO.MES;
  const inicio = mes ? inicioDoMes(c.referencia) : segundaDe(c.referencia);
  return { mes, inicio, fim: mes ? ultimoDiaDoMes(c.referencia) : somarDias(inicio, CONFIG.DIAS_POR_SEMANA - 1) };
}

const contextoCalendario = ([titulo, descricao], extra = '') => `<div class="calendario-contexto">
    <p class="calendario-contexto-texto"><span class="calendario-contexto-titulo">${esc(titulo)}</span><span class="legenda">${esc(descricao)}</span></p>${extra}</div>`;
const rodapeCalendario = (grupo, dica) => `<div class="calendario-rodape">${grupo}<span class="legenda dica">${icone('info')}${esc(dica)}</span></div>`;

// pessoas que aparecem nas ações visíveis: nada invisível entra no seletor (filtro por vínculo: pendências B04 e B21)
function opcoesPessoas(visiveis, u) {
  const ids = new Set(visiveis.flatMap((a) => [...a.responsaveis, ...a.pontosFocais].map((r) => r.id)));
  ids.delete(u.id);
  return [[FILTRO_PESSOA.TODAS, ROTULOS_FILTRO.TODAS_PESSOAS], ...[...ids].map(usuarioPorId).sort(porNome).map((p) => [p.id, rotuloPessoa(p)])];
}

// ação só se cria no Gerador (aba do Gestor de ações): o Calendário não tem "Nova ação"
function renderCalendarioTela() {
  const u = usuarioAtual();
  const aba = abaCalendario();
  const { mes, inicio, fim } = periodoCalendario();
  const abas = `<div class="abas" role="group" aria-label="${esc(ROTULOS_CALENDARIO.ABAS)}">${Object.values(ABA_CALENDARIO).map((a) => `<button type="button" class="aba" data-acao="calendario-aba" data-aba="${a}" aria-pressed="${a === aba}">${icone(ICONES_ABA_CALENDARIO[a])}${esc(ROTULOS_ABA_CALENDARIO[a])}</button>`).join('')}</div>`;
  // agendar reunião continua aqui (botão e "+" do dia); criar ação, só no Gerador
  const primario = aba === ABA_CALENDARIO.REUNIOES ? botaoAgendar() : '';
  return cabecalho('Calendário', 'Acompanhe suas ações e reuniões em um só lugar', abas + primario)
    + (aba === ABA_CALENDARIO.REUNIOES ? calendarioReunioes(mes, inicio, fim) : calendarioAcoes(u, mes, inicio, fim));
}

// "Hoje" marcado (aria-pressed) quando o período à vista já contém hoje; na aba Ações, "Exibir por" antes do modo
const barraCalendario = NBC.pontos.definir('calendario.barra', (contagem) => {
  const c = estado.calendario;
  const { mes, inicio, fim } = periodoCalendario();
  const navegar = ROTULOS_CALENDARIO.NAVEGAR[c.modo];
  const contemHoje = HOJE >= inicio && HOJE <= fim;
  const extras = abaCalendario() === ABA_CALENDARIO.ACOES ? grupoExibirPor() : '';
  const modos = Object.values(MODO_CALENDARIO).map((m) => `<button type="button" class="aba" data-acao="calendario-modo" data-modo="${m}" aria-pressed="${m === c.modo}">${esc(ROTULOS_MODO_CALENDARIO[m])}</button>`).join('');
  return `<div class="card-cabecalho calendario-barra">
      <div class="calendario-nav">
        <span class="botoes-unidos">
          <button type="button" class="btn btn-secundario btn-icone" data-acao="calendario-navegar" data-passo="-1" aria-label="${esc(navegar.ANTERIOR)}" title="${esc(navegar.ANTERIOR)}">${icone('esquerda')}</button>
          <button type="button" class="btn btn-secundario btn-icone" data-acao="calendario-navegar" data-passo="1" aria-label="${esc(navegar.PROXIMO)}" title="${esc(navegar.PROXIMO)}">${icone('direita')}</button>
        </span>
        <button type="button" class="btn btn-secundario" data-acao="calendario-hoje" aria-pressed="${contemHoje}">${esc(ROTULOS_CALENDARIO.HOJE)}</button>
        <h2 class="card-titulo calendario-periodo" id="calendario-periodo" tabindex="-1" aria-live="polite">${esc(mes ? formatarMesExtenso(inicio) : formatarSemana(inicio))}</h2>
      </div>
      <div class="agrupar">
        <span class="legenda" aria-live="polite">${esc(contagem)}</span>
        ${extras}<div class="abas" role="group" aria-label="${esc(ROTULOS_CALENDARIO.MODO)}">${modos}</div>
      </div>
    </div>`;
});

// aba Ações: Período (faixas pelo mês de conclusão) ou Vencimento (itens no dia do prazo); na Semana, com o guia de semanas
const calendarioAcoes = NBC.pontos.definir('calendario.acoes', (u, mes, inicio, fim) => {
  const vencimento = exibindoVencimento();
  const html = vencimento ? calendarioAcoesVencimento(u, mes, inicio, fim) : calendarioAcoesPeriodo(u, mes, inicio, fim);
  return mes ? html : comGuia(html, vencimento ? contagemVencimentosGuia(u) : null);
});

NBC.telas.registrar('calendario', {

  abas: () => Object.values(ABA_CALENDARIO).map((x) => ({ chave: x, href: ROTA_ABA_CALENDARIO[x], rotulo: ROTULOS_ABA_CALENDARIO[x], icone: ICONES_ABA_CALENDARIO[x], ativo: x === abaCalendario(), extra: '' })),
});

// ── telas/calendario/periodo.js
// aba Ações por período: faixas pelo mês de conclusão (sem arraste: mudar o mês seria editar a ação)
// E, depois cada O seguida das suas S; grupos por estratégica (porMesEId); só as ações da lista
function ordenarHierarquia(lista) {
  const ids = new Set(lista.map((a) => a.id));
  const resultado = [];
  const percorrer = (a) => { if (ids.has(a.id)) resultado.push(a); filhasDe(a.id).forEach(percorrer); };
  [...new Set(lista.map(estrategicaDe))].sort(porMesEId).forEach(percorrer);
  return resultado;
}

// atributos comuns: abre a gaveta; cor pelo status (Vencida usa danger, Lei 9)
// uma ação por linha (grid-row fixo), para a ordem hierárquica não se misturar
const atributosFaixa = (a, chave, linha, colunaInicio, colunaFim, extraRotulo = '') => `type="button" data-acao="gaveta-abrir" data-id="${a.id}" data-faixa="${a.id}-${chave}" data-status="${a.status}" ${estaVencida(a) ? 'data-vencida' : ''}
  style="grid-row:${linha}; grid-column:${colunaInicio} / ${colunaFim + 1}" title="${esc(a.descricao)}" aria-label="${esc(rotuloFaixa(a) + extraRotulo)}"`;
// "Vencida" é selo à parte (Lei 9), nunca parte do rótulo de status
const statusFaixa = (a) => `${badgeVencida(a)}<span class="faixa-status">${esc(ROTULOS_STATUS_ACAO[a.status])}</span>`;

// colunas da grade são 1-based; dias é a lista ISO da semana
const colunaDe = (dias, iso) => dias.indexOf(iso) + 1;

// número do dia; fora do mês, com o mês abreviado ("28 set.")
function numeroDia(iso, foraDoMes) {
  if (foraDoMes) return `<span class="dia-numero num">${diaDoMes(iso)}</span><span class="dia-fora-mes">${MESES_ABREV[Number(iso.split('-')[1]) - 1]}.</span>`;
  return `<span class="dia-numero num">${diaDoMes(iso)}</span>${iso === HOJE ? `<span class="hoje-legenda">${esc(ROTULOS_CALENDARIO.HOJE)}</span>` : ''}`;
}
function diaFundo(iso, foraDoMes, comNumero) {
  return `<div class="dia" ${ehFimDeSemana(iso) ? 'data-fim-de-semana' : ''} ${foraDoMes ? 'data-fora' : ''} ${iso === HOJE && !foraDoMes ? 'data-hoje' : ''}>${comNumero ? numeroDia(iso, foraDoMes) : ''}</div>`;
}

function calendarioAcoesPeriodo(u, mes, inicio, fim) {
  const c = estado.calendario;
  const visiveis = acoes.filter((a) => podeVer(a, u));
  const opcoes = opcoesPessoas(visiveis, u);
  if (c.pessoa && !opcoes.some(([v]) => String(v) === c.pessoa)) c.pessoa = FILTRO_PESSOA.EU; // troca de usuário
  const alvo = c.pessoa === FILTRO_PESSOA.TODAS ? null : c.pessoa === FILTRO_PESSOA.EU ? u : usuarioPorId(Number(c.pessoa));
  const noPeriodo = ordenarHierarquia(visiveis.filter((a) => {
    if (!c.tipos.has(a.tipo) || (alvo && !temVinculo(a, alvo))) return false;
    const intervalo = intervaloDaAcao(a);
    return intervalo.inicio <= fim && intervalo.fim >= inicio;
  }));
  const contexto = alvo === null ? MENSAGENS.CONTEXTO_CALENDARIO.TODAS
    : alvo === u ? MENSAGENS.CONTEXTO_CALENDARIO.EU : MENSAGENS.CONTEXTO_CALENDARIO.PESSOA(alvo.username);
  const tipos = Object.values(TIPO_ACAO).map((t) => `<label class="check"><input type="checkbox" data-tipo-calendario="${t}" ${c.tipos.has(t) ? 'checked' : ''}>${badgeTipo(t)}</label>`).join('');
  const grupoTipos = `<div class="legenda-tipos" role="group" aria-labelledby="rotulo-tipos"><span class="rotulo" id="rotulo-tipos">${esc(ROTULOS_CALENDARIO.TIPOS)}</span>${tipos}</div>`;
  return contextoCalendario(contexto, seletor('calendario.pessoa', ROTULOS_FILTRO.PESSOA, c.pessoa, opcoes, MENSAGENS.VOCE(u.username)))
    + `<section class="card" aria-labelledby="calendario-periodo">
      ${barraCalendario(MENSAGENS.ACOES_NO_PERIODO[c.modo](noPeriodo.length))}
      <div class="calendario-grade ${estado.calendarioTrocado ? 'trocando' : ''}">${mes ? renderMes(noPeriodo, inicio, fim) : renderSemana(noPeriodo, inicio)}</div>
      ${rodapePeriodo(grupoTipos)}
    </section>`;
}
// rodapé do Período: os tipos e a dica
const rodapePeriodo = NBC.pontos.definir('calendario.periodo.rodape', (grupoTipos) => rodapeCalendario(grupoTipos, MENSAGENS.SELECIONE_ACAO));

const renderMes = NBC.pontos.definir('calendario.mes', (lista, inicio, fim) => {
  const cabecalho = DIAS_SEMANA_ABREV.map((d, i) => `<div class="dia-titulo" ${i >= CONFIG.DIAS_POR_SEMANA - 2 ? 'data-fim-de-semana' : ''}>${esc(d)}</div>`).join('');
  const semanas = [];
  for (let segunda = segundaDe(inicio); segunda <= fim; segunda = somarDias(segunda, CONFIG.DIAS_POR_SEMANA)) {
    const dias = diasDaSemana(segunda);
    const doMes = dias.filter((d) => d >= inicio && d <= fim);
    const [ini, ult] = [colunaDe(dias, doMes[0]), colunaDe(dias, doMes[doMes.length - 1])];
    const visiveis = lista.slice(0, CONFIG.MAX_FAIXAS_SEMANA_MES);
    const resto = lista.length - visiveis.length;
    const faixas = visiveis.map((a, i) => `<button class="faixa" ${atributosFaixa(a, segunda, i + 1, ini, ult)}>${badgeTipo(a.tipo)}<span class="faixa-desc">${esc(a.descricao)}</span>${statusFaixa(a)}</button>`).join('')
      + (resto > 0 ? `<button type="button" class="link-botao legenda faixa-mais" data-acao="calendario-ver-semana" data-semana="${doMes[0]}" style="grid-row:${visiveis.length + 1}; grid-column:${ini} / ${ult + 1}" aria-label="${esc(MENSAGENS.VER_SEMANA(resto, formatarSemana(segunda)))}">${esc(MENSAGENS.MAIS_FAIXAS(resto))}</button>` : '');
    semanas.push(`<div class="semana-mes">
        <div class="dias-fundo" aria-hidden="true">${dias.map((d) => diaFundo(d, d < inicio || d > fim, true)).join('')}</div>
        <div class="faixas">${faixas}</div>
      </div>`);
  }
  return `<div class="dias-cabecalho" aria-hidden="true">${cabecalho}</div>${semanas.join('')}`;
});
const renderSemana = NBC.pontos.definir('calendario.semana', (lista, segunda) => {
  const u = usuarioAtual();
  const dias = diasDaSemana(segunda);
  const domingo = dias[dias.length - 1];
  const cabecalho = dias.map((d) => `<div class="dia-titulo" ${ehFimDeSemana(d) ? 'data-fim-de-semana' : ''} ${d === HOJE ? 'data-hoje' : ''}>${esc(formatarDiaCurto(d))}${d === HOJE ? `<span class="hoje-legenda">${esc(ROTULOS_CALENDARIO.HOJE)}</span>` : ''}</div>`).join('');
  const faixas = lista.map((a, i) => {
    const { inicio, fim } = intervaloDaAcao(a);
    const antes = inicio < segunda;
    const depois = fim > domingo;
    const ini = colunaDe(dias, antes ? segunda : inicio);
    const ult = colunaDe(dias, depois ? domingo : fim);
    const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
    const extra = (antes ? `. ${MENSAGENS.CONTINUA_ANTES}` : '') + (depois ? `. ${MENSAGENS.CONTINUA_DEPOIS}` : '');
    return `<button class="faixa faixa-semana" ${atributosFaixa(a, segunda, i + 1, ini, ult, extra)}>
        <span class="faixa-linha">
          ${antes ? `<span class="faixa-continua" aria-hidden="true">${ROTULOS_CALENDARIO.CONTINUA_ANTES}</span>` : ''}
          <span class="badges">${badgeTipo(a.tipo)}${badgePrioridade(a.prioridade)}</span>
          ${depois ? `<span class="faixa-continua" aria-hidden="true">${ROTULOS_CALENDARIO.CONTINUA_DEPOIS}</span>` : ''}
        </span>
        <span class="faixa-titulo">${esc(a.descricao)}</span>
        ${pai && podeVer(pai, u) ? `<span class="legenda cartao-pai">${PREFIXO_PAI} ${esc(pai.descricao)}</span>` : ''}
        <span class="faixa-linha">${iniciaisResponsaveis(a.responsaveis)}${a.tipo === E ? barraProgresso(progresso(a)) : ''}${statusFaixa(a)}</span>
      </button>`;
  }).join('');
  return `<div class="semana-quadro">
      <div class="dias-cabecalho">${cabecalho}</div>
      <div class="semana-corpo">
        <div class="dias-fundo" aria-hidden="true">${dias.map((d) => diaFundo(d, false, false)).join('')}</div>
        <div class="faixas">${faixas}</div>
      </div>
    </div>`;
});
const rotuloFaixa = NBC.pontos.definir('calendario.rotuloFaixa', (a) => {
  return MENSAGENS.FAIXA(a.descricao, ROTULOS_TIPO[a.tipo], ROTULOS_STATUS_ACAO[a.status], formatarPrazo(a), estaVencida(a));
});

// ── telas/calendario/reunioes.js
function rotuloEvento(r) {
  const l = horarioLocal(r.inicio);
  return MENSAGENS.EVENTO(r.titulo, `${formatarDiaCurto(l.data)}, ${formatarHorario(r)}`, ROTULOS_STATUS_REUNIAO[statusReuniao(r)]);
}
const statusEvento = (r) => `<span class="evento-status">${esc(ROTULOS_STATUS_REUNIAO[statusReuniao(r)])}</span>`;
// texto do title nativo das reuniões no calendário ('' = sem title)
const dicaNativaReuniao = NBC.pontos.definir('calendario.reunioes.dicaNativa', (r) => r.titulo);
const atributoTitle = (r) => { const t = dicaNativaReuniao(r); return t ? ` title="${esc(t)}"` : ''; };
const eventoMes = (r) => `<button type="button" class="evento" data-acao="reuniao-abrir" data-id="${r.id}" data-status="${statusReuniao(r)}"${atributoTitle(r)} aria-label="${esc(rotuloEvento(r))}">
    <span class="evento-hora num">${horarioLocal(r.inicio).hora}</span><span class="evento-titulo">${esc(r.titulo)}</span>${statusEvento(r)}</button>`;

function renderMesReunioes(lista, inicio, fim) {
  const porDia = new Map();
  lista.forEach((r) => { const d = horarioLocal(r.inicio).data; porDia.set(d, [...(porDia.get(d) || []), r]); });
  const cabecalho = DIAS_SEMANA_ABREV.map((d, i) => `<div class="dia-titulo" ${i >= CONFIG.DIAS_POR_SEMANA - 2 ? 'data-fim-de-semana' : ''}>${esc(d)}</div>`).join('');
  const ultimoDomingo = somarDias(segundaDe(fim), CONFIG.DIAS_POR_SEMANA - 1);
  const celulas = [];
  for (let dia = segundaDe(inicio); dia <= ultimoDomingo; dia = somarDias(dia, 1)) {
    const fora = dia < inicio || dia > fim;
    const eventos = fora ? [] : (porDia.get(dia) || []);
    const mostrados = eventos.slice(0, CONFIG.MAX_REUNIOES_DIA_MES);
    const resto = eventos.length - mostrados.length;
    const agendar = !fora && dia >= HOJE && pode(OPERACAO.CRIAR_REUNIAO)
      ? `<button type="button" class="dia-agendar" data-acao="reuniao-nova" data-data="${dia}" aria-label="${esc(MENSAGENS.AGENDAR_EM(formatarData(dia)))}" title="${esc(MENSAGENS.AGENDAR_EM(formatarData(dia)))}">${icone('mais')}</button>` : '';
    celulas.push(`<div class="dia-reunioes" ${ehFimDeSemana(dia) ? 'data-fim-de-semana' : ''} ${fora ? 'data-fora' : ''} ${dia === HOJE && !fora ? 'data-hoje' : ''}>
        <div class="dia-topo"><span>${numeroDia(dia, fora)}</span>${agendar}</div>
        ${mostrados.map(eventoMes).join('')}
        ${resto > 0 ? `<button type="button" class="link-botao legenda faixa-mais" data-acao="calendario-ver-semana" data-semana="${dia}" aria-label="${esc(MENSAGENS.VER_SEMANA(resto, formatarSemana(segundaDe(dia))))}">${esc(MENSAGENS.MAIS_FAIXAS(resto))}</button>` : ''}
      </div>`);
  }
  return `<div class="dias-cabecalho" aria-hidden="true">${cabecalho}</div><div class="mes-reunioes">${celulas.join('')}</div>`;
}

// reuniões que se sobrepõem no mesmo dia dividem a largura da coluna (faixa = posição, faixas = total do grupo)
function distribuirFaixas(eventos) {
  const saida = [];
  let grupo = [];
  let fins = [];
  let fimGrupo = '';
  const fechar = () => { grupo.forEach((g) => saida.push({ ...g, faixas: fins.length })); grupo = []; fins = []; };
  eventos.forEach((x) => {
    if (grupo.length && x.r.inicio >= fimGrupo) fechar();
    let faixa = fins.findIndex((fim) => fim <= x.r.inicio);
    if (faixa === -1) { faixa = fins.length; fins.push(x.r.termino); } else fins[faixa] = x.r.termino;
    fimGrupo = grupo.length === 0 || x.r.termino > fimGrupo ? x.r.termino : fimGrupo;
    grupo.push({ x, faixa });
  });
  if (grupo.length) fechar();
  return saida;
}

// conteúdo do bloco na grade de horas: x = { r, ini, minutosFim }; até 30 min, só a hora de início
const conteudoBloco = NBC.pontos.definir('calendario.reunioes.bloco', (x) => `<span class="evento-linha"><span class="evento-hora num">${x.minutosFim - x.ini.minutos <= CONFIG.MINUTOS_POR_HORA / 2 ? x.ini.hora : formatarHorario(x.r)}</span>${statusEvento(x.r)}</span><span class="evento-bloco-titulo">${esc(x.r.titulo)}</span><span class="evento-local">${esc(x.r.localOuLink.replace(PADRAO_LINK, ''))}</span>`);

function renderSemanaReunioes(lista, segunda) {
  const dias = diasDaSemana(segunda);
  const H = CONFIG.MINUTOS_POR_HORA;
  const locais = lista.map((r) => {
    const ini = horarioLocal(r.inicio);
    const fim = horarioLocal(r.termino);
    // termina depois da meia-noite: a grade vai até o fim do dia
    return { r, ini, minutosFim: fim.data > ini.data ? CONFIG.HORAS_POR_DIA * H : fim.minutos };
  });
  const horaInicio = Math.min(CONFIG.HORA_INICIO_GRADE, ...locais.map((x) => Math.floor(x.ini.minutos / H)));
  const horaFim = Math.max(CONFIG.HORA_FIM_GRADE, ...locais.map((x) => Math.ceil(x.minutosFim / H)));
  const horas = Array.from({ length: horaFim - horaInicio }, (_, i) => horaInicio + i);
  const cabecalho = '<div class="dia-titulo" aria-hidden="true"></div>' + dias.map((d) => `<div class="dia-titulo" ${ehFimDeSemana(d) ? 'data-fim-de-semana' : ''} ${d === HOJE ? 'data-hoje' : ''}>${esc(formatarDiaCurto(d))}${d === HOJE ? `<span class="hoje-legenda">${esc(ROTULOS_CALENDARIO.HOJE)}</span>` : ''}</div>`).join('');
  const colunas = dias.map((d) => {
    const doDia = locais.filter((x) => x.ini.data === d);
    const blocos = distribuirFaixas(doDia).map(({ x, faixa, faixas }) => `<button type="button" class="evento-bloco" data-acao="reuniao-abrir" data-id="${x.r.id}" data-status="${statusReuniao(x.r)}"
        ${x.minutosFim - x.ini.minutos <= H / 2 ? 'data-curto' : ''} style="--inicio:${x.ini.minutos / H - horaInicio}; --duracao:${(x.minutosFim - x.ini.minutos) / H}; --faixa:${faixa}; --faixas:${faixas}"${atributoTitle(x.r)} aria-label="${esc(rotuloEvento(x.r))}">
        ${conteudoBloco(x)}</button>`).join('');
    const agora = d === HOJE ? `<span class="agora-linha" style="--inicio:${horarioLocal(AGORA).minutos / H - horaInicio}" aria-hidden="true"></span>` : '';
    return `<div class="agenda-dia" ${ehFimDeSemana(d) ? 'data-fim-de-semana' : ''}>${agora}${blocos}</div>`;
  }).join('');
  return `<div class="agenda-semana">
      <div class="agenda-cabecalho">${cabecalho}</div>
      <div class="agenda-corpo" style="--horas:${horas.length}">
        <div class="agenda-horas" aria-hidden="true">${horas.map((h) => `<span class="hora-rotulo num">${horaCheia(h)}</span>`).join('')}</div>
        ${colunas}
      </div>
    </div>`;
}

// ── telas/calendario/vencimento.js

const EXIBIR_POR = Object.freeze({ PERIODO: 'PERIODO', VENCIMENTO: 'VENCIMENTO' });
const TEXTOS_VENCIMENTO = Object.freeze({

  }),
  MAIS: (n, data) => (n === 1 ? `+1: mais 1 ação que vence em ${data}` : `+${n}: mais ${n} ações que vencem em ${data}`),

// ordem dentro do dia: o que pede ação primeiro; Concluído por último. Empate: prioridade e descrição
const ORDEM_STATUS_VENCIMENTO = Object.freeze([ST.EM_RISCO, ST.EM_ANDAMENTO, ST.NAO_INICIADO, ST.CONCLUIDO]);
const ORDEM_PRIORIDADE_VENCIMENTO = Object.freeze([P.PAUTA_SEMANA, P.CURTO_PRAZO, P.MEDIO_PRAZO, P.LONGO_PRAZO]);
estado.calendario.exibirPor = EXIBIR_POR.PERIODO; // padrão aprovado: o comportamento de sempre

  || ORDEM_PRIORIDADE_VENCIMENTO.indexOf(a.prioridade) - ORDEM_PRIORIDADE_VENCIMENTO.indexOf(b.prioridade)
  || a.descricao.localeCompare(b.descricao, 'pt-BR') || a.id - b.id;

// o mesmo recorte da aba Ações (P1, Pessoa e Tipos), sem o período
function acoesDoCalendario(u) {
  const c = estado.calendario;
  const visiveis = acoes.filter((a) => podeVer(a, u));
  const opcoes = opcoesPessoas(visiveis, u);
  if (c.pessoa && !opcoes.some(([v]) => String(v) === c.pessoa)) c.pessoa = FILTRO_PESSOA.EU; // troca de usuário
  const alvo = c.pessoa === FILTRO_PESSOA.TODAS ? null : c.pessoa === FILTRO_PESSOA.EU ? u : usuarioPorId(Number(c.pessoa));
  return { opcoes, alvo, lista: visiveis.filter((a) => c.tipos.has(a.tipo) && (!alvo || temVinculo(a, alvo))) };
}
// índice dia → ações (O(n) por desenho), já na ordem do dia
function vencimentosPorDia(lista, inicio, fim) {
  const porDia = new Map();
  lista.forEach((a) => {
    const dia = prazoDaAcao(a);
    if (dia < inicio || dia > fim) return;
    if (!porDia.has(dia)) porDia.set(dia, []);
    porDia.get(dia).push(a);
  });
  porDia.forEach((l) => l.sort(porVencimento));
  return porDia;
}

      <span class="vencimento-titulo">${badgeTipo(a.tipo, { compacto: true })}<span class="vencimento-desc">${esc(a.descricao)}</span>${duasLinhas ? '' : `${badgeVencida(a)}${glifo}`}</span>${segunda}</button></li>`;

const contagemDia = (n) => (n ? `<span class="dia-contagem num" title="${esc(TEXTOS_VENCIMENTO.DIA(n))}"><span aria-hidden="true">${n}</span><span class="sr-only">${esc(TEXTOS_VENCIMENTO.DIA(n))}</span></span>` : '');

function renderMesVencimento(lista, inicio, fim) {
  const T = TEXTOS_VENCIMENTO;
  const limite = CONFIG_VENCIMENTO.LIMITE_MES;
  const porDia = vencimentosPorDia(lista, inicio, fim);
  const cabecalho = DIAS_SEMANA_ABREV.map((d, i) => `<div class="dia-titulo" ${i >= CONFIG.DIAS_POR_SEMANA - 2 ? 'data-fim-de-semana' : ''}>${esc(d)}</div>`).join('');
  const ultimoDomingo = somarDias(segundaDe(fim), CONFIG.DIAS_POR_SEMANA - 1);
  const celulas = [];
  for (let dia = segundaDe(inicio); dia <= ultimoDomingo; dia = somarDias(dia, 1)) {
    const fora = dia < inicio || dia > fim;
    const doDia = fora ? [] : (porDia.get(dia) || []);
    const mostrados = doDia.slice(0, limite); // desempenho: só o que cabe vai para o DOM
    const resto = doDia.length - mostrados.length;
    celulas.push(`<div class="dia-reunioes dia-vencimentos" ${ehFimDeSemana(dia) ? 'data-fim-de-semana' : ''} ${fora ? 'data-fora' : ''} ${dia === HOJE && !fora ? 'data-hoje' : ''}>

        ${mostrados.length ? `<ul class="vencimentos">${mostrados.map((a) => itemVencimento(a)).join('')}</ul>` : ''}
        ${resto > 0 ? `<button type="button" class="link-botao legenda faixa-mais vencimento-mais" data-vencimento-dia="${dia}" aria-haspopup="dialog" aria-expanded="false" aria-controls="popover-vencimento" aria-label="${esc(T.MAIS(resto, diaMes(dia)))}">${esc(T.MAIS_CURTO(resto))}</button>` : ''}

// barra mínima por status no cabeçalho do dia (role="img" com as contagens por extenso)
function barraDoDia(lista) {

// ── telas/calendario/guia.js
// guia de navegação rápida na visão Semana (Ações e Reuniões), como o mini calendário do Teams: mês com setas, iniciais dos dias,
// semana exibida em faixa, hoje em círculo cheio. Clicar num dia leva a grade para a semana dele. Recolhível; aberto a partir de
// 1280px. Pontos de intensidade no Vencimento (1–2, 3–9, 10+) e um ponto nos dias com reunião; o número vai no rótulo
const TEXTOS_GUIA = Object.freeze({
  ROTULO: 'Guia de semanas', ABRIR: 'Abrir o guia de semanas', RECOLHER: 'Recolher o guia de semanas',
  MES_ANTERIOR: 'Mês anterior no guia', MES_SEGUINTE: 'Próximo mês no guia',
  INICIAIS: Object.freeze(['S', 'T', 'Q', 'Q', 'S', 'S', 'D']),
  DIA: (dia, mes) => `${dia} de ${mes}`,
  IR: (intervalo) => `Ir para a semana de ${intervalo}`,
  VENCIMENTOS: (n) => (n === 1 ? '1 vencimento' : `${n} vencimentos`),
  REUNIOES: (n) => (n === 1 ? '1 reunião' : `${n} reuniões`),
  EXIBIDA: 'semana exibida', HOJE: 'hoje',
});
const CONFIG_GUIA = Object.freeze({ LARGURA_ABERTO: 1280, NIVEL_MEDIO: 3, NIVEL_ALTO: 10 });
const ICONES_GUIA = Object.freeze({ ABRIR: 'ph-calendar-blank', RECOLHER: 'ph-caret-double-left' });
estado.calendario.guia = { aberto: null, mes: null, referencia: null }; // aberto: null até a primeira visão Semana
// "12 a 18 de outubro", "28 de setembro a 4 de outubro" ou, na virada do ano, com os dois anos
function intervaloExtenso(segunda) {
  const domingo = somarDias(segunda, CONFIG.DIAS_POR_SEMANA - 1);
  const [a1, m1] = segunda.split('-').map(Number);
  const [a2, m2] = domingo.split('-').map(Number);
  const fim = `${diaDoMes(domingo)} de ${MESES_NOME[m2 - 1]}`;
  if (a1 !== a2) return `${diaDoMes(segunda)} de ${MESES_NOME[m1 - 1]} de ${a1} a ${fim} de ${a2}`;
  if (m1 !== m2) return `${diaDoMes(segunda)} de ${MESES_NOME[m1 - 1]} a ${fim}`;
  return `${diaDoMes(segunda)} a ${fim}`;
}
const nivelGuia = (n) => (n >= CONFIG_GUIA.NIVEL_ALTO ? 3 : n >= CONFIG_GUIA.NIVEL_MEDIO ? 2 : n > 0 ? 1 : 0);
// contagens: { tipo: 'vencimentos' | 'reunioes', porDia: Map } ou null (sem pontos)
function guiaSemanal(contagens) {
  const T = TEXTOS_GUIA;
  const c = estado.calendario;
  const g = c.guia;
  if (g.aberto === null) g.aberto = window.innerWidth >= CONFIG_GUIA.LARGURA_ABERTO;
  // a navegação da grade (setas, Hoje, "+N") leva o guia junto; as setas do guia só mudam o guia
  if (g.referencia !== c.referencia) { g.mes = inicioDoMes(c.referencia); g.referencia = c.referencia; }
  const [ano, mes] = g.mes.split('-').map(Number);
  if (!g.aberto) {
    return `<div class="guia-semanal guia-recolhido" role="group" aria-label="${esc(T.ROTULO)}"><button type="button" class="guia-alternar" data-guia="abrir" aria-expanded="false" aria-label="${esc(T.ABRIR)}" title="${esc(T.ABRIR)}">
        <i class="ph ${ICONES_GUIA.ABRIR}" aria-hidden="true"></i><span class="guia-mes-abrev" aria-hidden="true">${esc(MESES_ABREV[mes - 1])}</span></button></div>`;
  }
  const exibida = segundaDe(c.referencia);
  const primeira = segundaDe(g.mes);
  const fimMes = ultimoDiaDoMes(g.mes);
  const ultimoDomingo = somarDias(segundaDe(fimMes), CONFIG.DIAS_POR_SEMANA - 1);
  const foco = c.referencia >= primeira && c.referencia <= ultimoDomingo ? c.referencia : g.mes; // roving tabindex
  const semanas = [];
  for (let seg = primeira; seg <= fimMes; seg = somarDias(seg, CONFIG.DIAS_POR_SEMANA)) {
    const ehExibida = seg === exibida;
    const dias = diasDaSemana(seg).map((d) => {
      const n = contagens ? (contagens.porDia.get(d) || 0) : 0;
      const partes = [T.DIA(diaDoMes(d), MESES_NOME[Number(d.split('-')[1]) - 1])];
      if (n) partes.push(contagens.tipo === 'reunioes' ? T.REUNIOES(n) : T.VENCIMENTOS(n));
      if (d === HOJE) partes.push(T.HOJE);
      if (ehExibida) partes.push(T.EXIBIDA);
      const rotulo = `${partes.join(', ')}. ${T.IR(intervaloExtenso(seg))}`;
      const nivel = contagens ? (contagens.tipo === 'reunioes' ? (n ? 1 : 0) : nivelGuia(n)) : 0;
      return `<button type="button" class="guia-dia" data-guia-dia="${d}" tabindex="${d === foco ? 0 : -1}" ${d.slice(0, 7) !== g.mes.slice(0, 7) ? 'data-fora' : ''} ${d === HOJE ? 'aria-current="date"' : ''} aria-label="${esc(rotulo)}"><span class="guia-dia-numero num" aria-hidden="true">${diaDoMes(d)}</span>${nivel ? `<span class="guia-ponto" data-nivel="${nivel}" aria-hidden="true"></span>` : ''}</button>`;
    }).join('');
    semanas.push(`<div class="guia-semana" ${ehExibida ? 'data-exibida' : ''}>${dias}</div>`);
  }
  return `<div class="guia-semanal" role="group" aria-label="${esc(T.ROTULO)}">
      <div class="guia-topo">
        <button type="button" class="btn-quadrado" data-guia="mes" data-passo="-1" aria-label="${esc(T.MES_ANTERIOR)}" title="${esc(T.MES_ANTERIOR)}">${icone('esquerda')}</button>
        <span class="guia-mes" aria-live="polite">${esc(`${MESES_NOME[mes - 1]} ${ano}`)}</span>
        <button type="button" class="btn-quadrado" data-guia="mes" data-passo="1" aria-label="${esc(T.MES_SEGUINTE)}" title="${esc(T.MES_SEGUINTE)}">${icone('direita')}</button>
        <button type="button" class="btn-quadrado guia-recolher" data-guia="recolher" aria-expanded="true" aria-label="${esc(T.RECOLHER)}" title="${esc(T.RECOLHER)}"><i class="ph ${ICONES_GUIA.RECOLHER}" aria-hidden="true"></i></button>
      </div>
      <div class="guia-iniciais" aria-hidden="true">${T.INICIAIS.map((x) => `<span>${x}</span>`).join('')}</div>
      <div class="guia-grade">${semanas.join('')}</div>
    </div>`;
}
// o guia entra à esquerda da grade, num contêiner de duas colunas (a grade e o rodapé não mudam)
// ponto: o guia em si (uma mudança pode trocar por outro componente com a mesma entrada)
const guiaCalendario = NBC.pontos.definir('calendario.guia', (contagens) => guiaSemanal(contagens));
const comGuia = (html, contagens) => (!html.includes('<div class="calendario-grade') || !html.includes('<div class="calendario-rodape">') ? html : html
  .replace('<div class="calendario-grade', `<div class="calendario-com-guia">${guiaCalendario(contagens)}<div class="calendario-grade`)
  .replace('<div class="calendario-rodape">', '</div><div class="calendario-rodape">'));
function contagemVencimentosGuia(u) {
  const porDia = new Map();
  acoesDoCalendario(u).lista.forEach((a) => { const d = prazoDaAcao(a); porDia.set(d, (porDia.get(d) || 0) + 1); });
  return { tipo: 'vencimentos', porDia };
}
function contagemReunioesGuia() {
  const f = estado.filtrosCalendarioReunioes || { status: '', prioridade: '' };
  const porDia = new Map();
  reunioes.filter((r) => pode(OPERACAO.VER_REUNIAO, r) && (!f.status || statusReuniao(r) === f.status) && (!f.prioridade || r.prioridade === f.prioridade))
    .forEach((r) => { const d = horarioLocal(r.inicio).data; porDia.set(d, (porDia.get(d) || 0) + 1); });
  return { tipo: 'reunioes', porDia };
}
function focarDiaGuia(dia) {
  const alvo = document.querySelector(`.guia-dia[data-guia-dia="${dia}"]`);
  if (!alvo) return false;
  document.querySelectorAll('.guia-dia[tabindex="0"]').forEach((b) => { b.tabIndex = -1; });
  alvo.tabIndex = 0;
  alvo.focus({ preventScroll: true });
  return true;
}
document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const g = estado.calendario.guia;
  const dia = evento.target.closest('[data-guia-dia]');
  if (dia) {
    estado.calendario.referencia = dia.dataset.guiaDia;
    g.referencia = estado.calendario.referencia; // o guia fica no mês que estava à vista
    estado.calendarioTrocado = true;
    render();
    focarDiaGuia(dia.dataset.guiaDia);
    return;
  }
  const controle = evento.target.closest('[data-guia]');
  if (!controle) return;
  const acao = controle.dataset.guia;
  if (acao === 'mes') g.mes = somarMeses(g.mes, Number(controle.dataset.passo));
  else g.aberto = acao === 'abrir';
  render();
  if (acao === 'mes') { const [ano, m] = g.mes.split('-').map(Number); anunciar(`${MESES_NOME[m - 1]} ${ano}`); }
  const foco = acao === 'mes' ? `[data-guia="mes"][data-passo="${controle.dataset.passo}"]` : acao === 'abrir' ? '[data-guia="recolher"]' : '[data-guia="abrir"]';
  document.querySelector(foco)?.focus({ preventScroll: true });
});
// setas movem o foco entre os dias (±1 e ±7), Home e End vão ao início e ao fim da semana; fora do mês à vista, o guia muda de mês
document.addEventListener('keydown', (evento) => {
  const dia = evento.target instanceof Element ? evento.target.closest('.guia-dia') : null;
  if (!dia) return;
  const atual = dia.dataset.guiaDia;
  const i = indiceDiaSemana(atual);
  const passo = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -CONFIG.DIAS_POR_SEMANA, ArrowDown: CONFIG.DIAS_POR_SEMANA, Home: -i, End: CONFIG.DIAS_POR_SEMANA - 1 - i }[evento.key];
  if (passo === undefined) return;
  evento.preventDefault();
  const destino = somarDias(atual, passo);
  if (focarDiaGuia(destino)) return;
  estado.calendario.guia.mes = inicioDoMes(destino);
  render();
  focarDiaGuia(destino);
});

const TEXTOS_SEMANA = Object.freeze({

function pontasSemana(segunda) {

  const dia = (iso) => `${diaDoMes(iso)} ${MESES_ABREV[Number(iso.split('-')[1]) - 1]}${comAno ? ` ${ano(iso)}` : ''}`;

}
const etiquetaSemana = (segunda) => (segunda === SEGUNDA_DE_HOJE ? TEXTOS_SEMANA.ESTA : segunda === SEGUNDA_SEGUINTE ? TEXTOS_SEMANA.PROXIMA : '');
