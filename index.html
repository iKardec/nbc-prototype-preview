const PALETAS = Object.freeze([Object.freeze({ nome: "aero", rotulo: "Aero" }), Object.freeze({ nome: "cobalto", rotulo: "Cobalto" }), Object.freeze({ nome: "ambar", rotulo: "Âmbar" }), Object.freeze({ nome: "petroleo", rotulo: "Petróleo" })]);

// ── nucleo/extensoes.js
// Pontos de extensão (D4): cada mudança futura é um módulo em mudancas/ que usa estas APIs, nunca redeclara função.
// - NBC.telas: cada tela se registra no roteador (render e, se houver, as abas da sub-barra).
// - NBC.ganchos: eventos; os ouvintes rodam na ordem do manifesto.
// - NBC.pontos: comportamento substituível; definir devolve a função que as telas chamam, então substituir vale em todo lugar.
// - NBC.componentes: peças compartilhadas entre telas (NBC.componentes.<nome>), registradas uma vez e só para leitura.
const NBC = (() => {
  const telas = new Map();
  const ganchos = new Map();
  const pontos = new Map();
  const componentes = {};
  Object.defineProperty(componentes, 'registrar', {
    value(nome, api) {
      if (Object.hasOwn(componentes, nome)) { console.error(`NBC.componentes.registrar: o componente "${nome}" já existe`); return; }
      Object.defineProperty(componentes, nome, { value: Object.freeze(api), enumerable: true });
    },
  });
  return Object.freeze({
    componentes,
    telas: Object.freeze({
      registrar(rota, { render, abas = null }) { telas.set(rota, Object.freeze({ render, abas })); },
      obter: (rota) => telas.get(rota) || null,
    }),
    ganchos: Object.freeze({
      em(nome, fn) { if (!ganchos.has(nome)) ganchos.set(nome, []); ganchos.get(nome).push(fn); },
      emitir(nome, ctx) { (ganchos.get(nome) || []).forEach((fn) => fn(ctx)); },
    }),
    pontos: Object.freeze({
      definir(nome, fn) {
        if (pontos.has(nome)) console.error(`NBC.pontos.definir: o ponto "${nome}" já existe`);
        pontos.set(nome, fn);
        return (...args) => pontos.get(nome)(...args);
      },
      // só em mudancas/ (a montagem recusa no código base); fn recebe a função anterior como último argumento
      substituir(nome, fn) {
        if (!pontos.has(nome)) { console.error(`NBC.pontos.substituir: o ponto "${nome}" não existe`); return; }
        const anterior = pontos.get(nome);
        pontos.set(nome, (...args) => fn(...args, anterior));
      },
      nomes: () => [...pontos.keys()],
    }),
  });
})();

const usuarioAtual = () => USUARIOS.find((u) => u.id === estado.usuarioId);
const usuarioPorId = (id) => USUARIOS.find((u) => u.id === id);

const porMesEId = (a, b) => a.mesConclusaoEstimado.localeCompare(b.mesConclusaoEstimado) || a.id - b.id;
const porInicio = (a, b) => a.inicio.localeCompare(b.inicio) || a.id - b.id;
const porNome = (a, b) => a.username.localeCompare(b.username, 'pt-BR');
const filhasDe = (id) => acoes.filter((a) => a.acaoPaiId === id).sort(porMesEId);
function estrategicaDe(a) {
  let atual = a;
  while (atual.acaoPaiId !== null) atual = acaoPorId(atual.acaoPaiId);

}

// ── nucleo/datas.js
function ultimoDiaDoMes(dataIso) {
  const [ano, mes] = dataIso.split('-').map(Number);
  const dia = new Date(Date.UTC(ano, mes, 0)).getUTCDate();
  return `${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}
const FIM_DO_MES_CORRENTE = ultimoDiaDoMes(HOJE);

// datas do calendário em UTC sobre 'YYYY-MM-DD' (sem fuso no meio)
const TAMANHO_DATA_ISO = 'YYYY-MM-DD'.length;
const TAMANHO_MES_ISO = 'YYYY-MM'.length;
const paraData = (iso) => new Date(`${iso}T00:00:00Z`);
const paraIso = (data) => data.toISOString().slice(0, TAMANHO_DATA_ISO);
const inicioDoMes = (iso) => `${iso.slice(0, TAMANHO_MES_ISO)}-01`;
function somarDias(iso, dias) { const d = paraData(iso); d.setUTCDate(d.getUTCDate() + dias); return paraIso(d); }
function somarMeses(iso, meses) { const d = paraData(inicioDoMes(iso)); d.setUTCMonth(d.getUTCMonth() + meses); return paraIso(d); }
// getUTCDay: 0 = domingo; aqui 0 = segunda
const indiceDiaSemana = (iso) => (paraData(iso).getUTCDay() + CONFIG.DIAS_POR_SEMANA - 1) % CONFIG.DIAS_POR_SEMANA;
const segundaDe = (iso) => somarDias(iso, -indiceDiaSemana(iso));
const diasDaSemana = (segunda) => Array.from({ length: CONFIG.DIAS_POR_SEMANA }, (_, i) => somarDias(segunda, i));
const ehFimDeSemana = (iso) => indiceDiaSemana(iso) >= CONFIG.DIAS_POR_SEMANA - 2; // sábado e domingo
// a ação ocupa o mês inteiro de conclusão: do dia 1 ao último dia
const intervaloDaAcao = (a) => ({ inicio: inicioDoMes(a.mesConclusaoEstimado), fim: ultimoDiaDoMes(a.mesConclusaoEstimado) });

// Reuniões: a API guarda UTC; a interface mostra America/Sao_Paulo sem depender do fuso do navegador
const POSICAO_HORA_ISO = 'YYYY-MM-DDT'.length;
const TAMANHO_DATA_HORA_ISO = 'YYYY-MM-DDTHH:MM'.length;
function horarioLocal(isoUtc) {
  const d = new Date(Date.parse(isoUtc) + FUSO_MINUTOS * CONFIG.MS_POR_MINUTO);
  const iso = d.toISOString();
  return { data: iso.slice(0, TAMANHO_DATA_ISO), hora: iso.slice(POSICAO_HORA_ISO, TAMANHO_DATA_HORA_ISO), minutos: d.getUTCHours() * CONFIG.MINUTOS_POR_HORA + d.getUTCMinutes() };
}
const paraUtc = (data, hora) => new Date(Date.parse(`${data}T${hora}:00Z`) - FUSO_MINUTOS * CONFIG.MS_POR_MINUTO).toISOString().replace(/\.\d+Z$/, 'Z');
const horaCheia = (h) => `${String(h).padStart(2, '0')}:00`;
const duracaoMinutos = (r) => (Date.parse(r.termino) - Date.parse(r.inicio)) / CONFIG.MS_POR_MINUTO;
const iniciou = (r) => Date.parse(r.inicio) <= Date.parse(AGORA);

const formatarMesExtenso = (iso) => { const [ano, mes] = iso.split('-'); return `${MESES_NOME[Number(mes) - 1]} de ${ano}`; };
const diaDoMes = (iso) => Number(iso.split('-')[2]);
function formatarSemana(segunda) {
  const domingo = somarDias(segunda, CONFIG.DIAS_POR_SEMANA - 1);
  const [a1, m1] = segunda.split('-').map(Number);
  const [a2, m2] = domingo.split('-').map(Number);
  const fim = `${diaDoMes(domingo)} ${MESES_ABREV[m2 - 1]} ${a2}`;
  if (a1 !== a2) return `${diaDoMes(segunda)} ${MESES_ABREV[m1 - 1]} ${a1} – ${fim}`;
  if (m1 !== m2) return `${diaDoMes(segunda)} ${MESES_ABREV[m1 - 1]} – ${fim}`;
  return `${diaDoMes(segunda)} – ${fim}`;
}
const formatarDiaCurto = (iso) => { const [, mes, dia] = iso.split('-'); return `${DIAS_SEMANA_ABREV[indiceDiaSemana(iso)]} ${dia}/${mes}`; };

// ── nucleo/rbac.js
// função única de permissão: a matriz de docs/DOMAIN.md (a UI não substitui a regra do backend)
const temVinculo = (a, u) => a.responsaveis.some((r) => r.id === u.id) || a.pontosFocais.some((r) => r.id === u.id);
function todosVinculadosAfastados(a) {
  const ids = [...a.responsaveis, ...a.pontosFocais].map((r) => r.id);
  return ids.every((id) => usuarioPorId(id).status === STATUS_USUARIO.AFASTADO);
}
function podeVer(a, u) {
  if (a.tipo === S) return temVinculo(a, u) && !todosVinculadosAfastados(a);
  if (u.role === PAPEL.ADMINISTRADOR) return true;
  if (a.tipo === E) {
    return temVinculo(a, u) || filhasDe(a.id).some((o) => temVinculo(o, u) || filhasDe(o.id).some((s) => podeVer(s, u)));
  }
  return temVinculo(a, u) || temVinculo(acaoPorId(a.acaoPaiId), u) || filhasDe(a.id).some((s) => podeVer(s, u));
}

function pode(operacao, alvo) {
  const u = usuarioAtual();
  const admin = u.role === PAPEL.ADMINISTRADOR;
  switch (operacao) {
    case OPERACAO.VER: return podeVer(alvo, u);
    case OPERACAO.EDITAR:
    case OPERACAO.EXCLUIR: return podeVer(alvo, u) && (alvo.tipo === S ? temVinculo(alvo, u) : admin);
    case OPERACAO.MUDAR_STATUS: return podeVer(alvo, u) && (alvo.tipo === S ? temVinculo(alvo, u) : admin || temVinculo(alvo, u));
    case OPERACAO.CRIAR_ESTRATEGICA: return admin;
    case OPERACAO.CRIAR_OPERACIONAL: return admin && alvo.tipo === E;
    case OPERACAO.CRIAR_SUB_ACAO: return alvo.tipo === O && podeVer(alvo, u) && (admin || temVinculo(alvo, u));
    case OPERACAO.VER_USUARIOS: return admin;
    // Reuniões (R9): o papel não muda nada; o Administrador não tem visão extra
    case OPERACAO.VER_REUNIAO: return vinculoReuniao(alvo, u);
    case OPERACAO.CRIAR_REUNIAO: return true;
    case OPERACAO.EDITAR_REUNIAO:
    case OPERACAO.EXCLUIR_REUNIAO: return criadorPodeAgir(alvo, u) && !(alvo.historico && alvo.historico.possuiAta);
    case OPERACAO.GERENCIAR_ANEXOS:
    case OPERACAO.MARCAR_PRESENCA:
    case OPERACAO.FINALIZAR_REUNIAO: return criadorPodeAgir(alvo, u);
    default: return false;
  }
}

// vínculo com a reunião = ser o criador ou um participante
const vinculoReuniao = (r, u) => r.criadoPor.id === u.id || r.participantes.some((p) => p.id === u.id);
// R9 e R11: só o criador, só enquanto ele estiver ATIVO e só antes da finalização
const criadorPodeAgir = (r, u) => r.criadoPor.id === u.id && usuarioPorId(r.criadoPor.id).status === STATUS_USUARIO.ATIVO && !r.finalizadaEm;

// ── dominio/prazo.js
// Lei 9, com a data por dia (proposta D1): vencida = prazo antes de hoje e status diferente de Concluído; quem vence hoje não está vencida
const estaVencida = (a) => prazoDaAcao(a) < HOJE && a.status !== ST.CONCLUIDO;

// PROPOSTA D1 (data de conclusão por dia) e D2 (data efetiva de conclusão), só no mock: a API de hoje só tem o mês (B31, B32).
// prazoDaAcao é a única fonte do prazo: a data por dia ou, sem ela, o último dia do mês (regra de migração da D1)
const TEXTOS_PRAZO = Object.freeze({ CAMPO: 'Data de conclusão', COLUNA: 'Prazo', COLUNA_FILHAS: 'Conclusão' });
function prazoDaAcao(a) {
  return a.dataConclusaoEstimada || ultimoDiaDoMes(a.mesConclusaoEstimado);
}
// dd/mm no ano corrente e dd/mm/aaaa nos outros; sem data por dia, o mês de sempre
function formatarPrazo(a) {
  if (!a.dataConclusaoEstimada) return formatarMes(a.mesConclusaoEstimado);
  const [ano, mes, dia] = a.dataConclusaoEstimada.split('-');
  return ano === HOJE.slice(0, 4) ? `${dia}/${mes}` : `${dia}/${mes}/${ano}`;
}
// D2: concluidaEm é gravado quando a ação entra em Concluído e apagado quando sai (menu, Kanban, gaveta, desfazer e Gerador).
// Roda antes de cada desenho, então toda tela já vê o dado coerente
function sincronizarConclusao() {
  acoes.forEach((a) => {
    if (a.status === ST.CONCLUIDO && !a.concluidaEm) a.concluidaEm = AGORA;
    else if (a.status !== ST.CONCLUIDO && a.concluidaEm) a.concluidaEm = null;
  });
}
NBC.ganchos.em('render:antes', sincronizarConclusao);

// ── dominio/progresso.js
// Lei 7: sobre todas as O da E, visíveis ou não; S não contam
function progresso(estrategica) {
  const operacionais = filhasDe(estrategica.id);
  if (operacionais.length === 0) return 0;
  return operacionais.filter((o) => o.status === ST.CONCLUIDO).length / operacionais.length;
}

// PROPOSTA D3, opção A (B33): progresso da Operacional = Sub-Ações concluídas ÷ todas as Sub-Ações da O, visíveis ou não,
// como a Lei 7 faz na Estratégica. Sem Sub-Ação devolve null (a tela mostra "—", não 0%). A tela mostra só o percentual
function progressoDaOperacional(o) {
  const subAcoes = filhasDe(o.id);
  if (subAcoes.length === 0) return null;
  return subAcoes.filter((s) => s.status === ST.CONCLUIDO).length / subAcoes.length;
}

// ── dominio/reunioes.js
// Lei R4 (derivado): sem finalização automática; terminou e não foi finalizada = aguardando finalização
function statusReuniao(r) {
  if (r.finalizadaEm) return STATUS_REUNIAO.FINALIZADA;
  if (Date.parse(r.termino) <= Date.parse(AGORA)) return STATUS_REUNIAO.AGUARDANDO_FINALIZACAO;
  if (horarioLocal(r.inicio).data === HOJE) return STATUS_REUNIAO.HOJE;
  return STATUS_REUNIAO.AGENDADA;
}

// R10 e R11: presença e finalização só a partir do início (a API responde 409 antes disso)
function motivoBloqueioReuniao(r) {
  if (iniciou(r)) return '';
  const l = horarioLocal(r.inicio);
  return MENSAGENS.ANTES_DO_INICIO(`${formatarDiaCurto(l.data)}, ${l.hora}`);
}
// por que a reunião está em leitura para o usuário atual ('' quando ele pode agir); T08 e gaveta usam a mesma regra
function motivoLeituraReuniao(r) {
  if (r.finalizadaEm) return MENSAGENS.FINALIZADA_LEITURA(formatarQuando(r.finalizadaEm));
  if (criadorPodeAgir(r, usuarioAtual())) return '';
  // o status do criador só aparece para quem lista usuários (Administrador); para os demais vale a regra do criador
  if (statusVisivel(r.criadoPor.id) !== STATUS_USUARIO.ATIVO) return MENSAGENS.CRIADOR_INATIVO;
  return MENSAGENS.SO_CRIADOR(r.criadoPor.username);
}

// ── dominio/exclusao.js
// Lei 11: bloqueios de exclusão (contam todas as O, independentemente de visibilidade)
function motivoBloqueioExclusao(a) {
  if (a.tipo === E && filhasDe(a.id).length > 1) return MENSAGENS.EXCLUIR_E_COM_OPERACIONAIS;
  if (a.tipo === O && filhasDe(a.acaoPaiId).length === 1) return MENSAGENS.EXCLUIR_ULTIMA_O;
  return '';
}

// Leis 10 e 11: exclusão física com cascata, independente de visibilidade
function excluirEmCascata(id) {
  const a = acaoPorId(id);
  const ids = new Set([id]);
  let cresceu = true;
  while (cresceu) {
    cresceu = false;
    for (const x of acoes) {
      if (x.acaoPaiId !== null && ids.has(x.acaoPaiId) && !ids.has(x.id)) { ids.add(x.id); cresceu = true; }
    }
  }
  acoes = acoes.filter((x) => !ids.has(x.id));
  toast(MENSAGENS.ACAO_EXCLUIDA);
  const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
  irPara(pai && pode(OPERACAO.VER, pai) ? `#/acoes/${pai.id}` : ROTAS.ACOES);
}

// ── dominio/painel.js
// Leis P1–P6 do painel
function indicadores(lista) {
  const porStatus = Object.fromEntries(Object.values(STATUS_ACAO).map((s) => [s, 0]));
  const porPrioridade = Object.fromEntries(Object.values(PRIORIDADE_ACAO).map((p) => [p, 0]));
  const porUnidade = new Map();
  const porMes = new Map();
  for (const a of lista) {
    porStatus[a.status] += 1;
    porPrioridade[a.prioridade] += 1;
    porUnidade.set(a.unidadeId, (porUnidade.get(a.unidadeId) || 0) + 1);
    const mes = a.mesConclusaoEstimado.slice(0, 7);
    porMes.set(mes, (porMes.get(mes) || 0) + 1);
  }
  return {
    total: lista.length, porStatus, porPrioridade, porUnidade, porMes,
    vencidas: lista.filter(estaVencida).length,
    vencemEsteMes: lista.filter((a) => a.mesConclusaoEstimado === FIM_DO_MES_CORRENTE && a.status !== ST.CONCLUIDO).length,
  };
}

const restringeUnidade = (unidadeId) => (a) => !unidadeId || a.unidadeId === Number(unidadeId);

// recortes do cockpit (Leis P2–P4 e Lei 9), reaplicados no gestor de ações
function confereRecorte(a, recorte, u) {
  switch (recorte) {
    case RECORTE.VENCIDAS: return a.tipo !== S && estaVencida(a);
    case RECORTE.VENCEM_MES: return a.tipo !== S && a.mesConclusaoEstimado === FIM_DO_MES_CORRENTE && a.status !== ST.CONCLUIDO;
    case RECORTE.PAUTA: return a.tipo !== S && a.prioridade === P.PAUTA_SEMANA && a.status !== ST.CONCLUIDO;
    case RECORTE.EM_RISCO: return a.tipo !== S && a.status === ST.EM_RISCO;
    case RECORTE.MINHAS_SUB_ACOES: return a.tipo === S && temVinculo(a, u) && a.status !== ST.CONCLUIDO;
    default: return true;
  }

function seletorDeFoco(el) {
  if (!el || el === document.body) return null;
  const partes = ATRIBUTOS_FOCO.filter((a) => el.hasAttribute(a)).map((a) => `[${a}="${el.getAttribute(a)}"]`);
  // rádios e caixas do mesmo grupo têm o mesmo name: o value desempata
  if ((el.type === 'radio' || el.type === 'checkbox') && el.hasAttribute('value')) partes.push(`[value="${el.getAttribute('value')}"]`);
  return partes.length ? partes.join('') : null;
}

// query do hash (#/acoes?visao=kanban)
function lerQuery() {
  const i = location.hash.indexOf('?');
  return new URLSearchParams(i === -1 ? '' : location.hash.slice(i + 1));
}

// re-renderiza um contêiner devolvendo o foco (e a posição do cursor, em campos de texto)
function trocarConteudo(conteiner, html) {
  const ativo = conteiner.contains(document.activeElement) ? document.activeElement : null;
  const foco = seletorDeFoco(ativo);
  const cursor = ativo && typeof ativo.selectionStart === 'number' ? [ativo.selectionStart, ativo.selectionEnd] : null;
  conteiner.innerHTML = html;
  if (!foco) return;
  const alvo = conteiner.querySelector(foco);
  if (!alvo || alvo.disabled) return;
  alvo.focus({ preventScroll: true });
  if (cursor && alvo.setSelectionRange) alvo.setSelectionRange(cursor[0], cursor[1]);
}

// render: ganchos render:antes (concluidaEm, eventos do feed, painel do dia) e o desenho da rota.
// A troca de hash chama só desenharRota (no exp-06 o ouvinte guardava o render de antes dos envoltórios; mantido)
function render() {
  NBC.ganchos.emitir('render:antes');
  desenharRota();
}

function desenharRota() {
  const app = document.getElementById('app');
  const hash = location.hash;
  const [caminho] = hash.replace(/^#\//, '').split('?');
  const [base, id] = caminho.split('/');
  // a visão Calendário da v5 (#/acoes?visao=calendario) virou a tela Calendário
  if (base === 'acoes' && id === undefined && lerQuery().get(QUERY_VISAO.PARAMETRO) === QUERY_VISAO.CALENDARIO) { location.replace(ROTAS.CALENDARIO); return; }
  // o Kanban virou a visão principal: #/acoes?visao=kanban (v4–v6) volta para #/acoes
  if (base === 'acoes' && id === undefined && lerQuery().get(QUERY_VISAO.PARAMETRO) === QUERY_VISAO.KANBAN) { location.replace(ROTAS.ACOES); return; }
  const rotaMudou = hash !== estado.rotaRenderizada;
  estado.rotaRenderizada = hash;
  if (rotaMudou) { fecharGaveta(); estado.errosAnexos = null; } // a gaveta e os erros de envio pertencem à tela
  // "Nova operacional" e "Nova sub-ação" (T05) chegam ao Gerador com tipo e pai: o formulário recomeça
  if (rotaMudou && base === 'acoes' && lerQuery().has(QUERY_ACOES.TIPO)) estado.formAcao = null;
  if (base === 'login') { app.innerHTML = renderLogin(); return; }
  if (!document.getElementById('conteudo')) { app.innerHTML = renderShell(); NBC.ganchos.emitir('shell:montado'); }
  atualizarShell(base);

  const conteudo = document.getElementById('conteudo');
  conteudo.classList.remove('entrando'); // animação de entrada só na troca de rota
  trocarConteudo(conteudo, renderTela(base, id));
  if (rotaMudou) {
    void conteudo.offsetWidth; // reinicia a animação
    conteudo.classList.add('entrando');
    window.scrollTo(0, 0);
    NBC.ganchos.emitir('rota:entrou', { base, id });
  }
  atualizarGaveta();
  estado.recemExpandido = null;
  estado.recemMovido = null;
  estado.calendarioTrocado = false;
}

function irPara(destino) {
  if (location.hash === destino) render(); else location.hash = destino;
}

// o toast não recebe foco ao aparecer; o tempo pausa enquanto ele está sob o mouse ou com foco
let timerToast;
let duracaoToast = CONFIG.DURACAO_TOAST_MS;
const elToast = () => document.getElementById('toast');
function esconderToast() {
  clearTimeout(timerToast);
  elToast().classList.remove('visivel');
  estado.ultimaMudanca = null; // fim da janela do "Desfazer"
}
function agendarFimToast() {
  clearTimeout(timerToast);
  timerToast = setTimeout(esconderToast, duracaoToast);
}
// ação opcional do toast: "Desfazer" (mudança de status) ou "Abrir" (reunião recém-agendada)
function toast(mensagem, tipo = 'sucesso', { desfazer = false, abrirReuniaoId = null, abrirAcaoId = null } = {}) {
  const el = elToast();
  const botao = el.querySelector('.toast-acao');
  document.getElementById('toast-texto').textContent = mensagem;
  botao.hidden = !desfazer && abrirReuniaoId === null && abrirAcaoId === null;
  if (abrirAcaoId !== null) { botao.dataset.acao = 'toast-abrir-acao'; botao.dataset.id = String(abrirAcaoId); botao.textContent = MENSAGENS.VER_NO_QUADRO; }
  if (desfazer) { botao.dataset.acao = 'desfazer'; botao.textContent = MENSAGENS.DESFAZER; }
  if (abrirReuniaoId !== null) { botao.dataset.acao = 'toast-abrir-reuniao'; botao.dataset.id = String(abrirReuniaoId); botao.textContent = MENSAGENS.ABRIR; }
  if (!desfazer) estado.ultimaMudanca = null;
  el.dataset.tipo = tipo;
  el.classList.add('visivel');
  duracaoToast = botao.hidden ? CONFIG.DURACAO_TOAST_MS : CONFIG.DURACAO_DESFAZER_MS;
  agendarFimToast();
}

function anunciar(mensagem) {
  const el = document.getElementById('anuncio');
  el.textContent = '';
  requestAnimationFrame(() => { el.textContent = mensagem; });
}

const toastEl = elToast();
toastEl.addEventListener('mouseenter', () => clearTimeout(timerToast));
toastEl.addEventListener('focusin', () => clearTimeout(timerToast));
toastEl.addEventListener('mouseleave', () => { if (toastEl.classList.contains('visivel') && !toastEl.contains(document.activeElement)) agendarFimToast(); });
toastEl.addEventListener('focusout', (evento) => { if (toastEl.classList.contains('visivel') && !toastEl.contains(evento.relatedTarget) && !toastEl.matches(':hover')) agendarFimToast(); });

    : '';

  botao.className = `btn ${perigo ? 'btn-perigo' : 'btn-primario'}`;
  aoConfirmarDialogo = aoConfirmar;

}
function enviarDialogo(form) {
  const campo = form.querySelector('[name="observacao"]');
  if (campo && campo.value.length > LIMITES.OBSERVACAO_FINALIZACAO) { // sem trim; mantém o texto
    const erro = document.getElementById('erro-observacao');
    erro.textContent = MENSAGENS.LIMITE_TEXTO_LONGO;
    erro.hidden = false;
    campo.setAttribute('aria-invalid', 'true');
    campo.setAttribute('aria-describedby', 'erro-observacao');
    campo.focus();
    return;
  }
  const acao = aoConfirmarDialogo;
  const valor = campo ? campo.value : '';
  aoConfirmarDialogo = null;
  fecharDialogo(document.getElementById('dialogo'), () => { if (acao) acao(valor); });
}
function cancelarDialogo() {
  aoConfirmarDialogo = null;
  fecharDialogo(document.getElementById('dialogo'));
}

function fecharDialogo(dialogo, depois) {
  let terminou = false;
  const fim = () => {
    if (terminou) return;
    terminou = true;
    dialogo.removeEventListener('animationend', aoTerminar);
    dialogo.classList.remove('fechando'); dialogo.close(); if (depois) depois();
  };
  function aoTerminar(evento) { if (evento.target === dialogo && !evento.pseudoElement) fim(); } // ignora animações internas e do fundo
  dialogo.classList.add('fechando');
  const estilo = getComputedStyle(dialogo);
  if (estilo.animationName === 'none') { fim(); return; }
  dialogo.addEventListener('animationend', aoTerminar);
  setTimeout(fim, parseFloat(estilo.animationDuration) * CONFIG.MS_POR_SEGUNDO * CONFIG.FATOR_SALVAGUARDA_ANIMACAO); // salvaguarda se o animationend não vier
}

// ── nucleo/gaveta.js
let origemGaveta = null; // seletor do controle que abriu a gaveta, para devolver o foco
// a gaveta só mostra o que o usuário atual ainda pode ver (ou editar, no formulário)
function alvoGavetaValido(g) {
  if (!g) return false;
  if (g.tipo === TIPO_GAVETA.ACAO) { const a = acaoPorId(g.id); return Boolean(a) && pode(OPERACAO.VER, a); }
  if (g.tipo === TIPO_GAVETA.REUNIAO) { const r = reuniaoPorId(g.id); return Boolean(r) && pode(OPERACAO.VER_REUNIAO, r); }
  if (g.tipo === TIPO_GAVETA.USUARIO) return pode(OPERACAO.VER_USUARIOS) && Boolean(estado.formUsuario) && (g.id === null || Boolean(usuarioPorId(g.id)));
  if (!estado.formReuniao) return false;
  if (g.id === null) return pode(OPERACAO.CRIAR_REUNIAO);
  const r = reuniaoPorId(g.id);
  return Boolean(r) && pode(OPERACAO.EDITAR_REUNIAO, r);
}
function conteudoGaveta(g) {
  if (g.tipo === TIPO_GAVETA.ACAO) return renderGavetaAcao(acaoPorId(g.id));
  if (g.tipo === TIPO_GAVETA.REUNIAO) return renderGavetaReuniao(reuniaoPorId(g.id));
  if (g.tipo === TIPO_GAVETA.USUARIO) return renderGavetaUsuario();
  return renderFormReuniao();
}

function abrirGaveta(tipo, id, origem) {
  const alvo = { tipo, id };
  if (!alvoGavetaValido(alvo)) return;
  const gaveta = document.getElementById('gaveta');
  if (!gaveta.open) {
    origemGaveta = seletorDeFoco(origem);
    gaveta.append(elToast()); // fora do modal o toast ficaria inerte
    gaveta.showModal();
  }
  estado.gaveta = alvo;
  trocarConteudo(document.getElementById('gaveta-corpo'), conteudoGaveta(alvo));
  gaveta.scrollTop = 0;
  document.getElementById('gaveta-titulo').focus();
}

function atualizarGaveta() {
  const gaveta = document.getElementById('gaveta');
  if (!gaveta.open || gaveta.classList.contains('fechando')) return;
  // fecha se o item deixou de ser visível (troca de usuário, exclusão, finalização) ou a tela saiu do estado normal
  if (!alvoGavetaValido(estado.gaveta) || estado.estadoTela !== ESTADO_TELA.NORMAL) { fecharGaveta(); return; }
  if (estado.gaveta.tipo === TIPO_GAVETA.FORM_REUNIAO || estado.gaveta.tipo === TIPO_GAVETA.USUARIO) return; // não apaga o que foi digitado
  trocarConteudo(document.getElementById('gaveta-corpo'), conteudoGaveta(estado.gaveta));
}

function fecharGaveta() {
  const gaveta = document.getElementById('gaveta');
  if (!gaveta.open || gaveta.classList.contains('fechando')) return;
  // o gancho gaveta:fechou devolve o foco a quem abriu pela alça do HUB ou pelo "+N" do Calendário
  fecharDialogo(gaveta, () => { aoFecharGaveta(); NBC.ganchos.emitir('gaveta:fechou'); });
}

// também é chamada pelo evento close (Esc forçado pelo navegador), sem o gancho; roda uma vez por abertura
function aoFecharGaveta() {
  if (estado.gaveta === null) return;
  estado.gaveta = null;
  estado.formReuniao = null;
  estado.formUsuario = null;
  document.body.append(elToast());

// ── nucleo/flutuante.js
// menus e popovers ancorados: abaixo do controle (acima, se não couber) e sempre dentro da janela;
// com a gaveta (<dialog> modal) aberta, o elemento entra nela, senão ficaria inerte (como o toast)
const flutuantesAbertos = new Map(); // elemento → controle de origem, para acompanhar a rolagem
function posicionarFlutuante(el, ancora) {
  const conteiner = ancora.closest('dialog[open]') || document.body;
  if (el.parentElement !== conteiner) conteiner.append(el);
  el.hidden = false;
  flutuantesAbertos.set(el, ancora);
  const r = ancora.getBoundingClientRect();
  const margem = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--space-2')) || 0;
  const largura = el.offsetWidth;
  const altura = el.offsetHeight;
  const topo = r.bottom + margem + altura <= window.innerHeight ? r.bottom + margem / 2 : Math.max(margem, r.top - margem / 2 - altura);
  const esquerda = Math.max(margem, Math.min(r.left, window.innerWidth - largura - margem));
  el.style.top = `${Math.round(topo)}px`;
  el.style.left = `${Math.round(esquerda)}px`;
}
// rolar ou redimensionar a janela leva junto o que está aberto
function reposicionarFlutuantes() {
  flutuantesAbertos.forEach((ancora, el) => {
    if (el.hidden || !ancora.isConnected) { flutuantesAbertos.delete(el); return; }
    posicionarFlutuante(el, ancora);
  });
}
window.addEventListener('scroll', reposicionarFlutuantes, { capture: true, passive: true });
window.addEventListener('resize', reposicionarFlutuantes);
// clique fora do elemento aberto (o controle que o abriu não conta)
const cliqueFora = (evento, el, seletorAncora = '') => !el.hidden && !el.contains(evento.target) && !(seletorAncora && evento.target.closest(seletorAncora));

document.addEventListener('click', (evento) => {
  const alvo = evento.target.closest('[data-acao]');
  if (!alvo) return;
  switch (alvo.dataset.acao) {
    case 'expandir': {
      const id = Number(alvo.dataset.id);
      if (estado.expandidos.has(id)) estado.expandidos.delete(id);
      else { estado.expandidos.add(id); estado.recemExpandido = id; }
      render();
      break;
    }
    // o recorte segue pelo href; aqui o gestor recebe a unidade do cockpit e perde os filtros antigos
    case 'ir-recorte': Object.assign(estado.filtrosAcoes, FILTROS_INICIAIS.filtrosAcoes, { unidadeId: estado.filtrosPainel.unidadeId }); break;
    case 'limpar-filtros': {
      const grupo = alvo.dataset.grupo;
      clearTimeout(timerBusca);
      Object.assign(estado[grupo], FILTROS_INICIAIS[grupo]);
      render();
      const primeiro = document.querySelector(`[data-filtro^="${grupo}."]`);
      if (primeiro) primeiro.focus(); // o botão fica desabilitado
      break;
    }
    case 'usuario-novo':
      estado.formUsuario = { id: null, valores: { username: '', email: '', senha: '', role: PAPEL.COLABORADOR }, erros: {} };
      abrirGaveta(TIPO_GAVETA.USUARIO, null, alvo);
      break;
    case 'usuario-abrir': {
      const x = usuarioPorId(Number(alvo.dataset.id));
      if (!x) break;
      estado.formUsuario = formUsuarioDe(x);
      abrirGaveta(TIPO_GAVETA.USUARIO, x.id, alvo);
      break;
    }
    case 'toast-abrir-acao': {
      const id = Number(alvo.dataset.id);
      esconderToast();
      if (location.hash !== ROTAS.ACOES) location.hash = ROTAS.ACOES;
      estado.recemMovido = id;
      render();
      abrirGaveta(TIPO_GAVETA.ACAO, id, document.querySelector(`#conteudo [data-cartao="${id}"]`));
      break;
    }
    case 'agrupar': estado.agrupamentoKanban = alvo.dataset.agrupamento; render(); break;
    case 'calendario-navegar': {
      const c = estado.calendario;
      const passo = Number(alvo.dataset.passo);
      c.referencia = c.modo === MODO_CALENDARIO.MES ? somarMeses(c.referencia, passo) : somarDias(c.referencia, passo * CONFIG.DIAS_POR_SEMANA);
      estado.calendarioTrocado = true;
      render();
      break;
    }
    case 'calendario-hoje': estado.calendario.referencia = HOJE; estado.calendarioTrocado = true; render(); break;
    case 'calendario-modo': estado.calendario.modo = alvo.dataset.modo; estado.calendarioTrocado = true; render(); break;
    case 'calendario-ver-semana':
      Object.assign(estado.calendario, { modo: MODO_CALENDARIO.SEMANA, referencia: alvo.dataset.semana });
      estado.calendarioTrocado = true;
      render();
      document.getElementById('calendario-periodo').focus(); // o "+N mais" some: o foco vai para o título do período
      break;
    case 'recolher-raia': {
      const id = Number(alvo.dataset.id);
      if (estado.raiasRecolhidas.has(id)) estado.raiasRecolhidas.delete(id); else estado.raiasRecolhidas.add(id);
      render();
      break;
    }
    case 'calendario-aba': irPara(ROTA_ABA_CALENDARIO[alvo.dataset.aba]); break;
    case 'gaveta-abrir': abrirGaveta(TIPO_GAVETA.ACAO, Number(alvo.dataset.id), alvo); break;
    case 'reuniao-abrir': abrirGaveta(TIPO_GAVETA.REUNIAO, Number(alvo.dataset.id), alvo); break;
    case 'gaveta-fechar': fecharGaveta(); break;
    case 'reuniao-nova': abrirFormReuniao(null, alvo.dataset.data || '', alvo); break;
    case 'reuniao-editar': abrirFormReuniao(Number(alvo.dataset.id), '', alvo); break;
    case 'reuniao-excluir': pedirExclusaoReuniao(Number(alvo.dataset.id)); break;
    case 'reuniao-finalizar': pedirFinalizacao(Number(alvo.dataset.id)); break;
    case 'anexo-baixar': toast(MENSAGENS.DOWNLOAD_SIMULADO); break;
    case 'anexo-excluir': pedirExclusaoAnexo(Number(alvo.dataset.reuniao), Number(alvo.dataset.id)); break;
    case 'toast-abrir-reuniao': esconderToast(); irPara(`#/reunioes/${alvo.dataset.id}`); break;
    case 'desfazer': desfazerMudanca(); break;
    case 'em-breve': toast(MENSAGENS.EM_BREVE); break;
    case 'excluir': pedirExclusaoAcao(Number(alvo.dataset.id)); break;
    case 'dialogo-cancelar': cancelarDialogo(); break;
    case 'tentar-de-novo': estado.estadoTela = ESTADO_TELA.NORMAL; render(); break;
    case 'sair': irPara(ROTAS.LOGIN); break;
    default: break;
  }
});

document.addEventListener('change', (evento) => {
  const alvo = evento.target;
  if (alvo.matches('[data-campo="usuario"]')) { esconderToast(); estado.usuarioId = Number(alvo.value); render(); return; } // encerra o "Desfazer" do usuário anterior
  if (alvo.matches('[data-campo="estado-tela"]')) { estado.estadoTela = alvo.value; render(); return; }
  if (alvo.matches('[data-tipo-calendario]')) {
    const tipos = estado.calendario.tipos;
    if (alvo.checked) tipos.add(alvo.dataset.tipoCalendario); else tipos.delete(alvo.dataset.tipoCalendario);
    render();
    return;
  }
  if (alvo.matches('[data-anexos]')) { adicionarAnexos(Number(alvo.dataset.anexos), [...alvo.files]); return; }
  // Gerador: trocar o tipo redesenha o formulário mantendo o que já foi digitado
  if (alvo.matches('[data-form="acao"] [name="tipo"]') && estado.formAcao) {
    estado.formAcao = { valores: { ...lerFormAcao(alvo.form), tipo: alvo.value, paiId: '' }, erros: {} };
    render();
    return;
  }
  if (alvo.matches('[data-filtro]') && alvo.type !== 'search') { // a busca é tratada no evento input
    const [grupo, chave] = alvo.dataset.filtro.split('.');
    estado[grupo][chave] = alvo.value;
    render();
    return;
  }
  if (alvo.matches('[data-status-acao]')) mudarStatus(Number(alvo.dataset.statusAcao), alvo.value);
});

let timerBusca;
document.addEventListener('input', (evento) => {
  const alvo = evento.target;
  if (alvo.matches('input[type="search"][data-filtro]')) {
    const [grupo, chave] = alvo.dataset.filtro.split('.');
    const valor = alvo.value;
    clearTimeout(timerBusca);
    timerBusca = setTimeout(() => { estado[grupo][chave] = valor; render(); }, CONFIG.DEBOUNCE_BUSCA_MS);
    return;
  }
  if (alvo.matches('#dialogo [name="observacao"]')) {
    document.getElementById('contador-observacao').textContent = contadorTexto(alvo.value.length, LIMITES.OBSERVACAO_FINALIZACAO);
    return;
  }
  const form = alvo.closest('[data-form="reuniao"]');
  if (form) { aoDigitarFormReuniao(form, alvo); return; }
  // Gerador e Usuários: o erro de um campo some quando ele é corrigido
  const formAcao = alvo.closest('[data-form="acao"]');
  if (formAcao) {
    limparErroCampo(alvo, estado.formAcao);
    if (alvo.name.endsWith('descricao')) document.getElementById(`contador-${alvo.name}`).textContent = contadorTexto(alvo.value.length, LIMITES.DESCRICAO_ACAO);
    return;
  }
  if (alvo.closest('[data-form="usuario"]')) limparErroCampo(alvo, estado.formUsuario);
});

document.addEventListener('submit', (evento) => {
  const form = evento.target;
  evento.preventDefault();
  if (form.matches('[data-form="login"]')) irPara(ROTAS.PAINEL);
  else if (form.matches('[data-form="reuniao"]')) enviarFormReuniao(form);
  else if (form.matches('[data-form="acao"]')) enviarFormAcao(form);
  else if (form.matches('[data-form="usuario"]')) enviarFormUsuario(form);
  else if (form.matches('[data-form="usuario-papel"]')) mudarPapelUsuario(Number(form.dataset.id), String(new FormData(form).get('role') || ''));
  else if (form.matches('[data-form="usuario-status"]')) pedirMudancaStatusUsuario(Number(form.dataset.id), String(new FormData(form).get('status') || ''));
  else if (form.matches('[data-form="presenca"]')) salvarPresenca(Number(form.dataset.id), new FormData(form).getAll('presentes').map(Number));

});

const TEXTOS_SUBNAV = Object.freeze({ ROTULO: 'Visões desta tela' });
function atualizarSubnav(base) {
  const [caminho] = location.hash.replace(/^#\//, '').split('?');
  const id = caminho.split('/')[1];
  let nav = document.getElementById('subnav');
  if (!nav) {
    nav = document.createElement('nav');
    nav.id = 'subnav';
    nav.className = 'subnav';
    nav.setAttribute('aria-label', TEXTOS_SUBNAV.ROTULO);
    document.querySelector('.topo').after(nav);
  }
  const focado = nav.contains(document.activeElement) ? document.activeElement.dataset.subnav : null;
  const itens = itensSubnav(base, id);
  nav.hidden = itens.length === 0;
  document.body.classList.toggle('com-subnav', itens.length > 0);
  nav.innerHTML = `<div class="subnav-faixa">${itens.map((x) => `<a class="subnav-item" href="${x.href}" data-subnav="${x.chave}" ${x.ativo ? 'aria-current="page"' : ''}>${icone(x.icone)}${esc(x.rotulo)}${x.extra}</a>`).join('')}</div>`;

}

function resumoPanorama(d) {
  const total = d.iE.total + d.iO.total;

  return TEXTOS_RESUMO.FRASE(plural(total, TEXTOS_RESUMO.ESCOPO), plural(concluidas, TEXTOS_RESUMO.CONCLUIDAS), risco,

// ── telas/painel/graficos.js
// elemento de gráfico: botão que filtra o gestor (com filtro) ou dica focável
function alvoPanorama(filtro, conteudo, classe, rotulo, extra = '') {
  if (filtro) {
    return `<button type="button" class="${classe} dica-alvo" ${alvoGrafico(filtro)} aria-label="${esc(rotulo)}" data-dica="${esc(rotulo)}" ${extra}>${conteudo}</button>`;
  }

}

// no Total: status por tipo; com um card selecionado, a prioridade do subconjunto (graficoPorPrioridade)
function graficoStatusTotal(d) {
  const linhas = [[E, d.iE], [O, d.iO]].map(([tipo, ind]) => {
    const segmentos = Object.values(STATUS_ACAO).filter((s) => ind.porStatus[s] > 0).map((s) => {
      const n = ind.porStatus[s];
      const rotulo = TEXTOS_PANORAMA.DICA(`${ROTULOS_TIPO_PLURAL[tipo]}, ${ROTULOS_STATUS_ACAO[s]}`, n);
      return alvoPanorama({ tipo, status: s }, `<span class="seg-valor num">${n}</span>`, 'seg', rotulo, `data-status="${s}" style="flex-grow:${n}"`);
    }).join('');
    return `<div class="linha-empilhada">
        <span class="linha-empilhada-rotulo">${badgeTipo(tipo, { compacto: true })}<span>${esc(ROTULOS_TIPO_PLURAL[tipo])}</span><span class="num legenda">${ind.total}</span></span>
        <div class="barra-empilhada">${segmentos || `<span class="legenda">${esc(TEXTOS_PANORAMA.SEM_DADOS)}</span>`}</div>
      </div>`;
  }).join('');
  const legenda = Object.values(STATUS_ACAO).map((s) => `<tr><td><span class="marcador-status" data-cor="${s}" aria-hidden="true"></span>${esc(ROTULOS_STATUS_ACAO[s])}</td><td class="num">${d.iE.porStatus[s]}</td><td class="num">${d.iO.porStatus[s]}</td></tr>`).join('')
    + `<tr><td><span class="marcador-status" data-cor="${COR_VENCIDA}" aria-hidden="true"></span>${esc(ROTULO_VENCIDAS)}</td><td class="num">${d.iE.vencidas}</td><td class="num">${d.iO.vencidas}</td></tr>`;
  return `<section class="card grafico-principal" aria-labelledby="titulo-status-tipo">
      <div class="card-cabecalho"><h2 class="card-titulo" id="titulo-status-tipo">${esc(TEXTOS_PANORAMA.STATUS_POR_TIPO)}</h2><span class="legenda">${esc(TEXTOS_PANORAMA.STATUS_POR_TIPO_NOTA)}</span></div>
      <div class="grafico-principal-corpo">
        <div class="linhas-empilhadas">${linhas}</div>
        <table class="tabela tabela-compacta legenda-tabela"><thead><tr><th>${esc(TEXTOS_PANORAMA.STATUS)}</th><th class="num">${badgeTipo(E, { compacto: true })} ${ROTULOS_TIPO_PLURAL[E]}</th><th class="num">${badgeTipo(O, { compacto: true })} ${ROTULOS_TIPO_PLURAL[O]}</th></tr></thead><tbody>${legenda}</tbody></table>
      </div>
    </section>`;
}

// barras horizontais E e O por categoria (prioridade, unidade)
function barrasPar(linhas) {
  const maximo = Math.max(1, ...linhas.flatMap((l) => [l.e, l.o]));
  const barraTipo = (l, tipo, n) => alvoPanorama(l.filtro ? { ...l.filtro, tipo } : null,
    `${badgeTipo(tipo, { compacto: true })}<span class="barra-h-trilho"><span class="barra-h-preench" style="width:${larguraBarra(n, maximo)}"></span></span><span class="barra-h-valor">${n}</span>`,
    'barra-h', TEXTOS_PANORAMA.DICA(`${l.texto}, ${ROTULOS_TIPO_PLURAL[tipo]}`, n), `data-tipo="${tipo}"`);
  return linhas.length
    ? `<ul class="barras-par">${linhas.map((l) => `<li class="barra-par-linha"><span>${l.rotulo}</span><span class="barra-par-trilhas">${barraTipo(l, E, l.e)}${barraTipo(l, O, l.o)}</span></li>`).join('')}</ul>`
    : `<p class="legenda">${esc(TEXTOS_PANORAMA.SEM_DADOS)}</p>`;
}

function graficoMeses(d) {
  const meses = [...new Set([...d.iE.porMes.keys(), ...d.iO.porMes.keys()])].sort(); // P3: só meses com ação, crescente
  const maximo = Math.max(1, ...meses.map((m) => (d.iE.porMes.get(m) || 0) + (d.iO.porMes.get(m) || 0)));
  const atual = FIM_DO_MES_CORRENTE.slice(0, TAMANHO_MES_ISO);
  if (!meses.length) return `<p class="legenda">${esc(TEXTOS_PANORAMA.SEM_DADOS)}</p>`;
  const legendaTipos = `<p class="legenda-grafico">${badgeTipo(E)} ${badgeTipo(O)}</p>`;
  return legendaTipos + `<div class="colunas-mes">${meses.map((m) => {
    const e = d.iE.porMes.get(m) || 0;
    const o = d.iO.porMes.get(m) || 0;
    const rotulo = `${formatarMes(`${m}-01`)}${m === atual ? `, ${TEXTOS_PANORAMA.ESTE_MES}` : ''}: ${ROTULOS_TIPO_PLURAL[E]} ${e}, ${ROTULOS_TIPO_PLURAL[O]} ${o}`;
    return `<div class="coluna-mes" ${m === atual ? 'data-atual' : ''}>
        <span class="coluna-mes-valor">${e + o}</span>
        ${alvoPanorama(null, `<span data-tipo="${E}" style="--n:${e}"></span><span data-tipo="${O}" style="--n:${o}"></span>`, 'coluna-mes-pilha', rotulo, `style="--proporcao:${(e + o) / maximo}"`)}

  PRIORIDADE: 'Prioridade', TOTAL: 'Total', VAZIO: 'Nenhuma estratégica ou operacional neste filtro.',

const dadosPanorama = NBC.pontos.definir('painel.dados', (u, unidadeId) => {

function graficoPorPrioridade(d, filtro) {
  const T = TEXTOS_GRAFICO_FILTRADO;
  const predicado = PREDICADOS_PANORAMA[filtro];
  const iE = indicadores(d.estrategicas.filter(predicado));
  const iO = indicadores(d.operacionais.filter(predicado));
  const prioridades = Object.values(PRIORIDADE_ACAO);
  const linhas = [[E, iE], [O, iO]].map(([tipo, ind]) => {
    const segmentos = prioridades.filter((p) => ind.porPrioridade[p] > 0).map((p) => {
      const n = ind.porPrioridade[p];
      const rotulo = TEXTOS_PANORAMA.DICA(`${ROTULOS_TIPO_PLURAL[tipo]}, ${ROTULOS_PRIORIDADE[p]}`, n);
      return alvoPanorama(null, `<span class="seg-valor num">${n}</span>`, 'seg', rotulo, `data-cor-prioridade="${p}" style="flex-grow:${n}"`); // informativo
    }).join('');
    return `<div class="linha-empilhada">
        <span class="linha-empilhada-rotulo">${badgeTipo(tipo, { compacto: true })}<span>${esc(ROTULOS_TIPO_PLURAL[tipo])}</span><span class="num legenda">${ind.total}</span></span>

      </div>`;
  }).join('');
  const legenda = prioridades.map((p) => `<tr><td><span class="marcador-prioridade" data-cor-prioridade="${p}" aria-hidden="true"></span>${esc(ROTULOS_PRIORIDADE[p])}</td><td class="num">${iE.porPrioridade[p]}</td><td class="num">${iO.porPrioridade[p]}</td></tr>`).join('')
    + `<tr class="linha-total"><td>${esc(T.TOTAL)}</td><td class="num">${iE.total}</td><td class="num">${iO.total}</td></tr>`;
  const recorte = RECORTES_PANORAMA[filtro];
  const verNaLista = recorte
    ? `<button type="button" class="btn btn-terciario ver-na-lista" ${alvoGrafico({ recorte })} aria-label="${esc(T.VER_NA_LISTA_ROTULO(T.TITULO[filtro]))}">${esc(T.VER_NA_LISTA)}${icone('direita')}</button>` : '';
  const corpo = iE.total + iO.total === 0 ? `<p class="grafico-vazio">${esc(T.VAZIO)}</p>`
    : `<div class="grafico-principal-corpo">

        <table class="tabela tabela-compacta legenda-tabela"><thead><tr><th>${esc(T.PRIORIDADE)}</th><th class="num">${badgeTipo(E, { compacto: true })} ${ROTULOS_TIPO_PLURAL[E]}</th><th class="num">${badgeTipo(O, { compacto: true })} ${ROTULOS_TIPO_PLURAL[O]}</th></tr></thead><tbody>${legenda}</tbody></table>
      </div>`;
  return `<section class="card grafico-principal" aria-labelledby="titulo-status-tipo" data-filtro-grafico="${filtro}">
      <div class="card-cabecalho"><div class="grafico-cabecalho-texto"><h2 class="card-titulo" id="titulo-status-tipo">${esc(T.TITULO[filtro])}</h2><span class="legenda">${esc(T.NOTA[filtro])}</span></div>${verNaLista}</div>
      ${corpo}
    </section>`;
}
const graficoStatusPorTipo = NBC.pontos.definir('painel.grafico', (d) => {

// troca de filtro: os cards mudam na hora (o foco fica no card); só a seção do gráfico mostra o skeleton, por até 0,5 s
let timerPanorama;
function aplicarFiltroPanorama(filtro) {
  estado.panoramaFiltro = filtro;
  document.querySelectorAll('[data-filtro-panorama]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.filtroPanorama === filtro)));
  const secao = document.querySelector('#conteudo .grafico-principal');
  if (!secao) { render(); return; }
  clearTimeout(timerPanorama); // cliques seguidos valem pelo último
  const desenhar = () => {
    const atual = document.querySelector('#conteudo .grafico-principal');
    if (!atual) return;
    atual.outerHTML = graficoStatusPorTipo(dadosPanorama(usuarioAtual(), estado.filtrosPainel.unidadeId));
    anunciar(document.getElementById('titulo-status-tipo').textContent); // o resultado, além do "Atualizando"
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { desenhar(); return; }
  // o cabeçalho fica (o aria-labelledby continua válido); só o corpo vira skeleton
  secao.setAttribute('aria-busy', 'true');
  [...secao.children].filter((el) => !el.classList.contains('card-cabecalho')).forEach((el) => el.remove());
  secao.insertAdjacentHTML('beforeend', '<div class="grafico-carregando"><div class="skeleton skeleton-alto"></div><div class="skeleton"></div><div class="skeleton"></div></div>');
  anunciar(TEXTOS_GRAFICO_FILTRADO.ATUALIZANDO);
  timerPanorama = setTimeout(desenhar, CONFIG_PANORAMA.DURACAO_CARREGANDO_MS);
}

function abaAcoes() {

  if (valor === QUERY_ACOES.LISTA) return ABA_ACOES.LISTA;
  if (valor === QUERY_ACOES.GERADOR) return ABA_ACOES.GERADOR;
  return ABA_ACOES.KANBAN;

// endereço de uma aba do gestor, mantendo o recorte do cockpit (o Gerador não tem recorte)
function rotaAcoes(aba, recorte = '') {
  const q = new URLSearchParams();
  if (aba === ABA_ACOES.LISTA) q.set(QUERY_ACOES.ABA, QUERY_ACOES.LISTA);
  if (aba === ABA_ACOES.GERADOR) q.set(QUERY_ACOES.ABA, QUERY_ACOES.GERADOR);
  if (recorte && aba !== ABA_ACOES.GERADOR) q.set(QUERY_ACOES.RECORTE, recorte);

  if (mesmo && !mesmo.disabled) mesmo.focus({ preventScroll: true });
});

// Lista em árvore: cards de nível no topo e a tabela E → O → S com trilhos (só o que o usuário vê)
const listaArvore = NBC.pontos.definir('acoes.lista', (u, visao, acaoVazio) => {
  const confere = (a) => confereFiltrosAcoes(a, visao);
  const visiveis = (lista) => lista.filter((a) => podeVer(a, u));
  const aparece = (a) => confere(a) || visiveis(filhasDe(a.id)).some(aparece);
  const T = TEXTOS_LISTA;
  const linhas = [];
  const adicionar = (a, ultimosAncestrais, ehUltimo, surgindo) => {
    const filhas = visiveis(filhasDe(a.id)).filter(aparece);
    const aberto = estado.expandidos.has(a.id);
    const nivel = a.tipo === E ? 0 : ultimosAncestrais.length + 1;
    const trilhos = (nivel ? ultimosAncestrais.map((ult) => `<span class="trilho" data-trilho="${ult ? 'vazio' : 'linha'}" aria-hidden="true"></span>`).join('')
      + `<span class="trilho" data-trilho="${ehUltimo ? 'fim' : 'meio'}" aria-hidden="true"></span>` : '');
    const expandir = filhas.length
      ? `<button type="button" class="btn-expandir" data-acao="expandir" data-id="${a.id}" aria-expanded="${aberto}" aria-label="${esc(aberto ? T.RECOLHER(a.descricao) : T.EXPANDIR(a.descricao))}">${icone(aberto ? 'abaixo' : 'direita')}</button>`
      : '<span class="espaco-expandir"></span>';
    let resumo = '';
    if (a.tipo === E) {
      const os = visiveis(filhasDe(a.id));
      const ss = os.flatMap((o) => visiveis(filhasDe(o.id))); // só as sub-ações visíveis
      resumo = `<span class="resumo-e">${esc(T.RESUMO_E(os.length, ss.length))}${resumoStatusCompacto([...os, ...ss])}</span>`;
    }
    linhas.push(`<tr class="linha-acao ${surgindo ? 'surgindo' : ''}" data-nivel="${a.tipo}">
      <td><div class="arvore">${trilhos}${expandir}${badgeTipo(a.tipo, { compacto: true })}<div class="arvore-texto"><a class="link" href="#/acoes/${a.id}" title="${esc(a.descricao)}">${esc(a.descricao)}</a>${resumo}</div></div></td>
      <td><div class="badges">${seletorStatus(a)}${badgeVencida(a)}</div></td>
      <td>${badgePrioridade(a.prioridade)}</td>
      <td>${esc(unidadePorId(a.unidadeId).nome)}</td>
      <td>${iniciaisResponsaveis(a.responsaveis)}</td>
      <td class="num">${formatarPrazo(a)}</td>
      <td>${progressoExibido(a)}</td>
    </tr>`);
    if (aberto) {
      const proximos = nivel ? [...ultimosAncestrais, ehUltimo] : [];
      filhas.forEach((filha, i) => adicionar(filha, proximos, i === filhas.length - 1, surgindo || estado.recemExpandido === a.id));
    }
  };
  visiveis(acoes.filter((a) => a.tipo === E)).filter(aparece).sort(porMesEId).forEach((a) => adicionar(a, [], false, false));
  const conferem = acoes.filter((a) => podeVer(a, u) && confere(a)); // Sub-Ação de outro usuário nunca conta
  const niveis = Object.values(TIPO_ACAO).map((t) => cardNivel(t, conferem.filter((a) => a.tipo === t))).join('');
  const C = T.COLUNAS;
  return `<section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">${esc(T.TITULO)} ${badgeContagem(conferem.length)}</h2>
        <div class="lista-ferramentas"><button type="button" class="btn btn-terciario" data-lista-arvore="expandir">${icone('abaixo')}${esc(T.EXPANDIR_TUDO)}</button>
          <button type="button" class="btn btn-terciario" data-lista-arvore="recolher">${icone('direita')}${esc(T.RECOLHER_TUDO)}</button></div></div>
      <div class="niveis" role="group" aria-label="${esc(T.NIVEIS)}">${niveis}</div>
      ${linhas.length
        ? `<table class="tabela tabela-arvore"><colgroup><col><col class="col-status"><col class="col-prioridade"><col class="col-unidade"><col class="col-responsaveis"><col class="col-mes"><col class="col-progresso"></colgroup>
            <thead><tr><th>${C.ACAO}</th><th>${C.STATUS}</th><th>${C.PRIORIDADE}</th><th>${C.UNIDADE}</th><th>${C.RESPONSAVEIS}</th><th class="num">${esc(TEXTOS_PRAZO.COLUNA)}</th><th>${C.PROGRESSO}</th></tr></thead>
            <tbody>${linhas.join('')}</tbody></table>`
        : estadoVazio(MENSAGENS.NENHUMA_ACAO, acaoVazio)}
    </section>`;
});

// teclado no cartão: Enter ou Espaço abre a gaveta; Alt+← e Alt+→ movem para a coluna vizinha
document.addEventListener('keydown', (evento) => {
  const cartao = evento.target instanceof Element && evento.target.matches('[data-cartao]') ? evento.target : null;
  if (!cartao) return;
  if ((evento.key === 'Enter' || evento.key === ' ') && !evento.altKey) {
    evento.preventDefault();
    abrirGaveta(TIPO_GAVETA.ACAO, Number(cartao.dataset.cartao), cartao);
  } else if (evento.altKey && (evento.key === 'ArrowRight' || evento.key === 'ArrowLeft')) {
    evento.preventDefault(); // evita o voltar/avançar do navegador
    moverCartaoPorTeclado(cartao, evento.key === 'ArrowRight' ? 1 : -1);
  }
});

// arrastar e soltar (API nativa do HTML5); só entre colunas da mesma raia
let arrastandoId = null;
function limparArraste() {
  arrastandoId = null;
  document.querySelectorAll('[data-arrastando], [data-destino], [data-origem], [data-sobre]').forEach((el) => {
    el.removeAttribute('data-arrastando'); el.removeAttribute('data-destino'); el.removeAttribute('data-origem'); el.removeAttribute('data-sobre');
  });
}
document.addEventListener('dragstart', (evento) => {
  const cartao = evento.target instanceof Element ? evento.target.closest('[data-cartao]') : null;
  if (!cartao || cartao.getAttribute('draggable') !== 'true') return;
  const a = acaoPorId(Number(cartao.dataset.cartao));
  if (!a || !pode(OPERACAO.MUDAR_STATUS, a)) { evento.preventDefault(); return; }
  arrastandoId = a.id;
  evento.dataTransfer.effectAllowed = 'move';
  evento.dataTransfer.setData('text/plain', String(a.id));
  const quadro = cartao.closest('.quadro-conteudo');
  quadro.setAttribute('data-arrastando', '');
  quadro.querySelectorAll('.coluna-kanban').forEach((coluna) => {
    if (coluna.dataset.raia === cartao.dataset.raia && coluna.dataset.coluna !== a.status) coluna.setAttribute('data-destino', '');
  });
  requestAnimationFrame(() => cartao.setAttribute('data-origem', '')); // depois da captura da imagem de arraste
});
document.addEventListener('dragover', (evento) => {
  if (arrastandoId === null) return;
  const coluna = evento.target instanceof Element ? evento.target.closest('.coluna-kanban[data-destino]') : null;
  // destaque próprio só na coluna sob o cursor
  document.querySelectorAll('[data-sobre]').forEach((el) => { if (el !== coluna) el.removeAttribute('data-sobre'); });
  if (!coluna) return;
  coluna.setAttribute('data-sobre', '');
  evento.preventDefault();
  evento.dataTransfer.dropEffect = 'move';
});
document.addEventListener('drop', (evento) => {
  const coluna = evento.target instanceof Element ? evento.target.closest('.coluna-kanban[data-destino]') : null;
  if (arrastandoId === null || !coluna) return;
  evento.preventDefault();
  const id = arrastandoId;
  limparArraste();
  moverCartao(id, coluna.dataset.coluna);
});
document.addEventListener('dragend', limparArraste);

// Kanban em linhas por status, na ordem pedida; cada linha pagina 4×2 com setas; "Agrupar por" cria seções recolhíveis
const ORDEM_KANBAN = Object.freeze([ST.EM_RISCO, ST.EM_ANDAMENTO, ST.NAO_INICIADO, ST.CONCLUIDO]);
const CONFIG_KANBAN = Object.freeze({ POR_PAGINA: 8 });
const AGRUPAMENTO_EXP03 = Object.freeze({ NENHUM: 'NENHUM', ESTRATEGICA: 'ESTRATEGICA', UNIDADE: 'UNIDADE', TIPO: 'TIPO', PRIORIDADE: 'PRIORIDADE' });
const ROTULOS_AGRUPAMENTO_EXP03 = Object.freeze({ NENHUM: 'Nenhum', ESTRATEGICA: 'Estratégica', UNIDADE: 'Unidade', TIPO: 'Tipo de ação', PRIORIDADE: 'Prioridade' });
const TEXTOS_KANBAN = Object.freeze({
  TITULO: 'Ações',
  DICA: 'Arraste os cartões entre as linhas ou use Alt+↑ e Alt+↓ (ou Alt+← e Alt+→)',
  PAGINA: (atual, total) => `Página ${atual} de ${total}`,
  ANTERIOR: (status) => `Página anterior de ${status}`,
  SEGUINTE: (status) => `Página seguinte de ${status}`,
  RECOLHER: (nome) => `Recolher ${nome}`,
  EXPANDIR: (nome) => `Expandir ${nome}`,
});
estado.paginasKanban = new Map(); // "grupo|status" → página (a partir de 0)
estado.gruposRecolhidos = new Set();

// grupos do "Agrupar por": só os que têm cartão; o cabeçalho mostra o que identifica o grupo
function gruposKanban(cartoes, modo) {
  const A = AGRUPAMENTO_EXP03;
  const u = usuarioAtual();
  let grupos = [];
  if (modo === A.ESTRATEGICA) {
    grupos = acoes.filter((a) => a.tipo === E && podeVer(a, u)).sort(porMesEId).map((e) => ({
      chave: `E:${e.id}`, nome: e.descricao, cartoes: cartoes.filter((c) => estrategicaDe(c).id === e.id),
      titulo: `${badgeTipo(E, { compacto: true })}<button type="button" class="link-botao" data-acao="gaveta-abrir" data-id="${e.id}">${esc(e.descricao)}</button>`,
      extra: `<div class="badges">${seletorStatus(e)}${badgeVencida(e)}</div>${barraProgresso(progresso(e))}`,
    }));
  } else if (modo === A.UNIDADE) {
    grupos = UNIDADES.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map((un) => ({
      chave: `U:${un.id}`, nome: un.nome, cartoes: cartoes.filter((c) => c.unidadeId === un.id), titulo: esc(un.nome), extra: '',
    }));
  } else if (modo === A.TIPO) {
    grupos = Object.values(TIPO_ACAO).map((t) => ({ chave: `T:${t}`, nome: ROTULOS_TIPO_PLURAL[t], cartoes: cartoes.filter((c) => c.tipo === t), titulo: badgeTipo(t), extra: '' }));
  } else if (modo === A.PRIORIDADE) {
    grupos = Object.values(PRIORIDADE_ACAO).map((p) => ({ chave: `P:${p}`, nome: ROTULOS_PRIORIDADE[p], cartoes: cartoes.filter((c) => c.prioridade === p), titulo: badgePrioridade(p), extra: '' }));
  }
  return grupos.filter((g) => g.cartoes.length);
}
function grupoKanban(g) {
  const recolhido = estado.gruposRecolhidos.has(g.chave);
  const id = `grupo-${g.chave.replace(/[^A-Za-z0-9]/g, '-')}`;
  return `<section class="grupo-kanban" aria-labelledby="${id}">
      <div class="grupo-kanban-cabecalho">
        <button type="button" class="btn-expandir" data-grupo-kanban="${g.chave}" aria-expanded="${!recolhido}" aria-label="${esc(recolhido ? TEXTOS_KANBAN.EXPANDIR(g.nome) : TEXTOS_KANBAN.RECOLHER(g.nome))}">${icone(recolhido ? 'direita' : 'abaixo')}</button>
        <h3 class="grupo-kanban-titulo" id="${id}">${g.titulo}</h3>${badgeContagem(g.cartoes.length)}${g.extra}
      </div>
      ${recolhido ? '' : linhasKanban(g.cartoes, g.chave, 4)}
    </section>`;
}

// título do quadro: "Ações" e a contagem dos cartões exibidos
const tituloKanban = NBC.pontos.definir('acoes.kanban.titulo', (cartoes) => `${esc(TEXTOS_KANBAN.TITULO)} ${badgeContagem(cartoes.length)}`);
const renderKanban = NBC.pontos.definir('acoes.kanban', (acaoVazio) => {
  const u = usuarioAtual();
  const f = estado.filtrosAcoes;
  const A = AGRUPAMENTO_EXP03;
  const tipoEstrategica = f.tipo === E;
  if (!Object.values(A).includes(estado.agrupamentoKanban) || (tipoEstrategica && estado.agrupamentoKanban === A.ESTRATEGICA)) estado.agrupamentoKanban = A.NENHUM;
  const modo = estado.agrupamentoKanban;
  // agrupando por estratégica, as estratégicas viram cabeçalho e não aparecem como cartões
  const cartoes = acoes.filter((a) => podeVer(a, u) && confereFiltrosAcoes(a, VISAO_ACOES.KANBAN) && !(modo === A.ESTRATEGICA && a.tipo === E)).sort(porMesEId);
  const corpo = modo === A.NENHUM ? linhasKanban(cartoes, '', 3) : gruposKanban(cartoes, modo).map(grupoKanban).join('');
  const opcoes = Object.values(A).map((g) => `<button type="button" class="aba" data-acao="agrupar" data-agrupamento="${g}" aria-pressed="${g === modo}" ${g === A.ESTRATEGICA && tipoEstrategica ? 'disabled aria-describedby="dica-agrupar"' : ''}>${esc(ROTULOS_AGRUPAMENTO_EXP03[g])}</button>`).join('');
  return `<section class="card">
      <div class="card-cabecalho quadro-barra">
        <h2 class="card-titulo">${tituloKanban(cartoes)}</h2>
        <div class="agrupar"><span class="rotulo" id="rotulo-agrupar">${esc(ROTULOS_FILTRO.AGRUPAR)}</span>
          <div class="abas" role="group" aria-labelledby="rotulo-agrupar">${opcoes}</div>
          ${tipoEstrategica ? `<span class="legenda" id="dica-agrupar">${esc(MENSAGENS.AGRUPAMENTO_INDISPONIVEL)}</span>` : ''}</div>
      </div>
      <p class="legenda" id="dica-kanban">${esc(TEXTOS_KANBAN.DICA)}</p>
      ${cartoes.length ? `<div class="quadro"><div class="quadro-conteudo">${corpo}</div></div>` : estadoVazio(MENSAGENS.NENHUMA_ACAO, acaoVazio)}
    </section>`;
});

// teclado: a linha vizinha segue a ordem exibida (Em risco, Em andamento, Não iniciado, Concluído)
function moverCartaoPorTeclado(cartao, passo) {
  const id = Number(cartao.dataset.cartao);
  const a = acaoPorId(id);
  if (!a) return;
  if (!pode(OPERACAO.MUDAR_STATUS, a)) { anunciar(MENSAGENS.STATUS_BLOQUEADO); return; }
  const destino = ORDEM_KANBAN[ORDEM_KANBAN.indexOf(a.status) + passo];
  if (destino) moverCartao(id, destino);
}
document.addEventListener('keydown', (evento) => {
  const cartao = evento.target instanceof Element && evento.target.matches('[data-cartao]') ? evento.target : null;
  if (!cartao || !evento.altKey || (evento.key !== 'ArrowUp' && evento.key !== 'ArrowDown')) return;
  evento.preventDefault();
  moverCartaoPorTeclado(cartao, evento.key === 'ArrowDown' ? 1 : -1);
});
// setas de página e recolher grupo (o foco volta ao mesmo controle depois do render)
document.addEventListener('click', (evento) => {
  const alvo = evento.target instanceof Element ? evento.target.closest('[data-pagina-kanban], [data-grupo-kanban]') : null;
  if (!alvo) return;
  if (alvo.dataset.paginaKanban) {
    const chave = alvo.dataset.paginaKanban;
    const passo = Number(alvo.dataset.passo);
    estado.paginasKanban.set(chave, Math.max(0, (estado.paginasKanban.get(chave) || 0) + passo));
    render();
    const mesmo = document.querySelector(`[data-pagina-kanban="${chave}"][data-passo="${passo}"]`);
    const outro = document.querySelector(`[data-pagina-kanban="${chave}"][data-passo="${-passo}"]`);
    const foco = mesmo && !mesmo.disabled ? mesmo : outro;
    foco?.focus({ preventScroll: true });
    // a legenda é recriada a cada render: a página nova é anunciada pela região viva comum
    const legenda = foco?.closest('.linha-kanban')?.querySelector('.legenda-pagina');
    if (legenda) anunciar(legenda.textContent);
    return;
  }
  const chave = alvo.dataset.grupoKanban;
  if (estado.gruposRecolhidos.has(chave)) estado.gruposRecolhidos.delete(chave); else estado.gruposRecolhidos.add(chave);
  render();
  document.querySelector(`[data-grupo-kanban="${chave}"]`)?.focus({ preventScroll: true });
});

// Kanban (arrastar e Alt+setas): em vez de aplicar, o cartão fica pendente na linha nova até confirmar
const moverCartao = NBC.pontos.definir('acoes.moverCartao', (id, novo) => {
  const a = acaoPorId(id);
  if (!a || a.status === novo) return; // Lei 12
  pedirConfirmacaoStatus(id, novo, null, { kanban: true });
});
// linhas por status com o cartão pendente na linha de destino (na página certa) e o glifo do status no cabeçalho
const statusNoQuadro = (a) => (estado.statusPendente && estado.statusPendente.id === a.id ? estado.statusPendente.para : a.status);
function cartaoNoQuadro(a, grupo, nivel) {
  const html = cartaoKanban(a, grupo, nivel);
  if (!estado.statusPendente || estado.statusPendente.id !== a.id) return html;
  // o "Pendente" visível é ::after; o leitor de tela ouve o mesmo estado pelo nome do cartão
  return html.replace('<article ', `<article data-pendente="${esc(TEXTOS_CONFIRMACAO.PENDENTE)}" `)
    .replace(`aria-labelledby="cartao-${a.id}"`, `aria-labelledby="cartao-${a.id} pendente-${a.id}"`)
    .replace('<div class="cartao-topo">', `<span class="sr-only" id="pendente-${a.id}">${esc(TEXTOS_CONFIRMACAO.PENDENTE)}</span><div class="cartao-topo">`);
}
// cabeçalho da linha: glifo, status e contagem; a legenda da página (lida no anúncio da troca) só com mais de uma página
const cabecalhoLinhaKanban = NBC.pontos.definir('acoes.kanban.cabecalhoLinha', ({ st, nivel, titulo, total, pagina, paginas }) => {
  const marca = `<span class="glifo-linha" data-cor-status="${st}">${glifoStatus(st)}</span>`;
  return `<div class="linha-kanban-cabecalho">
          <h${nivel} class="coluna-cabecalho" id="${titulo}">${marca}${esc(ROTULOS_STATUS_ACAO[st])} ${badgeContagem(total)}</h${nivel}>
          ${paginas > 1 ? `<span class="legenda legenda-pagina">${esc(TEXTOS_KANBAN.PAGINA(pagina + 1, paginas))}</span>` : ''}
        </div>`;
});
const linhasKanban = NBC.pontos.definir('acoes.linhasKanban', (cartoes, grupo, nivel) => {
  const POR = CONFIG_KANBAN.POR_PAGINA;
  return `<div class="linhas-kanban">${ORDEM_KANBAN.map((st) => {
    const daLinha = cartoes.filter((a) => statusNoQuadro(a) === st);
    const chave = `${grupo}|${st}`;
    const paginas = Math.max(1, Math.ceil(daLinha.length / POR));
    // o cartão que acabou de mudar (ou está pendente) aparece na página certa da linha nova
    const indiceMovido = daLinha.findIndex((a) => a.id === estado.recemMovido || (estado.statusPendente && a.id === estado.statusPendente.id));
    if (indiceMovido >= 0) estado.paginasKanban.set(chave, Math.floor(indiceMovido / POR));
    const pagina = Math.min(estado.paginasKanban.get(chave) || 0, paginas - 1);
    estado.paginasKanban.set(chave, pagina);
    const daPagina = daLinha.slice(pagina * POR, (pagina + 1) * POR);
    const titulo = `linha-${(grupo || 'todas').replace(/[^A-Za-z0-9]/g, '-')}-${st}`;
    const seta = (passo, nome, rotulo, desabilitada) => `<button type="button" class="btn-pagina" data-pagina-kanban="${chave}" data-passo="${passo}" aria-label="${esc(rotulo)}" title="${esc(rotulo)}" ${desabilitada ? 'disabled' : ''} ${paginas === 1 ? 'data-unica' : ''}>${icone(nome)}</button>`;
    return `<section class="coluna-kanban linha-kanban" data-coluna="${st}" data-raia="${grupo}" aria-labelledby="${titulo}">
        ${cabecalhoLinhaKanban({ st, nivel, titulo, total: daLinha.length, pagina, paginas })}
        <div class="linha-kanban-corpo">
          ${seta(-1, 'esquerda', TEXTOS_KANBAN.ANTERIOR(ROTULOS_STATUS_ACAO[st]), pagina === 0)}
          <div class="coluna-cartoes grade-cartoes">${daPagina.length ? daPagina.map((a) => cartaoNoQuadro(a, grupo, nivel + 1)).join('') : `<p class="coluna-vazia">${esc(MENSAGENS.NENHUMA_ACAO_COLUNA)}</p>`}</div>
          ${seta(1, 'direita', TEXTOS_KANBAN.SEGUINTE(ROTULOS_STATUS_ACAO[st]), pagina >= paginas - 1)}
        </div>
      </section>`;
  }).join('')}</div>`;
});

// cartão de altura e lugares fixos; na O, a barra de progresso (D3) no lugar da contagem de sub-ações
const cartaoKanban = NBC.pontos.definir('acoes.cartaoKanban', (a, raiaId, nivelTitulo) => {
  const u = usuarioAtual();
  const podeMover = pode(OPERACAO.MUDAR_STATUS, a);
  const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
  const unidade = unidadePorId(a.unidadeId).nome;
  const cadeado = podeMover ? '' : `<span class="cadeado" title="${esc(MENSAGENS.STATUS_BLOQUEADO)}">${icone('cadeado')}<span class="sr-only">${esc(MENSAGENS.STATUS_BLOQUEADO)}</span></span>`;
  const paiVisivel = pai && podeVer(pai, u);
  const contexto = paiVisivel ? `${PREFIXO_PAI} ${pai.descricao}` : unidade;
  const subAcoesVisiveis = a.tipo === O ? filhasDe(a.id).filter((x) => podeVer(x, u)).length : 0;
  const direita = a.tipo === E ? barraProgresso(progresso(a)) // Lei 7
    : a.tipo === O ? progressoExibido(a, { contagemVisivel: subAcoesVisiveis })
      : paiVisivel ? `<span class="legenda">${esc(unidade)}</span>` : '';
  return `<article class="cartao cartao-padrao ${estado.recemMovido === a.id ? 'movido' : ''}" data-fita="${a.status}" tabindex="0" draggable="${podeMover}" data-acao="gaveta-abrir" data-id="${a.id}" data-cartao="${a.id}" data-raia="${raiaId}" aria-labelledby="cartao-${a.id}" ${podeMover ? 'aria-describedby="dica-kanban"' : ''}>
      <div class="cartao-topo">${badgeTipo(a.tipo)}${cadeado}</div>

function mudarStatus(id, novo, { desfazendo = false, anunciarMovimento = false } = {}) {
  const a = acaoPorId(id);
  if (!a || !pode(OPERACAO.VER, a)) { toast(MENSAGENS.ACAO_NAO_ENCONTRADA, 'erro'); render(); return; } // 404 idêntico
  if (!pode(OPERACAO.MUDAR_STATUS, a)) { toast(MENSAGENS.SEM_PERMISSAO_OPERACAO, 'erro'); render(); return; } // 403
  if (!Object.values(STATUS_ACAO).includes(novo)) return; // só valores do enum
  if (a.status === novo) return; // Lei 12: mesmo status não tem efeito
  const de = a.status;

// pais possíveis: O sob E (só Administrador); S sob O (Administrador: qualquer O; Colaborador: só Oe)
function paisPara(tipo) {
  if (tipo === O) return acoes.filter((a) => a.tipo === E && pode(OPERACAO.CRIAR_OPERACIONAL, a)).sort(porMesEId);
  if (tipo === S) return acoes.filter((a) => a.tipo === O && pode(OPERACAO.CRIAR_SUB_ACAO, a)).sort(porMesEId);

}
const tiposCriacao = () => Object.values(TIPO_ACAO).filter((t) => (t === E ? pode(OPERACAO.CRIAR_ESTRATEGICA) : paisPara(t).length > 0));
const dadosAcaoVazios = () => ({ descricao: '', unidadeId: '', prioridade: '', mes: '', responsaveisIds: [], pontosFocaisIds: [] });
function valoresIniciaisAcao(tipos) {
  const q = lerQuery();
  const tipo = tipos.includes(q.get(QUERY_ACOES.TIPO)) ? q.get(QUERY_ACOES.TIPO) : tipos[0];
  const pai = q.get(QUERY_ACOES.PAI) || '';
  return { tipo, paiId: paisPara(tipo).some((x) => String(x.id) === pai) ? pai : '', ...dadosAcaoVazios(), o: dadosAcaoVazios() };
}

function validarDadosAcao(d, prefixo, erros) {
  const chave = (c) => prefixo + c;
  // só espaços conta como vazio; o limite de 2.000 conta sem trim
  if (!d.descricao.trim()) erros[chave('descricao')] = MENSAGENS.PREENCHA;
  else if (d.descricao.length > LIMITES.DESCRICAO_ACAO) erros[chave('descricao')] = MENSAGENS.LIMITE_DESCRICAO;
  ['unidadeId', 'prioridade', 'mes'].forEach((c) => { if (!String(d[c]).trim()) erros[chave(c)] = MENSAGENS.PREENCHA; });
  if (!d.responsaveisIds.length) erros[chave('responsaveisIds')] = MENSAGENS.RESPONSAVEL_ATIVO;
}
function validarAcao(v) {
  const erros = {};
  if (v.tipo !== E && !v.paiId) erros.paiId = MENSAGENS.PREENCHA;
  validarDadosAcao(v, '', erros);
  if (v.tipo === E) validarDadosAcao(v.o, 'o_', erros);
  return erros;
}

function renderGerador() {
  const u = usuarioAtual();

function lerFormAcao(form) {

  const criada = criarAcao(v.tipo, v.tipo === E ? null : Number(v.paiId), v);
  if (v.tipo === E) criarAcao(O, criada.id, v.o); // a E nasce com a primeira O, no mesmo envio
  estado.formAcao = { valores: { tipo: v.tipo, paiId: v.paiId, ...dadosAcaoVazios(), o: dadosAcaoVazios() }, erros: {} };

  const grupoPessoas = (campo, rotulo, marcados) => ctl.grupo(n(campo), rotulo, pessoas.map((x) => `<label class="opcao"><input type="checkbox" name="${n(campo)}" value="${x.id}" ${marcados.includes(String(x.id)) ? 'checked' : ''}>${avatarPequeno(x.username)}${esc(x.username)}</label>`).join(''));
  return `<div class="form-grade">
      <label class="campo campo-largo"><span class="rotulo">Descrição da ação</span>
        <textarea class="textarea" name="${n('descricao')}" rows="3" placeholder="${esc(MENSAGENS.PLACEHOLDER_DESCRICAO)}" ${ctl.invalido(n('descricao'))}>${esc(d.descricao)}</textarea>
        <span class="campo-rodape">${ctl.erroDe(n('descricao'))}<span class="legenda num" id="contador-${n('descricao')}">${contadorTexto(d.descricao.length, LIMITES.DESCRICAO_ACAO)}</span></span></label>
      ${ctl.select(n('unidadeId'), 'Unidade', d.unidadeId, opcoesUnidades())}
      ${ctl.select(n('prioridade'), 'Prioridade', d.prioridade, Object.values(PRIORIDADE_ACAO).map((x) => [x, ROTULOS_PRIORIDADE[x]]))}
      ${ctl.input(n('mes'), TEXTOS_GERADOR_DATA.CAMPO, 'date', d.mes)}
      ${grupoPessoas('responsaveisIds', 'Responsáveis', d.responsaveisIds)}
      ${grupoPessoas('pontosFocaisIds', 'Pontos focais (opcional)', d.pontosFocaisIds)}
    </div>`;
});
const criarAcao = NBC.pontos.definir('acoes.gerador.criar', (tipo, acaoPaiId, d) => {
  const nova = {
    id: Math.max(0, ...acoes.map((a) => a.id)) + 1, tipo, acaoPaiId, descricao: d.descricao, unidadeId: Number(d.unidadeId),
    responsaveis: d.responsaveisIds.map((id) => ref(Number(id))), pontosFocais: d.pontosFocaisIds.map((id) => ref(Number(id))),
    // a API de hoje grava o último dia do mês; PROPOSTA D1 (data por dia) e D2 (concluidaEm), só no mock
    prioridade: d.prioridade, mesConclusaoEstimado: ultimoDiaDoMes(d.mes), status: STATUS_INICIAL_ACAO,
    dataConclusaoEstimada: d.mes, concluidaEm: null,
  };
  acoes.push(nova);
  if (tipo !== S) estado.expandidos.add(nova.id);
  if (acaoPaiId) estado.expandidos.add(acaoPaiId);
  return nova;
});

function pedirExclusaoAcao(id) {
  const a = acaoPorId(id);
  if (!a || !pode(OPERACAO.EXCLUIR, a) || motivoBloqueioExclusao(a)) return;
  confirmar({
    titulo: `Excluir ${ROTULOS_TIPO[a.tipo].toLowerCase()}?`,
    texto: { [E]: MENSAGENS.CONFIRMAR_EXCLUSAO_E, [O]: MENSAGENS.CONFIRMAR_EXCLUSAO_O, [S]: MENSAGENS.CONFIRMAR_EXCLUSAO_S }[a.tipo],
    rotulo: 'Excluir', aoConfirmar: () => excluirEmCascata(id),
  });
}

// T05 Detalhe da ação: dados, filhas visíveis (com o prazo por data) e histórico (B01)

  const u = usuarioAtual();

  const trilha = [];
  for (let pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null; pai; pai = pai.acaoPaiId ? acaoPorId(pai.acaoPaiId) : null) {
    trilha.unshift(`<a class="link-discreto" href="#/acoes/${pai.id}">${badgeTipo(pai.tipo, { compacto: true })} ${esc(pai.descricao)}</a>`);
  }
  trilha.unshift(`<a class="link-discreto" href="${ROTAS.ACOES}">Gestor de ações</a>`);

  const bloqueio = motivoBloqueioExclusao(a);
  let botoes = '';
  if (pode(OPERACAO.EDITAR, a)) botoes += botaoEmBreve('Editar');
  if (pode(OPERACAO.EXCLUIR, a)) {
    botoes += `<button type="button" class="btn btn-perigo" data-acao="excluir" data-id="${a.id}" ${bloqueio ? `disabled title="${esc(bloqueio)}"` : ''}>Excluir</button>`;
  }
  const somenteLeitura = !pode(OPERACAO.EDITAR, a) && !pode(OPERACAO.MUDAR_STATUS, a);

  const filhas = filhasDe(a.id).filter((x) => podeVer(x, u));
  const tipoFilha = a.tipo === E ? O : S;
  const podeCriarFilha = a.tipo === E ? pode(OPERACAO.CRIAR_OPERACIONAL, a) : pode(OPERACAO.CRIAR_SUB_ACAO, a);
  const botaoNovaFilha = podeCriarFilha
    ? `<a class="btn btn-secundario" href="${ROTAS.ACOES_GERADOR}&${QUERY_ACOES.TIPO}=${tipoFilha}&${QUERY_ACOES.PAI}=${a.id}">${icone('mais')}${esc(MENSAGENS.NOVA_FILHA(ROTULOS_TIPO[tipoFilha]))}</a>` : '';

  const cardFilhas = a.tipo === S ? '' : `<section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">${ROTULOS_TIPO_PLURAL[tipoFilha]} ${badgeContagem(filhas.length)}</h2>${botaoNovaFilha}</div>
      ${filhas.length ? `<table class="tabela"><thead><tr><th>Descrição</th><th>Responsáveis</th><th class="num">${esc(TEXTOS_PRAZO.COLUNA_FILHAS)}</th><th>Prioridade</th><th>Status</th></tr></thead><tbody>
        ${filhas.map((x) => `<tr><td><a class="link" href="#/acoes/${x.id}">${esc(x.descricao)}</a></td><td>${listaUsuarios(x.responsaveis)}</td><td class="num">${formatarPrazo(x)}</td><td>${badgePrioridade(x.prioridade)}</td><td><div class="badges">${seletorStatus(x)}${badgeVencida(x)}</div></td></tr>`).join('')}
      </tbody></table>` : estadoVazio(MENSAGENS.NENHUMA_FILHA)}
    </section>`;

  return `<nav class="trilha" aria-label="Trilha">${trilha.join('<span aria-hidden="true">/</span>')}</nav>`
    + cabecalho(a.descricao, '', botoes)
    + `<div class="badges">${badgeTipo(a.tipo)}${badgeStatus(a.status)}${badgeVencida(a)}</div>`
    + (bloqueio && pode(OPERACAO.EXCLUIR, a) ? `<p class="motivo">${esc(bloqueio)}</p>` : '')
    + (somenteLeitura ? `<p class="aviso">${esc(MENSAGENS.HERANCA)}</p>` : '')
    + `<section class="card"><h2 class="card-titulo">Dados da ação</h2>${gradeDadosAcao(a)}</section>`
    + cardFilhas
    + `<section class="card"><h2 class="card-titulo">Histórico de status</h2><p class="legenda">${esc(MENSAGENS.HISTORICO_EM_BREVE)}</p></section>`;
});

// ── telas/reunioes/lista.js
// T07 Gestor de reuniões e histórico de reuniões (mesma tabela; histórico = status FINALIZADA)
// participantes das reuniões visíveis: nada invisível entra no seletor
function opcoesParticipantes(visiveis) {
  const ids = new Set(visiveis.flatMap((r) => r.participantes.map((p) => p.id)));
  return [...ids].map(usuarioPorId).sort(porNome).map((p) => [p.id, rotuloPessoa(p)]);
}

function linhaReuniao(r, historico) {
  const l = horarioLocal(r.inicio);
  const nomes = r.participantes.map((p) => p.username).join(', ');
  const titulo = `<div class="celula"><span class="badges"><a class="link" href="#/reunioes/${r.id}">${esc(r.titulo)}</a>${badgePrioridadeReuniao(r.prioridade)}</span>
      <span class="legenda truncar" title="${esc(nomes)}">${esc(MENSAGENS.PARTICIPANTES_LISTA(nomes))}</span></div>`;
  const resumo = `<td class="col-acao"><button type="button" class="btn-quadrado" data-acao="reuniao-abrir" data-id="${r.id}" aria-label="${esc(MENSAGENS.VER_RESUMO(r.titulo))}" title="${esc(MENSAGENS.VER_RESUMO(r.titulo))}">${icone('olho')}</button></td>`;
  if (historico) {
    const presentes = r.historico.participantes.filter((p) => p.presente).length;
    return `<tr>${resumo}<td>${titulo}</td><td>${chipsUnidades(r.unidades)}</td>
      <td class="nowrap num">${esc(formatarData(l.data))}</td>
      <td class="nowrap num">${esc(MENSAGENS.PRESENTES(presentes, r.historico.participantes.length))}</td>
      <td class="num">${r.anexos.length}</td>
      <td class="nowrap num">${esc(formatarQuando(r.finalizadaEm))}</td></tr>`;
  }
  return `<tr>${resumo}<td>${titulo}</td><td>${chipsUnidades(r.unidades)}</td><td>${localOuLink(r.localOuLink)}</td>
    <td class="nowrap"><span class="celula"><span class="num">${esc(formatarDiaCurto(l.data))} · ${l.hora}</span><span class="legenda">${esc(MENSAGENS.DURACAO(formatarDuracao(duracaoMinutos(r))))}</span></span></td>
    <td>${badgeStatusReuniao(r)}</td></tr>`;
}

function renderReunioes(historico) {
  const grupo = historico ? 'filtrosHistoricoReunioes' : 'filtrosReunioes';
  const f = estado[grupo];
  const visiveis = reunioes.filter((r) => pode(OPERACAO.VER_REUNIAO, r) && Boolean(r.finalizadaEm) === historico);
  const participantes = opcoesParticipantes(visiveis);
  if (f.participanteId && !participantes.some(([v]) => String(v) === f.participanteId)) f.participanteId = ''; // troca de usuário
  const termo = normalizar(f.busca.trim());
  const lista = visiveis.filter((r) => (!f.unidadeId || r.unidades.some((un) => un.id === Number(f.unidadeId)))
      && (!f.participanteId || r.participantes.some((p) => p.id === Number(f.participanteId)))
      && (historico || !f.status || statusReuniao(r) === f.status)
      && (!termo || normalizar(`${r.titulo} ${r.assunto}`).includes(termo)))
    .sort(historico ? (a, b) => porInicio(b, a) : porInicio); // histórico: sort=inicio,desc
  const ativos = [f.unidadeId, f.participanteId, historico ? '' : f.status, f.busca.trim()].filter(Boolean).length;

  const statusAbertos = Object.values(STATUS_REUNIAO).filter((s) => s !== STATUS_REUNIAO.FINALIZADA).map((s) => [s, ROTULOS_STATUS_REUNIAO[s]]);
  const busca = `<label class="campo" ${f.busca.trim() ? 'data-ativo' : ''}><span class="rotulo">${esc(ROTULOS_FILTRO.BUSCA_REUNIAO)}</span>
      <span class="campo-icone">${icone('busca')}<input class="input" type="search" data-filtro="${grupo}.busca" value="${esc(f.busca)}" placeholder="${esc(ROTULOS_FILTRO.BUSCA_REUNIAO_DICA)}" autocomplete="off"></span></label>`;
  const filtros = `<section class="card filtros-painel filtros-reunioes" aria-label="Filtros de reuniões">
      <div class="filtros-campos">
        ${seletor(`${grupo}.unidadeId`, ROTULOS_FILTRO.UNIDADE, f.unidadeId, opcoesUnidades(), ROTULOS_FILTRO.TODAS_UNIDADES)}
        ${seletor(`${grupo}.participanteId`, ROTULOS_FILTRO.PARTICIPANTE, f.participanteId, participantes, ROTULOS_FILTRO.TODOS_PARTICIPANTES)}
        ${historico ? '' : seletor(`${grupo}.status`, ROTULOS_FILTRO.STATUS, f.status, statusAbertos, ROTULOS_FILTRO.TODOS_STATUS)}
        ${busca}
      </div>
      <div class="filtros-rodape"><span class="legenda" aria-live="polite">${esc(ativos ? MENSAGENS.FILTROS_ATIVOS(ativos) : MENSAGENS.SEM_FILTROS)}</span>
        <button type="button" class="btn btn-terciario" data-acao="limpar-filtros" data-grupo="${grupo}" ${ativos ? '' : 'disabled'}>Limpar filtros</button></div>
    </section>`;

  const vazio = ativos
    ? estadoVazio(MENSAGENS.NENHUMA_REUNIAO, `<button type="button" class="btn btn-secundario" data-acao="limpar-filtros" data-grupo="${grupo}">Limpar filtros</button>`)
    : estadoVazio(historico ? MENSAGENS.NENHUMA_REUNIAO_HISTORICO : MENSAGENS.NENHUMA_REUNIAO_AGENDADA, historico ? '' : botaoAgendar('btn-secundario'));
  const cabecalhoTabela = historico
    ? '<th class="col-acao"><span class="sr-only">Resumo</span></th><th>Reunião e pauta</th><th>Unidades</th><th>Data</th><th>Presença</th><th class="num">Anexos</th><th>Finalizada em</th>'
    : '<th class="col-acao"><span class="sr-only">Resumo</span></th><th>Reunião e pauta</th><th>Unidades</th><th>Local ou link</th><th>Horário</th><th>Status</th>';
  const tabela = `<section class="card">
      <div class="card-cabecalho"><h2 class="card-titulo">${historico ? 'Reuniões finalizadas' : 'Reuniões agendadas'} ${badgeContagem(lista.length)}</h2>
        ${historico ? '' : `<a class="link-discreto dica" href="${ROTAS.HISTORICO_REUNIOES}">${esc(MENSAGENS.VER_HISTORICO)}${icone('direita')}</a>`}</div>
      ${lista.length ? `<table class="tabela"><thead><tr>${cabecalhoTabela}</tr></thead><tbody>${lista.map((r) => linhaReuniao(r, historico)).join('')}</tbody></table>` : vazio}
    </section>`;

  if (historico) return cabecalho('Histórico de reuniões', 'Reuniões finalizadas, com presença e observação registradas') + filtros + tabela;
  const acoesCabecalho = `<a class="btn btn-secundario" href="${ROTAS.CALENDARIO_REUNIOES}">${icone('calendario')}${esc(MENSAGENS.VER_NO_CALENDARIO)}</a>` + botaoAgendar();
  const atas = `<section class="card card-discreto"><div class="card-cabecalho"><h2 class="card-titulo">Atas</h2><span class="badge">${esc(MENSAGENS.FORA_DO_MVP)}</span></div>
      <p class="legenda">${esc(MENSAGENS.ATAS_FORA_MVP)}</p></section>`;
  return cabecalho('Gestor de reuniões', 'Acompanhe, agende e gerencie pautas, participantes e anexos das reuniões', acoesCabecalho) + filtros + tabela + atas;
}

// pontos: a lista (sem id), as abas da sub-barra (nenhuma na base) e a rota do histórico
const telaReunioes = NBC.pontos.definir('reunioes.tela', () => renderReunioes(false));
const abasReunioes = NBC.pontos.definir('reunioes.abas', () => []);
