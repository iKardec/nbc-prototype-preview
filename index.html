// ── mudancas/calendario-cards-semana/calendario-cards-semana.js
// calendario-cards-semana (exp-09): na Semana do Período, cada ação vira um card que vai do primeiro ao último dia dela dentro
// da semana (antes: pílula de 100px na semana toda, com avatar, status e "▸" cortados). Três linhas: tipo, prazo e status;
// título; ação-mãe e avatares. Começa antes ou termina depois: canto reto e "desde dd/mm" / "até dd/mm" no lugar de ◂ ▸.
// Card de um dia: ponto do tipo e ponto de status em cima, título em até 2 linhas na largura toda (o resto continua na gaveta)
const TEXTOS_CARD_SEMANA = Object.freeze({
  DESDE: (data) => `desde ${data}`,
  ATE: (data) => `até ${data}`,
  PRAZO: (prazo) => `prazo ${prazo}`,
  MAIS: (n) => `+${n}`,
});
const diaMesCurto = (iso) => formatarData(iso).slice(0, 'dd/mm'.length);

function avataresCard(lista) {
  const mostrados = lista.slice(0, CONFIG.MAX_INICIAIS_CARTAO);
  const extra = lista.length - mostrados.length;
  return `<span class="cs-avatares" aria-hidden="true">${mostrados.map((r) => `<span class="cs-avatar">${esc(iniciais(r.username))}</span>`).join('')}${extra > 0 ? `<span class="cs-avatar cs-avatar-mais">${esc(TEXTOS_CARD_SEMANA.MAIS(extra))}</span>` : ''}</span>`;
}
// etiqueta de prazo: Vencida na cor cheia (Lei 9) ou o prazo D1
const etiquetaPrazoCard = (a) => (estaVencida(a) ? `<span class="cs-vencida">${ROTULO_VENCIDA}</span>` : `<span class="cs-prazo num">${esc(TEXTOS_CARD_SEMANA.PRAZO(formatarPrazo(a)))}</span>`);
const statusCard = (a) => `<span class="cs-status">${esc(ROTULOS_STATUS_ACAO[a.status])}</span>`;

NBC.pontos.substituir('calendario.semana', (lista, segunda) => {
  const u = usuarioAtual();
  const dias = diasDaSemana(segunda);
  const domingo = dias[dias.length - 1];
  const cabecalho = dias.map((d) => `<div class="dia-titulo" ${ehFimDeSemana(d) ? 'data-fim-de-semana' : ''} ${d === HOJE ? 'data-hoje' : ''}>${esc(formatarDiaCurto(d))}${d === HOJE ? `<span class="hoje-legenda">${esc(ROTULOS_CALENDARIO.HOJE)}</span>` : ''}</div>`).join('');
  const cards = lista.map((a, i) => {
    const { inicio, fim } = intervaloDaAcao(a);
    const antes = inicio < segunda;
    const depois = fim > domingo;
    const ini = colunaDe(dias, antes ? segunda : inicio);
    const ult = colunaDe(dias, depois ? domingo : fim);
    const extra = (antes ? `. ${MENSAGENS.CONTINUA_ANTES}` : '') + (depois ? `. ${MENSAGENS.CONTINUA_DEPOIS}` : '');
    const atributos = atributosFaixa(a, segunda, i + 1, ini, ult, extra);
    const marcas = `data-tipo="${a.tipo}" ${antes ? 'data-antes' : ''} ${depois ? 'data-depois' : ''}`;
    const ponto = '<span class="cs-ponto" aria-hidden="true"></span>';
    if (ini === ult) {
      return `<button class="cartao-semana cartao-semana-dia" ${marcas} ${atributos}>
          <span class="cs-dia-linha">${ponto}<span class="cs-ponto-status" role="img" aria-label="${esc(ROTULOS_STATUS_ACAO[a.status])}"></span></span>
          <span class="cs-titulo cs-titulo-duas">${esc(a.descricao)}</span>
        </button>`;
    }
    const pai = a.acaoPaiId ? acaoPorId(a.acaoPaiId) : null;
    const textoPai = pai && podeVer(pai, u) ? `<span class="cs-pai">${PREFIXO_PAI} ${esc(pai.descricao)}</span>` : '<span class="cs-pai"></span>';
    return `<button class="cartao-semana" ${marcas} ${atributos}>
        <span class="cs-linha"><span class="cs-tipo">${ponto}<span class="cs-tipo-rotulo">${esc(ROTULOS_TIPO[a.tipo])}</span></span>${etiquetaPrazoCard(a)}${statusCard(a)}</span>
        <span class="cs-titulo">${esc(a.descricao)}</span>
        <span class="cs-linha cs-base">${antes ? `<span class="cs-continua num">${esc(TEXTOS_CARD_SEMANA.DESDE(diaMesCurto(inicio)))}</span>` : ''}${textoPai}${depois ? `<span class="cs-continua num">${esc(TEXTOS_CARD_SEMANA.ATE(diaMesCurto(fim)))}</span>` : ''}${avataresCard(a.responsaveis)}</span>
      </button>`;
  }).join('');
  return `<div class="semana-quadro">
      <div class="dias-cabecalho">${cabecalho}</div>
      <div class="semana-corpo semana-cards">
        <div class="dias-fundo" aria-hidden="true">${dias.map((d) => diaFundo(d, false, false)).join('')}</div>
        <div class="faixas">${cards}</div>
      </div>
    </div>`;
});

// ── mudancas/seletor-semana/seletor-semana.js
// seletor-semana (exp-09): o mini calendário vira um componente compartilhado, NBC.componentes.seletorSemana (Calendário e
// Kanban). Entrada: { semanaSelecionada, mesVisivel, marcadores(dia) → número, rotuloMarcador(n), rotulo, extraTopo }.
// Saída: o evento DOM "semana:escolhida" (borbulha da raiz, detail { id, segunda, domingo, dia }); "semana:mes" avisa a troca
// de mês. As setas ‹ › e o teclado redesenham só o componente, sem render() da página
const TEXTOS_SELETOR = Object.freeze({
  ROTULO: 'Seletor de semanas',
  MES_ANTERIOR: 'Mês anterior',
  MES_SEGUINTE: 'Próximo mês',
  INICIAIS: Object.freeze(['S', 'T', 'Q', 'Q', 'S', 'S', 'D']),
  DIA: (iso) => { const [ano, mes, dia] = iso.split('-').map(Number); return `${DIAS_SEMANA_NOME[indiceDiaSemana(iso)]}, ${dia} de ${MESES_NOME[mes - 1]} de ${ano}`; },
  HOJE: 'hoje',
  ESCOLHIDA: 'semana escolhida',
  MES: (iso) => { const [ano, mes] = iso.split('-').map(Number); return `${MESES_NOME[mes - 1]} ${ano}`; },
});

const seletoresSemana = new Map(); // id → { opcoes, mes, mesDado }
const domingoDaSemana = (segunda) => somarDias(segunda, CONFIG.DIAS_POR_SEMANA - 1);
function semanasDoMes(mes) {
  const primeira = segundaDe(mes);
  const fimMes = ultimoDiaDoMes(mes);
  const lista = [];
  for (let seg = primeira; seg <= fimMes; seg = somarDias(seg, CONFIG.DIAS_POR_SEMANA)) lista.push(seg);
  return lista;
}
// dia que recebe o Tab (tabindex itinerante): a segunda da semana escolhida, hoje ou o dia 1 do mês à vista
function diaDoFoco(inst) {
  const semanas = semanasDoMes(inst.mes);
  const [inicio, fim] = [semanas[0], domingoDaSemana(semanas[semanas.length - 1])];
  const dentro = (d) => d && d >= inicio && d <= fim;
  if (dentro(inst.opcoes.semanaSelecionada)) return inst.opcoes.semanaSelecionada;
  return dentro(HOJE) ? HOJE : inst.mes;
}

function desenharSeletor(id) {
  const T = TEXTOS_SELETOR;
  const inst = seletoresSemana.get(id);
  const o = inst.opcoes;
  const foco = diaDoFoco(inst);
  const semanas = semanasDoMes(inst.mes).map((seg) => {
    const escolhida = seg === o.semanaSelecionada;
    const dias = diasDaSemana(seg).map((d) => {
      const n = o.marcadores ? o.marcadores(d) : 0;
      const partes = [T.DIA(d)];
      if (n && o.rotuloMarcador) partes.push(o.rotuloMarcador(n));
      if (d === HOJE) partes.push(T.HOJE);
      if (escolhida) partes.push(T.ESCOLHIDA);
      return `<button type="button" class="ss-dia" data-ss-dia="${d}" tabindex="${d === foco ? 0 : -1}" aria-pressed="${escolhida}" ${d === HOJE ? 'aria-current="date"' : ''} ${d.slice(0, 7) !== inst.mes.slice(0, 7) ? 'data-fora' : ''} aria-label="${esc(partes.join(', '))}">
          <span class="ss-numero num" aria-hidden="true">${diaDoMes(d)}</span>${n ? '<span class="ss-ponto" aria-hidden="true"></span>' : ''}</button>`;
    }).join('');
    return `<div class="ss-semana" ${escolhida ? 'data-escolhida' : ''}>${dias}</div>`;
  }).join('');
  return `<div class="seletor-semana" data-seletor="${id}" role="group" aria-label="${esc(o.rotulo || T.ROTULO)}">
      <div class="ss-topo">
        <button type="button" class="ss-passo" data-ss-mes="-1" aria-label="${esc(T.MES_ANTERIOR)}" title="${esc(T.MES_ANTERIOR)}">${icone('esquerda')}</button>
        <span class="ss-mes">${esc(T.MES(inst.mes))}</span>
        <button type="button" class="ss-passo" data-ss-mes="1" aria-label="${esc(T.MES_SEGUINTE)}" title="${esc(T.MES_SEGUINTE)}">${icone('direita')}</button>
        ${o.extraTopo || ''}
      </div>
      <div class="ss-grade">
        <div class="ss-iniciais" aria-hidden="true">${T.INICIAIS.map((x) => `<span>${x}</span>`).join('')}</div>
        ${semanas}
      </div>
    </div>`;
}

// troca o mês à vista e redesenha só o componente; devolve a raiz nova
function trocarMesSeletor(raiz, mes) {
  const id = raiz.dataset.seletor;
  const inst = seletoresSemana.get(id);
  inst.mes = inicioDoMes(mes);
  raiz.outerHTML = desenharSeletor(id);
  const nova = document.querySelector(`.seletor-semana[data-seletor="${id}"]`);
  nova.dispatchEvent(new CustomEvent('semana:mes', { bubbles: true, detail: { id, mes: inst.mes } }));
  return nova;
}
function focarDiaSeletor(id, dia) {
  const raiz = document.querySelector(`.seletor-semana[data-seletor="${id}"]`);
  const alvo = raiz && raiz.querySelector(`[data-ss-dia="${dia}"]`);
  if (!alvo) return false;
  raiz.querySelectorAll('.ss-dia[tabindex="0"]').forEach((b) => { b.tabIndex = -1; });
  alvo.tabIndex = 0;
  alvo.focus({ preventScroll: true });
  return true;
}

NBC.componentes.registrar('seletorSemana', {
  // mesVisivel só reinicia o mês quando quem usa muda o valor; as setas internas não dependem de redesenho da página
  html(id, opcoes) {
    const inst = seletoresSemana.get(id) || {};
    if (opcoes.mesVisivel !== inst.mesDado) inst.mes = inicioDoMes(opcoes.mesVisivel);
    inst.mesDado = opcoes.mesVisivel;
    inst.opcoes = opcoes;
    seletoresSemana.set(id, inst);
    return desenharSeletor(id);
  },
  focar: focarDiaSeletor,
  focarItinerante: (id) => { const raiz = document.querySelector(`.seletor-semana[data-seletor="${id}"]`); raiz?.querySelector('.ss-dia[tabindex="0"]')?.focus({ preventScroll: true }); },
});

document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const raiz = evento.target.closest('.seletor-semana');
  if (!raiz) return;
  const dia = evento.target.closest('[data-ss-dia]');
  if (dia) {
    const segunda = segundaDe(dia.dataset.ssDia);
    raiz.dispatchEvent(new CustomEvent('semana:escolhida', { bubbles: true, detail: { id: raiz.dataset.seletor, segunda, domingo: domingoDaSemana(segunda), dia: dia.dataset.ssDia } }));
    return;
  }
  const passo = evento.target.closest('[data-ss-mes]');
  if (!passo) return;
  const inst = seletoresSemana.get(raiz.dataset.seletor);
  const nova = trocarMesSeletor(raiz, somarMeses(inst.mes, Number(passo.dataset.ssMes)));
  nova.querySelector(`[data-ss-mes="${passo.dataset.ssMes}"]`)?.focus({ preventScroll: true });
  anunciar(TEXTOS_SELETOR.MES(inst.mes));
});
// setas por dia (±1 e ±7), Home e End na semana, PageUp e PageDown trocam o mês; fora do mês à vista, o componente acompanha
document.addEventListener('keydown', (evento) => {
  const dia = evento.target instanceof Element ? evento.target.closest('.ss-dia') : null;
  if (!dia) return;
  const raiz = dia.closest('.seletor-semana');
  const atual = dia.dataset.ssDia;
  const i = indiceDiaSemana(atual);
  let destino;
  if (evento.key === 'PageUp' || evento.key === 'PageDown') {
    const mes = somarMeses(atual, evento.key === 'PageUp' ? -1 : 1);
    const ultimo = Number(ultimoDiaDoMes(mes).slice(8));
    destino = `${mes.slice(0, 8)}${String(Math.min(Number(atual.slice(8)), ultimo)).padStart(2, '0')}`;
  } else {
    const passo = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -CONFIG.DIAS_POR_SEMANA, ArrowDown: CONFIG.DIAS_POR_SEMANA, Home: -i, End: CONFIG.DIAS_POR_SEMANA - 1 - i }[evento.key];
    if (passo === undefined) return;
    destino = somarDias(atual, passo);
  }
  evento.preventDefault();
  const id = raiz.dataset.seletor;
  const pagina = evento.key === 'PageUp' || evento.key === 'PageDown';
  if (!pagina && focarDiaSeletor(id, destino)) return;
  trocarMesSeletor(raiz, destino);
  focarDiaSeletor(id, destino);
});

// Calendário: o guia de semanas passa a ser o componente (aberto); recolhido, continua o botão da base
NBC.pontos.substituir('calendario.guia', (contagens, anterior) => {
  const c = estado.calendario;
  const g = c.guia;
  if (g.aberto === null) g.aberto = window.innerWidth >= CONFIG_GUIA.LARGURA_ABERTO;
  if (!g.aberto) return anterior(contagens);
  if (g.referencia !== c.referencia) { g.mes = inicioDoMes(c.referencia); g.referencia = c.referencia; }
  const recolher = `<button type="button" class="ss-passo ss-recolher" data-guia="recolher" aria-expanded="true" aria-label="${esc(TEXTOS_GUIA.RECOLHER)}" title="${esc(TEXTOS_GUIA.RECOLHER)}"><i class="ph ${ICONES_GUIA.RECOLHER}" aria-hidden="true"></i></button>`;
  return NBC.componentes.seletorSemana.html('calendario', {
    semanaSelecionada: segundaDe(c.referencia),
    mesVisivel: g.mes,
    marcadores: (d) => (contagens ? contagens.porDia.get(d) || 0 : 0),
    rotuloMarcador: (n) => (contagens.tipo === 'reunioes' ? TEXTOS_GUIA.REUNIOES(n) : TEXTOS_GUIA.VENCIMENTOS(n)),
    rotulo: TEXTOS_GUIA.ROTULO,
    extraTopo: recolher,
  });
});
document.addEventListener('semana:mes', (evento) => { if (evento.detail.id === 'calendario') estado.calendario.guia.mes = evento.detail.mes; });
// escolher um dia leva a grade para a semana dele; o guia fica no mês que estava à vista
document.addEventListener('semana:escolhida', (evento) => {
  if (evento.detail.id !== 'calendario') return;
  estado.calendario.referencia = evento.detail.dia;
  estado.calendario.guia.referencia = evento.detail.dia;
  estado.calendarioTrocado = true;
  render();
  NBC.componentes.seletorSemana.focar('calendario', evento.detail.dia);
});

// ── mudancas/kanban-semana-calendario/kanban-semana-calendario.js
// kanban-semana-calendario (exp-09; requer seletor-semana e kanban-semana-vencimento): o intervalo do campo "Semana de vencimento"
// vira botão que abre, logo abaixo do campo, um popover com o seletor de semanas. Os pontos marcam os dias com prazo de ação
// visível ao usuário. Escolher um dia aplica a semana inteira (segunda a domingo), fecha e devolve o foco; Esc, clique fora e
// foco saindo fecham sem escolher. ‹ ›, atalhos, contagens e anúncio continuam como no exp-08
const TEXTOS_POPOVER_SEMANA = Object.freeze({
  ROTULO: 'Escolher a semana de vencimento',
  ABRIR: 'Escolher a semana no calendário',
});
const popoverSemana = document.createElement('div');
popoverSemana.id = 'popover-semana';
popoverSemana.className = 'popover-semana';
popoverSemana.setAttribute('role', 'dialog');
popoverSemana.setAttribute('aria-label', TEXTOS_POPOVER_SEMANA.ROTULO);
popoverSemana.hidden = true;
document.body.append(popoverSemana);
let semanaAberta = false;

// o intervalo (e a etiqueta) passa a ser o botão; os passos ‹ › continuam em volta
NBC.pontos.substituir('acoes.filtros.extra', (visao, anterior) => anterior(visao).replace(
  /<span class="semana-intervalo">([\s\S]*?)<\/span>(<button[^>]*data-semana-passo="1")/,
  `<button type="button" class="semana-intervalo semana-abrir" aria-haspopup="dialog" aria-expanded="false" aria-controls="popover-semana" title="${esc(TEXTOS_POPOVER_SEMANA.ABRIR)}">$1</button>$2`,
));

function prazosVisiveis() {

  const fixo = ['.topo', '#subnav:not([hidden])'].reduce((t, s) => t + (document.querySelector(s)?.getBoundingClientRect().height || 0), 0);
  const barra = document.querySelector('#conteudo .calendario-barra')?.getBoundingClientRect().height || 0;

function posicionarDica(alvo) {

    topo = r.bottom + M + h <= window.innerHeight - M ? r.bottom + M : r.top - M - h;
  }

// reunioes-unificadas (exp-09; canvas "NBC — Reuniões unificadas", GestorReunioes e Header): o Histórico de reuniões sai do
// menu e vira a aba Finalizadas do Gestor de reuniões, ao lado de Em aberto, na linha 2 do cabeçalho. #/historico-reunioes
// redireciona. Cada aba tem filtros próprios (em memória), "Ordenar", "Mostrando X de Y" e paginação. Visibilidade só por
// vínculo (pode VER_REUNIAO), nos dois papéis
const ABA_REUNIOES = Object.freeze({ ABERTAS: 'ABERTAS', FINALIZADAS: 'FINALIZADAS' });
const QUERY_REUNIOES = Object.freeze({ PARAMETRO: 'aba', FINALIZADAS: 'finalizadas' });
const ROTA_ABA_REUNIOES = Object.freeze({ ABERTAS: ROTAS.REUNIOES, FINALIZADAS: `${ROTAS.REUNIOES}?${QUERY_REUNIOES.PARAMETRO}=${QUERY_REUNIOES.FINALIZADAS}` });
const ROTULOS_ABA_REUNIOES = Object.freeze({ ABERTAS: 'Em aberto', FINALIZADAS: 'Finalizadas' });
const ICONES_ABA_REUNIOES = Object.freeze({ ABERTAS: 'calendario', FINALIZADAS: 'historico' });
const ORDEM_REUNIOES = Object.freeze({ PROXIMAS: 'PROXIMAS', RECENTES: 'RECENTES' });
const ROTULOS_ORDEM_REUNIOES = Object.freeze({ PROXIMAS: 'Mais próximas', RECENTES: 'Mais recentes' });
const CONFIG_REUNIOES = Object.freeze({ POR_PAGINA: 10, MAX_AVATARES: 3 });
const TEXTOS_REUNIOES = Object.freeze({
  TITULO: 'Gestor de reuniões',
  SUBTITULO: 'Agende, acompanhe e consulte reuniões, presenças e anexos em um só lugar',
  LISTA: Object.freeze({ ABERTAS: 'Reuniões em aberto', FINALIZADAS: 'Reuniões finalizadas' }),
  FILTROS: 'Filtros de reuniões',
  TABELA: 'Lista de reuniões; em telas estreitas, role para os lados',
  ORDENAR: 'Ordenar',
  BUSCA: 'Busca', BUSCA_DICA: 'Título ou pauta',
  PRIORIDADE: 'Prioridade', TODAS_PRIORIDADES: 'Todas',
  MES: 'Mês', TODOS_MESES: 'Todos os meses', MES_ROTULO: (iso) => { const [ano, mes] = iso.split('-').map(Number); return `${MESES_NOME[mes - 1]} de ${ano}`; },
  COLUNAS: Object.freeze({
    ABERTAS: Object.freeze(['Reunião e participantes', 'Unidades', 'Quando', 'Local ou link', 'Anexos', 'Status']),
    FINALIZADAS: Object.freeze(['Reunião e participantes', 'Unidades', 'Data', 'Presença', 'Anexos', 'Ata', 'Finalizada em']),
  }),
  ABRIR_COLUNA: 'Abrir',
  ABRIR: (titulo) => `Abrir ${titulo}`,
  DURACAO: (d) => `Duração: ${d}`,
  SEM_ATA: 'Sem ata', COM_ATA: 'Com ata',
  SEM_ANEXOS: '—', SEM_ANEXOS_LEITOR: 'Sem anexos',
  ANEXOS: (n) => (n === 1 ? '1 anexo' : `${n} anexos`),
  FINALIZADA_EM: (iso) => formatarQuando(iso),
  MOSTRANDO: (x, y) => `Mostrando ${x} de ${y}`,
  PAGINA_ANTERIOR: 'Página anterior', PROXIMA_PAGINA: 'Próxima página',
  PAGINA: (p, n) => `Página ${p} de ${n}`,
  LIMPAR: 'Limpar filtros',
});
const FILTROS_REUNIOES_INICIAIS = Object.freeze({
  ABERTAS: Object.freeze({ busca: '', unidadeId: '', participanteId: '', status: '', prioridade: '' }),
  FINALIZADAS: Object.freeze({ busca: '', unidadeId: '', participanteId: '', mes: '', prioridade: '' }),
});
const GRUPO_FILTROS_REUNIOES = Object.freeze({ ABERTAS: 'filtrosReunioesAbertas', FINALIZADAS: 'filtrosReunioesFinalizadas' });
estado.filtrosReunioesAbertas = { ...FILTROS_REUNIOES_INICIAIS.ABERTAS };
estado.filtrosReunioesFinalizadas = { ...FILTROS_REUNIOES_INICIAIS.FINALIZADAS };
estado.ordemReunioes = { ABERTAS: ORDEM_REUNIOES.PROXIMAS, FINALIZADAS: ORDEM_REUNIOES.RECENTES };
estado.paginaReunioes = { ABERTAS: 1, FINALIZADAS: 1 };
estado.abaReunioesOrigem = null; // a aba de onde o detalhe foi aberto (link de volta)

const abaReunioes = () => (lerQuery().get(QUERY_REUNIOES.PARAMETRO) === QUERY_REUNIOES.FINALIZADAS ? ABA_REUNIOES.FINALIZADAS : ABA_REUNIOES.ABERTAS);

// menu sem "Histórico de reuniões"; abas na linha 2 do cabeçalho; a rota antiga leva à aba Finalizadas
NBC.pontos.substituir('shell.menu', (anterior) => anterior().filter((m) => m.rota !== ROTAS.HISTORICO_REUNIOES));
NBC.pontos.substituir('reunioes.abas', () => Object.values(ABA_REUNIOES).map((a) => ({
  chave: a, href: ROTA_ABA_REUNIOES[a], rotulo: ROTULOS_ABA_REUNIOES[a], icone: ICONES_ABA_REUNIOES[a], ativo: a === abaReunioes(), extra: '',
})));
NBC.pontos.substituir('reunioes.historico', () => { location.replace(ROTA_ABA_REUNIOES.FINALIZADAS); return ''; });
// o detalhe volta à aba de onde veio; aberto direto (link, calendário), pelo status
NBC.pontos.substituir('reunioes.detalhe.voltar', (r) => {
  const aba = estado.abaReunioesOrigem || (r.finalizadaEm ? ABA_REUNIOES.FINALIZADAS : ABA_REUNIOES.ABERTAS);
  return `<a class="link-discreto voltar-reunioes" href="${ROTA_ABA_REUNIOES[aba]}">${icone('esquerda')}${esc(TEXTOS_REUNIOES.LISTA[aba])}</a>`;
});

// célula de anexos (o popover entra pela mudança reunioes-anexos-popover); na listagem, quantidadeAnexos = r.anexos.length
const celulaAnexosReuniao = NBC.pontos.definir('reunioes.lista.anexos', (r) => (r.anexos.length
  ? `<span class="anexos-quantidade num" title="${esc(TEXTOS_REUNIOES.ANEXOS(r.anexos.length))}">${icone('anexo')}${r.anexos.length}</span>`
  : `<span class="legenda" aria-hidden="true">${TEXTOS_REUNIOES.SEM_ANEXOS}</span><span class="sr-only">${esc(TEXTOS_REUNIOES.SEM_ANEXOS_LEITOR)}</span>`));

function avataresReuniao(r) {
  const mostrados = r.participantes.slice(0, CONFIG_REUNIOES.MAX_AVATARES);
  return `<span class="ru-avatares" aria-hidden="true">${mostrados.map((p) => `<span class="ru-avatar">${esc(iniciais(p.username))}</span>`).join('')}</span>`;
}
function celulaReuniao(r) {
  const nomes = r.participantes.map((p) => p.username).join(', ');
  return `<td><div class="ru-reuniao">
      <span class="ru-titulo-linha"><a class="ru-titulo" href="#/reunioes/${r.id}" title="${esc(r.titulo)}">${esc(r.titulo)}</a>${badgePrioridadeReuniao(r.prioridade)}</span>
      <span class="ru-pessoas">${avataresReuniao(r)}<span class="ru-nomes" title="${esc(nomes)}"><span class="sr-only">${esc(MENSAGENS.PARTICIPANTES_LISTA(''))}</span>${esc(nomes)}</span></span>
    </div></td>`;
}
const celulaAbrir = (r) => `<td class="ru-col-abrir"><a class="btn-quadrado ru-abrir" href="#/reunioes/${r.id}" aria-label="${esc(TEXTOS_REUNIOES.ABRIR(r.titulo))}" title="${esc(TEXTOS_REUNIOES.ABRIR(r.titulo))}">${icone('direita')}</a></td>`;
function presencaReuniao(r) {
  const lista = r.historico ? r.historico.participantes : r.participantes;
  const presentes = lista.filter((p) => p.presente).length;
  const total = lista.length;
  return `<div class="ru-presenca"><span class="ru-presenca-texto num">${esc(MENSAGENS.PRESENTES(presentes, total))}</span>
      <span class="barra-presenca" aria-hidden="true"><span class="barra-presenca-cheia" style="width:${total ? Math.round((presentes / total) * 100) : 0}%"></span></span></div>`;
}
function linhaReuniaoUnificada(r, aba) {
  const l = horarioLocal(r.inicio);
  const anexos = `<td class="ru-col-anexos">${celulaAnexosReuniao(r)}</td>`;
  if (aba === ABA_REUNIOES.FINALIZADAS) {
    return `<tr>${celulaReuniao(r)}<td>${chipsUnidades(r.unidades)}</td><td class="nowrap"><span class="ru-forte num">${esc(formatarData(l.data))}</span></td>
      <td>${presencaReuniao(r)}</td>${anexos}<td class="legenda nowrap">${r.historico && r.historico.possuiAta ? esc(TEXTOS_REUNIOES.COM_ATA) : `<span title="${esc(MENSAGENS.SEM_ATA)}">${esc(TEXTOS_REUNIOES.SEM_ATA)}</span>`}</td>
      <td class="legenda nowrap num">${esc(TEXTOS_REUNIOES.FINALIZADA_EM(r.finalizadaEm))}</td>${celulaAbrir(r)}</tr>`;
  }
  return `<tr>${celulaReuniao(r)}<td>${chipsUnidades(r.unidades)}</td>
    <td class="nowrap"><span class="celula"><span class="ru-forte num">${esc(formatarDiaCurto(l.data))} · ${l.hora}</span><span class="legenda">${esc(TEXTOS_REUNIOES.DURACAO(formatarDuracao(duracaoMinutos(r))))}</span></span></td>
    <td class="ru-col-local">${localOuLink(r.localOuLink)}</td>${anexos}<td>${badgeStatusReuniao(r)}</td>${celulaAbrir(r)}</tr>`;
}

function renderGestorReunioes() {
  const T = TEXTOS_REUNIOES;
  const aba = abaReunioes();
  const fin = aba === ABA_REUNIOES.FINALIZADAS;
  estado.abaReunioesOrigem = aba;
  const grupo = GRUPO_FILTROS_REUNIOES[aba];
  const f = estado[grupo];
  const visiveis = reunioes.filter((r) => pode(OPERACAO.VER_REUNIAO, r) && Boolean(r.finalizadaEm) === fin);
  const participantes = opcoesParticipantes(visiveis);
  if (f.participanteId && !participantes.some(([v]) => String(v) === f.participanteId)) f.participanteId = ''; // troca de usuário
  const meses = [...new Set(visiveis.map((r) => horarioLocal(r.inicio).data.slice(0, 7)))].sort().reverse();
  if (fin && f.mes && !meses.includes(f.mes)) f.mes = '';
  const termo = normalizar(f.busca.trim());
  const ordem = estado.ordemReunioes[aba];
  const lista = visiveis.filter((r) => {
    const data = horarioLocal(r.inicio).data;
    return (!f.unidadeId || r.unidades.some((un) => un.id === Number(f.unidadeId)))
      && (!f.participanteId || r.participantes.some((p) => p.id === Number(f.participanteId)))
      && (fin || !f.status || statusReuniao(r) === f.status)
      && (!fin || !f.mes || (data >= `${f.mes}-01` && data <= ultimoDiaDoMes(`${f.mes}-01`))) // de/ate sobre inicio
      && (!f.prioridade || r.prioridade === f.prioridade)
      && (!termo || normalizar(`${r.titulo} ${r.assunto}`).includes(termo));
  }).sort(ordem === ORDEM_REUNIOES.RECENTES ? (a, b) => porInicio(b, a) : porInicio);
  const ativos = Object.keys(FILTROS_REUNIOES_INICIAIS[aba]).filter((k) => String(f[k]).trim()).length;
  const paginas = Math.max(1, Math.ceil(lista.length / CONFIG_REUNIOES.POR_PAGINA));
  const pagina = Math.min(estado.paginaReunioes[aba], paginas);
  estado.paginaReunioes[aba] = pagina;
  const naPagina = lista.slice((pagina - 1) * CONFIG_REUNIOES.POR_PAGINA, pagina * CONFIG_REUNIOES.POR_PAGINA);

  const statusAbertos = Object.values(STATUS_REUNIAO).filter((s) => s !== STATUS_REUNIAO.FINALIZADA).map((s) => [s, ROTULOS_STATUS_REUNIAO[s]]);
  const prioridades = Object.values(PRIORIDADE_REUNIAO).map((p) => [p, ROTULOS_PRIORIDADE_REUNIAO[p]]);
  const busca = `<label class="campo campo-busca-reunioes" ${f.busca.trim() ? 'data-ativo' : ''}><span class="rotulo">${esc(T.BUSCA)}</span>
      <span class="campo-icone">${icone('busca')}<input class="input" type="search" data-filtro="${grupo}.busca" value="${esc(f.busca)}" placeholder="${esc(T.BUSCA_DICA)}" autocomplete="off"></span></label>`;
  const limpar = (classe) => `<button type="button" class="btn ${classe}" data-limpar-reunioes="${aba}" ${ativos ? '' : 'disabled'}>${esc(T.LIMPAR)}</button>`;
  const filtros = `<section class="card filtros-painel filtros-reunioes" aria-label="${esc(T.FILTROS)}">
      <div class="filtros-campos">
        ${busca}
        ${seletor(`${grupo}.unidadeId`, ROTULOS_FILTRO.UNIDADE, f.unidadeId, opcoesUnidades(), ROTULOS_FILTRO.TODAS_UNIDADES)}
        ${seletor(`${grupo}.participanteId`, ROTULOS_FILTRO.PARTICIPANTE, f.participanteId, participantes, ROTULOS_FILTRO.TODOS_PARTICIPANTES)}
        ${fin ? seletor(`${grupo}.mes`, T.MES, f.mes, meses.map((m) => [m, T.MES_ROTULO(m)]), T.TODOS_MESES)
    : seletor(`${grupo}.status`, ROTULOS_FILTRO.STATUS, f.status, statusAbertos, ROTULOS_FILTRO.TODOS_STATUS)}
        ${seletor(`${grupo}.prioridade`, T.PRIORIDADE, f.prioridade, prioridades, T.TODAS_PRIORIDADES)}
      </div>
      <div class="filtros-rodape"><span class="legenda" aria-live="polite">${esc(ativos ? MENSAGENS.FILTROS_ATIVOS(ativos) : MENSAGENS.SEM_FILTROS)}</span>${limpar('btn-secundario')}</div>
    </section>`;

  const ordenar = `<label class="ru-ordenar"><span class="rotulo">${esc(T.ORDENAR)}</span><select class="select" data-filtro="ordemReunioes.${aba}">${Object.values(ORDEM_REUNIOES).map((o) => `<option value="${o}" ${o === ordem ? 'selected' : ''}>${esc(ROTULOS_ORDEM_REUNIOES[o])}</option>`).join('')}</select></label>`;
  const vazio = ativos
    ? estadoVazio(MENSAGENS.NENHUMA_REUNIAO, limpar('btn-secundario'))
    : estadoVazio(fin ? MENSAGENS.NENHUMA_REUNIAO_HISTORICO : MENSAGENS.NENHUMA_REUNIAO_AGENDADA, fin ? '' : botaoAgendar('btn-secundario'));
  const colunas = T.COLUNAS[aba].map((c) => `<th scope="col" ${c === T.COLUNAS[aba][4] ? 'class="ru-col-anexos"' : ''}>${esc(c)}</th>`).join('') + `<th scope="col" class="ru-col-abrir"><span class="sr-only">${esc(T.ABRIR_COLUNA)}</span></th>`;
  const passo = (n, rotulo, nome, desabilitado) => `<button type="button" class="ru-pagina" data-pagina-reunioes data-passo="${n}" aria-label="${esc(rotulo)}" title="${esc(rotulo)}" ${desabilitado ? 'disabled' : ''}>${icone(nome)}</button>`;
  const rodape = `<div class="ru-rodape"><span class="legenda" aria-live="polite">${esc(T.MOSTRANDO(naPagina.length, lista.length))}${paginas > 1 ? `<span class="sr-only">. ${esc(T.PAGINA(pagina, paginas))}</span>` : ''}</span>
      <div class="ru-paginas">${passo(-1, T.PAGINA_ANTERIOR, 'esquerda', pagina === 1)}${passo(1, T.PROXIMA_PAGINA, 'direita', pagina === paginas)}</div></div>`;
  const tabela = `<section class="ru-lista" aria-labelledby="ru-titulo-lista">
      <div class="ru-lista-cabecalho"><h2 class="card-titulo" id="ru-titulo-lista">${esc(T.LISTA[aba])} ${badgeContagem(lista.length)}</h2>${ordenar}</div>
      <div class="ru-caixa">${lista.length
    ? `<div class="ru-rolagem" role="region" tabindex="0" aria-label="${esc(T.TABELA)}"><table class="tabela ru-tabela" data-aba="${aba}"><thead><tr>${colunas}</tr></thead>
          <tbody>${naPagina.map((r) => linhaReuniaoUnificada(r, aba)).join('')}</tbody></table></div>${rodape}`
    : vazio}</div>
    </section>`;
  const acoesCabecalho = `<a class="btn btn-secundario" href="${ROTAS.CALENDARIO_REUNIOES}">${icone('calendario')}${esc(MENSAGENS.VER_NO_CALENDARIO)}</a>` + botaoAgendar();
  return cabecalho(T.TITULO, T.SUBTITULO, acoesCabecalho) + filtros + tabela;
}
NBC.pontos.substituir('reunioes.tela', () => renderGestorReunioes());

// filtros e ordem mudam a lista: volta à primeira página (captura: antes do ouvinte base, que redesenha)
const voltarPrimeiraPagina = (evento) => {
  const alvo = evento.target instanceof Element ? evento.target.closest('[data-filtro]') : null;
  if (!alvo) return;
  const [grupo] = alvo.dataset.filtro.split('.');
  const aba = Object.keys(GRUPO_FILTROS_REUNIOES).find((k) => GRUPO_FILTROS_REUNIOES[k] === grupo) || (grupo === 'ordemReunioes' ? abaReunioes() : null);
  if (aba) estado.paginaReunioes[aba] = 1;
};
document.addEventListener('change', voltarPrimeiraPagina, true);
document.addEventListener('input', voltarPrimeiraPagina, true);
document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const limpar = evento.target.closest('[data-limpar-reunioes]');
  if (limpar) {
    const aba = limpar.dataset.limparReunioes;
    Object.assign(estado[GRUPO_FILTROS_REUNIOES[aba]], FILTROS_REUNIOES_INICIAIS[aba]);
    estado.paginaReunioes[aba] = 1;
    render();
    document.querySelector(`[data-filtro^="${GRUPO_FILTROS_REUNIOES[aba]}."]`)?.focus(); // o botão fica desabilitado
    return;
  }
  const pagina = evento.target.closest('[data-pagina-reunioes]');
  if (!pagina || pagina.disabled) return;
  const aba = abaReunioes();
  estado.paginaReunioes[aba] += Number(pagina.dataset.passo);
  render();
  // na primeira ou na última página o botão usado fica desabilitado: o foco vai ao outro
  const mesmo = document.querySelector(`[data-pagina-reunioes][data-passo="${pagina.dataset.passo}"]`);
  (mesmo && !mesmo.disabled ? mesmo : document.querySelector('[data-pagina-reunioes]:not([disabled])'))?.focus({ preventScroll: true });
});
// fora do Gestor de reuniões, a origem se perde: o detalhe aberto do calendário ou do HUB volta pela aba do status
NBC.ganchos.em('rota:entrou', ({ base }) => { if (base !== 'reunioes') estado.abaReunioesOrigem = null; });

// ── mudancas/reunioes-anexos-popover/reunioes-anexos-popover.js
// reunioes-anexos-popover (exp-09; requer reunioes-unificadas): na lista (Em aberto e Finalizadas), a célula Anexos vira um
// botão com clipe e quantidade (quantidadeAnexos da listagem) que abre, abaixo dele, um popover de 380px com os arquivos.
// A lista vem do detalhe (GET /reunioes/{id}), carregada só ao abrir: carregando, erro 403 e 404 (forçados pela demonstração).
// "Baixar todos" baixa um por um (não há endpoint de lote: pendência opcional do ZIP). Download vale para criador e
// participantes (R9), e só quem tem vínculo vê a reunião. Esc, clique fora, Fechar e foco saindo fecham e devolvem o foco
const ESTADO_ANEXOS = Object.freeze({ NORMAL: 'NORMAL', CARREGANDO: 'CARREGANDO', ERRO_403: 'ERRO_403', ERRO_404: 'ERRO_404' });
const ROTULOS_ESTADO_ANEXOS = Object.freeze({ NORMAL: 'Normal', CARREGANDO: 'Carregando', ERRO_403: 'Erro 403', ERRO_404: 'Erro 404' });
const CONFIG_ANEXOS_POPOVER = Object.freeze({ ATRASO_MS: 400, LINHAS_ESQUELETO: 2 });
const TEXTOS_ANEXOS_POPOVER = Object.freeze({
  DEMO: 'Anexos na lista',
  BOTAO: (n) => `${n === 1 ? '1 anexo' : `${n} anexos`}: ver e baixar`,
  TITULO: 'Anexos',
  ROTULO: (titulo) => `Anexos de ${titulo}`,
  FECHAR: 'Fechar',
  META: (tamanho, data) => `${tamanho} · enviado em ${data}`,
  BAIXAR: 'Baixar',
  BAIXAR_TODOS: (n) => `Baixar todos (${n})`,
  BAIXANDO_TODOS: (n) => `Baixando ${n} arquivos, um por um. ${MENSAGENS.DOWNLOAD_SIMULADO}`,
  CARREGANDO: 'Carregando anexos…',
  // o 403 só existe forçado pela demonstração: com vínculo, a leitura não depende do papel (R9)
  ERRO: Object.freeze({ ERRO_403: 'Você não tem acesso aos anexos desta reunião.', ERRO_404: MENSAGENS.REUNIAO_NAO_ENCONTRADA }),
});
estado.demoAnexos = ESTADO_ANEXOS.NORMAL;

// a demonstração ganha o seletor do estado da carga (o 403 e o 404 não acontecem com os mocks)
NBC.pontos.substituir('shell.demo', (anterior) => anterior().replace('<label><input type="checkbox" data-demo-429',
  `<label>${esc(TEXTOS_ANEXOS_POPOVER.DEMO)} <select class="select" data-campo="demo-anexos">${Object.values(ESTADO_ANEXOS).map((e) => `<option value="${e}">${esc(ROTULOS_ESTADO_ANEXOS[e])}</option>`).join('')}</select></label><label><input type="checkbox" data-demo-429`));
document.addEventListener('change', (evento) => {
  if (evento.target instanceof Element && evento.target.matches('[data-campo="demo-anexos"]')) estado.demoAnexos = evento.target.value;
});

NBC.pontos.substituir('reunioes.lista.anexos', (r, anterior) => (r.anexos.length
  ? `<button type="button" class="ru-anexos" data-anexos-reuniao="${r.id}" aria-haspopup="dialog" aria-expanded="false" aria-controls="popover-anexos" aria-label="${esc(TEXTOS_ANEXOS_POPOVER.BOTAO(r.anexos.length))}">${icone('anexo')}<span class="num">${r.anexos.length}</span></button>`
  : anterior(r)));

const popoverAnexos = document.createElement('div');
popoverAnexos.id = 'popover-anexos';
popoverAnexos.className = 'popover-anexos';
popoverAnexos.setAttribute('role', 'dialog');
popoverAnexos.hidden = true;
document.body.append(popoverAnexos);
let anexosAbertos = null; // { id, timer }
const botaoAnexos = (id) => document.querySelector(`#conteudo [data-anexos-reuniao="${id}"]`);

const arquivoAnexo = (x) => `<li class="pa-arquivo">
    <span class="pa-extensao" aria-hidden="true">${esc(extensaoDe(x.nomeOriginal).toUpperCase())}</span>
    <span class="pa-texto"><span class="pa-nome" title="${esc(x.nomeOriginal)}">${esc(x.nomeOriginal)}</span>
      <span class="legenda num">${esc(TEXTOS_ANEXOS_POPOVER.META(formatarBytes(x.tamanhoBytes), formatarData(horarioLocal(x.criadoEm).data)))}</span></span>
    <button type="button" class="pa-baixar" data-acao="anexo-baixar" data-id="${x.id}" aria-label="${esc(MENSAGENS.BAIXAR(x.nomeOriginal))}" title="${esc(MENSAGENS.BAIXAR(x.nomeOriginal))}">${icone('download')}</button>
  </li>`;
function corpoAnexos(r, situacao) {
  const T = TEXTOS_ANEXOS_POPOVER;
  if (situacao === ESTADO_ANEXOS.CARREGANDO) {
    return `<ul class="pa-lista" aria-busy="true"><li class="sr-only" role="status">${esc(T.CARREGANDO)}</li>${'<li class="pa-arquivo pa-esqueleto" aria-hidden="true"><span class="pa-extensao skeleton"></span><span class="pa-texto"><span class="skeleton pa-linha"></span><span class="skeleton pa-linha pa-linha-curta"></span></span></li>'.repeat(CONFIG_ANEXOS_POPOVER.LINHAS_ESQUELETO)}</ul>`;
  }
  if (T.ERRO[situacao]) return `<div class="alerta-erro" role="alert"><p>${esc(T.ERRO[situacao])}</p></div>`;
  return `<ul class="pa-lista">${r.anexos.map(arquivoAnexo).join('')}</ul>
    <button type="button" class="btn btn-primario pa-todos" data-baixar-todos="${r.id}">${icone('download')}${esc(T.BAIXAR_TODOS(r.anexos.length))}</button>`;
}
function desenharPopoverAnexos(r, situacao) {
  const T = TEXTOS_ANEXOS_POPOVER;
  popoverAnexos.setAttribute('aria-label', T.ROTULO(r.titulo));
  popoverAnexos.innerHTML = `<div class="pa-topo"><h2 class="pa-titulo" id="popover-anexos-titulo">${esc(T.TITULO)} · <span class="num">${r.anexos.length}</span></h2>
      <button type="button" class="pa-fechar" data-anexos-fechar aria-label="${esc(T.FECHAR)}" title="${esc(T.FECHAR)}">${icone('fechar')}</button></div>
    ${corpoAnexos(r, situacao)}`;
}
// abre abaixo do botão: sem espaço na janela, a página rola o necessário (virar para cima cobriria o cabeçalho preso)
function abaixoDoBotao(botao) {
  posicionarFlutuante(popoverAnexos, botao);
  const b = botao.getBoundingClientRect();
  const p = popoverAnexos.getBoundingClientRect();
  if (p.top >= b.top) return;
  const folga = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--space-4')) || 0;
  window.scrollBy(0, b.bottom + p.height + folga - window.innerHeight);
  posicionarFlutuante(popoverAnexos, botao);
}
// carga do detalhe só ao abrir: primeiro o esqueleto; depois a lista ou o erro (a demonstração pode segurar no carregando)
function abrirPopoverAnexos(botao) {
  const id = Number(botao.dataset.anexosReuniao);
  fecharPopoverAnexos({ devolverFoco: false });
  const r = reuniaoPorId(id);
  if (!r) return;
  // item invisível (por exemplo, depois da troca de usuário) cai no 404, como a API responde sem vínculo
  const situacaoFinal = pode(OPERACAO.VER_REUNIAO, r) ? estado.demoAnexos : ESTADO_ANEXOS.ERRO_404;
  desenharPopoverAnexos(r, ESTADO_ANEXOS.CARREGANDO);
  abaixoDoBotao(botao);
  botao.setAttribute('aria-expanded', 'true');
  const timer = situacaoFinal === ESTADO_ANEXOS.CARREGANDO ? null : setTimeout(() => {
    if (!anexosAbertos || anexosAbertos.id !== id) return;
    const temFoco = popoverAnexos.contains(document.activeElement);
    desenharPopoverAnexos(r, situacaoFinal);
    abaixoDoBotao(botaoAnexos(id) || botao);
    if (temFoco) popoverAnexos.querySelector('[data-anexos-fechar]').focus({ preventScroll: true });
  }, CONFIG_ANEXOS_POPOVER.ATRASO_MS);
  anexosAbertos = { id, timer };
  popoverAnexos.querySelector('[data-anexos-fechar]').focus({ preventScroll: true });
}
function fecharPopoverAnexos({ devolverFoco = true } = {}) {
  if (!anexosAbertos) return;
  const { id, timer } = anexosAbertos;
  clearTimeout(timer);
  anexosAbertos = null;
  popoverAnexos.hidden = true;
  popoverAnexos.innerHTML = '';
  const botao = botaoAnexos(id);
  if (botao) { botao.setAttribute('aria-expanded', 'false'); if (devolverFoco) botao.focus({ preventScroll: true }); }
}

document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const botao = evento.target.closest('[data-anexos-reuniao]');
  if (botao) {
    if (anexosAbertos && anexosAbertos.id === Number(botao.dataset.anexosReuniao)) fecharPopoverAnexos(); else abrirPopoverAnexos(botao);
    return;
  }
  if (evento.target.closest('[data-anexos-fechar]')) { fecharPopoverAnexos(); return; }
  const todos = evento.target.closest('[data-baixar-todos]');
  if (todos) toast(TEXTOS_ANEXOS_POPOVER.BAIXANDO_TODOS(reuniaoPorId(Number(todos.dataset.baixarTodos)).anexos.length));
});
document.addEventListener('keydown', (evento) => {
  if (!anexosAbertos || evento.key !== 'Escape' || evento.defaultPrevented || document.querySelector('dialog[open]')) return;
  evento.preventDefault();
  fecharPopoverAnexos();
});
document.addEventListener('pointerdown', (evento) => {
  if (anexosAbertos && evento.target instanceof Element && cliqueFora(evento, popoverAnexos, '[data-anexos-reuniao]') && !evento.target.closest('#toast')) fecharPopoverAnexos({ devolverFoco: false });
});
// no fim da página: Tab depois do último controle (ou Shift+Tab antes do primeiro) fecha e volta ao botão de anexos
popoverAnexos.addEventListener('keydown', (evento) => {
  if (evento.key !== 'Tab') return;
  const focaveis = [...popoverAnexos.querySelectorAll('button:not([disabled])')];
  const borda = evento.shiftKey ? focaveis[0] : focaveis[focaveis.length - 1];
  if (document.activeElement !== borda) return;
  evento.preventDefault();
  fecharPopoverAnexos();
});
popoverAnexos.addEventListener('focusout', () => {
  setTimeout(() => {
    if (anexosAbertos && !popoverAnexos.contains(document.activeElement) && !document.activeElement?.closest('[data-anexos-reuniao], #toast')) fecharPopoverAnexos({ devolverFoco: false });
  });
});
NBC.ganchos.em('render:antes', () => fecharPopoverAnexos({ devolverFoco: false }));
NBC.ganchos.em('rota:entrou', () => fecharPopoverAnexos({ devolverFoco: false }));

// ── mudancas/reunioes-detalhe-finalizada/reunioes-detalhe-finalizada.js
// reunioes-detalhe-finalizada (exp-09; canvas Detalhe): o detalhe da reunião finalizada em duas colunas, só leitura para
// todos, inclusive o criador (R11: sem Editar, Excluir, Finalizar, presença nem envio de anexos; ver e baixar continuam).
// Principal: Pauta, Anexos e Ata (estado vazio: possuiAta é sempre false no MVP). Lateral: Presença, Finalização e Dados.
// A finalização não traz o autor (B22): só o criador finaliza (R9), então o autor exibido é o criador.
// Reunião não finalizada: segue o detalhe de antes (o link de volta vem do ponto reunioes.detalhe.voltar)
const TEXTOS_DETALHE_FINALIZADA = Object.freeze({
  QUANDO: (r) => { const l = horarioLocal(r.inicio); return `${formatarDiaCurto(l.data)}/${l.data.slice(0, 4)} · ${formatarHorario(r)} (${formatarDuracao(duracaoMinutos(r))})`; },
  VER_CALENDARIO: MENSAGENS.VER_NO_CALENDARIO,
  BAIXAR_ANEXOS: (n) => `Baixar anexos (${n})`,
  SEM_ANEXOS_MOTIVO: 'Esta reunião não tem anexos para baixar.',
  BAIXANDO: (n) => `Baixando ${n === 1 ? '1 arquivo' : `${n} arquivos, um por um`}. ${MENSAGENS.DOWNLOAD_SIMULADO}`,
  PAUTA: 'Pauta',
  ANEXOS: 'Anexos',
  ARQUIVOS: (n) => (n === 1 ? '1 arquivo' : `${n} arquivos`),
  BAIXAR: 'Baixar',
  BAIXAR_TODOS: 'Baixar todos',
  ANEXOS_LEITURA: 'Reunião finalizada: os anexos ficam disponíveis só para leitura e download.',
  META: (tamanho, data) => `${tamanho} · enviado em ${data}`,
  ATA: 'Ata',
  ATA_VAZIA: 'Ainda não há ata para esta reunião.',
  ATA_DEPOIS: 'O registro e o download da ata entram depois do MVP.',
  BAIXAR_ATA: 'Baixar ata',
  PRESENCA: 'Presença',
  FINALIZACAO: 'Finalização',
  FINALIZADA_POR: (quando, nome) => `${quando}, por ${nome}`,
  DADOS: 'Dados da reunião',
  TRILHA: 'Trilha',
});
const ICONE_ATA = 'ph-file-text';

function anexosFinalizada(r) {
  const T = TEXTOS_DETALHE_FINALIZADA;
  const itens = r.anexos.map((x) => `<li class="df-arquivo">
      <span class="df-extensao" aria-hidden="true">${esc(extensaoDe(x.nomeOriginal).toUpperCase())}</span>
      <span class="df-arquivo-texto"><span class="df-arquivo-nome" title="${esc(x.nomeOriginal)}">${esc(x.nomeOriginal)}</span>
        <span class="legenda num">${esc(T.META(formatarBytes(x.tamanhoBytes), formatarData(horarioLocal(x.criadoEm).data)))}</span></span>
      <button type="button" class="btn btn-secundario df-baixar" data-acao="anexo-baixar" data-id="${x.id}" aria-label="${esc(MENSAGENS.BAIXAR(x.nomeOriginal))}">${icone('download')}${esc(T.BAIXAR)}</button>
    </li>`).join('');
  return `<section class="card df-card" aria-labelledby="df-anexos">
      <div class="df-card-cabecalho"><h2 class="card-titulo" id="df-anexos">${esc(T.ANEXOS)} <span class="legenda df-contagem">${esc(T.ARQUIVOS(r.anexos.length))}</span></h2>
        ${r.anexos.length ? `<button type="button" class="btn btn-secundario" data-baixar-anexos-reuniao="${r.id}">${icone('download')}${esc(T.BAIXAR_TODOS)}</button>` : ''}</div>
      ${r.anexos.length ? `<ul class="df-arquivos">${itens}</ul>` : `<p class="legenda">${esc(MENSAGENS.NENHUM_ANEXO)}</p>`}
      <p class="legenda">${esc(T.ANEXOS_LEITURA)}</p>
    </section>`;
}
function presencaFinalizada(r) {
  const lista = r.historico ? r.historico.participantes : r.participantes;
  const presentes = lista.filter((p) => p.presente).length;
  const pessoas = lista.map((p) => `<li class="df-pessoa"><span class="df-avatar" aria-hidden="true">${esc(iniciais(p.username))}</span><span class="df-pessoa-nome">${listaUsuarios([p])}</span>${badgePresenca(p.presente)}</li>`).join('');
  return `<section class="card df-card" aria-labelledby="df-presenca">
      <div class="df-card-cabecalho"><h2 class="card-titulo" id="df-presenca">${esc(TEXTOS_DETALHE_FINALIZADA.PRESENCA)}</h2><span class="df-presentes num">${esc(MENSAGENS.PRESENTES(presentes, lista.length))}</span></div>
      <span class="df-barra" aria-hidden="true"><span class="df-barra-cheia" style="width:${lista.length ? Math.round((presentes / lista.length) * 100) : 0}%"></span></span>
      <ul class="df-pessoas">${pessoas}</ul>
    </section>`;
}

NBC.pontos.substituir('reunioes.detalhe', (id, anterior) => {
  const T = TEXTOS_DETALHE_FINALIZADA;
  const r = reuniaoPorId(id);
  if (!r || !pode(OPERACAO.VER_REUNIAO, r) || !r.finalizadaEm) return anterior(id);
  const n = r.anexos.length;
  const acoesTopo = `<button type="button" class="btn btn-secundario" data-ver-reuniao-calendario="${r.id}">${icone('calendario')}${esc(T.VER_CALENDARIO)}</button>
    <button type="button" class="btn btn-primario" data-baixar-anexos-reuniao="${r.id}" ${n ? '' : 'disabled aria-describedby="df-sem-anexos"'}>${icone('download')}${esc(T.BAIXAR_ANEXOS(n))}</button>`;
  const observacao = r.historico && r.historico.observacao;
  return `<nav class="trilha" aria-label="${esc(T.TRILHA)}">${voltarReuniao(r)}</nav>`
    + cabecalho(r.titulo, `${T.QUANDO(r)} · ${r.localOuLink.replace(PADRAO_LINK, '')}`, acoesTopo)
    + `<div class="reuniao-cabecalho-badges">${badgeStatusReuniao(r)}${badgePrioridadeReuniao(r.prioridade)}${chipsUnidades(r.unidades)}</div>`
    + (n ? '' : `<p class="motivo" id="df-sem-anexos">${esc(T.SEM_ANEXOS_MOTIVO)}</p>`)
    + `<div class="grid-principal df-grade">
        <div class="coluna">
          <section class="card df-card" aria-labelledby="df-pauta"><h2 class="card-titulo" id="df-pauta">${esc(T.PAUTA)}</h2><p class="pauta">${esc(r.assunto)}</p></section>
          ${anexosFinalizada(r)}
          <section class="card df-card" aria-labelledby="df-ata"><h2 class="card-titulo" id="df-ata">${esc(T.ATA)}</h2>
            <div class="df-ata"><i class="ph ${ICONE_ATA}" aria-hidden="true"></i>
              <span class="df-ata-texto"><span class="df-ata-titulo">${esc(T.ATA_VAZIA)}</span><span class="legenda">${esc(T.ATA_DEPOIS)}</span></span>
              <button type="button" class="btn btn-secundario" disabled>${esc(T.BAIXAR_ATA)}</button></div>
          </section>
        </div>
        <div class="coluna">
          ${presencaFinalizada(r)}
          <section class="card df-card" aria-labelledby="df-finalizacao"><h2 class="card-titulo" id="df-finalizacao">${esc(T.FINALIZACAO)}</h2>
            <p class="legenda num">${esc(T.FINALIZADA_POR(formatarQuando(r.finalizadaEm), r.criadoPor.username))}</p>
            ${observacao ? `<blockquote class="df-observacao pauta">${esc(observacao)}</blockquote>` : `<p class="legenda">${esc(MENSAGENS.SEM_OBSERVACAO)}</p>`}
          </section>
          <section class="card df-card" aria-labelledby="df-dados"><h2 class="card-titulo" id="df-dados">${esc(T.DADOS)}</h2>${gradeDadosReuniao(r, true)}</section>
        </div>
      </div>`;
});

document.addEventListener('click', (evento) => {
  if (!(evento.target instanceof Element)) return;
  const baixar = evento.target.closest('[data-baixar-anexos-reuniao]');
  if (baixar) { toast(TEXTOS_DETALHE_FINALIZADA.BAIXANDO(reuniaoPorId(Number(baixar.dataset.baixarAnexosReuniao)).anexos.length)); return; }
  // "Ver no calendário": aba Reuniões, na Semana da reunião
  const ver = evento.target.closest('[data-ver-reuniao-calendario]');
  if (!ver) return;
  const r = reuniaoPorId(Number(ver.dataset.verReuniaoCalendario));
  estado.calendario.modo = MODO_CALENDARIO.SEMANA;
  estado.calendario.referencia = horarioLocal(r.inicio).data;
  irPara(ROTAS.CALENDARIO_REUNIOES);
});

// ── nucleo/inicio.js
// último módulo do manifesto (depois das mudanças): o primeiro desenho já vê todos os pontos substituídos
if (!location.hash) location.hash = ROTAS.LOGIN;
render();
</script>
