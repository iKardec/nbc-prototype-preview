<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBC — protótipo v5</title>
<style>
/* ===== Tokens (docs/DESIGN.md) ===== */
:root {
  --color-primary: #0F172A;
  --color-on-primary: #FFFFFF;
  --color-text: var(--color-primary);
  --color-text-muted: #475569;
  --color-border: #E2E8F0;
  --color-surface-muted: var(--color-border);
  --color-bg: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-border-strong: #7C8799;
  --color-success: #2F6B4F;
  --color-success-bg: #EEF5F1;
  --color-warning: #875A16;
  --color-warning-bg: #FAF3E6;
  --color-danger: #A33A3A;
  --color-danger-bg: #FBEEEE;
  --color-info: #2E5A88;
  --color-info-bg: #EEF3F9;
  --font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-size-xs: 12px;
  --font-size-sm: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 24px;
  --line-height-xs: 16px;
  --line-height-sm: 20px;
  --line-height-md: 24px;
  --line-height-lg: 28px;
  --line-height-xl: 32px;
  --font-weight-regular: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-full: 9999px;
  --control-height: 36px;
  --sidebar-width: 240px;
  --content-max-width: 1280px;
  --shadow-overlay: 0 8px 24px rgb(15 23 42 / 0.12);
  --duration-fast: 150ms;
  --duration-base: 200ms;
  --opacity-disabled: 0.5;

  /* Tokens só deste protótipo (autorizados nos prompts da v2 e da v3; fora de docs/DESIGN.md) */
  --color-sidebar-bg: var(--color-primary);
  --color-sidebar-text: #F8FAFC;
  --color-sidebar-text-muted: #94A3B8;
  --color-sidebar-active: #1E293B;
  --sidebar-width-collapsed: 72px;
  --shadow-card: 0 1px 2px rgb(15 23 42 / 0.04), 0 1px 3px rgb(15 23 42 / 0.06);
  --shadow-card-hover: 0 4px 12px rgb(15 23 42 / 0.08);
  --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --duration-slow: 400ms;
  /* Tokens só deste protótipo (autorizados no INSTRUCTION.md da v4; fora de docs/DESIGN.md) */
  --kanban-column-width: 288px;
  --drawer-width: 480px;
  /* Tokens só deste protótipo (aprovados no plano da v5; fora de docs/DESIGN.md) */
  --calendar-day-min-height: 120px;
  --calendar-bar-height: 24px;
  --calendar-bar-height-week: 72px;
}

/* ===== Base ===== */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: var(--font-family);
  font-size: var(--font-size-sm);
  line-height: var(--line-height-sm);
  font-weight: var(--font-weight-regular);
  color: var(--color-text);
  background: var(--color-bg);
}
h1, h2, h3, h4, p, dl, dd { margin: 0; }
button, select, input { font: inherit; color: inherit; }
a { color: inherit; }

/* ===== Layout ===== */
/* A coluna da barra lateral fica sempre na largura recolhida; a barra expande por cima do conteúdo. */
.shell { display: grid; grid-template-columns: var(--sidebar-width-collapsed) 1fr; min-height: 100vh; }
.sidebar {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 10;
  width: var(--sidebar-width-collapsed);
  display: flex; flex-direction: column; gap: var(--space-6);
  padding: var(--space-5) var(--space-3);
  overflow: hidden;
  background: var(--color-sidebar-bg); color: var(--color-sidebar-text);
  /* atraso só no recolher, para não piscar */
  transition: width var(--duration-base) var(--easing-standard) var(--duration-fast),
              box-shadow var(--duration-base) var(--easing-standard) var(--duration-fast);
}
.sidebar:hover, .sidebar:has(:focus-visible) {
  width: var(--sidebar-width);
  box-shadow: var(--shadow-overlay);
  transition-delay: 0s;
}
.recolhivel { opacity: 0; white-space: nowrap; transition: opacity var(--duration-fast) var(--easing-standard); }
.sidebar:hover .recolhivel, .sidebar:has(:focus-visible) .recolhivel { opacity: 1; transition-delay: var(--duration-fast); }

.marca {
  display: flex; align-items: center; gap: var(--space-3);
  padding-left: calc((var(--sidebar-width-collapsed) - var(--control-height)) / 2 - var(--space-3));
}
.marca-logo {
  width: var(--control-height); height: var(--control-height); flex: none;
  display: grid; place-items: center; border-radius: var(--radius-md);
  background: var(--color-surface); color: var(--color-primary);
  font-size: var(--font-size-md); font-weight: var(--font-weight-semibold);
}
.marca-nome { font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); }
.marca-sub { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-sidebar-text-muted); text-transform: uppercase; }

.nav { display: flex; flex-direction: column; gap: var(--space-1); }
.nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-3) var(--space-2) calc((var(--sidebar-width-collapsed) - var(--font-size-lg)) / 2 - var(--space-3));
  border-radius: var(--radius-md);
  color: var(--color-sidebar-text-muted); text-decoration: none;
  transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
}
.nav-item:hover { background: var(--color-sidebar-active); color: var(--color-sidebar-text); }
.nav-item[aria-current="page"] { background: var(--color-sidebar-active); color: var(--color-sidebar-text); font-weight: var(--font-weight-medium); }

.cartao-usuario {
  margin-top: auto; display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-2) 0; border-radius: var(--radius-lg);
  transition: background-color var(--duration-fast) var(--easing-standard);
}
.sidebar:hover .cartao-usuario, .sidebar:has(:focus-visible) .cartao-usuario { background: var(--color-sidebar-active); }
.usuario-linha {
  display: flex; align-items: center; gap: var(--space-3);
  padding-left: calc((var(--sidebar-width-collapsed) - var(--control-height)) / 2 - var(--space-3));
}
.sidebar .avatar { background: var(--color-sidebar-text-muted); color: var(--color-sidebar-bg); }
.usuario-texto { display: flex; flex-direction: column; min-width: 0; }
.cartao-usuario-nome { font-weight: var(--font-weight-semibold); overflow: hidden; text-overflow: ellipsis; }
.cartao-usuario-papel { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-sidebar-text-muted); }
.btn-sair {
  display: flex; align-items: center; gap: var(--space-3);
  height: calc(var(--control-height) - var(--space-2));
  padding: 0 0 0 calc((var(--sidebar-width-collapsed) - var(--space-4)) / 2 - var(--space-3));
  border: 0; border-radius: var(--radius-md); background: none; cursor: pointer;
  color: var(--color-sidebar-text-muted); font-size: var(--font-size-xs);
  transition: color var(--duration-fast) var(--easing-standard);
}
.btn-sair:hover { color: var(--color-sidebar-text); }
.sidebar :focus-visible { outline-color: var(--color-sidebar-text); }

.main { grid-column: 2; display: flex; flex-direction: column; min-width: 0; }
.demo {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4);
  padding: var(--space-2) var(--space-5);
  background: var(--color-surface-muted); border-bottom: 1px dashed var(--color-border-strong);
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted);
}
.demo-titulo { font-weight: var(--font-weight-semibold); text-transform: uppercase; }
.demo label { display: flex; align-items: center; gap: var(--space-2); }
.demo select { height: calc(var(--control-height) - var(--space-2)); width: auto; font-size: var(--font-size-xs); }
.conteudo {
  width: 100%; max-width: var(--content-max-width); margin: 0 auto;
  display: flex; flex-direction: column; gap: var(--space-5);
  padding: var(--space-6) var(--space-5);
}
.cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-4); }
.titulo { font-size: var(--font-size-xl); line-height: var(--line-height-xl); font-weight: var(--font-weight-semibold); }
.subtitulo { margin-top: var(--space-1); color: var(--color-text-muted); }
.cabecalho-acoes { display: flex; align-items: center; gap: var(--space-3); flex: none; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-5); }
.grid-topo { align-items: start; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-5); }
.grid-principal { display: grid; grid-template-columns: 2fr 1fr; gap: var(--space-5); align-items: start; }
.coluna { display: flex; flex-direction: column; gap: var(--space-5); }

/* ===== Componentes ===== */
.icone { width: var(--space-4); height: var(--space-4); flex: none; }
/* Avatar: componente único; .avatar-sm é a variante dos cartões e faixas */
.avatar {
  width: var(--control-height); height: var(--control-height); flex: none;
  display: grid; place-items: center; border-radius: var(--radius-full);
  background: var(--color-surface-muted); color: var(--color-text);
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); font-weight: var(--font-weight-semibold);
}
.avatar-sm { width: var(--space-5); height: var(--space-5); border: 1px solid var(--color-surface); }
.avatar-sm + .avatar-sm { margin-left: calc(var(--space-1) * -1); }
.icone-nav { width: var(--font-size-lg); height: var(--font-size-lg); flex: none; }

.btn {
  height: var(--control-height); padding: 0 var(--space-4);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 1px solid transparent; border-radius: var(--radius-md);
  font-weight: var(--font-weight-medium); text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background-color var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast) var(--easing-standard);
}
.btn-primario { background: var(--color-primary); color: var(--color-on-primary); }
.btn-secundario { background: var(--color-surface); border-color: var(--color-border-strong); color: var(--color-text); }
.btn-terciario { background: none; color: var(--color-text-muted); }
.btn-perigo { background: var(--color-danger); color: var(--color-on-primary); }
.btn-primario:hover, .btn-perigo:hover { box-shadow: var(--shadow-card-hover); text-decoration: underline; }
.btn-secundario:hover, .btn-terciario:hover { background: var(--color-surface-muted); }
.btn-secundario:active, .btn-terciario:active { background: var(--color-border); border-color: var(--color-text-muted); }
.btn-bloco { width: 100%; }
.link { color: var(--color-text); font-weight: var(--font-weight-medium); text-decoration: none; }
.link:hover { text-decoration: underline; }
.link-discreto { color: var(--color-text-muted); text-decoration: none; }
.link-discreto:hover { color: var(--color-text); text-decoration: underline; }
.link-botao {
  padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
  color: var(--color-text); font-weight: var(--font-weight-medium);
}
.link-botao:hover { text-decoration: underline; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.abas { display: inline-flex; gap: var(--space-1); padding: var(--space-1); border-radius: var(--radius-md); background: var(--color-surface-muted); }
.aba {
  height: calc(var(--control-height) - var(--space-2)); padding: 0 var(--space-3);
  display: inline-flex; align-items: center; border: 0; border-radius: var(--radius-sm);
  background: none; color: var(--color-text-muted); font-weight: var(--font-weight-medium); cursor: pointer;
  transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
}
.aba:hover { color: var(--color-text); }
.aba[aria-current="page"], .aba[aria-pressed="true"] { background: var(--color-surface); color: var(--color-text); box-shadow: var(--shadow-card); }
.aba .icone { margin-right: var(--space-1); }

.card {
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: var(--space-5); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-card);
  transition: box-shadow var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard);
}
.card:hover { box-shadow: var(--shadow-card-hover); }
.card-cabecalho { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.card-titulo { display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); }
.legenda { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted); }
.num, .indicador-numero, .kpi-numero, .badge-contagem { font-variant-numeric: tabular-nums; }

.filtros { flex-direction: row; flex-wrap: wrap; gap: var(--space-4); }
.campo { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; min-width: 0; }
.rotulo { font-size: var(--font-size-xs); line-height: var(--line-height-xs); font-weight: var(--font-weight-medium); color: var(--color-text-muted); text-transform: uppercase; }
.select, .input {
  width: 100%; height: var(--control-height); padding: 0 var(--space-3);
  border: 1px solid var(--color-border-strong); border-radius: var(--radius-md); background: var(--color-surface);
  transition: border-color var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast) var(--easing-standard);
}
.select:hover, .input:hover { border-color: var(--color-text-muted); }
.campo[data-ativo] .rotulo { color: var(--color-text); }
.campo[data-ativo] .select { border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary); font-weight: var(--font-weight-medium); }
.select-status {
  width: auto; height: calc(var(--control-height) - var(--space-2)); padding: 0 var(--space-2);
  border-color: transparent; border-radius: var(--radius-sm);
  font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); cursor: pointer;
}
.select-status:hover { border-color: currentColor; }
.busca { position: relative; display: flex; flex: 0 1 calc(var(--kanban-column-width) + var(--space-7)); min-width: 0; }
.busca .icone { position: absolute; left: var(--space-3); top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }
.busca .input { padding-left: calc(var(--space-3) * 2 + var(--space-4)); }
.campo[data-ativo] .input, .busca[data-ativo] .input { border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary); }

.indicador-numero { font-size: var(--font-size-xl); line-height: var(--line-height-xl); font-weight: var(--font-weight-semibold); }

.tabela { width: 100%; border-collapse: collapse; }
.tabela th {
  padding: 0 var(--space-3) var(--space-2); border-bottom: 1px solid var(--color-border);
  text-align: left; font-size: var(--font-size-xs); line-height: var(--line-height-xs);
  font-weight: var(--font-weight-medium); color: var(--color-text-muted); text-transform: uppercase; white-space: nowrap;
}
.tabela td { padding: var(--space-3); border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.tabela tbody tr:last-child td { border-bottom: 0; }
.tabela tbody tr { transition: background-color var(--duration-fast) var(--easing-standard); }
.tabela tbody tr:hover { background: var(--color-bg); }
.tabela .num { text-align: right; white-space: nowrap; }
.tabela-compacta td { padding: var(--space-2) var(--space-3); }
.col-barra { width: 30%; }

.badge {
  display: inline-flex; align-items: center; padding: 0 var(--space-2); border-radius: var(--radius-sm);
  background: var(--color-surface-muted); color: var(--color-text-muted);
  font-size: var(--font-size-xs); line-height: var(--line-height-sm); font-weight: var(--font-weight-medium); white-space: nowrap;
}
.badges { display: inline-flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }

.barra { display: block; height: var(--space-2); border-radius: var(--radius-full); background: var(--color-surface-muted); overflow: hidden; }
.barra-preenchimento { display: block; height: 100%; border-radius: var(--radius-full); background: var(--color-text-muted); transform-origin: left; }
.barra-preenchimento-primaria { background: var(--color-primary); }
.progresso { display: flex; align-items: center; gap: var(--space-2); min-width: calc(var(--space-7) * 2); }
.progresso .barra { flex: 1; }
.proporcao { display: flex; flex-direction: column; gap: var(--space-2); }
.proporcao-linha { display: flex; justify-content: space-between; }

.prioridades { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3); }
.prioridade-item {
  display: flex; flex-direction: column; align-items: center; gap: var(--space-1);
  padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
}

.arvore-desc { display: flex; align-items: center; gap: var(--space-2); }
.recuo-1 { padding-left: var(--space-6); }
.recuo-2 { padding-left: calc(var(--space-6) * 2); }
.btn-expandir {
  width: calc(var(--control-height) - var(--space-2)); height: calc(var(--control-height) - var(--space-2)); flex: none;
  display: grid; place-items: center; padding: 0; cursor: pointer;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-surface); color: var(--color-text-muted);
  transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard);
}
.btn-expandir:hover { background: var(--color-surface-muted); color: var(--color-text); }
.espaco-expandir { width: calc(var(--control-height) - var(--space-2)); flex: none; }

.trilha { display: flex; flex-wrap: wrap; gap: var(--space-2); color: var(--color-text-muted); }
.detalhe-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5) var(--space-4); }
.detalhe-item { display: flex; flex-direction: column; gap: var(--space-1); }
.aviso { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-info-bg); color: var(--color-info); }
.motivo { font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted); }

.estado { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); padding: var(--space-7) var(--space-5); text-align: center; color: var(--color-text-muted); }
.estado-icone {
  width: var(--space-7); height: var(--space-7); display: grid; place-items: center;
  border-radius: var(--radius-full); background: var(--color-surface-muted); color: var(--color-text-muted);
}
.estado-titulo { font-size: var(--font-size-md); line-height: var(--line-height-md); font-weight: var(--font-weight-semibold); color: var(--color-text); }
.estado-vazio { padding: var(--space-6) var(--space-4); }
.skeleton { height: var(--space-4); border-radius: var(--radius-md); background: var(--color-surface-muted); }
.skeleton-curto { width: 40%; }
.skeleton-alto { height: var(--space-6); width: 60%; }

.toast {
  position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: 20;
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface); box-shadow: var(--shadow-overlay); font-weight: var(--font-weight-medium);
  opacity: 0; visibility: hidden; transform: translateY(var(--space-2));
  transition: opacity var(--duration-base) var(--easing-standard), transform var(--duration-base) var(--easing-standard), visibility 0s linear var(--duration-base);
}
.toast.visivel {
  opacity: 1; visibility: visible; transform: none;
  transition: opacity var(--duration-base) var(--easing-standard), transform var(--duration-base) var(--easing-standard), visibility 0s;
}
.toast[data-tipo="sucesso"] { color: var(--color-success); }
.toast[data-tipo="erro"] { color: var(--color-danger); }
.toast-acao { height: calc(var(--control-height) - var(--space-2)); padding: 0 var(--space-3); color: var(--color-text); text-decoration: underline; }
.dialogo {
  width: 100%; max-width: calc(var(--content-max-width) / 3); padding: var(--space-5);
  border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-surface);
  color: var(--color-text); box-shadow: var(--shadow-overlay);
}
.dialogo-corpo { display: flex; flex-direction: column; gap: var(--space-4); }
.dialogo-acoes { display: flex; justify-content: flex-end; gap: var(--space-3); }
.gaveta {
  inset: 0 0 0 auto; margin: 0 0 0 auto; padding: 0;
  width: var(--drawer-width); max-width: 100%; height: 100%; max-height: 100%; overflow-y: auto;
  border: 0; border-left: 1px solid var(--color-border); background: var(--color-surface);
  color: var(--color-text); box-shadow: var(--shadow-overlay);
}
.gaveta-corpo { display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5); }
.gaveta-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.gaveta-titulo { font-size: var(--font-size-lg); line-height: var(--line-height-lg); font-weight: var(--font-weight-semibold); }
.gaveta-titulo:focus { outline: 0; } /* não interativo: recebe foco por script só para o leitor de tela anunciar a ação */
.gaveta-cabecalho { display: flex; flex-direction: column; gap: var(--space-3); }
.gaveta-secao { display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-5); border-top: 1px solid var(--color-border); }
.gaveta .detalhe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.lista-curta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista-curta li { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--color-border); }
.lista-curta li:last-child { border-bottom: 0; }

/* ===== Estados ===== */
[data-status="NAO_INICIADO"], [data-status="DESLIGADO"], [data-prioridade] { background: var(--color-surface-muted); color: var(--color-text-muted); }
[data-status="EM_ANDAMENTO"] { background: var(--color-info-bg); color: var(--color-info); }
[data-status="EM_RISCO"], [data-status="AFASTADO"] { background: var(--color-warning-bg); color: var(--color-warning); }
[data-status="CONCLUIDO"], [data-status="ATIVO"] { background: var(--color-success-bg); color: var(--color-success); }
[data-prioridade="PAUTA_SEMANA"] { background: var(--color-primary); color: var(--color-on-primary); }
[data-vencida] { background: var(--color-danger-bg); color: var(--color-danger); }
/* Barras: cor sólida por significado */
.barra-preenchimento[data-status="NAO_INICIADO"], .marcador[data-status="NAO_INICIADO"] { background: var(--color-text-muted); }
.barra-preenchimento[data-status="EM_ANDAMENTO"], .marcador[data-status="EM_ANDAMENTO"] { background: var(--color-info); }
.barra-preenchimento[data-status="EM_RISCO"], .marcador[data-status="EM_RISCO"] { background: var(--color-warning); }
.barra-preenchimento[data-status="CONCLUIDO"], .marcador[data-status="CONCLUIDO"] { background: var(--color-success); }
.barra-preenchimento[data-vencida] { background: var(--color-danger); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
[disabled] { opacity: var(--opacity-disabled); cursor: not-allowed; }

/* ===== Telas ===== */
/* T01 */
.login { min-height: 100vh; display: grid; place-items: center; padding: var(--space-5); background: var(--color-sidebar-bg); }
.login-card { width: 100%; max-width: calc(var(--content-max-width) / 3); gap: var(--space-5); padding: var(--space-6); box-shadow: var(--shadow-overlay); }
.login-card:hover { box-shadow: var(--shadow-overlay); }
.login-marca { display: flex; align-items: center; gap: var(--space-3); }
.login-marca .marca-logo { background: var(--color-primary); color: var(--color-on-primary); }
.login-cabecalho { display: flex; flex-direction: column; gap: var(--space-1); }
.login-nota { padding: var(--space-2) var(--space-3); border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); }

/* T02 */
.filtros-painel { gap: var(--space-3); }
.filtros-campos { display: flex; gap: var(--space-4); }
.filtros-rodape { display: flex; justify-content: flex-end; align-items: center; gap: var(--space-3); }
.kpi {
  width: 100%; text-align: left; cursor: pointer; gap: var(--space-2);
  transition: box-shadow var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard), background-color var(--duration-fast) var(--easing-standard);
}
.kpi:hover { border-color: var(--color-border-strong); }
.kpi:active { background: var(--color-bg); }
.kpi[aria-pressed="true"] { border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary), var(--shadow-card); }
.kpi-topo { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
.kpi-icone {
  width: var(--control-height); height: var(--control-height); flex: none;
  display: grid; place-items: center; border-radius: var(--radius-md);
  background: var(--color-bg); border: 1px solid var(--color-border); color: var(--color-text-muted);
}
.kpi-numero { font-size: var(--font-size-xl); line-height: var(--line-height-xl); font-weight: var(--font-weight-semibold); }
.kpi-numero[data-tom="neutro"] { color: var(--color-text); }
.kpi-numero[data-tom="success"] { color: var(--color-success); }
.kpi-numero[data-tom="info"] { color: var(--color-info); }
.kpi-numero[data-tom="danger"] { color: var(--color-danger); }

/* T04 */
.filtros-acoes { gap: var(--space-3); }
.filtros-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3); }
.quadro-barra { flex-wrap: wrap; }
.agrupar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.quadro { overflow-x: auto; padding-bottom: var(--space-2); }
.quadro-conteudo {
  display: flex; flex-direction: column; gap: var(--space-5);
  min-width: calc(var(--kanban-column-width) * var(--colunas) + var(--space-2) * (var(--colunas) - 1));
}
.colunas { display: grid; grid-template-columns: repeat(var(--colunas), minmax(var(--kanban-column-width), 1fr)); gap: var(--space-2); }
.coluna-kanban {
  display: flex; flex-direction: column; min-width: 0;
  max-height: calc(100vh - var(--space-7) * 5); overflow-y: auto;
  border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg);
  transition: background-color var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard);
}
.coluna-cabecalho {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-3); border-bottom: 1px solid var(--color-border); background: inherit;
  font-size: var(--font-size-sm); line-height: var(--line-height-sm); font-weight: var(--font-weight-semibold);
}
.marcador { width: var(--space-2); height: var(--space-2); flex: none; border-radius: var(--radius-full); }
.coluna-cartoes { display: flex; flex-direction: column; gap: var(--space-2); flex: 1; min-height: calc(var(--space-7) * 2); padding: var(--space-2); }
.coluna-vazia { padding: var(--space-4) var(--space-2); text-align: center; font-size: var(--font-size-xs); line-height: var(--line-height-xs); color: var(--color-text-muted); }
.quadro-conteudo[data-arrastando] .coluna-kanban[data-destino] { border-style: dashed; border-color: var(--color-border-strong); background: var(--color-surface-muted); }
.quadro-conteudo[data-arrastando] .coluna-kanban[data-sobre] { border-style: solid; border-color: var(--color-primary); box-shadow: inset 0 0 0 1px var(--color-primary); }

.cartao {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface); box-shadow: var(--shadow-card); cursor: pointer;
  transition: box-shadow var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard), opacity var(--duration-fast) var(--easing-standard);
}
.cartao[draggable="true"] { cursor: grab; }
.cartao:hover { border-color: var(--color-border-strong); box-shadow: var(--shadow-card-hover); }
.cartao[data-origem] { opacity: var(--opacity-disabled); }
.cartao-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-2); }
.cartao-titulo {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  font-size: var(--font-size-sm); line-height: var(--line-height-sm); font-weight: var(--font-weight-medium);
}
.cartao-pai { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cartao-rodape { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }
.cartao .progresso { min-width: 0; }
.cadeado { display: inline-flex; flex: none; color: var(--color-text-muted); }
.iniciais { display: inline-flex; }

.raia { display: flex; flex-direction: column; gap: var(--space-3); }
.raia + .raia { padding-top: var(--space-5); border-top: 1px solid var(--color-border); }
.raia-cabecalho { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
.raia-titulo { font-size: var(--font-size-md); line-height: var(--line-height-md); }
.raia-titulo .link-botao { font-weight: var(--font-weight-semibold); }

/* T04 Calendário */
.calendario-barra { flex-wrap: wrap; }
.calendario-nav { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.btn-icone { width: var(--control-height); padding: 0; font-size: var(--font-size-md); }
.calendario-periodo { margin-left: var(--space-2); }
.calendario-periodo:focus { outline: 0; } /* não interativo: recebe foco por script depois do "+N mais" */
.calendario-grade { border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
.calendario-grade.trocando { animation: surgir var(--duration-fast) var(--easing-standard); }
.dias-cabecalho, .dias-fundo, .faixas { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dias-cabecalho { border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
.dia-titulo {
  display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2);
  border-right: 1px solid var(--color-border);
  font-size: var(--font-size-xs); line-height: var(--line-height-sm); font-weight: var(--font-weight-medium); color: var(--color-text-muted);
}
.dias-fundo { position: absolute; inset: 0; }
.dia { padding: var(--space-1) var(--space-2); border-right: 1px solid var(--color-border); font-size: var(--font-size-xs); line-height: var(--line-height-sm); }
.dia:last-child, .dia-titulo:last-child { border-right: 0; }
.dia[data-fim-de-semana], .dia-titulo[data-fim-de-semana] { background: var(--color-bg); }
.dia[data-fora] { background: var(--color-surface-muted); color: var(--color-text-muted); }
.dia-numero { display: inline-grid; place-items: center; min-width: var(--line-height-sm); padding: 0 var(--space-1); border-radius: var(--radius-full); font-weight: var(--font-weight-medium); }
[data-hoje] .dia-numero { background: var(--color-primary); color: var(--color-on-primary); }
.hoje-legenda { margin-left: var(--space-1); font-weight: var(--font-weight-semibold); color: var(--color-text); }
.semana-mes { position: relative; min-height: var(--calendar-day-min-height); border-bottom: 1px solid var(--color-border); }
.semana-mes:last-child { border-bottom: 0; }
.faixas { position: relative; row-gap: var(--space-1); padding: calc(var(--line-height-sm) + var(--space-2)) 0 var(--space-2); }
.faixa {
  display: flex; align-items: center; gap: var(--space-2); min-width: 0; height: var(--calendar-bar-height);
  margin: 0 var(--space-1); padding: 0 var(--space-2);
  border: 0; border-left: var(--space-1) solid currentColor; border-radius: var(--radius-sm);
  font-size: var(--font-size-xs); line-height: var(--line-height-xs); text-align: left; cursor: pointer; overflow: hidden;
  transition: box-shadow var(--duration-fast) var(--easing-standard);
}
.faixa:hover { box-shadow: var(--shadow-card-hover); }
.faixa .badge { flex: none; }
.faixa .badge:not([data-prioridade="PAUTA_SEMANA"]) { background: var(--color-surface); } /* contorno sobre a faixa neutra */
.faixa-desc { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: var(--font-weight-medium); }
.faixa-status { flex: none; font-weight: var(--font-weight-medium); white-space: nowrap; }
.faixa-mais { margin: 0 var(--space-2); justify-self: start; }
.semana-quadro { max-height: calc(100vh - var(--space-7) * 5); overflow-y: auto; }
.semana-quadro .dias-cabecalho { position: sticky; top: 0; z-index: 1; }
.semana-corpo { position: relative; min-height: calc(var(--calendar-day-min-height) * 2); }
.semana-corpo .faixas { row-gap: var(--space-2); padding-top: var(--space-2); }
.faixa-semana { flex-direction: column; align-items: stretch; gap: var(--space-1); height: auto; min-height: var(--calendar-bar-height-week); padding: var(--space-2) var(--space-3); }
.faixa-linha { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); min-width: 0; }
.faixa-titulo {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  font-size: var(--font-size-sm); line-height: var(--line-height-sm); font-weight: var(--font-weight-medium);
}
.faixa .cartao-pai { display: block; }
.faixa .progresso { flex: 1; min-width: 0; }
.faixa-continua { flex: none; font-size: var(--font-size-sm); }
.faixa-linha .badges { flex: 1; }

/* ===== Movimento (só funcional) ===== */
@keyframes entrar-rota { from { opacity: 0; transform: translateY(var(--space-2)); } }
@keyframes crescer { from { transform: scaleX(0); } }
@keyframes surgir { from { opacity: 0; } }
@keyframes dialogo-entrar { from { opacity: 0; transform: translateY(var(--space-2)); } }
@keyframes dialogo-sair { to { opacity: 0; transform: translateY(var(--space-2)); } }
@keyframes fundo-entrar { from { opacity: 0; } }
@keyframes fundo-sair { to { opacity: 0; } }
@keyframes pulso { 50% { opacity: var(--opacity-disabled); } }
@keyframes gaveta-entrar { from { transform: translateX(100%); } }
@keyframes gaveta-sair { to { transform: translateX(100%); } }
@keyframes destacar { from { border-color: var(--color-primary); background: var(--color-surface-muted); } }
.conteudo.entrando { animation: entrar-rota var(--duration-base) var(--easing-standard); }
.conteudo.entrando .barra-preenchimento { animation: crescer var(--duration-slow) var(--easing-standard); }
.tabela tr.surgindo { animation: surgir var(--duration-base) var(--easing-standard); }
.dialogo[open] { animation: dialogo-entrar var(--duration-base) var(--easing-standard); }
.dialogo[open]::backdrop { animation: fundo-entrar var(--duration-base) var(--easing-standard); }
.dialogo.fechando { animation: dialogo-sair var(--duration-fast) var(--easing-standard) forwards; }
.dialogo.fechando::backdrop { animation: fundo-sair var(--duration-fast) var(--easing-standard) forwards; }
.gaveta[open] { animation: gaveta-entrar var(--duration-base) var(--easing-standard); }
.gaveta[open]::backdrop { animation: fundo-entrar var(--duration-base) var(--easing-standard); }
.gaveta.fechando { animation: gaveta-sair var(--duration-fast) var(--easing-standard) forwards; }
.gaveta.fechando::backdrop { animation: fundo-sair var(--duration-fast) var(--easing-standard) forwards; }
.cartao.movido { animation: destacar calc(var(--duration-slow) * 3) var(--easing-standard); }
.skeleton { animation: pulso calc(var(--duration-slow) * 4) var(--easing-standard) infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after, ::backdrop { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>

<dialog class="dialogo" id="dialogo" aria-labelledby="dialogo-titulo">
  <div class="dialogo-corpo">
    <h2 class="card-titulo" id="dialogo-titulo"></h2>
    <p id="dialogo-texto"></p>
    <div class="dialogo-acoes">
      <button type="button" class="btn btn-secundario" data-acao="cancelar-exclusao">Cancelar</button>
      <button type="button" class="btn btn-perigo" data-acao="confirmar-exclusao">Excluir</button>
    </div>
  </div>
</dialog>
<dialog class="gaveta" id="gaveta" aria-labelledby="gaveta-titulo">
  <div class="gaveta-corpo" id="gaveta-corpo"></div>
</dialog>
<div class="toast" id="toast" role="status"><span id="toast-texto"></span><button type="button" class="btn btn-terciario toast-acao" data-acao="desfazer" hidden></button></div>
<div class="sr-only" id="anuncio" aria-live="polite"></div>

<script>
'use strict';

/* ===== 1. Constantes ===== */
const HOJE = '2026-10-03'; // data fixa da demonstração (fuso America/Sao_Paulo)

const PAPEL = Object.freeze({ ADMINISTRADOR: 'ADMINISTRADOR', COLABORADOR: 'COLABORADOR' });
const STATUS_USUARIO = Object.freeze({ ATIVO: 'ATIVO', AFASTADO: 'AFASTADO', DESLIGADO: 'DESLIGADO' });
const STATUS_ACAO = Object.freeze({ NAO_INICIADO: 'NAO_INICIADO', EM_ANDAMENTO: 'EM_ANDAMENTO', EM_RISCO: 'EM_RISCO', CONCLUIDO: 'CONCLUIDO' });
const PRIORIDADE_ACAO = Object.freeze({ PAUTA_SEMANA: 'PAUTA_SEMANA', CURTO_PRAZO: 'CURTO_PRAZO', MEDIO_PRAZO: 'MEDIO_PRAZO', LONGO_PRAZO: 'LONGO_PRAZO' });
const TIPO_ACAO = Object.freeze({
  ESTRATEGICA: 'ESTRATEGICA', // provisório: valor não definido em docs/DOMAIN.md
  OPERACIONAL: 'OPERACIONAL',
  SUB_ACAO: 'SUB_ACAO', // provisório: valor não definido em docs/DOMAIN.md
});

const ROTULOS_PAPEL = Object.freeze({ ADMINISTRADOR: 'Administrador', COLABORADOR: 'Colaborador' });
const ROTULOS_STATUS_USUARIO = Object.freeze({ ATIVO: 'Ativo', AFASTADO: 'Afastado', DESLIGADO: 'Desligado' });
const ROTULOS_STATUS_ACAO = Object.freeze({ NAO_INICIADO: 'Não iniciado', EM_ANDAMENTO: 'Em andamento', EM_RISCO: 'Em risco', CONCLUIDO: 'Concluído' });
const ROTULOS_PRIORIDADE = Object.freeze({ PAUTA_SEMANA: 'Pauta da semana', CURTO_PRAZO: 'Curto prazo', MEDIO_PRAZO: 'Médio prazo', LONGO_PRAZO: 'Longo prazo' });
const ROTULOS_TIPO = Object.freeze({ ESTRATEGICA: 'Estratégica', OPERACIONAL: 'Operacional', SUB_ACAO: 'Sub-Ação' });
const ROTULOS_TIPO_PLURAL = Object.freeze({ ESTRATEGICA: 'Estratégicas', OPERACIONAL: 'Operacionais', SUB_ACAO: 'Sub-Ações' });
const ROTULO_VENCIDA = 'Vencida';
const ROTULO_VENCIDAS = 'Vencidas';
const ROTULO_VENCEM_ESTE_MES = 'Vencem neste mês';
const MESES_ABREV = Object.freeze(['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez']);
const MESES_NOME = Object.freeze(['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro']);
const DIAS_SEMANA_ABREV = Object.freeze(['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom']); // a semana começa na segunda

// Filtros do painel: recurso de interface, não regra de domínio (pendência B17)
const FILTRO_STATUS_PAINEL = Object.freeze({ TODOS: '', VENCIDAS: 'VENCIDAS' }); // VENCIDAS: derivado da Lei 9, não é status
const FILTRO_PONTO_FOCAL = Object.freeze({ TODOS: '', SEM: 'SEM' });
const ROTULOS_FILTRO = Object.freeze({
  UNIDADE: 'Unidade', MES: 'Mês esperado', PONTO_FOCAL: 'Ponto focal', STATUS: 'Status',
  TODAS_UNIDADES: 'Todas as unidades', TODOS_MESES: 'Todos os meses', TODOS_PONTOS_FOCAIS: 'Todos os pontos focais',
  SEM_PONTO_FOCAL: 'Sem ponto focal', TODOS_STATUS: 'Todos os status', TODOS_TIPOS: 'Todos os tipos', TIPO: 'Tipo de ação',
  BUSCA: 'Buscar ação', VISAO: 'Visão', AGRUPAR: 'Agrupar por',
});

// T04: visão e agrupamento são recursos de interface, não regra de domínio
const VISAO_ACOES = Object.freeze({ LISTA: 'LISTA', KANBAN: 'KANBAN', CALENDARIO: 'CALENDARIO' });
const ROTULOS_VISAO = Object.freeze({ LISTA: 'Lista', KANBAN: 'Kanban', CALENDARIO: 'Calendário' });
const ICONES_VISAO = Object.freeze({ LISTA: 'lista', KANBAN: 'kanban', CALENDARIO: 'calendario' });
const QUERY_VISAO = Object.freeze({ PARAMETRO: 'visao', KANBAN: 'kanban', CALENDARIO: 'calendario' });
// Calendário: faixas de dia inteiro derivadas só de mesConclusaoEstimado (sem data nova no domínio)
const MODO_CALENDARIO = Object.freeze({ MES: 'MES', SEMANA: 'SEMANA' });
const ROTULOS_MODO_CALENDARIO = Object.freeze({ MES: 'Mês', SEMANA: 'Semana' });
const ROTULOS_CALENDARIO = Object.freeze({
  ANTERIOR: '‹', PROXIMO: '›', HOJE: 'Hoje', CONTINUA_ANTES: '◂', CONTINUA_DEPOIS: '▸', MODO: 'Modo do calendário',
  NAVEGAR: Object.freeze({
    MES: Object.freeze({ ANTERIOR: 'Mês anterior', PROXIMO: 'Próximo mês' }),
    SEMANA: Object.freeze({ ANTERIOR: 'Semana anterior', PROXIMO: 'Próxima semana' }),
  }),
});
const AGRUPAMENTO_KANBAN = Object.freeze({ NENHUM: 'NENHUM', ESTRATEGICA: 'ESTRATEGICA' });
const ROTULOS_AGRUPAMENTO = Object.freeze({ NENHUM: 'Nenhum', ESTRATEGICA: 'Estratégica' });
const PREFIXO_PAI = '↳';

const KPIS = Object.freeze([
  { chave: 'ESCOPO', rotulo: 'No escopo', icone: 'acoes', tom: 'neutro', status: FILTRO_STATUS_PAINEL.TODOS },
  { chave: 'CONCLUIDO', rotulo: 'Concluídas', icone: 'concluido', tom: 'success', status: STATUS_ACAO.CONCLUIDO },
  { chave: 'EM_ANDAMENTO', rotulo: 'Em andamento', icone: 'andamento', tom: 'info', status: STATUS_ACAO.EM_ANDAMENTO },

const unidadePorId = (id) => UNIDADES.find((u) => u.id === id);
const acaoPorId = (id) => acoes.find((a) => a.id === id);
const porMesEId = (a, b) => a.mesConclusaoEstimado.localeCompare(b.mesConclusaoEstimado) || a.id - b.id;
const filhasDe = (id) => acoes.filter((a) => a.acaoPaiId === id).sort(porMesEId);
function estrategicaDe(a) {
  let atual = a;
  while (atual.acaoPaiId !== null) atual = acaoPorId(atual.acaoPaiId);
  return atual;
}

function ultimoDiaDoMes(dataIso) {
  const [ano, mes] = dataIso.split('-').map(Number);
  const dia = new Date(Date.UTC(ano, mes, 0)).getUTCDate();
  return `${ano}-${String(mes).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
}
const FIM_DO_MES_CORRENTE = ultimoDiaDoMes(HOJE);

// datas do calendário em UTC sobre 'YYYY-MM-DD' (sem fuso no meio)
const TAMANHO_DATA_ISO = 'YYYY-MM-DD'.length;
const TAMANHO_MES_ISO = 'YYYY-MM'.length;
const paraData = (iso) => new Date(`${iso}T00:00:00Z`);
const paraIso = (data) => data.toISOString().slice(0, TAMANHO_DATA_ISO);
const inicioDoMes = (iso) => `${iso.slice(0, TAMANHO_MES_ISO)}-01`;
function somarDias(iso, dias) { const d = paraData(iso); d.setUTCDate(d.getUTCDate() + dias); return paraIso(d); }
function somarMeses(iso, meses) { const d = paraData(inicioDoMes(iso)); d.setUTCMonth(d.getUTCMonth() + meses); return paraIso(d); }
// getUTCDay: 0 = domingo; aqui 0 = segunda
const indiceDiaSemana = (iso) => (paraData(iso).getUTCDay() + CONFIG.DIAS_POR_SEMANA - 1) % CONFIG.DIAS_POR_SEMANA;
const segundaDe = (iso) => somarDias(iso, -indiceDiaSemana(iso));
const diasDaSemana = (segunda) => Array.from({ length: CONFIG.DIAS_POR_SEMANA }, (_, i) => somarDias(segunda, i));
const ehFimDeSemana = (iso) => indiceDiaSemana(iso) >= CONFIG.DIAS_POR_SEMANA - 2; // sábado e domingo
// a ação ocupa o mês inteiro de conclusão: do dia 1 ao último dia
const intervaloDaAcao = (a) => ({ inicio: inicioDoMes(a.mesConclusaoEstimado), fim: ultimoDiaDoMes(a.mesConclusaoEstimado) });

  const operacionais = filhasDe(estrategica.id);

  return operacionais.filter((o) => o.status === ST.CONCLUIDO).length / operacionais.length;
}

/* ===== 4. Permissão (única função de decisão) ===== */
const temVinculo = (a, u) => a.responsaveis.some((r) => r.id === u.id) || a.pontosFocais.some((r) => r.id === u.id);
function todosVinculadosAfastados(a) {
  const ids = [...a.responsaveis, ...a.pontosFocais].map((r) => r.id);
  return ids.every((id) => usuarioPorId(id).status === STATUS_USUARIO.AFASTADO);
}
function podeVer(a, u) {
  if (a.tipo === S) return temVinculo(a, u) && !todosVinculadosAfastados(a);
  if (u.role === PAPEL.ADMINISTRADOR) return true;
  if (a.tipo === E) {
    return temVinculo(a, u) || filhasDe(a.id).some((o) => temVinculo(o, u) || filhasDe(o.id).some((s) => podeVer(s, u)));
  }
  return temVinculo(a, u) || temVinculo(acaoPorId(a.acaoPaiId), u) || filhasDe(a.id).some((s) => podeVer(s, u));
}

function pode(operacao, alvo) {
  const u = usuarioAtual();
  const admin = u.role === PAPEL.ADMINISTRADOR;
  switch (operacao) {
    case OPERACAO.VER: return podeVer(alvo, u);
    case OPERACAO.EDITAR:
    case OPERACAO.EXCLUIR: return podeVer(alvo, u) && (alvo.tipo === S ? temVinculo(alvo, u) : admin);
    case OPERACAO.MUDAR_STATUS: return podeVer(alvo, u) && (alvo.tipo === S ? temVinculo(alvo, u) : admin || temVinculo(alvo, u));
    case OPERACAO.CRIAR_ESTRATEGICA: return admin;
    case OPERACAO.CRIAR_OPERACIONAL: return admin && alvo.tipo === E;
    case OPERACAO.CRIAR_SUB_ACAO: return alvo.tipo === O && podeVer(alvo, u) && (admin || temVinculo(alvo, u));
    case OPERACAO.VER_USUARIOS: return admin;
    default: return false;
  }
}

// Lei 11: bloqueios de exclusão (contam todas as O, independentemente de visibilidade)
function motivoBloqueioExclusao(a) {
  if (a.tipo === E && filhasDe(a.id).length > 1) return MENSAGENS.EXCLUIR_E_COM_OPERACIONAIS;
  if (a.tipo === O && filhasDe(a.acaoPaiId).length === 1) return MENSAGENS.EXCLUIR_ULTIMA_O;
  return '';
}

const badgeStatus = (s) => `<span class="badge" data-status="${s}">${esc(ROTULOS_STATUS_ACAO[s])}</span>`;
const badgePrioridade = (p) => `<span class="badge" data-prioridade="${p}">${esc(ROTULOS_PRIORIDADE[p])}</span>`;
const badgeTipo = (t) => `<span class="badge">${esc(ROTULOS_TIPO[t])}</span>`;
const badgeVencida = (a) => (estaVencida(a) ? `<span class="badge" data-vencida>${ROTULO_VENCIDA}</span>` : '');
const badgeStatusUsuario = (s) => `<span class="badge" data-status="${s}">${esc(ROTULOS_STATUS_USUARIO[s])}</span>`;
const badgeContagem = (n) => `<span class="badge badge-contagem">${n}</span>`;

// a ação traz só { id, username }; o status de outro usuário só vem de GET /usuarios (Administrador)
const statusVisivel = (id) => (pode(OPERACAO.VER_USUARIOS) ? usuarioPorId(id).status : STATUS_USUARIO.ATIVO);
function listaUsuarios(lista, vazio = '—') {
  if (lista.length === 0) return `<span class="legenda">${esc(vazio)}</span>`;
  return lista.map((r) => {
    const status = statusVisivel(r.id);
    return esc(r.username) + (status !== STATUS_USUARIO.ATIVO ? ` ${badgeStatusUsuario(status)}` : '');
  }).join(', ');
}

function seletorStatus(a) {
  if (!pode(OPERACAO.MUDAR_STATUS, a)) return badgeStatus(a.status);
  const opcoes = Object.values(STATUS_ACAO)
    .map((s) => `<option value="${s}" ${s === a.status ? 'selected' : ''}>${esc(ROTULOS_STATUS_ACAO[s])}</option>`).join('');
  return `<select class="select select-status" data-status-acao="${a.id}" data-status="${a.status}" aria-label="Status de ${esc(a.descricao)}">${opcoes}</select>`;
}

const larguraBarra = (valor, maximo) => (maximo ? formatarPercentual(valor / maximo) : '0%');
const barra = (largura, atributos = '', classe = '') => `<span class="barra"><span class="barra-preenchimento ${classe}" ${atributos} style="width:${largura}"></span></span>`;
function barraProgresso(valor) {
  return `<span class="progresso">${barra(formatarPercentual(valor), 'data-progresso')}<span class="legenda num">${formatarPercentual(valor)}</span></span>`;
}

function seletor(filtro, rotulo, valorAtual, opcoes, rotuloTodos) {
  const itens = [`<option value="">${esc(rotuloTodos)}</option>`]
    .concat(opcoes.map(([valor, texto]) => `<option value="${valor}" ${String(valor) === valorAtual ? 'selected' : ''}>${esc(texto)}</option>`));
  return `<label class="campo" ${valorAtual ? 'data-ativo' : ''}><span class="rotulo">${esc(rotulo)}</span><select class="select" data-filtro="${filtro}">${itens.join('')}</select></label>`;
}
const opcoesUnidades = () => UNIDADES.map((u) => [u.id, u.nome]);

function cabecalho(titulo, subtitulo = '', acoesHtml = '') {
  return `<header class="cabecalho"><div><h1 class="titulo">${esc(titulo)}</h1>${subtitulo ? `<p class="subtitulo">${esc(subtitulo)}</p>` : ''}</div><div class="cabecalho-acoes">${acoesHtml}</div></header>`;
}
const botaoEmBreve = (rotulo, classe = 'btn-secundario', comIcone = '') =>
  `<button type="button" class="btn ${classe}" data-acao="em-breve">${comIcone ? icone(comIcone) : ''}${esc(rotulo)}</button>`;
const estadoVazio = (mensagem, acaoHtml = '') => `<div class="estado estado-vazio"><span class="estado-icone">${icone('caixa', 'icone-nav')}</span><p>${esc(mensagem)}</p>${acaoHtml}</div>`;

function renderEstado(tipo) {
  if (tipo === ESTADO_TELA.CARREGANDO) {
    const cartao = '<div class="card"><div class="skeleton skeleton-curto"></div><div class="skeleton skeleton-alto"></div><div class="skeleton skeleton-curto"></div></div>';
    return `<div class="skeleton skeleton-alto" aria-hidden="true"></div>
      <div class="grid-4" aria-busy="true">${cartao.repeat(4)}</div>
      <div class="card">${'<div class="skeleton"></div>'.repeat(5)}</div>`;
  }
  const textos = {
    VAZIO: ['caixa', ROTULOS_ESTADO_TELA.VAZIO, MENSAGENS.VAZIO],
    ERRO: ['alerta', ROTULOS_ESTADO_TELA.ERRO, MENSAGENS.ERRO],
    SEM_PERMISSAO: ['cadeado', ROTULOS_ESTADO_TELA.SEM_PERMISSAO, MENSAGENS.SEM_PERMISSAO],
    NAO_ENCONTRADO: ['busca', ROTULOS_ESTADO_TELA.NAO_ENCONTRADO, MENSAGENS.NAO_ENCONTRADO],
  }[tipo];
  const acao = tipo === ESTADO_TELA.ERRO
    ? '<button type="button" class="btn btn-secundario" data-acao="tentar-de-novo">Tentar de novo</button>'
    : `<a class="btn btn-secundario" href="${ROTAS.PAINEL}">Voltar ao cockpit</a>`;
  return `<section class="card estado"><span class="estado-icone">${icone(textos[0], 'icone-nav')}</span><h2 class="estado-titulo">${esc(textos[1])}</h2><p>${esc(textos[2])}</p>${acao}</section>`;
}

function renderEmBreve(titulo) {
  return cabecalho(titulo) + `<section class="card estado"><span class="estado-icone">${icone('calendario', 'icone-nav')}</span><h2 class="estado-titulo">Em breve</h2><p>${esc(MENSAGENS.EM_BREVE_TELA)}</p></section>`;
}

      <div class="login-marca"><span class="marca-logo">nb</span><div><div class="marca-nome">Newbay Control</div><div class="legenda">Gestor de ações</div></div></div>
